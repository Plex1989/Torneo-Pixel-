<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Torneos - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (localStorage.getItem('admin_autenticado') !== 'true') {
            window.location.href = "index.html"; // Redirigir si no es admin
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');

        body { font-family: 'Sora', sans-serif; margin: 0; padding: 0; background-color: #04060a; color: #f8fafc; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; animation: pulse-slow 10s infinite alternate; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; animation: pulse-slow 12s infinite alternate-reverse; }
        @keyframes pulse-slow { 0% { transform: scale(1) translate(0px, 0px); } 100% { transform: scale(1.3) translate(40px, -60px); } }

        .navbar { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 50; }
        .nav-title { font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { color: #94a3b8; text-decoration: none; padding: 8px 18px; border-radius: 9999px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .nav-btn:hover { color: #000000; background: #f5a623; border-color: #f5a623; box-shadow: 0 0 25px rgba(245, 166, 35, 0.8); transform: translateY(-2px); }
        .nav-btn.active { color: #ffffff; border-color: #8b5cf6; background: rgba(139, 92, 246, 0.3); box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .nav-btn.public { color: #34d399; border-color: rgba(16, 185, 129, 0.5); }

        .main-content { padding: 30px; max-width: 1100px; margin: auto; position: relative; z-index: 10; }

        .panel-3d { background: rgba(10, 15, 26, 0.45); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.03); padding: 26px; margin-bottom: 26px; }

        h2 { color: #ffffff; margin-top: 0; padding-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
        
        .input-group label { display: block; font-size: 9px; color: #38bdf8; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(10, 15, 26, 0.85); color: #ffffff; border-radius: 10px; font-size: 12px; font-family: 'Sora', sans-serif; font-weight: 600; box-sizing: border-box; outline: none; transition: all 0.3s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 16px rgba(56, 189, 248, 0.55); }

        .btn-console { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 24px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 9999px; color: #f1f5f9; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; text-decoration: none; letter-spacing: 1px; }
        .btn-gold { background: #f59e0b; color: #000; border-color: #fbbf24; }
        .btn-gold:hover { box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); transform: translateY(-2px); }
        .btn-green { background: #10b981; color: #000; border-color: #34d399; }
        .btn-green:hover { box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); transform: translateY(-2px); }
        .btn-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.5); }
        .btn-red:hover { background: #ef4444; color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
        .btn-outline { color: #38bdf8; border-color: #0ea5e9; }
        .btn-outline:hover { background: #0ea5e9; color: #000; box-shadow: 0 0 20px rgba(14, 165, 233, 0.6); }

        .grid-torneos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card-torneo { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; position: relative; transition: all 0.3s ease; }
        .card-torneo:hover { border-color: rgba(255, 255, 255, 0.2); transform: translateY(-3px); }
        .card-torneo.activo { border-color: #38bdf8; background: rgba(15, 23, 42, 0.85); box-shadow: 0 0 25px rgba(56, 189, 248, 0.15); }
        
        .badge-activo { position: absolute; top: 20px; right: 20px; background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.4); padding: 4px 10px; border-radius: 9999px; font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .t-id { font-size: 10px; color: #64748b; font-weight: 800; margin-bottom: 4px; display: block; }
        .t-nombre { font-size: 16px; font-weight: 800; color: #ffffff; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .t-info { font-size: 11px; color: #94a3b8; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .t-info i { color: #f59e0b; width: 12px; text-align: center; }
        
        .acciones-torneo { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">CENTRAL DE TORNEOS</div>
        <div class="nav-links">
            <a href="torneos.html" class="nav-btn active">Mis Torneos</a>
            <a href="admin.html" class="nav-btn">Administrador</a>
            <a href="sorteo.html" class="nav-btn">Sorteo y Rol</a>
            <a href="mesas.html" target="_blank" class="nav-btn" style="border-color:#06b6d4; color:#38bdf8;">🏓 Mesas</a>
            <a href="espectador.html" target="_blank" class="nav-btn" style="border-color:#d946ef; color:#f0abfc;">👁️ Espectador</a>
            <a href="index.html" target="_blank" class="nav-btn public">Portal Público</a>
            <button onclick="cerrarSesion()" class="nav-btn" style="border-color: rgba(239,68,68,0.4); color: #f87171; cursor:pointer;">SALIR</button>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="panel-3d" style="border-bottom: 5px solid #06b6d4;">
            <h2 id="form-titulo">🏆 CREAR / EDITAR TORNEO</h2>
            
            <input type="hidden" id="torneo-id">
            
            <div class="form-row">
                <div class="input-group">
                    <label>Nombre del Torneo</label>
                    <input type="text" id="t-nombre" placeholder="Ej. Gran Torneo Estatal 2026">
                </div>
                <div class="input-group">
                    <label>Fecha de Inicio del Evento</label>
                    <input type="date" id="t-fecha">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Sede / Gimnasio</label>
                    <input type="text" id="t-sede" placeholder="Ej. Complejo Deportivo Central">
                </div>
                <div class="input-group">
                    <label>N° de Mesas Disponibles</label>
                    <input type="number" id="t-mesas" value="5" min="1">
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn-console btn-gold" id="btn-guardar" onclick="guardarTorneo()">+ CREAR TORNEO</button>
                <button class="btn-console" id="btn-cancelar" style="display:none;" onclick="resetFormulario()">CANCELAR</button>
            </div>
        </div>

        <div class="panel-3d" style="border-bottom: 5px solid #8b5cf6;">
            <h2>📋 MIS TORNEOS REGISTRADOS</h2>
            <div class="grid-torneos" id="lista-torneos">
                <div style="color: #64748b; font-size: 12px; font-style: italic;">Cargando torneos...</div>
            </div>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let torneosCargados = [];

        function cerrarSesion() {
            localStorage.removeItem('admin_autenticado');
            window.location.href = "index.html";
        }

        async function cargarTorneos() {
            try {
                const { data, error } = await clienteSupabase
                    .from('torneos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                torneosCargados = data || [];
                dibujarTorneos();
            } catch (err) {
                console.error("Error cargando torneos:", err);
            }
        }

        function dibujarTorneos() {
            const container = document.getElementById('lista-torneos');
            container.innerHTML = '';

            if (torneosCargados.length === 0) {
                container.innerHTML = '<div style="color: #64748b; font-size: 12px; grid-column: 1/-1;">No tienes torneos registrados aún. Crea uno arriba.</div>';
                return;
            }

            const activoId = localStorage.getItem('torneo_activo_id');

            torneosCargados.forEach(t => {
                const isActivo = (t.id == activoId);
                const badge = isActivo ? `<div class="badge-activo">TORNEO ACTIVO</div>` : '';
                const cardClass = isActivo ? 'card-torneo activo' : 'card-torneo';

                // Botón principal de acción
                const mainBtn = isActivo 
                    ? `<button class="btn-console btn-outline" onclick="window.location.href='admin.html'">ENTRAR PANEL ➔</button>`
                    : `<button class="btn-console btn-green" onclick="activarTorneo(${t.id})">APERTURAR</button>`;

                container.innerHTML += `
                    <div class="${cardClass}">
                        ${badge}
                        <span class="t-id">ID #${t.id}</span>
                        <h3 class="t-nombre">${t.nombre}</h3>
                        
                        <div class="t-info"><i class="fa-regular fa-calendar"></i> ${t.fecha_evento || 'Sin fecha'}</div>
                        <div class="t-info"><i class="fa-solid fa-location-dot"></i> ${t.lugar_evento || 'Sin sede'}</div>
                        <div class="t-info" style="color:#38bdf8;"><i class="fa-solid fa-table-tennis-paddle-ball" style="color:#38bdf8;"></i> Mesas Gimnasio: ${t.numero_mesas || 0}</div>

                        <div class="acciones-torneo">
                            ${mainBtn}
                            <button class="btn-console btn-gold" onclick="prepararEdicion(${t.id})">EDITAR</button>
                            <button class="btn-console btn-red" onclick="eliminarTorneo(${t.id}, '${t.nombre.replace(/'/g, "\\'")}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function activarTorneo(id) {
            localStorage.setItem('torneo_activo_id', id);
            dibujarTorneos();
        }

        async function guardarTorneo() {
            const id = document.getElementById('torneo-id').value;
            const nombre = document.getElementById('t-nombre').value.trim();
            const fecha = document.getElementById('t-fecha').value;
            const sede = document.getElementById('t-sede').value.trim();
            const mesas = parseInt(document.getElementById('t-mesas').value) || 5;

            if (!nombre) {
                alert("El nombre del torneo es obligatorio.");
                return;
            }

            const payload = {
                nombre: nombre,
                fecha_evento: fecha,
                lugar_evento: sede,
                numero_mesas: mesas
            };

            const btn = document.getElementById('btn-guardar');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            try {
                if (id) {
                    // Actualizar
                    const { error } = await clienteSupabase.from('torneos').update(payload).eq('id', id);
                    if (error) throw error;
                    alert("✅ Torneo actualizado.");
                } else {
                    // Crear nuevo
                    const { data, error } = await clienteSupabase.from('torneos').insert([payload]).select();
                    if (error) throw error;
                    
                    // Si es el primero que crea, lo activamos automáticamente
                    if (torneosCargados.length === 0 && data && data.length > 0) {
                        localStorage.setItem('torneo_activo_id', data[0].id);
                    }
                    alert("✅ Torneo creado con éxito.");
                }
                
                resetFormulario();
                cargarTorneos();
            } catch (err) {
                console.error(err);
                alert("❌ Error al guardar: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        function prepararEdicion(id) {
            const t = torneosCargados.find(item => item.id == id);
            if (!t) return;

            document.getElementById('torneo-id').value = t.id;
            document.getElementById('t-nombre').value = t.nombre;
            document.getElementById('t-fecha').value = t.fecha_evento || '';
            document.getElementById('t-sede').value = t.lugar_evento || '';
            document.getElementById('t-mesas').value = t.numero_mesas || 5;

            document.getElementById('form-titulo').innerHTML = `✏️ EDITANDO: <span style="color:#fbbf24">${t.nombre}</span>`;
            document.getElementById('btn-guardar').innerText = "GUARDAR CAMBIOS";
            document.getElementById('btn-cancelar').style.display = "inline-flex";
            
            // Hacer scroll hacia arriba
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFormulario() {
            document.getElementById('torneo-id').value = '';
            document.getElementById('t-nombre').value = '';
            document.getElementById('t-fecha').value = '';
            document.getElementById('t-sede').value = '';
            document.getElementById('t-mesas').value = '5';

            document.getElementById('form-titulo').innerText = "🏆 CREAR / EDITAR TORNEO";
            document.getElementById('btn-guardar').innerText = "+ CREAR TORNEO";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        // ==========================================
        // FUNCIÓN ELIMINAR (CON LIMPIEZA EN CASCADA)
        // ==========================================
        async function eliminarTorneo(id, nombre) {
            const confirmacion = confirm(
                `⚠️ ATENCIÓN: ¿Estás seguro de eliminar el torneo "${nombre}"?\n\n` +
                `Esto borrará permanentemente:\n` +
                `- Todos los partidos jugados\n` +
                `- Todas las inscripciones de jugadores\n` +
                `- Horarios y programación\n\n` +
                `ESTA ACCIÓN NO SE PUEDE DESHACER.`
            );

            if (!confirmacion) return;

            try {
                // 1. Limpiamos los hijos (Para evitar error de llave foránea en Supabase)
                await clienteSupabase.from('partidos').delete().eq('torneo_id', id);
                await clienteSupabase.from('inscripciones').delete().eq('torneo_id', id);
                await clienteSupabase.from('programacion_categorias').delete().eq('torneo_id', id);

                // 2. Eliminamos el torneo padre
                const { error } = await clienteSupabase.from('torneos').delete().eq('id', id);
                if (error) throw error;

                // 3. Si borramos el torneo activo, limpiamos el localStorage
                if (localStorage.getItem('torneo_activo_id') == id) {
                    localStorage.removeItem('torneo_activo_id');
                }

                alert(`✅ Torneo "${nombre}" borrado exitosamente.`);
                cargarTorneos();
            } catch (err) {
                console.error(err);
                alert("❌ Ocurrió un error al borrar el torneo:\n" + err.message);
            }
        }

        // Iniciar
        cargarTorneos();
    </script>
</body>
</html>
