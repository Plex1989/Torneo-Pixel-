<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Torneos - Pixel Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');

        body { font-family: 'Sora', sans-serif; margin: 0; padding: 0; background-color: #04060a; color: #f8fafc; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }

        .navbar { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-title { font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }

        .main-content { padding: 30px; max-width: 1000px; margin: auto; }
        .panel-3d { background: rgba(10, 15, 26, 0.45); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.06); padding: 26px; margin-bottom: 26px; border-bottom: 5px solid #0e7490; }

        h2 { color: #ffffff; margin-top: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px; }

        .form-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-row input, .form-row select { flex: 1; min-width: 140px; padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(10, 15, 26, 0.85); color: #ffffff; border-radius: 10px; font-size: 12px; font-family: 'Sora', sans-serif; font-weight: 600; }

        .btn-console { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 9999px; color: #f1f5f9; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-gold { background: #f59e0b; color: #000; border-color: #fbbf24; }
        .btn-gold:hover { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
        .btn-green { background: #10b981; color: #000; border-color: #34d399; }
        .btn-red { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
        .btn-red:hover { background: #ef4444; color: #fff; }

        .grid-torneos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-torneo { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; transition: all 0.3s ease; position: relative; }
        .card-torneo.activo { border-color: #06b6d4; box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }

        .badge-activo { background: rgba(6, 182, 212, 0.2); border: 1px solid #06b6d4; color: #38bdf8; font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">Pixel Studio • Central de Torneos</div>
    </nav>

    <div class="main-content">
        
        <div class="panel-3d">
            <h2 id="titulo-form-torneo">🏆 Crear Nuevo Torneo</h2>
            <input type="hidden" id="edit-torneo-id">
            
            <div class="form-row">
                <input type="text" id="torneo-nombre" placeholder="Nombre del Torneo (Ej. Gran Torneo Estatal 2026)">
                <input type="date" id="torneo-fecha">
            </div>
            
            <div class="form-row">
                <input type="text" id="torneo-lugar" placeholder="Sede / Gimnasio (Ej. Complejo Deportivo Central)">
                <input type="number" id="torneo-mesas" value="5" min="1" max="50" placeholder="Total Mesas Gimnasio">
            </div>

            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn-console btn-gold" id="btn-guardar-torneo" onclick="guardarTorneo()">➕ Crear Torneo</button>
                <button class="btn-console" id="btn-cancelar-edit" style="display:none;" onclick="cancelarEdicion()">Cancelar Edición</button>
            </div>
        </div>

        <div class="panel-3d">
            <h2>📋 Mis Torneos Registrados</h2>
            <div id="contenedor-torneos" class="grid-torneos">
                <div style="color:#64748b; font-size:12px;">Cargando torneos...</div>
            </div>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let listaTorneos = [];

        async function cargarTorneos() {
            const { data, error } = await clienteSupabase.from('torneos').select('*').order('created_at', { ascending: false });
            listaTorneos = data || [];
            dibujarTorneos();
        }

        function dibujarTorneos() {
            const container = document.getElementById('contenedor-torneos');
            const idActivo = localStorage.getItem('torneo_activo_id') || (listaTorneos[0] ? listaTorneos[0].id : null);
            container.innerHTML = '';

            if (listaTorneos.length === 0) {
                container.innerHTML = '<div style="color:#64748b; font-size:12px;">No hay torneos registrados. Crea el primero arriba.</div>';
                return;
            }

            listaTorneos.forEach(t => {
                const esActivo = t.id == idActivo;
                container.innerHTML += `
                    <div class="card-torneo ${esActivo ? 'activo' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span style="font-size:10px; color:#94a3b8; font-weight:800;">ID #${t.id}</span>
                            ${esActivo ? '<span class="badge-activo">Torneo Activo</span>' : ''}
                        </div>
                        
                        <h3 style="margin:0 0 8px 0; font-size:15px; color:#fff;">${t.nombre}</h3>
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">📅 ${t.fecha_evento || 'Sin Fecha'}</div>
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">📍 ${t.lugar_evento || 'Sin Sede'}</div>
                        <div style="font-size:11px; color:#38bdf8; font-weight:700; margin-bottom:15px;">🏓 Mesas Gimnasio: ${t.total_mesas || 5}</div>

                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            ${!esActivo ? `<button class="btn-console btn-green" style="padding:6px 12px; font-size:9px;" onclick="seleccionarTorneoActivo(${t.id})">Aperturar</button>` : ''}
                            <button class="btn-console btn-gold" style="padding:6px 12px; font-size:9px;" onclick="editarTorneo(${t.id})">✏️ Editar</button>
                            <button class="btn-console btn-red" style="padding:6px 12px; font-size:9px;" onclick="eliminarTorneo(${t.id}, '${t.nombre}')">🗑️</button>
                            ${esActivo ? `<a href="admin.html" class="btn-console" style="padding:6px 12px; font-size:9px; border-color:#06b6d4; color:#38bdf8;">Entrar Panel ➔</a>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function seleccionarTorneoActivo(id) {
            localStorage.setItem('torneo_activo_id', id);
            localStorage.setItem('admin_autenticado', 'true');
            cargarTorneos();
        }

        function editarTorneo(id) {
            const t = listaTorneos.find(item => item.id == id);
            if (!t) return;

            document.getElementById('edit-torneo-id').value = t.id;
            document.getElementById('torneo-nombre').value = t.nombre;
            document.getElementById('torneo-fecha').value = t.fecha_evento || '';
            document.getElementById('torneo-lugar').value = t.lugar_evento || '';
            document.getElementById('torneo-mesas').value = t.total_mesas || 5;

            document.getElementById('titulo-form-torneo').innerText = `✏️ Editando: ${t.nombre}`;
            document.getElementById('btn-guardar-torneo').innerText = "💾 Actualizar Cambios";
            document.getElementById('btn-cancelar-edit').style.display = "inline-flex";
        }

        function cancelarEdicion() {
            document.getElementById('edit-torneo-id').value = "";
            document.getElementById('torneo-nombre').value = "";
            document.getElementById('torneo-fecha').value = "";
            document.getElementById('torneo-lugar').value = "";
            document.getElementById('torneo-mesas').value = "5";

            document.getElementById('titulo-form-torneo').innerText = "🏆 Crear Nuevo Torneo";
            document.getElementById('btn-guardar-torneo').innerText = "➕ Crear Torneo";
            document.getElementById('btn-cancelar-edit').style.display = "none";
        }

        async function guardarTorneo() {
            const idEdit = document.getElementById('edit-torneo-id').value;
            const nombre = document.getElementById('torneo-nombre').value.trim();
            const fecha = document.getElementById('torneo-fecha').value;
            const lugar = document.getElementById('torneo-lugar').value.trim();
            const mesas = parseInt(document.getElementById('torneo-mesas').value) || 5;

            if (!nombre) { alert("Ingresa el nombre del torneo."); return; }

            const payload = { nombre: nombre, fecha_evento: fecha, lugar_evento: lugar, total_mesas: mesas };

            if (idEdit) {
                await clienteSupabase.from('torneos').update(payload).eq('id', idEdit);
                alert("✅ Torneo actualizado con éxito.");
            } else {
                const { data } = await clienteSupabase.from('torneos').insert([payload]).select().single();
                if (data) localStorage.setItem('torneo_activo_id', data.id);
                localStorage.setItem('admin_autenticado', 'true');
                alert("✅ Torneo creado con éxito.");
            }

            cancelarEdicion();
            cargarTorneos();
        }

        async function eliminarTorneo(id, nombre) {
            if (!confirm(`⚠️ ¿Eliminar el torneo "${nombre}"? Se borrarán todos sus partidos.`)) return;
            await clienteSupabase.from('partidos').delete().eq('torneo_id', id);
            await clienteSupabase.from('torneos').delete().eq('id', id);
            cargarTorneos();
        }

        cargarTorneos();
    </script>
</body>
</html>
