<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mesa de Arbitraje - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 24px; }
        .score-p1 { border-top: 4px solid #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .score-p2 { border-top: 4px solid #d946ef; box-shadow: 0 10px 30px rgba(217, 70, 239, 0.2); }
        .btn-action { transition: all 0.2s active; }
        .btn-action:active { transform: scale(0.95); }
        select option { background-color: #0f172a; color: #fff; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 bg-[#04060a]">

    <!-- PANTALLA DE BLOQUEO (NIP DE JUEZ) -->
    <div id="modal-pin" class="fixed inset-0 z-[200] bg-[#04060a]/95 backdrop-blur-md flex flex-col items-center justify-center hidden">
        <div class="bg-slate-900/80 p-8 rounded-3xl border border-cyan-500/30 flex flex-col items-center text-center shadow-[0_0_40px_rgba(6,182,212,0.2)] max-w-sm w-full mx-4">
            <i class="fa-solid fa-lock text-5xl text-cyan-500 mb-4 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]"></i>
            <h2 class="text-2xl font-black text-white uppercase tracking-widest mb-2">Mesa de Juez</h2>
            <p id="texto-estado-pin" class="text-xs text-zinc-400 mb-6 uppercase tracking-widest leading-relaxed">Conectando con base de datos para validar credenciales...</p>
            
            <input type="password" id="input-pin" class="bg-black/50 border-2 border-cyan-500/50 text-cyan-400 text-center text-3xl font-black rounded-xl p-4 w-full outline-none focus:border-cyan-400 focus:shadow-[0_0_20px_rgba(6,182,212,0.4)] transition-all mb-6 tracking-[0.5em]" placeholder="****" maxlength="4" inputmode="numeric">
            
            <button onclick="verificarPin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-black py-4 rounded-xl font-black uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                Desbloquear Mesa
            </button>
            <button onclick="window.location.href='mesas.html'" class="mt-4 text-xs text-zinc-500 uppercase tracking-widest hover:text-white transition-colors">Volver al lobby</button>
        </div>
    </div>

    <!-- PANTALLA MODAL DE GANADOR -->
    <div id="modal-ganador" class="hidden fixed inset-0 z-[100] bg-black/95 flex-col items-center justify-center">
        <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" class="w-32 h-32 md:w-40 md:h-40 mb-4 drop-shadow-[0_0_20px_rgba(251,191,36,0.8)] animate-pulse" alt="Trophy">
        <h1 class="text-3xl md:text-5xl font-black text-amber-400 uppercase tracking-widest mb-1 text-center drop-shadow-lg transition-colors duration-500">¡PARTIDO FINALIZADO!</h1>
        <h2 id="winner-name-modal" class="text-2xl md:text-4xl font-bold text-white text-center mt-2 uppercase tracking-wider">Nombre del Ganador</h2>
        <h3 id="winner-sets-modal" class="text-sm md:text-lg text-zinc-400 font-bold mb-8 uppercase tracking-widest">Ganó 0 a 0 en Sets</h3>
        
        <div class="flex flex-col gap-4 items-center w-full max-w-sm px-6">
            <button onclick="cerrarYRegresar()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black px-6 py-3 rounded-full font-black text-sm md:text-base uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                ✅ Volver a Mesas
            </button>
            <button onclick="cerrarModalYCorregir()" class="w-full bg-rose-500/20 hover:bg-rose-500 text-rose-400 hover:text-white px-6 py-3 rounded-full font-bold text-xs md:text-sm uppercase tracking-widest transition-all border border-rose-500/50 shadow-[0_0_15px_rgba(225,29,72,0.2)] mt-2">
                <i class="fa-solid fa-rotate-left mr-2"></i> Deshacer Último Punto
            </button>
        </div>
    </div>

    <!-- HEADER DE CONTROL -->
    <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-white/10 mb-3">
        <button onclick="window.location.href='mesas.html'" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest text-white transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Mesas
        </button>

        <div class="text-center">
            <span id="info-mesa-fase" class="text-[10px] font-black text-cyan-400 uppercase tracking-widest block">MESA -- • FASE</span>
            <span id="info-juez" class="text-[9px] font-bold text-fuchsia-400 uppercase tracking-widest block mt-1">⚖️ JUEZ: CARGANDO...</span>
            <select id="select-formato" onchange="cambiarFormato()" class="bg-transparent border border-zinc-600 text-zinc-400 hover:border-cyan-400 hover:text-cyan-400 text-[9px] font-bold uppercase rounded mt-2 outline-none text-center cursor-pointer transition-colors py-0.5 px-1 appearance-none text-center">
                <option value="2-3">Formato: 2 de 3 Sets</option>
                <option value="3-5" selected>Formato: 3 de 5 Sets</option>
                <option value="4-7">Formato: 4 de 7 Sets</option>
                <option value="1-15">Formato: 1 a 15 Pts</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <div id="badge-espectadores" class="hidden items-center bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all gap-1" title="Espectadores conectados">
                <i class="fa-solid fa-eye animate-pulse"></i> <span id="contador-espectadores">0</span>
            </div>
            <button id="btn-toggle-ranking" onclick="toggleMostrarRanking()" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all">
                <i class="fa-regular fa-star"></i> MODO RANKING: OFF
            </button>
            <button id="btn-audio" onclick="toggleAudio()" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 w-8 h-8 rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>

    <!-- MÓDULO DE GRABACIÓN INTELIGENTE -->
    <div class="bg-slate-900/80 p-3 rounded-2xl border border-white/10 mb-3 text-center">
        <div class="flex justify-center gap-3 mb-2">
            <button id="btn-camara" onclick="activarCamara()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest transition-colors shadow-[0_0_15px_rgba(79,70,229,0.4)]">
                <i class="fa-solid fa-video mr-1"></i> Activar Cámara
            </button>
            <button id="btn-grabar" onclick="iniciarGrabacion()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest transition-colors hidden shadow-[0_0_15px_rgba(225,29,72,0.4)]">
                <i class="fa-solid fa-circle mr-1"></i> Iniciar Grabación
            </button>
            <button id="btn-detener" onclick="detenerGrabacion()" class="bg-zinc-600 hover:bg-zinc-500 text-white px-4 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest transition-colors hidden">
                <i class="fa-solid fa-stop mr-1"></i> Detener y Guardar
            </button>
        </div>
        <!-- Vista previa de la cámara -->
        <video id="preview-camara" class="w-full max-w-sm mx-auto rounded-lg border border-white/10 hidden mt-3" autoplay muted playsinline></video>
    </div>

    <!-- MARCADOR PRINCIPAL -->
    <div class="flex-1 flex flex-col md:flex-row gap-4 my-2 min-h-0">
        
        <div class="flex-1 flex flex-col min-h-0 relative">
            <div class="bg-cyan-600/30 border border-cyan-500/40 p-3 rounded-2xl mb-2 text-center relative">
                <div id="badge-saque-left" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all animate-pulse">
                    🎾 Saque
                </div>
                <h2 id="name-left" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate mt-1">JUGADOR 1</h2>
                <div id="ranking-info-left" class="text-[10px] font-extrabold text-cyan-300 mt-0.5">Calculando...</div>
            </div>
            <div onclick="addPointLeft()" class="flex-1 card-score score-p1 flex flex-col items-center justify-center cursor-pointer active:bg-cyan-950/40 transition-colors">
                <div id="score-left" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-cyan-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-left" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

        <div class="flex md:flex-col justify-center items-center gap-2 py-1 shrink-0 px-2 md:px-0">
            <button onclick="undo()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action w-full" title="Deshacer último punto">
                <i class="fa-solid fa-rotate-left md:mr-1"></i> <span class="hidden md:inline">Deshacer</span>
            </button>
            <button onclick="manualSwapSides()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action w-full" title="Cambiar lados manualmente">
                <i class="fa-solid fa-arrows-rotate md:mr-1"></i> <span class="hidden md:inline">Lados</span>
            </button>
            <button onclick="forzarCambioSaqueInicial()" class="bg-indigo-600/20 hover:bg-indigo-500 text-indigo-400 hover:text-white p-3 rounded-xl border border-indigo-500/50 text-[10px] md:text-xs font-black uppercase tracking-wider btn-action mt-2 w-full transition-colors shadow-[0_0_10px_rgba(99,102,241,0.2)]" title="Cambiar posesión de saque manualmente">
                <i class="fa-solid fa-table-tennis-paddle-ball md:mr-1"></i> <span class="hidden md:inline">Saque</span>
            </button>
            <button onclick="forzarFinalizacion()" class="bg-amber-600/20 hover:bg-amber-500 text-amber-400 hover:text-black p-3 rounded-xl border border-amber-500/50 text-[10px] md:text-xs font-black uppercase tracking-wider btn-action mt-2 w-full transition-colors shadow-[0_0_10px_rgba(245,158,11,0.2)]" title="Finalizar partido manualmente">
                <i class="fa-solid fa-flag-checkered md:mr-1"></i> <span class="hidden md:inline">Finalizar</span>
            </button>
        </div>

        <div class="flex-1 flex flex-col min-h-0 relative">
            <div class="bg-fuchsia-600/30 border border-fuchsia-500/40 p-3 rounded-2xl mb-2 text-center relative">
                <div id="badge-saque-right" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all animate-pulse">
                    🎾 Saque
                </div>
                <h2 id="name-right" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate mt-1">JUGADOR 2</h2>
                <div id="ranking-info-right" class="text-[10px] font-extrabold text-fuchsia-300 mt-0.5">Calculando...</div>
            </div>
            <div onclick="addPointRight()" class="flex-1 card-score score-p2 flex flex-col items-center justify-center cursor-pointer active:bg-fuchsia-950/40 transition-colors">
                <div id="score-right" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-fuchsia-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-right" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

    </div>

    <!-- HISTORIAL DE SETS -->
    <div id="container-historial" class="bg-slate-900/80 p-3 rounded-2xl border border-white/10 flex justify-center items-center gap-3 flex-wrap min-h-[45px]">
        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Historial de Sets:</span>
        <div id="list-sets" class="flex gap-2 flex-wrap"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const partidoId = urlParams.get('partido');

        let ORG_ID = null; 
        let partidoData = null;
        let reglasRankingList = []; 
        let p1 = { id: null, nombre: 'JUGADOR 1', ptsBase: 0, ptsLive: 0, score: 0, sets: 0, div: 1, handBase: 0 };
        let p2 = { id: null, nombre: 'JUGADOR 2', ptsBase: 0, ptsLive: 0, score: 0, sets: 0, div: 1, handBase: 0 };
        
        let handicapP1 = 0;
        let handicapP2 = 0;

        let historialSets = [];
        let numSetActual = 1;
        let modoJuego = '3-5'; 
        let setsParaGanar = 3;
        let pointsToWin = 11;
        
        let isSwapped = false;
        let firstServersBySet = [1];
        let audioMuted = false;
        let mostrarRankingImpacto = false;
        
        let historyStack = [];
        let canalEspectadores = null;

        const getApellido = (nom) => {
            if (!nom) return "";
            const partes = nom.trim().split(" ");
            return partes[partes.length - 1];
        };

        window.pinJuezOficial = '1234'; 

        async function cargarInfoRapidaParaPIN() {
            try {
                const { data: partData } = await clienteSupabase.from('partidos').select('torneo_id').eq('id', partidoId).single();
                if (partData && partData.torneo_id) {
                    const { data: torData } = await clienteSupabase.from('torneos').select('pin_jueces').eq('id', partData.torneo_id).single();
                    if (torData && torData.pin_jueces) {
                        window.pinJuezOficial = String(torData.pin_jueces);
                    }
                }
                document.getElementById('texto-estado-pin').innerText = "Ingresa el PIN de Jueces asignado en el Sorteo.";
            } catch(e) { 
                console.warn("Buscando PIN Juez:", e); 
                document.getElementById('texto-estado-pin').innerText = "Ingresa el PIN de Jueces para arbitrar.";
            }
        }

        function verificarPin() {
            const inputVal = document.getElementById('input-pin').value;
            if (inputVal === window.pinJuezOficial || inputVal === 'admin') {
                localStorage.setItem('juez_autorizado_' + partidoId, 'true');
                document.getElementById('modal-pin').classList.add('hidden');
                document.getElementById('modal-pin').classList.remove('flex');
                inicializarJuez();
            } else {
                alert('❌ PIN Incorrecto. Ingresa el PIN de Jueces válido para este torneo.');
                document.getElementById('input-pin').value = '';
                document.getElementById('input-pin').focus();
            }
        }

        document.getElementById('input-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { verificarPin(); }
        });

        function checarAcceso() {
            if (!partidoId) { alert("Error: ID de partido no especificado."); window.location.href = 'mesas.html'; return; }
            
            if (localStorage.getItem('juez_autorizado_' + partidoId) === 'true') {
                inicializarJuez();
            } else {
                document.getElementById('modal-pin').classList.remove('hidden');
                document.getElementById('modal-pin').classList.add('flex');
                setTimeout(() => { document.getElementById('input-pin').focus(); }, 300);
                cargarInfoRapidaParaPIN();
            }
        }

        function calcularHandicapActual() {
            let hP1 = 0; let hP2 = 0;
            let targetPlayer = 0; 
            
            if (p1.div === 2 && p2.div === 1) { hP1 = p1.handBase; targetPlayer = 1; } 
            else if (p2.div === 2 && p1.div === 1) { hP2 = p2.handBase; targetPlayer = 2; }
            
            if (targetPlayer === 1) {
                historialSets.forEach(set => {
                    if (set.s1 > set.s2) hP1 = Math.max(0, hP1 - 1); else hP1 += 1; 
                });
            } else if (targetPlayer === 2) {
                historialSets.forEach(set => {
                    if (set.s2 > set.s1) hP2 = Math.max(0, hP2 - 1); else hP2 += 1; 
                });
            }
            return { hP1, hP2 };
        }

        async function inicializarJuez() {
            try {
                const cacheHistory = localStorage.getItem(`historial_undo_${partidoId}`);
                if (cacheHistory) historyStack = JSON.parse(cacheHistory);
                
                await cargarYResolverPartido();

                const { data: reglas, error: errReglas } = await clienteSupabase.from('reglas_ranking')
                    .select('*')
                    .eq('organizador_id', ORG_ID)
                    .order('diferencia_min', { ascending: true });
                
                if (errReglas) console.error("Error al cargar reglas:", errReglas);
                reglasRankingList = reglas || [];
                
                await calcularRankingEnVivoAcumulado();
                actualizarUI();
            } catch (err) { console.error("Error inicializando:", err); }
        }

        async function cargarYResolverPartido() {
            try {
                const { data, error } = await clienteSupabase
                    .from('partidos')
                    .select('*, j1:jugador1_id(id, nombre, puntos_ranking, division, handicap), j2:jugador2_id(id, nombre, puntos_ranking, division, handicap), categorias(id, nombre)')
                    .eq('id', partidoId)
                    .single();

                if (error || !data) throw new Error("No se encontró el partido.");
                
                partidoData = data;
                ORG_ID = data.organizador_id; 

                document.getElementById('info-juez').innerText = '⚖️ JUEZ: ' + (data.juez || 'COMITÉ');

                p1.id = data.jugador1_id; 
                p1.nombre = data.j1 ? data.j1.nombre : 'Jugador 1'; 
                p1.ptsBase = data.j1 ? data.j1.puntos_ranking || 0 : 0;
                p1.div = data.j1 ? (data.j1.division || 1) : 1;
                p1.handBase = data.j1 && data.j1.handicap !== undefined && data.j1.handicap !== null ? data.j1.handicap : 5;

                p2.id = data.jugador2_id; 
                p2.nombre = data.j2 ? data.j2.nombre : 'Jugador 2'; 
                p2.ptsBase = data.j2 ? data.j2.puntos_ranking || 0 : 0;
                p2.div = data.j2 ? (data.j2.division || 1) : 1;
                p2.handBase = data.j2 && data.j2.handicap !== undefined && data.j2.handicap !== null ? data.j2.handicap : 5;

                p1.score = parseInt(data.puntos_j1) || 0;
                p2.score = parseInt(data.puntos_j2) || 0;
                p1.sets = parseInt(data.sets_j1) || 0;
                p2.sets = parseInt(data.sets_j2) || 0;
                
                let hs = data.historial_sets;
                if (typeof hs === 'string') { try { hs = JSON.parse(hs); } catch(e) { hs = []; } }
                historialSets = Array.isArray(hs) ? hs : [];
                numSetActual = historialSets.length + 1;

                let hActual = calcularHandicapActual();
                handicapP1 = hActual.hP1;
                handicapP2 = hActual.hP2;

                firstServersBySet = [];
                let tempHP1 = p1.div === 2 && p2.div === 1 ? p1.handBase : 0;
                let tempHP2 = p2.div === 2 && p1.div === 1 ? p2.handBase : 0;
                
                for (let i = 0; i < numSetActual; i++) {
                    if (tempHP1 > 0 || tempHP2 > 0) {
                        if (tempHP1 > 0 && tempHP2 === 0) firstServersBySet.push(2); 
                        else if (tempHP2 > 0 && tempHP1 === 0) firstServersBySet.push(1); 
                        else firstServersBySet.push(1);
                    } else {
                        if (i === 0) firstServersBySet.push(1);
                        else firstServersBySet.push(firstServersBySet[i-1] === 1 ? 2 : 1);
                    }
                    
                    if (i < historialSets.length) {
                        let s = historialSets[i];
                        if (p1.div === 2 && p2.div === 1) {
                            if (s.s1 > s.s2) tempHP1 = Math.max(0, tempHP1 - 1); else tempHP1 += 1;
                        } else if (p2.div === 2 && p1.div === 1) {
                            if (s.s2 > s.s1) tempHP2 = Math.max(0, tempHP2 - 1); else tempHP2 += 1;
                        }
                    }
                }

                if (historialSets.length === 0 && p1.score === 0 && p2.score === 0 && p1.sets === 0 && p2.sets === 0) {
                    if (handicapP1 > 0 || handicapP2 > 0) {
                        p1.score = handicapP1;
                        p2.score = handicapP2;
                        clienteSupabase.from('partidos').update({ puntos_j1: p1.score, puntos_j2: p2.score }).eq('id', partidoId);
                    }
                }

                modoJuego = data.modo_juego || '3-5';
                definirReglasMatematicas();

                const selFormato = document.getElementById('select-formato');
                if (selFormato) selFormato.value = modoJuego;
                
                let memoriaLocalRanking = localStorage.getItem('preferencia_ranking_pixel');
                if (data.mostrar_ranking !== undefined && data.mostrar_ranking !== null) {
                    mostrarRankingImpacto = data.mostrar_ranking;
                } else {
                    mostrarRankingImpacto = (memoriaLocalRanking === 'true');
                }

                isSwapped = (numSetActual % 2 === 0);

                if (data.estado === 'finalizado' && data.ganador_id) {
                    let nomWin = data.ganador_id === p1.id ? p1.nombre : p2.nombre;
                    mostrarOverlayGanador(nomWin);
                }

                actualizarBotonRankingUI();
                actualizarUI();
                iniciarPresenciaEspectadores();

            } catch (err) { console.error("Crash:", err); }
        }

        function definirReglasMatematicas() {
            if (modoJuego === '2-3') { setsParaGanar = 2; pointsToWin = 11; }
            else if (modoJuego === '4-7') { setsParaGanar = 4; pointsToWin = 11; }
            else if (modoJuego === '1-15') { setsParaGanar = 1; pointsToWin = 15; }
            else { setsParaGanar = 3; pointsToWin = 11; }
        }

        async function calcularRankingEnVivoAcumulado() {
            if (!partidoData || !partidoData.torneo_id) return;
            try {
                const { data: finMatches } = await clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, puntos_ranking), j2:jugador2_id(id, puntos_ranking)').eq('torneo_id', partidoData.torneo_id).eq('estado', 'finalizado');
                let deltaP1 = 0; let deltaP2 = 0;
                if (finMatches && finMatches.length > 0) {
                    finMatches.forEach(m => {
                        if (m.id == partidoId) return;
                        let p1Base = m.j1 ? m.j1.puntos_ranking : 0; let p2Base = m.j2 ? m.j2.puntos_ranking : 0;
                        let impacto = calcularImpactoPuntos(p1Base, p2Base);
                        if (p1.id && m.jugador1_id === p1.id) { deltaP1 += (m.ganador_id === p1.id) ? impacto.j1Gana : impacto.j1Pierde; } else if (p1.id && m.jugador2_id === p1.id) { deltaP1 += (m.ganador_id === p1.id) ? impacto.j2Gana : impacto.j2Pierde; }
                        if (p2.id && m.jugador1_id === p2.id) { deltaP2 += (m.ganador_id === p2.id) ? impacto.j1Gana : impacto.j1Pierde; } else if (p2.id && m.jugador2_id === p2.id) { deltaP2 += (m.ganador_id === p2.id) ? impacto.j2Gana : impacto.j2Pierde; }
                    });
                }
                p1.ptsLive = p1.ptsBase + deltaP1; p2.ptsLive = p2.ptsBase + deltaP2;
            } catch(e) { p1.ptsLive = p1.ptsBase; p2.ptsLive = p2.ptsBase; }
        }

        function calcularImpactoPuntos(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);
            let favoritoEsJ1 = ptsA >= ptsB;

            let reglasRango = reglasRankingList.filter(r => diff >= Number(r.diferencia_min) && diff <= Number(r.diferencia_max));
            
            let reglaGanaFav = null;
            let reglaGanaRet = null;

            if (reglasRango.length >= 2) {
                if (Number(reglasRango[0].puntos_ganador) < Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[0];
                    reglaGanaRet = reglasRango[1];
                } else if (Number(reglasRango[0].puntos_ganador) > Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[1];
                    reglaGanaRet = reglasRango[0];
                } else {
                    let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                    if (str.includes('retador') || str.includes('upset')) { reglaGanaRet = reglasRango[0]; reglaGanaFav = reglasRango[1]; }
                    else { reglaGanaFav = reglasRango[0]; reglaGanaRet = reglasRango[1]; }
                }
            } else if (reglasRango.length === 1) {
                let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                if (str.includes('retador') || str.includes('upset')) reglaGanaRet = reglasRango[0];
                else reglaGanaFav = reglasRango[0];
            }

            let ptsGanaFav = reglaGanaFav ? Number(reglaGanaFav.puntos_ganador) : 10;
            let ptsPierdeFav = reglaGanaRet ? -Math.abs(Number(reglaGanaRet.puntos_perdedor)) : -5;
            
            let ptsGanaRet = reglaGanaRet ? Number(reglaGanaRet.puntos_ganador) : 10;
            let ptsPierdeRet = reglaGanaFav ? -Math.abs(Number(reglaGanaFav.puntos_perdedor)) : -5;

            return { 
                j1Gana: favoritoEsJ1 ? ptsGanaFav : ptsGanaRet, 
                j1Pierde: favoritoEsJ1 ? ptsPierdeFav : ptsPierdeRet, 
                j2Gana: favoritoEsJ1 ? ptsGanaRet : ptsGanaFav, 
                j2Pierde: favoritoEsJ1 ? ptsPierdeRet : ptsPierdeFav 
            };
        }

        function getCurrentServer() {
            let currentSetIdx = numSetActual - 1; 
            if(currentSetIdx >= firstServersBySet.length) { 
                firstServersBySet[currentSetIdx] = firstServersBySet[currentSetIdx-1] === 1 ? 2 : 1; 
            }
            let firstSrv = firstServersBySet[currentSetIdx]; 
            
            let total = p1.score + p2.score; 
            let deuceThreshold = pointsToWin - 1;
            
            let s1Base = Math.max(0, p1.score - handicapP1);
            let s2Base = Math.max(0, p2.score - handicapP2); 
            
            if(s1Base >= deuceThreshold && s2Base >= deuceThreshold && modoJuego !== '1-15') { 
                let extra = (s1Base + s2Base) - (deuceThreshold * 2); 
                return extra % 2 === 0 ? firstSrv : (firstSrv === 1 ? 2 : 1); 
            } else { 
                let blocks = Math.floor(total / 2); 
                return blocks % 2 === 0 ? firstSrv : (firstSrv === 1 ? 2 : 1); 
            }
        }

        function forzarCambioSaqueInicial() { 
            let currentSetIdx = numSetActual - 1; 
            firstServersBySet[currentSetIdx] = firstServersBySet[currentSetIdx] === 1 ? 2 : 1; 
            actualizarUI(); 
        }

            let textRankP1 = mostrarRankingImpacto 
                ? `<strong>${ptsShowP1} pts ${isFin ? '(Final)' : '(En Vivo)'}</strong> | <span class="text-emerald-400 font-bold">🟢 GANA: +${impactoLive.j1Gana}</span> <span class="text-rose-400 font-bold ml-2">🔴 PIERDE: ${impactoLive.j1Pierde}</span>` 
                : `${ptsShowP1} pts ${isFin ? '(Final)' : '(En Vivo)'}`;
                
            let textRankP2 = mostrarRankingImpacto 
                ? `<strong>${ptsShowP2} pts ${isFin ? '(Final)' : '(En Vivo)'}</strong> | <span class="text-emerald-400 font-bold">🟢 GANA: +${impactoLive.j2Gana}</span> <span class="text-rose-400 font-bold ml-2">🔴 PIERDE: ${impactoLive.j2Pierde}</span>` 
                : `${ptsShowP2} pts ${isFin ? '(Final)' : '(En Vivo)'}`;

            document.getElementById('ranking-info-left').innerHTML = isSwapped ? textRankP2 : textRankP1; 
            document.getElementById('ranking-info-right').innerHTML = isSwapped ? textRankP1 : textRankP2;

            let currServer = getCurrentServer(); let visualServerLeft = (!isSwapped && currServer === 1) || (isSwapped && currServer === 2);
            if (visualServerLeft) { document.getElementById('badge-saque-left').classList.remove('hidden'); document.getElementById('badge-saque-right').classList.add('hidden'); } 
            else { document.getElementById('badge-saque-left').classList.add('hidden'); document.getElementById('badge-saque-right').classList.remove('hidden'); }

            const listSetsEl = document.getElementById('list-sets'); listSetsEl.innerHTML = '';
            historialSets.forEach(s => { listSetsEl.innerHTML += `<span class="bg-black/60 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-bold">Set ${s.numSet}: <span class="${s.s1 > s.s2 ? 'text-cyan-400' : 'text-zinc-400'}">${s.s1}</span> - <span class="${s.s2 > s.s1 ? 'text-fuchsia-400' : 'text-zinc-400'}">${s.s2}</span></span>`; });
        }

        function saveSnapshot() { 
            historyStack.push(JSON.parse(JSON.stringify({ p1, p2, historialSets, numSetActual, isSwapped, firstServersBySet, handicapP1, handicapP2 }))); 
            localStorage.setItem(`historial_undo_${partidoId}`, JSON.stringify(historyStack));
        }

        function addPointLeft() { addPoint(isSwapped ? 2 : 1); }
        function addPointRight() { addPoint(isSwapped ? 1 : 2); }

        async function addPoint(jugadorOriginalNum) {
            if (p1.sets >= setsParaGanar || p2.sets >= setsParaGanar || (partidoData && partidoData.estado === 'finalizado')) {
                let ganadorFinal = (p1.sets > p2.sets) ? p1.nombre : p2.nombre;
                if (partidoData && partidoData.ganador_id) {
                    ganadorFinal = partidoData.ganador_id === p1.id ? p1.nombre : p2.nombre;
                }
                mostrarOverlayGanador(ganadorFinal);
                return;
            }

            saveSnapshot();
            
            if (jugadorOriginalNum === 1) p1.score++; else p2.score++;
            let s1 = p1.score, s2 = p2.score;
            let partidoGanado = false; let ganadorId = null;

            if ((s1 >= pointsToWin || s2 >= pointsToWin) && Math.abs(s1 - s2) >= 2) {
                let ganadorSet = s1 > s2 ? 1 : 2;
                if (ganadorSet === 1) p1.sets++; else p2.sets++;
                
                historialSets.push({ numSet: numSetActual, s1: s1, s2: s2 });
                numSetActual++;

                if (p1.sets >= setsParaGanar) { partidoGanado = true; ganadorId = p1.id; }
                else if (p2.sets >= setsParaGanar) { partidoGanado = true; ganadorId = p2.id; }

                if (!partidoGanado) {
                    let hActual = calcularHandicapActual();
                    handicapP1 = hActual.hP1;
                    handicapP2 = hActual.hP2;

                    p1.score = handicapP1; 
                    p2.score = handicapP2;
                    isSwapped = !isSwapped; 
                    
                    if (handicapP1 > 0 || handicapP2 > 0) {
                        if (handicapP1 > 0 && handicapP2 === 0) firstServersBySet.push(2);
                        else if (handicapP2 > 0 && handicapP1 === 0) firstServersBySet.push(1);
                        else {
                            let prevFirst = firstServersBySet[firstServersBySet.length - 1];
                            firstServersBySet.push(prevFirst === 1 ? 2 : 1);
                        }
                    } else {
                        let prevFirst = firstServersBySet[firstServersBySet.length - 1];
                        firstServersBySet.push(prevFirst === 1 ? 2 : 1);
                    }
                }
            }

            if (partidoGanado) { partidoData.estado = 'finalizado'; partidoData.ganador_id = ganadorId; }

            actualizarUI();
            anunciarMarcador(p1.nombre, p1.score, p2.nombre, p2.score, partidoGanado);

            await clienteSupabase.from('partidos').update({
                puntos_j1: p1.score, puntos_j2: p2.score, sets_j1: p1.sets, sets_j2: p2.sets, historial_sets: historialSets,
                estado: partidoGanado ? 'finalizado' : 'en_curso', ganador_id: ganadorId
            }).eq('id', partidoId);

            if (partidoGanado) mostrarOverlayGanador(ganadorId === p1.id ? p1.nombre : p2.nombre);
        }

        async function forzarFinalizacion() {
            if (partidoData && partidoData.estado === 'finalizado') {
                mostrarOverlayGanador(partidoData.ganador_id === p1.id ? p1.nombre : p2.nombre);
                return;
            }

            let numRespuesta = prompt(`⚠️ El partido no ha alcanzado los sets automáticos.\n¿Deseas FINALIZARLO MANUALMENTE?\n\nEscribe 1 para declarar ganador a: ${p1.nombre}\nEscribe 2 para declarar ganador a: ${p2.nombre}\n\nDejar en blanco para cancelar.`);
            
            if (numRespuesta === '1' || numRespuesta === '2') {
                saveSnapshot();
                let ganadorId = (numRespuesta === '1') ? p1.id : p2.id;
                let nombreGanador = (numRespuesta === '1') ? p1.nombre : p2.nombre;

                partidoData.estado = 'finalizado';
                partidoData.ganador_id = ganadorId;

                actualizarUI();
                anunciarMarcador(p1.nombre, p1.score, p2.nombre, p2.score, true);

                await clienteSupabase.from('partidos').update({ estado: 'finalizado', ganador_id: ganadorId }).eq('id', partidoId);
                mostrarOverlayGanador(nombreGanador);
            }
        }

        async function undo(skipConfirm = false) {
            if (historyStack.length > 0) {
                const snap = historyStack.pop();
                localStorage.setItem(`historial_undo_${partidoId}`, JSON.stringify(historyStack)); 
                
                p1 = snap.p1; p2 = snap.p2; 
                historialSets = snap.historialSets; 
                numSetActual = snap.numSetActual; 
                isSwapped = snap.isSwapped; 
                firstServersBySet = snap.firstServersBySet;
                handicapP1 = snap.handicapP1 !== undefined ? snap.handicapP1 : handicapP1;
                handicapP2 = snap.handicapP2 !== undefined ? snap.handicapP2 : handicapP2;
                
                if (partidoData) { partidoData.estado = 'en_curso'; partidoData.ganador_id = null; }
                actualizarUI();
                await clienteSupabase.from('partidos').update({ puntos_j1: p1.score, puntos_j2: p2.score, sets_j1: p1.sets, sets_j2: p2.sets, historial_sets: historialSets, estado: 'en_curso', ganador_id: null }).eq('id', partidoId);
                return;
            } 
            
            if (p1.score === handicapP1 && p2.score === handicapP2 && historialSets.length === 0 && (!partidoData || partidoData.estado !== 'finalizado')) return;

            if (!skipConfirm) {
                let c = confirm("⚠️ Modo Corrección Manual: ¿Deseas deshacer la última acción y reabrir el marcador?");
                if (!c) return;
            }

            if (partidoData && partidoData.estado === 'finalizado') {
                partidoData.estado = 'en_curso';
                partidoData.ganador_id = null;
                
                if (p1.sets >= setsParaGanar || p2.sets >= setsParaGanar) {
                    if (p1.sets > p2.sets) p1.sets = Math.max(0, p1.sets - 1);
                    else p2.sets = Math.max(0, p2.sets - 1);
                    
                    if (historialSets.length > 0) {
                        let lastSet = historialSets.pop();
                        numSetActual = Math.max(1, numSetActual - 1);
                        p1.score = lastSet.s1; p2.score = lastSet.s2;
                        
                        let hActual = calcularHandicapActual();
                        handicapP1 = hActual.hP1;
                        handicapP2 = hActual.hP2;

                        if (p1.score > p2.score) p1.score = Math.max(handicapP1, p1.score - 1);
                        else p2.score = Math.max(handicapP2, p2.score - 1);
                    }
                }
            } 
            else if (p1.score === handicapP1 && p2.score === handicapP2 && (p1.sets > 0 || p2.sets > 0)) {
                if (historialSets.length > 0) {
                    let lastSet = historialSets.pop();
                    numSetActual = Math.max(1, numSetActual - 1);
                    p1.score = lastSet.s1; p2.score = lastSet.s2;
                    
                    let hActual = calcularHandicapActual();
                    handicapP1 = hActual.hP1;
                    handicapP2 = hActual.hP2;

                    if (p1.score > p2.score) { p1.sets = Math.max(0, p1.sets - 1); p1.score = Math.max(handicapP1, p1.score - 1); }
                    else { p2.sets = Math.max(0, p2.sets - 1); p2.score = Math.max(handicapP2, p2.score - 1); }
                }
            } 
            else {
                let resp = prompt(`MODO CORRECCIÓN: ¿A quién le restamos 1 punto?\n\n[ 1 ] para ${p1.nombre}\n[ 2 ] para ${p2.nombre}`);
                if (resp === '1' && p1.score > handicapP1) p1.score--;
                else if (resp === '2' && p2.score > handicapP2) p2.score--;
                else return;
            }

            actualizarUI();
            await clienteSupabase.from('partidos').update({ sets_j1: p1.sets, sets_j2: p2.sets, puntos_j1: p1.score, puntos_j2: p2.score, historial_sets: historialSets, estado: 'en_curso', ganador_id: null }).eq('id', partidoId);
        }

        function toggleAudio() { audioMuted = !audioMuted; document.getElementById('btn-audio').innerHTML = audioMuted ? '<i class="fa-solid fa-volume-xmark text-rose-400"></i>' : '<i class="fa-solid fa-volume-high text-cyan-400"></i>'; }
        function anunciarMarcador(n1, s1, n2, s2, fin) { if (audioMuted || !window.speechSynthesis) return; window.speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(fin ? `¡Juego finalizado!` : `${getApellido(n1)} ${s1}, ${getApellido(n2)} ${s2}`); u.lang = 'es-MX'; window.speechSynthesis.speak(u); }

        // ==========================================
        // MÓDULO DE MEDIARECORDER API (GRABACIÓN)
        // ==========================================
        let mediaRecorder;
        let recordedChunks = [];
        let streamActivo = null;

        async function activarCamara() {
            try {
                // Solicitud de 720p a 30fps para balancear calidad y peso en dispositivos móviles
                streamActivo = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: "environment" },
                    audio: true
                });
                
                const videoElement = document.getElementById('preview-camara');
                videoElement.srcObject = streamActivo;
                videoElement.classList.remove('hidden');
                
                document.getElementById('btn-camara').classList.add('hidden');
                document.getElementById('btn-grabar').classList.remove('hidden');
            } catch (err) {
                alert("⚠️ Error al acceder a la cámara o micrófono. Verifica los permisos del navegador.\nDetalle: " + err.message);
            }
        }

        function iniciarGrabacion() {
            if (!streamActivo) return;
            recordedChunks = [];
            
            // Configuración de bitrate comprimido (~1.5 Mbps) para evitar archivos gigantes
            const options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 1500000 };
            
            try {
                mediaRecorder = new MediaRecorder(streamActivo, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(streamActivo); // Fallback para iOS/Safari
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                document.body.appendChild(a);
                a.style = 'display: none';
                a.href = url;
                
                // Auto-Nomenclatura dinámica
                let faseLimpia = (partidoData?.ronda_fase || partidoData?.grupo_nombre || 'PARTIDO').replace(/\s+/g, '').toUpperCase();
                let div = p1?.div || 1;
                let nombreJ1 = (p1?.nombre || 'JUGADOR1').replace(/\s+/g, '-').toUpperCase();
                let nombreJ2 = (p2?.nombre || 'JUGADOR2').replace(/\s+/g, '-').toUpperCase();
                
                a.download = `${faseLimpia}_DIV${div}_${nombreJ1}_vs_${nombreJ2}.mp4`;
                a.click();
                window.URL.revokeObjectURL(url);
            };

            mediaRecorder.start();
            document.getElementById('btn-grabar').classList.add('hidden');
            
            const btnDetener = document.getElementById('btn-detener');
            btnDetener.classList.remove('hidden');
            btnDetener.classList.remove('bg-zinc-600');
            btnDetener.classList.add('bg-rose-600', 'animate-pulse');
        }

        function detenerGrabacion() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                
                const btnDetener = document.getElementById('btn-detener');
                btnDetener.classList.add('hidden');
                btnDetener.classList.remove('animate-pulse', 'bg-rose-600');
                btnDetener.classList.add('bg-zinc-600');
                
                document.getElementById('btn-grabar').classList.remove('hidden');
            }
        }

        window.onload = checarAcceso;
    </script>
</body>
</html>
