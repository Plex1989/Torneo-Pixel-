<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesa de Arbitraje - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 24px; }
        .score-p1 { border-top: 4px solid #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .score-p2 { border-top: 4px solid #d946ef; box-shadow: 0 10px 30px rgba(217, 70, 239, 0.2); }
        .btn-action { transition: all 0.2s active; }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 bg-[#04060a]">

    <!-- HEADER DE CONTROL -->
    <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-white/10 mb-3">
        <button onclick="window.location.href='mesas.html'" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest text-white transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Mesas
        </button>

        <div class="text-center">
            <span id="info-mesa-fase" class="text-[10px] font-black text-cyan-400 uppercase tracking-widest block">MESA -- • FASE</span>
            <span id="info-formato" class="text-[8px] text-zinc-400 font-bold uppercase">FORMATO: 3 DE 5 SETS</span>
        </div>

        <div class="flex items-center gap-2">
            <!-- BOTÓN INTERRUPTOR DE RANKING PARA ESPECTADORES -->
            <button id="btn-toggle-ranking" onclick="toggleMostrarRanking()" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all">
                📊 Ranking: OFF
            </button>
            <button id="btn-audio" onclick="toggleAudio()" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 w-8 h-8 rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>

    <!-- MARCADOR PRINCIPAL -->
    <div class="flex-1 flex flex-col md:flex-row gap-4 my-2 min-h-0">
        
        <!-- JUGADOR 1 -->
        <div class="flex-1 flex flex-col min-h-0">
            <div class="bg-cyan-600/30 border border-cyan-500/40 p-3 rounded-2xl mb-2 text-center">
                <h2 id="name-j1" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate">JUGADOR 1</h2>
                <div id="ranking-info-j1" class="text-[10px] font-extrabold text-cyan-300 mt-0.5">Calculando ranking...</div>
            </div>
            
            <div onclick="addPoint(1)" class="flex-1 card-score score-p1 flex flex-col items-center justify-center cursor-pointer active:bg-cyan-950/40 transition-colors">
                <div id="score-j1" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-cyan-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-j1" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

        <!-- CONTROLES CENTRALES -->
        <div class="flex md:flex-col justify-center items-center gap-2 py-1 shrink-0">
            <button onclick="undo()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action" title="Deshacer último punto">
                <i class="fa-solid fa-rotate-left mr-1"></i> Deshacer
            </button>
            <button onclick="swapSides()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action" title="Cambiar lados de mesa">
                <i class="fa-solid fa-arrows-rotate mr-1"></i> Lados
            </button>
        </div>

        <!-- JUGADOR 2 -->
        <div class="flex-1 flex flex-col min-h-0">
            <div class="bg-fuchsia-600/30 border border-fuchsia-500/40 p-3 rounded-2xl mb-2 text-center">
                <h2 id="name-j2" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate">JUGADOR 2</h2>
                <div id="ranking-info-j2" class="text-[10px] font-extrabold text-fuchsia-300 mt-0.5">Calculando ranking...</div>
            </div>
            
            <div onclick="addPoint(2)" class="flex-1 card-score score-p2 flex flex-col items-center justify-center cursor-pointer active:bg-fuchsia-950/40 transition-colors">
                <div id="score-j2" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-fuchsia-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-j2" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

    </div>

    <!-- HISTORIAL DE SETS -->
    <div id="container-historial" class="bg-slate-900/80 p-3 rounded-2xl border border-white/10 flex justify-center items-center gap-3 flex-wrap min-h-[45px]">
        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Historial de Sets:</span>
        <div id="list-sets" class="flex gap-2 flex-wrap"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const partidoId = urlParams.get('partido');

        let partidoData = null;
        let reglasRanking = [];
        let p1 = { id: null, nombre: 'JUGADOR 1', ptsBase: 0, ptsLive: 0, score: 0, sets: 0 };
        let p2 = { id: null, nombre: 'JUGADOR 2', ptsBase: 0, ptsLive: 0, score: 0, sets: 0 };
        let historialSets = [];
        let numSetActual = 1;
        let modoJuego = '3-5'; 
        let setsParaGanar = 3;
        let audioMuted = false;
        let mostrarRankingImpacto = false;
        let historyStack = [];

        const getApellido = (nom) => {
            if (!nom) return "";
            const partes = nom.trim().split(" ");
            return partes[partes.length - 1];
        };

        async function inicializarJuez() {
            if (!partidoId) { alert("ID de partido no especificado."); return; }

            const { data: reglas } = await clienteSupabase.from('reglas_ranking').select('*').order('diferencia_min', { ascending: true });
            reglasRanking = reglas || [];

            await cargarYResolverPartido();

            clienteSupabase
                .channel(`juez-match-${partidoId}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'partidos', filter: `id=eq.${partidoId}` }, payload => {
                    if (payload.new.estado === 'finalizado' && payload.new.ganador_id !== null) {
                        // Notificación remota
                    }
                })
                .subscribe();
        }

        async function cargarYResolverPartido() {
            const { data, error } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(id, nombre, puntos_ranking), j2:jugador2_id(id, nombre, puntos_ranking), categorias(id, nombre)')
                .eq('id', partidoId)
                .single();

            if (error || !data) { alert("Error al cargar partido."); return; }
            partidoData = data;

            p1.id = data.jugador1_id;
            p1.nombre = data.j1 ? data.j1.nombre : 'Jugador 1';
            p1.ptsBase = data.j1 ? data.j1.puntos_ranking || 0 : 0;

            p2.id = data.jugador2_id;
            p2.nombre = data.j2 ? data.j2.nombre : 'Jugador 2';
            p2.ptsBase = data.j2 ? data.j2.puntos_ranking || 0 : 0;

            p1.score = data.puntos_j1 || 0;
            p2.score = data.puntos_j2 || 0;
            p1.sets = data.sets_j1 || 0;
            p2.sets = data.sets_j2 || 0;

            modoJuego = data.modo_juego || '3-5';
            setsParaGanar = modoJuego === '2-3' ? 2 : (modoJuego === '3-5' ? 3 : 4);
            historialSets = data.historial_sets || [];
            numSetActual = historialSets.length + 1;
            mostrarRankingImpacto = data.mostrar_ranking || false;

            // CÁLCULO DE RANKING ACUMULADO EN VIVO (Partidos anteriores en este torneo)
            await calcularRankingEnVivoAcumulado();

            actualizarUI();
        }

        async function calcularRankingEnVivoAcumulado() {
            if (!partidoData || !partidoData.torneo_id) return;

            // Buscar todos los partidos finalizados en este torneo ANTES o DISTINTOS del partido actual
            const { data: finMatches } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(id, puntos_ranking), j2:jugador2_id(id, puntos_ranking)')
                .eq('torneo_id', partidoData.torneo_id)
                .eq('estado', 'finalizado');

            let deltaP1 = 0;
            let deltaP2 = 0;

            if (finMatches && finMatches.length > 0) {
                finMatches.forEach(m => {
                    if (m.id == partidoId) return; // Ignorar el partido actual en curso

                    let p1Inicial = m.j1 ? m.j1.puntos_ranking : 0;
                    let p2Inicial = m.j2 ? m.j2.puntos_ranking : 0;
                    let impacto = calcularImpactoPuntos(p1Inicial, p2Inicial);

                    if (m.jugador1_id === p1.id) {
                        deltaP1 += (m.ganador_id === p1.id) ? impacto.j1Gana : impacto.j1Pierde;
                    } else if (m.jugador2_id === p1.id) {
                        deltaP1 += (m.ganador_id === p1.id) ? impacto.j2Gana : impacto.j2Pierde;
                    }

                    if (m.jugador1_id === p2.id) {
                        deltaP2 += (m.ganador_id === p2.id) ? impacto.j1Gana : impacto.j1Pierde;
                    } else if (m.jugador2_id === p2.id) {
                        deltaP2 += (m.ganador_id === p2.id) ? impacto.j2Gana : impacto.j2Pierde;
                    }
                });
            }

            p1.ptsLive = p1.ptsBase + deltaP1;
            p2.ptsLive = p2.ptsBase + deltaP2;
        }

        function calcularImpactoPuntos(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);
            let favoritoEsJ1 = ptsA >= ptsB;

            let reglaGanaJ1 = reglasRanking.find(r => 
                diff >= r.diferencia_min && diff <= r.diferencia_max && 
                ((favoritoEsJ1 && r.resultado_esperado === 'gana_favorito') || (!favoritoEsJ1 && r.resultado_esperado === 'gana_retador'))
            );

            let reglaGanaJ2 = reglasRanking.find(r => 
                diff >= r.diferencia_min && diff <= r.diferencia_max && 
                ((!favoritoEsJ1 && r.resultado_esperado === 'gana_favorito') || (favoritoEsJ1 && r.resultado_esperado === 'gana_retador'))
            );

            return {
                j1Gana: reglaGanaJ1 ? reglaGanaJ1.puntos_ganador : 10,
                j1Pierde: reglaGanaJ2 ? -Math.abs(reglaGanaJ2.puntos_perdedor) : -5,
                j2Gana: reglaGanaJ2 ? reglaGanaJ2.puntos_ganador : 10,
                j2Pierde: reglaGanaJ1 ? -Math.abs(reglaGanaJ1.puntos_perdedor) : -5
            };
        }

        function toggleMostrarRanking() {
            mostrarRankingImpacto = !mostrarRankingImpacto;
            const btn = document.getElementById('btn-toggle-ranking');
            btn.innerText = `📊 Ranking: ${mostrarRankingImpacto ? 'ON' : 'OFF'}`;
            btn.className = mostrarRankingImpacto 
                ? "bg-amber-500 text-black border border-amber-400 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest shadow-[0_0_12px_rgba(245,158,11,0.5)]"
                : "bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest";

            clienteSupabase.from('partidos').update({ mostrar_ranking: mostrarRankingImpacto }).eq('id', partidoId);
            actualizarUI();
        }

        function actualizarUI() {
            document.getElementById('name-j1').innerText = p1.nombre;
            document.getElementById('name-j2').innerText = p2.nombre;
            document.getElementById('score-j1').innerText = p1.score;
            document.getElementById('score-j2').innerText = p2.score;
            document.getElementById('sets-j1').innerText = p1.sets;
            document.getElementById('sets-j2').innerText = p2.sets;

            document.getElementById('info-mesa-fase').innerText = `MESA ${partidoData?.mesa || 1} • ${partidoData?.grupo_nombre ? 'GRUPO ' + partidoData.grupo_nombre : (partidoData?.ronda_fase || 'FASE FINAL')}`;
            document.getElementById('info-formato').innerText = `FORMATO: ${modoJuego === '2-3' ? '2 DE 3' : (modoJuego === '3-5' ? '3 DE 5' : '4 DE 7')} SETS`;

            // CÁLCULO DE PROYECCIÓN CON EL RANKING ACUMULADO EN VIVO
            const impactoLive = calcularImpactoPuntos(p1.ptsLive, p2.ptsLive);

            const infoJ1El = document.getElementById('ranking-info-j1');
            const infoJ2El = document.getElementById('ranking-info-j2');

            if (mostrarRankingImpacto) {
                infoJ1El.innerHTML = `<strong>${p1.ptsLive} pts (En Vivo)</strong> | <span class="text-emerald-400">🏆 +${impactoLive.j1Gana}</span> <span class="text-rose-400">❌ ${impactoLive.j1Pierde}</span>`;
                infoJ2El.innerHTML = `<strong>${p2.ptsLive} pts (En Vivo)</strong> | <span class="text-emerald-400">🏆 +${impactoLive.j2Gana}</span> <span class="text-rose-400">❌ ${impactoLive.j2Pierde}</span>`;
            } else {
                infoJ1El.innerText = `${p1.ptsLive} pts (En Vivo)`;
                infoJ2El.innerText = `${p2.ptsLive} pts (En Vivo)`;
            }

            const listSetsEl = document.getElementById('list-sets');
            listSetsEl.innerHTML = '';
            historialSets.forEach(s => {
                listSetsEl.innerHTML += `
                    <span class="bg-black/60 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-bold">
                        Set ${s.numSet}: <span class="${s.s1 > s.s2 ? 'text-cyan-400' : 'text-zinc-400'}">${s.s1}</span> - <span class="${s.s2 > s.s1 ? 'text-fuchsia-400' : 'text-zinc-400'}">${s.s2}</span>
                    </span>
                `;
            });
        }

        function saveSnapshot() {
            historyStack.push(JSON.parse(JSON.stringify({ p1, p2, historialSets, numSetActual })));
        }

        async function addPoint(jugadorNum) {
            saveSnapshot();

            if (jugadorNum === 1) p1.score++;
            else p2.score++;

            let s1 = p1.score, s2 = p2.score;
            if ((s1 >= 11 || s2 >= 11) && Math.abs(s1 - s2) >= 2) {
                let ganadorSet = s1 > s2 ? 1 : 2;
                if (ganadorSet === 1) p1.sets++;
                else p2.sets++;

                historialSets.push({ numSet: numSetActual, s1: s1, s2: s2 });
                numSetActual++;

                p1.score = 0;
                p2.score = 0;
            }

            let partidoGanado = false;
            let ganadorId = null;

            if (p1.sets === setsParaGanar) { partidoGanado = true; ganadorId = p1.id; }
            if (p2.sets === setsParaGanar) { partidoGanado = true; ganadorId = p2.id; }

            actualizarUI();
            anunciarMarcador(p1.nombre, p1.score, p2.nombre, p2.score, partidoGanado);

            await clienteSupabase.from('partidos').update({
                puntos_j1: p1.score,
                puntos_j2: p2.score,
                sets_j1: p1.sets,
                sets_j2: p2.sets,
                historial_sets: historialSets,
                estado: partidoGanado ? 'finalizado' : 'en_curso',
                ganador_id: ganadorId
            }).eq('id', partidoId);

            if (partidoGanado) {
                setTimeout(() => {
                    alert(`🏆 ¡PARTIDO FINALIZADO!\nGanador: ${ganadorId === p1.id ? p1.nombre : p2.nombre}`);
                }, 300);
            }
        }

        function undo() {
            if (historyStack.length === 0) return;
            const snap = historyStack.pop();
            p1 = snap.p1; p2 = snap.p2;
            historialSets = snap.historialSets;
            numSetActual = snap.numSetActual;

            actualizarUI();
            clienteSupabase.from('partidos').update({
                puntos_j1: p1.score, puntos_j2: p2.score,
                sets_j1: p1.sets, sets_j2: p2.sets,
                historial_sets: historialSets, estado: 'en_curso', ganador_id: null
            }).eq('id', partidoId);
        }

        function swapSides() {
            let temp = { ...p1 }; p1 = { ...p2 }; p2 = { ...temp };
            actualizarUI();
        }

        function toggleAudio() {
            audioMuted = !audioMuted;
            document.getElementById('btn-audio').innerHTML = audioMuted ? '<i class="fa-solid fa-volume-xmark text-rose-400"></i>' : '<i class="fa-solid fa-volume-high text-cyan-400"></i>';
        }

        function anunciarMarcador(n1, s1, n2, s2, fin) {
            if (audioMuted || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            let texto = fin ? `¡Juego finalizado!` : `${getApellido(n1)} ${s1}, ${getApellido(n2)} ${s2}`;
            let u = new SpeechSynthesisUtterance(texto);
            u.lang = 'es-MX';
            window.speechSynthesis.speak(u);
        }

        inicializarJuez();
    </script>
</body>
</html>
