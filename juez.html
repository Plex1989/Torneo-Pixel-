<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scoreboard Oficial - Arbitraje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .btn-3d { position: relative; margin-bottom: 4px; transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .btn-3d:active { transform: translateY(4px) !important; }
        .btn-off { background-color: #1e293b; box-shadow: 0 4px 0 #0f172a; color: #94a3b8; }
        .btn-cyan { background-color: #06b6d4; box-shadow: 0 4px 0 #164e63; color: white; }
        .btn-fuchsia { background-color: #d946ef; box-shadow: 0 4px 0 #701a75; color: white; }
        .btn-orange { background-color: #f97316; box-shadow: 0 4px 0 #9a3412; color: white; }
        .btn-red { background-color: #e11d48; box-shadow: 0 4px 0 #881337; color: white; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); margin-bottom: 8px; }
        .score-p1 { border-top: 3px solid #06b6d4; box-shadow: 0 8px 0 #020617; }
        .score-p2 { border-top: 3px solid #d946ef; box-shadow: 0 8px 0 #020617; }
        .glass-dark { background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(20px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const { useState, useEffect, useMemo, useRef } = React;

        function App() {
            const [view, setView] = useState('loading'); // loading, h2h, match, error
            const [partidoData, setPartidoData] = useState(null);
            const [h2hHistory, setH2hHistory] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null);

            const [p1, setP1] = useState("");
            const [p2, setP2] = useState("");
            const [mode, setMode] = useState('2-3'); 
            const [score1, setScore1] = useState(0);
            const [score2, setScore2] = useState(0);
            const [sets1, setSets1] = useState(0);
            const [sets2, setSets2] = useState(0);
            const [winner, setWinner] = useState(null);
            const [history, setHistory] = useState([]); 
            const [servingFirst, setServingFirst] = useState(1); 
            const [swapped, setSwapped] = useState(false);
            const [isTimeoutActive, setIsTimeoutActive] = useState(false);
            const [timeoutSeconds, setTimeoutSeconds] = useState(0);

            const timerRef = useRef(null);
            const stateRef = useRef({});

            const urlParams = new URLSearchParams(window.location.search);
            const partidoId = urlParams.get('partido');

            useEffect(() => {
                if (!partidoId) {
                    setErrorMsg("Falta el parámetro ?partido=ID en la URL.");
                    setView('error');
                    return;
                }

                async function fetchMatch() {
                    const { data, error } = await clienteSupabase
                        .from('partidos')
                        .select('*, j1:jugador1_id(id, nombre), j2:jugador2_id(id, nombre)')
                        .eq('id', partidoId)
                        .single();

                    if (error || !data) {
                        setErrorMsg("No se encontró el partido.");
                        setView('error');
                        return;
                    }

                    setPartidoData(data);
                    setP1(data.j1 ? data.j1.nombre : 'Jugador 1');
                    setP2(data.j2 ? data.j2.nombre : 'Jugador 2');
                    setMode(data.modo_juego || '2-3');
                    setScore1(data.puntos_j1 || 0);
                    setScore2(data.puntos_j2 || 0);
                    setSets1(data.sets_j1 || 0);
                    setSets2(data.sets_j2 || 0);

                    // Si ya finalizó, ir directo al match para ver el ganador
                    if (data.estado === 'finalizado') {
                        setWinner(data.ganador_id === data.jugador1_id ? data.j1.nombre : data.j2.nombre);
                        setView('match');
                    } else if (data.estado === 'en_curso') {
                        setView('match');
                    } else {
                        // Buscar H2H Rivalry (Partidos finalizados entre ellos)
                        const { data: historial } = await clienteSupabase
                            .from('partidos')
                            .select('*, torneos(nombre, fecha_evento)')
                            .eq('estado', 'finalizado')
                            .or(`and(jugador1_id.eq.${data.jugador1_id},jugador2_id.eq.${data.jugador2_id}),and(jugador1_id.eq.${data.jugador2_id},jugador2_id.eq.${data.jugador1_id})`)
                            .order('created_at', { ascending: false });

                        setH2hHistory(historial || []);
                        setView('h2h');
                    }
                }
                fetchMatch();
            }, [partidoId]);

            const syncToSupabase = async (newS1, newS2, newSets1, newSets2, estadoPartido, ganadorId = null) => {
                if (!partidoId) return;
                const updateData = { puntos_j1: newS1, puntos_j2: newS2, sets_j1: newSets1, sets_j2: newSets2, estado: estadoPartido, updated_at: new Date().toISOString() };
                if (ganadorId) updateData.ganador_id = ganadorId;
                await clienteSupabase.from('partidos').update(updateData).eq('id', partidoId);
            };

            useEffect(() => {
                if (view === 'match' && !winner && isTimeoutActive) {
                    timerRef.current = setInterval(() => {
                        setTimeoutSeconds(s => { if (s <= 1) { setIsTimeoutActive(false); return 0; } return s - 1; });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [view, winner, isTimeoutActive]);

            useEffect(() => { stateRef.current = { view, addPoint, undo, startTimeout, winner }; });

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const { view, addPoint, undo, startTimeout, winner } = stateRef.current;
                    if (view !== 'match' || winner) return;
                    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown'].includes(e.key)) e.preventDefault(); 
                    switch(e.key) {
                        case 'ArrowLeft': case 'PageUp': addPoint(1); break;
                        case 'ArrowRight': case 'PageDown': addPoint(2); break;
                        case ' ': case 'Enter': undo(); break;
                        case 'ArrowUp': startTimeout(); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const pointsToWin = mode === '1-15' ? 15 : 11;
            const setsNeeded = mode === '2-3' ? 2 : (mode === '3-5' ? 3 : 1);

            const { currentServer, servesRemaining } = useMemo(() => {
                const totalPoints = score1 + score2;
                const isDeuce = score1 >= 10 && score2 >= 10 && mode !== '1-15';
                const serveInterval = isDeuce ? 1 : 2;
                const cyclesPassed = Math.floor(totalPoints / serveInterval);
                const remaining = serveInterval - (totalPoints % serveInterval);
                let server = servingFirst === 1 ? (cyclesPassed % 2 === 0 ? 1 : 2) : (cyclesPassed % 2 === 0 ? 2 : 1);
                return { currentServer: server, servesRemaining: remaining };
            }, [score1, score2, servingFirst, mode]);

            const saveState = () => setHistory([...history, { score1, score2, sets1, sets2, winner, servingFirst, swapped }]);
            
            const undo = () => {
                if (history.length === 0) return;
                const last = history.pop();
                setScore1(last.score1); setScore2(last.score2);
                setSets1(last.sets1); setSets2(last.sets2);
                setWinner(last.winner); setServingFirst(last.servingFirst);
                if (last.swapped !== undefined) setSwapped(last.swapped);
                setHistory([...history]);
                syncToSupabase(last.score1, last.score2, last.sets1, last.sets2, 'en_curso');
            };

            const addPoint = (player) => {
                if (winner || isTimeoutActive) return;
                saveState();
                let s1 = score1, s2 = score2;
                if (player === 1) s1++; else s2++;
                
                if (s1 >= pointsToWin && (s1 - s2 >= 2)) {
                    let ns1 = sets1 + 1;
                    setSets1(ns1);
                    if (ns1 === setsNeeded) { 
                        setWinner(p1); 
                        syncToSupabase(s1, s2, ns1, sets2, 'finalizado', partidoData.jugador1_id);
                    } else { 
                        setScore1(0); setScore2(0); setSwapped(prev => !prev); setServingFirst(prev => prev === 1 ? 2 : 1); 
                        syncToSupabase(0, 0, ns1, sets2, 'en_curso');
                    }
                } else if (s2 >= pointsToWin && (s2 - s1 >= 2)) {
                    let ns2 = sets2 + 1;
                    setSets2(ns2);
                    if (ns2 === setsNeeded) { 
                        setWinner(p2); 
                        syncToSupabase(s1, s2, sets1, ns2, 'finalizado', partidoData.jugador2_id);
                    } else { 
                        setScore1(0); setScore2(0); setSwapped(prev => !prev); setServingFirst(prev => prev === 1 ? 2 : 1); 
                        syncToSupabase(0, 0, sets1, ns2, 'en_curso');
                    }
                } else {
                    if (player === 1) setScore1(s1); else setScore2(s2);
                    syncToSupabase(player === 1 ? s1 : score1, player === 2 ? s2 : score2, sets1, sets2, 'en_curso');
                }
            };

            const startTimeout = () => { setTimeoutSeconds(120); setIsTimeoutActive(true); };
            const changeServe = () => { saveState(); setServingFirst(prev => prev === 1 ? 2 : 1); };

            // VISTAS
            if (view === 'loading') return <div className="min-h-screen flex items-center justify-center text-cyan-400 font-bold uppercase tracking-widest text-sm">Cargando...</div>;
            if (view === 'error') return <div className="min-h-screen flex items-center justify-center text-rose-500 font-bold uppercase text-center">{errorMsg}</div>;

            // PANTALLA H2H (RIVALIDAD)
            if (view === 'h2h') {
                let p1Wins = 0, p2Wins = 0;
                h2hHistory.forEach(h => {
                    if (h.ganador_id === partidoData.jugador1_id) p1Wins++;
                    if (h.ganador_id === partidoData.jugador2_id) p2Wins++;
                });

                return (
                    <div className="fixed inset-0 bg-[#04060a] p-6 overflow-y-auto z-50 text-white flex flex-col items-center">
                        <h1 className="text-2xl md:text-3xl font-black text-cyan-400 mt-10 uppercase tracking-widest text-center">Frente a Frente</h1>
                        <p className="text-zinc-500 text-[10px] font-bold mb-8 uppercase tracking-widest border-b border-white/10 pb-4">Historial de Rivalidad</p>

                        <div className="flex w-full max-w-md justify-between items-center bg-slate-900/50 p-6 rounded-[30px] border border-white/10 mb-8 shadow-[0_0_30px_rgba(6,182,212,0.1)]">
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-cyan-400 font-bold mb-2 drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]">{p1Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p1}</div>
                            </div>
                            <div className="text-2xl font-black italic text-zinc-600">VS</div>
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-fuchsia-400 font-bold mb-2 drop-shadow-[0_0_10px_rgba(217,70,239,0.5)]">{p2Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p2}</div>
                            </div>
                        </div>

                        <div className="w-full max-w-md mb-10">
                            {h2hHistory.length === 0 ? (
                                <div className="text-center text-zinc-500 font-bold text-xs uppercase tracking-widest italic py-8 border border-white/5 rounded-2xl bg-white/5">Es la primera vez que se enfrentan en la liga.</div>
                            ) : (
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest border-b border-white/10 pb-2 mb-4">Últimos Enfrentamientos</h3>
                                    {h2hHistory.map(h => (
                                        <div key={h.id} className="bg-white/5 p-4 rounded-xl flex justify-between items-center border border-white/5">
                                            <div>
                                                <div className="text-[11px] font-bold text-cyan-200 uppercase">{h.torneos?.nombre || 'Torneo Anterior'}</div>
                                                <div className="text-[9px] text-zinc-500 font-bold tracking-widest mt-1">{h.torneos?.fecha_evento || ''}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] font-bold uppercase text-white mb-1">🏆 {h.ganador_id === partidoData.jugador1_id ? p1 : p2}</div>
                                                <div className="text-[9px] font-bold text-zinc-400 tracking-widest bg-black/40 px-2 py-1 rounded inline-block">Score: {h.sets_j1} - {h.sets_j2}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="flex gap-4 w-full max-w-md mt-auto mb-6">
                            <button onClick={() => window.location.href = 'mesas.html'} className="flex-1 py-5 rounded-xl font-bold uppercase tracking-widest text-[10px] btn-3d btn-off">Volver</button>
                            <button onClick={() => { setView('match'); syncToSupabase(0,0,0,0, 'en_curso'); }} className="flex-[2] py-5 rounded-xl font-black uppercase tracking-widest text-[11px] btn-3d btn-cyan text-white">🏓 Iniciar Partido</button>
                        </div>
                    </div>
                )
            }

            // SCOREBOARD EN VIVO
            return (
                <div className="fixed inset-0 flex flex-col z-50 bg-[#04060a] overflow-hidden">
                    <div className="glass-dark py-3 px-6 flex justify-between items-center text-white shrink-0 z-20 border-b border-white/5">
                        <span className="text-[10px] font-bold tracking-[0.2em] text-cyan-400 uppercase">MESA {partidoData?.mesa || 1} • {partidoData?.grupo_nombre ? `GPO ${partidoData.grupo_nombre}` : 'FASE'}</span>
                        <button onClick={() => window.location.href = 'mesas.html'} className="text-zinc-500 font-bold text-[9px] uppercase tracking-widest hover:text-white transition-colors"><i className="fa-solid fa-person-running"></i> Salir a Mesas</button>
                    </div>

                    <div className="flex-1 flex flex-col landscape:flex-row w-full p-3 landscape:p-6 gap-4 overflow-hidden min-h-0">
                        <div className={`flex-1 flex flex-col min-h-0 min-w-0 ${swapped ? 'order-3' : 'order-1'}`}>
                            <div className="name-p1 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10"></div> 
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p1}</h2>
                                    <div className="h-1 w-full flex justify-center gap-2 mt-2">
                                        {currentServer === 1 && Array.from({length: servesRemaining}).map((_, i) => <div key={i} className="h-1 w-6 bg-white rounded-full shadow-[0_0_5px_white] animate-pulse"></div>)}
                                    </div>
                                </div>
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets1}</div>
                            </div>
                            <div onClick={() => addPoint(1)} className="flex-1 card-score score-p1 rounded-[30px] flex flex-col items-center justify-center relative cursor-pointer overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score1}</div>
                            </div>
                        </div>

                        <div className="flex flex-row landscape:flex-col items-center justify-center gap-3 shrink-0 py-1 landscape:py-0 z-20">
                            <button onClick={undo} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-rotate-left text-lg"></i></button>
                            <button onClick={() => { saveState(); setSwapped(prev => !prev); }} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-shuffle text-lg"></i></button>
                            <button onClick={changeServe} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-right-left text-lg"></i></button>
                            <button onClick={startTimeout} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-orange"><i className="fa-solid fa-stopwatch text-lg"></i></button>
                        </div>

                        <div className={`flex-1 flex flex-col min-h-0 min-w-0 ${swapped ? 'order-1' : 'order-3'}`}>
                            <div className="name-p2 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets2}</div>
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p2}</h2>
                                    <div className="h-1 w-full flex justify-center gap-2 mt-2">
                                        {currentServer === 2 && Array.from({length: servesRemaining}).map((_, i) => <div key={i} className="h-1 w-6 bg-white rounded-full shadow-[0_0_5px_white] animate-pulse"></div>)}
                                    </div>
                                </div>
                                <div className="w-10"></div>
                            </div>
                            <div onClick={() => addPoint(2)} className="flex-1 card-score score-p2 rounded-[30px] flex flex-col items-center justify-center relative cursor-pointer overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score2}</div>
                            </div>
                        </div>
                    </div>

                    {isTimeoutActive && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-lg z-[500] flex flex-col items-center justify-center p-10 text-white animate-in zoom-in">
                            <i className="fa-solid fa-stopwatch text-5xl mb-6 text-orange-500"></i>
                            <h3 className="text-xl font-bold uppercase tracking-[0.4em] mb-4 text-white">Pausa (120s)</h3>
                            <div className="text-[12vh] font-digital font-black leading-none tracking-widest text-white mb-12">{Math.floor(timeoutSeconds/60)}:{(timeoutSeconds%60).toString().padStart(2,'0')}</div>
                            <button onClick={() => setIsTimeoutActive(false)} className="px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-xs btn-3d btn-orange">Reanudar Partido</button>
                        </div>
                    )}

                    {winner && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-xl z-[600] flex flex-col items-center justify-center text-center p-6 animate-in zoom-in duration-500">
                            <div className="w-20 h-20 rounded-full btn-3d btn-cyan flex items-center justify-center mb-6"><i className="fa-solid fa-trophy text-3xl text-white"></i></div>
                            <p className="text-cyan-400 font-bold uppercase tracking-[0.4em] text-[10px] mb-3">Victoria Registrada en Supabase</p>
                            <h2 className="text-[6vh] font-black text-white mb-12 uppercase tracking-widest leading-none">{winner}</h2>
                            <div className="flex flex-col landscape:flex-row w-full gap-4 max-w-sm">
                                <button onClick={() => window.location.href = 'mesas.html'} className="flex-1 py-4 rounded-xl font-black uppercase tracking-widest text-xs btn-3d btn-white">Cerrar Scoreboard</button>
                                <button onClick={undo} className="flex-1 py-4 rounded-xl font-bold uppercase tracking-widest text-xs btn-3d btn-off">Corregir Último Punto</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
