<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">

    <script>
        const orgIdCheck = localStorage.getItem('organizador_id');
        if (!orgIdCheck) {
            alert("🔒 Acceso Restringido: Inicia sesión en la Central de Torneos.");
            window.location.href = "torneos.html";

    <style>
        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #04060a; color: #f8fafc; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin: 0; }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 16px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; }
        .btn-filter-pill.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        .btn-filter-pill.active-flash { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        
        .btn-cat-pill { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
        .btn-cat-pill.active { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; max-width: 1200px; margin: auto; }

        .card-mesa { background: rgba(10, 15, 26, 0.7); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 4px solid #0e7490; padding: 18px; position: relative; transition: all 0.3s ease; }
        .card-mesa.vivo { border-bottom-color: #34d399 !important; box-shadow: 0 0 25px rgba(52, 211, 153, 0.15); }
        .card-mesa.finalizado { border-bottom-color: #64748b !important; opacity: 0.85; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .mesa-title { font-size: 12px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .cat-badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        .badge-estado { padding: 3px 8px; border-radius: 9999px; font-weight: 800; font-size: 9px; text-transform: uppercase; }
        .est-pendiente { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .est-curso { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .est-fin { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; }

        .score-container { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.03); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .jugador-nombre { font-size: 13px; font-weight: 800; color: #ffffff; cursor: pointer; transition: color 0.2s; }
        .jugador-nombre:hover { color: #38bdf8; }
        .jugador-club { font-size: 10px; color: #64748b; font-weight: 600; display: block; }
        .score-big { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: #06b6d4; }
        .score-big.p2 { color: #d946ef; }
        .sets-badge { font-size: 10px; font-weight: 800; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 6px; margin-left: 6px; }

        .btn-arbitrar { width: 100%; padding: 12px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24; border-radius: 12px; font-weight: 800; font-size: 10px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; text-align:center; text-decoration:none; display:inline-block; }
        .btn-arbitrar:hover { background: #f59e0b; color: #000000; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }
        .btn-reabrir { background: rgba(148, 163, 184, 0.1) !important; border: 1px solid rgba(148, 163, 184, 0.4) !important; color: #94a3b8 !important; }
        .btn-reabrir:hover { background: rgba(148, 163, 184, 0.2) !important; color: #ffffff !important; box-shadow: none !important; }

        .btn-console { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; color: #f1f5f9; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .btn-console:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }

        .input-tabla { background: rgba(0, 0, 0, 0.5) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; border-radius: 8px !important; color: #ffffff !important; outline: none !important; transition: all 0.2s !important; }
        .input-tabla:focus { border-color: #a855f7 !important; box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
        
        /* Ocultar flechas del input numérico */
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .header-hora { grid-column: 1 / -1; font-size: 12px; color: #38bdf8; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 6px; margin-top: 15px; margin-bottom: 5px; letter-spacing: 1.5px; }

        .seccion-llaves-footer { grid-column: 1 / -1; margin-top: 20px; background: rgba(10, 15, 26, 0.85); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); }
        .mensaje-vacio { text-align: center; color: #475569; font-style: italic; grid-column: 1/-1; padding: 40px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; width: 100%; max-width: 520px; padding: 24px; color: white; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <div id="modal-jugador-admin" class="modal-overlay no-print" style="display: none;">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: start; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px;">
                <div>
                    <h3 id="modal-jugador-nombre" style="margin: 0; color: #38bdf8; font-size: 16px; font-weight: 800; text-transform: uppercase;"></h3>

                </div>
                <button onclick="cerrarModalJugadorAdmin()" style="background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 800;">✕</button>
            </div>
            <div id="modal-jugador-partidos-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="mensaje-vacio">Cargando expediente...</div>
            </div>
            <button onclick="cerrarModalJugadorAdmin()" style="width: 100%; justify-content: center; margin-top: 20px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24; padding: 12px; border-radius: 9999px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;">Cerrar Detalle</button>
        </div>
    </div>

    <!-- NUEVO MODAL INTELIGENTE DE MARCADOR ULTRARRÁPIDO -->
    <div id="modal-marcador" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 400px; padding: 30px; border: 2px solid #a855f7;">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:15px;">
                <h3 style="color: #a855f7; font-size: 16px; font-weight: 900; text-transform: uppercase; margin: 0;">📝 Asignar Marcador Directo</h3>
                <button onclick="cerrarModalMarcador()" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            
            <p style="font-size: 10px; color: #94a3b8; text-align: center; margin-bottom: 25px; text-transform: uppercase; font-weight: 700;">El marcador se guardará automáticamente al poner el segundo número.</p>
            
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 25px;">
                <div style="flex: 1; text-align: center;">
                    <label id="lbl-marcador-j1" style="display: block; font-size: 12px; color: #38bdf8; font-weight: 800; margin-bottom: 8px; min-height: 28px; line-height:1.2;"></label>
                    <input type="number" id="input-sets-j1" class="input-tabla" style="width: 100%; text-align: center; font-size: 40px !important; font-family:'Orbitron',sans-serif; font-weight: 900; padding: 15px !important; background:rgba(0,0,0,0.8)!important; border: 2px solid #38bdf8 !important;" min="0" max="7" oninput="if(this.value.length > 0) document.getElementById('input-sets-j2').focus();">
                </div>
                <div style="font-size: 16px; font-weight: 900; color: #64748b;">VS</div>
                <div style="flex: 1; text-align: center;">
                    <label id="lbl-marcador-j2" style="display: block; font-size: 12px; color: #d946ef; font-weight: 800; margin-bottom: 8px; min-height: 28px; line-height:1.2;"></label>
                    <input type="number" id="input-sets-j2" class="input-tabla" style="width: 100%; text-align: center; font-size: 40px !important; font-family:'Orbitron',sans-serif; font-weight: 900; padding: 15px !important; background:rgba(0,0,0,0.8)!important; border: 2px solid #d946ef !important;" min="0" max="7" oninput="if(this.value.length > 0) setTimeout(guardarMarcadorManual, 400);">
                </div>
            </div>

            <input type="hidden" id="hidden-marcador-partidoid">

            <button id="btn-guardar-marcador" onclick="guardarMarcadorManual()" class="btn-console" style="width: 100%; justify-content: center; background: #a855f7; color: white; border-color: #c084fc; padding: 14px; font-size: 13px;">💾 Guardar Manualmente</button>
        </div>
    </div>

    <div class="header">
        <p style="color:#06b6d4; font-weight:800; font-size:10px; text-transform:uppercase; margin:0 0 4px 0;">Portal de Arbitraje Oficial</p>
        <div class="flex justify-center items-center gap-4">
            <h1 id="nombre-torneo" class="m-0">CENTRAL DE MESAS</h1>
            <div id="badge-espectadores" class="hidden bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest items-center gap-1" title="Espectadores en vivo">
                <i class="fa-solid fa-eye animate-pulse"></i> <span id="contador-espectadores">0</span>
            </div>
        </div>
    </div>

    <div style="font-size:9px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1px;">🏆 Filtrar por Categoría:</div>
    <div class="scrolling-bar" id="bar-categorias">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div style="font-size:9px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1px;">📌 Estado de Juego / Vista:</div>
    <div class="scrolling-bar">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Todos</button>
        <button class="btn-filter-pill" id="tab-flash" onclick="filtrarEstado('flash')" style="color: #fbbf24; border-color: rgba(245,158,11,0.5);">⚡ Estadísticas Flash</button>
        <button class="btn-filter-pill" id="tab-vivo" onclick="filtrarEstado('en_curso')">🔴 En Vivo</button>
        <button class="btn-filter-pill" id="tab-pendientes" onclick="filtrarEstado('pendiente')">⏳ Pendientes</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Finalizados</button>
        <button class="btn-filter-pill" id="tab-resumen" onclick="filtrarEstado('resumen')">📊 Resumen Grupos/Llaves</button>
    </div>

    <div class="scrolling-bar" id="bar-mesas">
        <button class="btn-filter-pill active" onclick="filtrarMesa('todas')">Todas las Mesas</button>
    </div>

    <div class="grid-espectador" id="contenedor-partidos">
        <div class="mensaje-vacio">Cargando marcadores en vivo...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = localStorage.getItem('torneo_activo_id') || 1;
        const orgId = localStorage.getItem('organizador_id'); 

        let todosLosPartidos = [];
        let reglasRankingList = [];
        let mesaFiltro = 'todas';
        let estadoFiltro = 'todos';
        let categoriaFiltro = 'todas';
        let canalEspectadores = null;

        const coloresMesasFlash = [
            { border: '#10b981', bg: 'rgba(16, 185, 129, 0.1)', text: '#10b981' }, 
            { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)', text: '#3b82f6' }, 
            { border: '#d946ef', bg: 'rgba(217, 70, 239, 0.1)', text: '#d946ef' }, 
            { border: '#eab308', bg: 'rgba(234, 179, 8, 0.1)', text: '#eab308' },  
            { border: '#a855f7', bg: 'rgba(168, 85, 247, 0.1)', text: '#a855f7' }, 
            { border: '#f97316', bg: 'rgba(249, 115, 22, 0.1)', text: '#f97316' }, 
            { border: '#06b6d4', bg: 'rgba(6, 182, 212, 0.1)', text: '#06b6d4' }   
        ];

        const obtenerEstiloCategoria = (catId) => {
            const paleta = [
                { bg: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.5)', text: '#fbbf24' },
                { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.5)', text: '#38bdf8' },
                { bg: 'rgba(217, 70, 239, 0.15)', border: 'rgba(217, 70, 239, 0.5)', text: '#f0abfc' },
                { bg: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.5)', text: '#34d399' }
            ];
            return paleta[(catId || 0) % paleta.length];
        };

        const obtenerColorGrupo = (texto) => {
            if (!texto) return { color: '#94a3b8', bg: 'rgba(148,163,184,0.15)', border: 'rgba(148,163,184,0.4)' };
            
            let str = String(texto).toUpperCase();
            let letra = '';
            
            if (str.includes('GPO A') || str.includes('GRUPO A') || str.includes('(A)')) letra = 'A';
            else if (str.includes('GPO B') || str.includes('GRUPO B') || str.includes('(B)')) letra = 'B';
            else if (str.includes('GPO C') || str.includes('GRUPO C') || str.includes('(C)')) letra = 'C';
            else if (str.includes('GPO D') || str.includes('GRUPO D') || str.includes('(D)')) letra = 'D';
            else if (str.includes('GPO E') || str.includes('GRUPO E') || str.includes('(E)')) letra = 'E';
            else if (str.includes('GPO F') || str.includes('GRUPO F') || str.includes('(F)')) letra = 'F';

            switch(letra) {
                case 'A': return { color: '#06b6d4', bg: 'rgba(6,182,212,0.15)', border: 'rgba(6,182,212,0.4)' }; 
                case 'B': return { color: '#a855f7', bg: 'rgba(168,85,247,0.15)', border: 'rgba(168,85,247,0.4)' }; 
                case 'C': return { color: '#10b981', bg: 'rgba(16,185,129,0.15)', border: 'rgba(16,185,129,0.4)' }; 
                case 'D': return { color: '#f59e0b', bg: 'rgba(245,158,11,0.15)', border: 'rgba(245,158,11,0.4)' }; 
                case 'E': return { color: '#f43f5e', bg: 'rgba(244,63,94,0.15)', border: 'rgba(244,63,94,0.4)' }; 
                case 'F': return { color: '#3b82f6', bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.4)' }; 
                default:  return { color: '#cbd5e1', bg: 'rgba(255,255,255,0.05)', border: 'rgba(255,255,255,0.1)' }; 
            }
        };

        async function inicializar() {
            try {
                const { data: torneoData } = await clienteSupabase.from('torneos').select('nombre').eq('id', idTorneoActivo).eq('organizador_id', orgId).single();
                if (torneoData) document.getElementById('nombre-torneo').innerText = torneoData.nombre;

                const { data: reglasData } = await clienteSupabase.from('reglas_ranking').select('*').eq('organizador_id', orgId).order('diferencia_min', { ascending: true });
                if (reglasData) reglasRankingList = reglasData;

                await cargarPartidos();
                iniciarPresenciaEspectadores();

                clienteSupabase
                    .channel('mesas-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => {
                        cargarPartidos();
                    })
                    .subscribe();
            } catch (err) {
                console.error("Error inicializando mesas:", err);
            }
        }

        function iniciarPresenciaEspectadores() {
            canalEspectadores = clienteSupabase.channel(`espectadores_torneo_${idTorneoActivo}`);
            canalEspectadores.on('presence', { event: 'sync' }, () => {
                const newState = canalEspectadores.presenceState();
                const numSpectators = Object.keys(newState).length;
                const badge = document.getElementById('badge-espectadores');
                const contador = document.getElementById('contador-espectadores');
                if (badge && contador) {
                    if (numSpectators > 0) {
                        badge.classList.remove('hidden'); badge.classList.add('flex');
                        contador.innerText = numSpectators;
                    } else {
                        badge.classList.add('hidden'); badge.classList.remove('flex');
                    }
                }
            }).subscribe();
        }

        async function cargarPartidos() {
            try {
                const { data } = await clienteSupabase
                    .from('partidos')
                    .select('*, j1:jugador1_id(id, nombre, club, puntos_ranking), j2:jugador2_id(id, nombre, club, puntos_ranking), categorias(id, nombre)')
                    .eq('torneo_id', idTorneoActivo)
                    .eq('organizador_id', orgId)
                    .order('id', { ascending: true });

                todosLosPartidos = data || [];
                generarBotonesCategorias();
                generarBotonesMesas();
                dibujarPantalla();
            } catch (err) {
                console.error(err);
            }
        }

        function generarBotonesCategorias() {
            const bar = document.getElementById('bar-categorias');
            if(!bar) return;
            const catsMap = new Map();
            todosLosPartidos.forEach(p => {
                if (p.categorias && p.categorias.nombre) {
                    catsMap.set(p.categorias.nombre, p.categorias.id);
                }
            });

            let html = `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarCategoria('todas')">Todas las Categorías</button>`;
            catsMap.forEach((id, nombre) => {
                html += `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === nombre ? 'active' : ''}" onclick="filtrarCategoria('${nombre}')">🏆 ${nombre}</button>`;
            });
            bar.innerHTML = html;
        }

        function filtrarCategoria(catNombre) {
            categoriaFiltro = catNombre;
            generarBotonesCategorias();
            dibujarPantalla();
        }

        function generarBotonesMesas() {
            const bar = document.getElementById('bar-mesas');
            if(!bar) return;
            let mesasUnicas = [...new Set(todosLosPartidos.map(p => p.mesa))].sort((a,b) => a-b);

            let html = `<button class="btn-filter-pill ${mesaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarMesa('todas')">Todas las Mesas</button>`;
            mesasUnicas.forEach(m => {
                if(m) html += `<button class="btn-filter-pill ${mesaFiltro == m ? 'active' : ''}" onclick="filtrarMesa(${m})">Mesa ${m}</button>`;
            });
            bar.innerHTML = html;
        }

        function filtrarMesa(m) {
            mesaFiltro = m;
            generarBotonesMesas();
            dibujarPantalla();
        }

        function filtrarEstado(est) {
            estadoFiltro = est;
            document.querySelectorAll('.scrolling-bar .btn-filter-pill:not(.btn-cat-pill)').forEach(b => {
                b.classList.remove('active');
                b.classList.remove('active-flash');
            });

            if (est === 'todos') document.getElementById('tab-todos')?.classList.add('active');
            else if (est === 'en_curso') document.getElementById('tab-vivo')?.classList.add('active');
            else if (est === 'pendiente') document.getElementById('tab-pendientes')?.classList.add('active');
            else if (est === 'finalizado') document.getElementById('tab-finalizados')?.classList.add('active');
            else if (est === 'resumen') document.getElementById('tab-resumen')?.classList.add('active');
            else if (est === 'flash') document.getElementById('tab-flash')?.classList.add('active-flash');

            dibujarPantalla();
        }

        // ======================= CORRECCIÓN MATEMÁTICA DEFINITIVA DE RANKING =======================
        // Ignora palabras clave en base de datos. Se basa puramente en la tabla de números para saber quién es Fav y quién es Ret.
        function calcularImpactoPuntos(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);
            let favoritoEsJ1 = ptsA >= ptsB;

            let reglasRango = reglasRankingList.filter(r => diff >= Number(r.diferencia_min) && diff <= Number(r.diferencia_max));
            
            let reglaGanaFav = null;
            let reglaGanaRet = null;

            if (reglasRango.length >= 2) {
                // El Retador siempre gana MÁS puntos por dar la sorpresa
                if (Number(reglasRango[0].puntos_ganador) < Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[0];
                    reglaGanaRet = reglasRango[1];
                } else if (Number(reglasRango[0].puntos_ganador) > Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[1];
                    reglaGanaRet = reglasRango[0];
                } else {
                    let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                    if (str.includes('retador') || str.includes('upset')) { reglaGanaRet = reglasRango[0]; reglaGanaFav = reglasRango[1]; }
                    else { reglaGanaFav = reglasRango[0]; reglaGanaRet = reglasRango[1]; }
                }
            } else if (reglasRango.length === 1) {
                let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                if (str.includes('retador') || str.includes('upset')) reglaGanaRet = reglasRango[0];
                else reglaGanaFav = reglasRango[0];
            }

            let ptsGanaFav = reglaGanaFav ? Number(reglaGanaFav.puntos_ganador) : 10;
            // Si el favorito pierde, se le aplica el castigo configurado en la regla de "Gana Retador"
            let ptsPierdeFav = reglaGanaRet ? -Math.abs(Number(reglaGanaRet.puntos_perdedor)) : -5;
            
            let ptsGanaRet = reglaGanaRet ? Number(reglaGanaRet.puntos_ganador) : 10;
            // Si el retador pierde, se le aplica el castigo configurado en la regla de "Gana Favorito"
            let ptsPierdeRet = reglaGanaFav ? -Math.abs(Number(reglaGanaFav.puntos_perdedor)) : -5;

            return { 
                j1Gana: favoritoEsJ1 ? ptsGanaFav : ptsGanaRet, 
                j1Pierde: favoritoEsJ1 ? ptsPierdeFav : ptsPierdeRet, 
                j2Gana: favoritoEsJ1 ? ptsGanaRet : ptsGanaFav, 
                j2Pierde: favoritoEsJ1 ? ptsPierdeRet : ptsPierdeFav 
            };
        }

        function calcularStandingsGrupos() {
            const porCategoria = {};

            todosLosPartidos.forEach(m => {
                if (!m.grupo_nombre || m.grupo_nombre === 'Flash') return; 
                
                const catNombre = m.categorias?.nombre || 'General';
                if (!porCategoria[catNombre]) porCategoria[catNombre] = {};
                
                const gpoNombre = m.grupo_nombre;
                if (!porCategoria[catNombre][gpoNombre]) porCategoria[catNombre][gpoNombre] = {};

                const grupoObj = porCategoria[catNombre][gpoNombre];

                [m.j1, m.j2].forEach(j => {
                    if (j && j.id && !grupoObj[j.id]) {
                        grupoObj[j.id] = { 
                            id: j.id, nombre: j.nombre, club: j.club, 
                            pj: 0, pg: 0, pp: 0, pts: 0, setsG: 0, setsP: 0, 
                            rankImpact: 0, rivalesStr: [] 
                        };
                    }
                });

                let estLimpio = String(m.estado || '').trim().toLowerCase();
                if (estLimpio === 'finalizado' && m.j1 && m.j2) {
                    const j1 = grupoObj[m.j1.id];
                    const j2 = grupoObj[m.j2.id];

                    if (j1 && j2) {
                        j1.pj += 1; j2.pj += 1;
                        j1.setsG += (m.sets_j1 || 0); j1.setsP += (m.sets_j2 || 0);
                        j2.setsG += (m.sets_j2 || 0); j2.setsP += (m.sets_j1 || 0);

                        let r1 = m.j1.puntos_ranking || 0;
                        let r2 = m.j2.puntos_ranking || 0;
                        
                        let impacto = calcularImpactoPuntos(r1, r2);
                        let ptsGana = 0; let ptsPierde = 0;

                        let nomCorto1 = m.j1.nombre.split(' ')[0];
                        let nomCorto2 = m.j2.nombre.split(' ')[0];

                        if (m.ganador_id === m.jugador1_id) {
                            j1.pg += 1; j1.pts += 2;
                            j2.pp += 1; j2.pts += 1;
                            
                            ptsGana = impacto.j1Gana;
                            ptsPierde = impacto.j2Pierde;
                            
                            j1.rankImpact += ptsGana;
                            j2.rankImpact += ptsPierde;
                            j1.rivalesStr.push(`<span style="color:#34d399">✅ vs ${nomCorto2} (+${ptsGana})</span>`);
                            j2.rivalesStr.push(`<span style="color:#f87171">❌ vs ${nomCorto1} (${ptsPierde})</span>`);
                        } else if (m.ganador_id === m.jugador2_id) {
                            j2.pg += 1; j2.pts += 2;
                            j1.pp += 1; j1.pts += 1;
                            
                            ptsGana = impacto.j2Gana;
                            ptsPierde = impacto.j1Pierde;

                            j2.rankImpact += ptsGana;
                            j1.rankImpact += ptsPierde;
                            j2.rivalesStr.push(`<span style="color:#34d399">✅ vs ${nomCorto1} (+${ptsGana})</span>`);
                            j1.rivalesStr.push(`<span style="color:#f87171">❌ vs ${nomCorto2} (${ptsPierde})</span>`);
                        }
                    }
                }
            });

            return porCategoria;
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                if (Math.abs(rSetB - rSetA) > 0.0001) return rSetB - rSetA;
                return b.pg - a.pg; 
            });
        }

        function precalcularProyecciones() {
            let proyecciones = {};
            const standings = calcularStandingsGrupos();
            const categoriasSet = new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean));

            categoriasSet.forEach(catNombre => {
                const gruposCat = standings[catNombre] || {};
                const numGrupos = Object.keys(gruposCat).length;
                
                let clasificados = [];
                Object.keys(gruposCat).forEach(gpoNombre => {
                    let jugArr = ordenarJugadoresITTF(Object.values(gruposCat[gpoNombre]));
                    if(jugArr[0]) clasificados.push({ ...jugArr[0], seedType: 1, gpo: gpoNombre });
                    if(jugArr[1]) clasificados.push({ ...jugArr[1], seedType: 2, gpo: gpoNombre });
                });
                
                clasificados.sort((a,b) => {
                    if(a.seedType !== b.seedType) return a.seedType - b.seedType;
                    if(b.pts !== a.pts) return b.pts - a.pts;
                    let diffA = (a.setsG||0) - (a.setsP||0);
                    let diffB = (b.setsG||0) - (b.setsP||0);
                    return diffB - diffA;
                });

                let s1 = clasificados[0] || { nombre: 'Seed 1', gpo: '-' };
                let s2 = clasificados[1] || { nombre: 'Seed 2', gpo: '-' };
                let s3 = clasificados[2] || { nombre: 'Seed 3', gpo: '-' };
                let s4 = clasificados[3] || { nombre: 'Seed 4', gpo: '-' };
                let s5 = clasificados[4] || { nombre: 'Seed 5', gpo: '-' };
                let s6 = clasificados[5] || { nombre: 'Seed 6', gpo: '-' };
                let s7 = clasificados[6] || { nombre: 'Seed 7', gpo: '-' };
                let s8 = clasificados[7] || { nombre: 'Seed 8', gpo: '-' };

                const partidosLlaveBD = todosLosPartidos.filter(p => p.categorias?.nombre === catNombre && (!p.grupo_nombre || p.grupo_nombre !== 'Flash') && p.ronda_fase);
                
                const pCuartos1 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('1'));
                const pCuartos2 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('2'));
                const pCuartos3 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('3'));
                const pCuartos4 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('4'));

                const partidoSemi1 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('1') || String(p.ronda_fase || '').toLowerCase().includes('cruce 1')));
                const partidoSemi2 = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('2') || String(p.ronda_fase || '').toLowerCase().includes('cruce 2')));
                const partidoFinal = partidosLlaveBD.find(p => String(p.ronda_fase || '').toLowerCase().includes('final') && !String(p.ronda_fase || '').toLowerCase().includes('semi'));

                let nomC1_j1 = pCuartos1?.j1 ? pCuartos1.j1.nombre : s1.nombre;
                let nomC1_j2 = pCuartos1?.j2 ? pCuartos1.j2.nombre : s8.nombre;
                let nomC2_j1 = pCuartos2?.j1 ? pCuartos2.j1.nombre : s4.nombre;
                let nomC2_j2 = pCuartos2?.j2 ? pCuartos2.j2.nombre : s5.nombre;
                let nomC3_j1 = pCuartos3?.j1 ? pCuartos3.j1.nombre : s3.nombre;
                let nomC3_j2 = pCuartos3?.j2 ? pCuartos3.j2.nombre : s6.nombre;
                let nomC4_j1 = pCuartos4?.j1 ? pCuartos4.j1.nombre : s2.nombre;
                let nomC4_j2 = pCuartos4?.j2 ? pCuartos4.j2.nombre : s7.nombre;

                let nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : (pCuartos1?.ganador_id ? (pCuartos1.ganador_id === pCuartos1.jugador1_id ? nomC1_j1 : nomC1_j2) : 'Gana C1');
                let nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : (pCuartos2?.ganador_id ? (pCuartos2.ganador_id === pCuartos2.jugador1_id ? nomC2_j1 : nomC2_j2) : 'Gana C2');
                let nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : (pCuartos3?.ganador_id ? (pCuartos3.ganador_id === pCuartos3.jugador1_id ? nomC3_j1 : nomC3_j2) : 'Gana C3');
                let nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : (pCuartos4?.ganador_id ? (pCuartos4.ganador_id === pCuartos4.jugador1_id ? nomC4_j1 : nomC4_j2) : 'Gana C4');

                let nomFinal_j1 = partidoFinal?.j1 ? partidoFinal.j1.nombre : (partidoSemi1?.ganador_id ? (partidoSemi1.ganador_id === partidoSemi1.jugador1_id ? nomSemi1_j1 : nomSemi1_j2) : 'Gana Semi 1');
                let nomFinal_j2 = partidoFinal?.j2 ? partidoFinal.j2.nombre : (partidoSemi2?.ganador_id ? (partidoSemi2.ganador_id === partidoSemi2.jugador1_id ? nomSemi2_j1 : nomSemi2_j2) : 'Gana Semi 2');

                if(pCuartos1) proyecciones[pCuartos1.id] = { n1: nomC1_j1, n2: nomC1_j2 };
                if(pCuartos2) proyecciones[pCuartos2.id] = { n1: nomC2_j1, n2: nomC2_j2 };
                if(pCuartos3) proyecciones[pCuartos3.id] = { n1: nomC3_j1, n2: nomC3_j2 };
                if(pCuartos4) proyecciones[pCuartos4.id] = { n1: nomC4_j1, n2: nomC4_j2 };

                if(partidoSemi1) proyecciones[partidoSemi1.id] = { n1: nomSemi1_j1, n2: nomSemi1_j2 };
                if(partidoSemi2) proyecciones[partidoSemi2.id] = { n1: nomSemi2_j1, n2: nomSemi2_j2 };
                if(partidoFinal) proyecciones[partidoFinal.id] = { n1: nomFinal_j1, n2: nomFinal_j2 };
            });
            return proyecciones;
        }

        async function guardarMarcadorManual() {
            let partidoId = document.getElementById('hidden-marcador-partidoid').value;
            let valJ1 = document.getElementById('input-sets-j1').value;
            let valJ2 = document.getElementById('input-sets-j2').value;

            if (valJ1 === '' || valJ2 === '') return;
            
            let setsJ1 = parseInt(valJ1);
            let setsJ2 = parseInt(valJ2);

            if (isNaN(setsJ1) || isNaN(setsJ2)) return;
            
            const btn = document.getElementById('btn-guardar-marcador');

            if (setsJ1 === setsJ2) {
                btn.innerText = "❌ Empate no válido";
                setTimeout(() => { btn.innerText = "💾 Guardar Manualmente"; }, 2000);
                return;
            }

            btn.disabled = true; btn.innerText = '⏳ Guardando...';

            try {
                const { data: partido } = await clienteSupabase.from('partidos').select('jugador1_id, jugador2_id').eq('id', partidoId).single();
                let ganador_id = setsJ1 > setsJ2 ? partido.jugador1_id : partido.jugador2_id;

                const { error } = await clienteSupabase.from('partidos').update({
                    sets_j1: setsJ1,
                    sets_j2: setsJ2,
                    puntos_j1: setsJ1,
                    puntos_j2: setsJ2,
                    estado: 'finalizado',
                    ganador_id: ganador_id
                }).eq('id', partidoId);

                if (!error) {
                    cerrarModalMarcador();
                    window.location.reload();
                } else {
                    alert("❌ Error al guardar en base de datos: " + error.message);
                    btn.disabled = false; btn.innerText = '💾 Guardar Manualmente';
                }
            } catch (e) {
                console.error(e);
                alert("❌ Error: " + e.message);
                btn.disabled = false; btn.innerText = '💾 Guardar Manualmente';
            }
        }

                container.style.display = 'block';
                dibujarResumenYLlaves(container);
                return;
            }

            if (estadoFiltro === 'flash') {
                container.style.display = 'block';
                dibujarEstadisticasFlash(container);
                return;
            }

            container.style.display = 'grid';

            let filtrados = todosLosPartidos.filter(p => p.grupo_nombre && p.grupo_nombre !== 'Flash');

            if (mesaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.mesa == mesaFiltro);
            }

            if (categoriaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltro);
            }

            if (estadoFiltro === 'en_curso') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'en_curso');
            } else if (estadoFiltro === 'pendiente') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'pendiente');
            } else if (estadoFiltro === 'finalizado') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'finalizado');

            let stats = {};

            partidosFlash.forEach(m => {
                let estLimpio = String(m.estado || '').trim().toLowerCase();
                if (estLimpio === 'finalizado' && m.j1 && m.j2) {
                    [m.j1, m.j2].forEach(j => {
                        if (j && j.id && !stats[j.id]) {
                            stats[j.id] = { id: j.id, nombre: j.nombre, club: j.club, pj: 0, pg: 0, pp: 0, setsG: 0, setsP: 0 };

                    });

                    if (stats[m.j1.id] && stats[m.j2.id]) {
                        let j1 = stats[m.j1.id];
                        let j2 = stats[m.j2.id];

                        j1.pj++; j2.pj++;
                        j1.setsG += (m.sets_j1 || 0); j1.setsP += (m.sets_j2 || 0);
                        j2.setsG += (m.sets_j2 || 0); j2.setsP += (m.sets_j1 || 0);

                        if (m.ganador_id === m.jugador1_id) { j1.pg++; j2.pp++; }
                        else if (m.ganador_id === m.jugador2_id) { j2.pg++; j1.pp++; }
                    }

        function dibujarLlavesInferiores(container) {
            const standings = calcularStandingsGrupos();
            const categoriasSet = new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean));
            let catsList = [...categoriasSet];

            if (categoriaFiltro !== 'todas') {
                catsList = catsList.filter(c => c === categoriaFiltro);
            }

            if (catsList.length === 0) return;

            const partidosLlaveBD = todosLosPartidos.filter(p => (!p.grupo_nombre || p.grupo_nombre !== 'Flash') && (String(p.ronda_fase || '').toLowerCase().includes('cuarto') || String(p.ronda_fase || '').toLowerCase().includes('cruce') || String(p.ronda_fase || '').toLowerCase().includes('semifinal') || String(p.ronda_fase || '').toLowerCase().includes('final')));

            let footerHtml = '';

            catsList.forEach(catNombre => {
                const gruposCat = standings[catNombre] || {};
                const numGrupos = Object.keys(gruposCat).length;
                
                if (gruposCat['Único'] || (numGrupos === 0 && partidosLlaveBD.filter(p => p.categorias?.nombre === catNombre).length === 0)) return;

                let clasificados = [];
                Object.keys(gruposCat).forEach(gpoNombre => {
                    let jugArr = ordenarJugadoresITTF(Object.values(gruposCat[gpoNombre]));
                    if(jugArr[0]) clasificados.push({ ...jugArr[0], seedType: 1, gpo: gpoNombre });
                    if(jugArr[1]) clasificados.push({ ...jugArr[1], seedType: 2, gpo: gpoNombre });
                });
                
                clasificados.sort((a,b) => {
                    if(a.seedType !== b.seedType) return a.seedType - b.seedType;
                    if(b.pts !== a.pts) return b.pts - a.pts;
                    let diffA = (a.setsG||0) - (a.setsP||0);
                    let diffB = (b.setsG||0) - (b.setsP||0);
                    return diffB - diffA;
                });

                let s1 = clasificados[0] || { nombre: 'Seed 1', gpo: '-' };
                let s2 = clasificados[1] || { nombre: 'Seed 2', gpo: '-' };
                let s3 = clasificados[2] || { nombre: 'Seed 3', gpo: '-' };
                let s4 = clasificados[3] || { nombre: 'Seed 4', gpo: '-' };
                let s5 = clasificados[4] || { nombre: 'Seed 5', gpo: '-' };
                let s6 = clasificados[5] || { nombre: 'Seed 6', gpo: '-' };
                let s7 = clasificados[6] || { nombre: 'Seed 7', gpo: '-' };
                let s8 = clasificados[7] || { nombre: 'Seed 8', gpo: '-' };

                const partidosCatGpo = todosLosPartidos.filter(p => p.grupo_nombre && p.grupo_nombre !== 'Flash' && p.categorias?.nombre === catNombre);
                const totalGpo = partidosCatGpo.length;
                const finGpo = partidosCatGpo.filter(p => String(p.estado || '').trim().toLowerCase() === 'finalizado').length;
                const gpoCompleto = totalGpo > 0 && totalGpo === finGpo;

                const llavesCat = partidosLlaveBD.filter(p => p.categorias?.nombre === catNombre);
                const pCuartos1 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('1'));
                const pCuartos2 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('2'));
                const pCuartos3 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('3'));
                const pCuartos4 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('4'));

                const partidoSemi1 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('1') || String(p.ronda_fase || '').toLowerCase().includes('cruce 1')));
                const partidoSemi2 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('2') || String(p.ronda_fase || '').toLowerCase().includes('cruce 2')));
                const partidoFinal = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('final') && !String(p.ronda_fase || '').toLowerCase().includes('semi'));

                let hayCuartos = pCuartos1 || pCuartos2 || pCuartos3 || pCuartos4 || numGrupos > 2;
                if(!hayCuartos && !partidoSemi1 && !partidoSemi2 && !partidoFinal && numGrupos === 0) return;

                let nomC1_j1 = pCuartos1?.j1 ? pCuartos1.j1.nombre : s1.nombre;
                let nomC1_j2 = pCuartos1?.j2 ? pCuartos1.j2.nombre : s8.nombre;
                let nomC2_j1 = pCuartos2?.j1 ? pCuartos2.j1.nombre : s4.nombre;
                let nomC2_j2 = pCuartos2?.j2 ? pCuartos2.j2.nombre : s5.nombre;
                let nomC3_j1 = pCuartos3?.j1 ? pCuartos3.j1.nombre : s3.nombre;
                let nomC3_j2 = pCuartos3?.j2 ? pCuartos3.j2.nombre : s6.nombre;
                let nomC4_j1 = pCuartos4?.j1 ? pCuartos4.j1.nombre : s2.nombre;
                let nomC4_j2 = pCuartos4?.j2 ? pCuartos4.j2.nombre : s7.nombre;

                let nomSemi1_j1, nomSemi1_j2, nomSemi2_j1, nomSemi2_j2;
                let tS1_1, tS1_2, tS2_1, tS2_2;
                
                if (hayCuartos) {
                    nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : (pCuartos1?.ganador_id ? (pCuartos1.ganador_id === pCuartos1.jugador1_id ? nomC1_j1 : nomC1_j2) : 'Gana C1');
                    nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : (pCuartos2?.ganador_id ? (pCuartos2.ganador_id === pCuartos2.jugador1_id ? nomC2_j1 : nomC2_j2) : 'Gana C2');
                    tS1_1 = 'Gana C1'; tS1_2 = 'Gana C2';
                    
                    nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : (pCuartos3?.ganador_id ? (pCuartos3.ganador_id === pCuartos3.jugador1_id ? nomC3_j1 : nomC3_j2) : 'Gana C3');
                    nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : (pCuartos4?.ganador_id ? (pCuartos4.ganador_id === pCuartos4.jugador1_id ? nomC4_j1 : nomC4_j2) : 'Gana C4');
                    tS2_1 = 'Gana C3'; tS2_2 = 'Gana C4';
                } else {
                    nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : s1.nombre;
                    nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : s4.nombre;
                    tS1_1 = `Seed 1 (${s1.gpo})`; tS1_2 = `Seed 4 (${s4.gpo})`;
                    
                    nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : s2.nombre;
                    nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : s3.nombre;
                    tS2_1 = `Seed 2 (${s2.gpo})`; tS2_2 = `Seed 3 (${s3.gpo})`;
                }

                let nomFinal_j1 = partidoFinal?.j1 ? partidoFinal.j1.nombre : (partidoSemi1?.ganador_id ? (partidoSemi1.ganador_id === partidoSemi1.jugador1_id ? nomSemi1_j1 : nomSemi1_j2) : 'Ganador Semi 1');
                let nomFinal_j2 = partidoFinal?.j2 ? partidoFinal.j2.nombre : (partidoSemi2?.ganador_id ? (partidoSemi2.ganador_id === partidoSemi2.jugador1_id ? nomSemi2_j1 : nomSemi2_j2) : 'Ganador Semi 2');

                let cardsHtml = '';
                if (hayCuartos) {
                    cardsHtml += generarTarjetaLlave(pCuartos1, 'Cuartos 1', '#10b981', 1, nomC1_j1, nomC1_j2, `Seed 1 (Gpo ${s1.gpo})`, `Seed 8 (Gpo ${s8.gpo})`);
                    cardsHtml += generarTarjetaLlave(pCuartos2, 'Cuartos 2', '#10b981', 2, nomC2_j1, nomC2_j2, `Seed 4 (Gpo ${s4.gpo})`, `Seed 5 (Gpo ${s5.gpo})`);
                    cardsHtml += generarTarjetaLlave(pCuartos3, 'Cuartos 3', '#10b981', 3, nomC3_j1, nomC3_j2, `Seed 3 (Gpo ${s3.gpo})`, `Seed 6 (Gpo ${s6.gpo})`);
                    cardsHtml += generarTarjetaLlave(pCuartos4, 'Cuartos 4', '#10b981', 4, nomC4_j1, nomC4_j2, `Seed 2 (Gpo ${s2.gpo})`, `Seed 7 (Gpo ${s7.gpo})`);
                }
                
                cardsHtml += generarTarjetaLlave(partidoSemi1, 'Semifinal 1', '#38bdf8', 1, nomSemi1_j1, nomSemi1_j2, tS1_1, tS1_2);
                cardsHtml += generarTarjetaLlave(partidoSemi2, 'Semifinal 2', '#f0abfc', 2, nomSemi2_j1, nomSemi2_j2, tS2_1, tS2_2);
                cardsHtml += generarTarjetaLlave(partidoFinal, 'Gran Final', '#fbbf24', 1, nomFinal_j1, nomFinal_j2, 'Gana Semi 1', 'Gana Semi 2');

                footerHtml += `
                    <div class="seccion-llaves-footer">
                        <div style="text-align:center; margin-bottom:15px;">
                            <span style="font-size:10px; color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:4px;">Fase Final de Eliminatoria Directa</span>
                            <h3 style="margin:0; border:none; padding:0; font-size:16px; color:#ffffff;">🏆 LLAVES ELIMINATORIAS - ${catNombre}</h3>
                        </div>

                        ${gpoCompleto ? `
                            <div style="background:rgba(16,185,129,0.2); border:1px solid rgba(16,185,129,0.5); color:#34d399; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:11px; text-transform:uppercase; margin-bottom:18px;">
                                ✅ ¡LLAVE DEFINITIVA CONFIRMADA! (Fase de grupos completada)
                            </div>
                        ` : `
                            <div style="background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.4); color:#fbbf24; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:10px; text-transform:uppercase; margin-bottom:18px;">
                                ⏳ PROYECCIÓN PRELIMINAR EN TIEMPO REAL (En espera de finalizar grupos)
                            </div>
                        `}

                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px;">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });
            
            if (footerHtml !== '') container.innerHTML += footerHtml;
        }

        inicializar();
    </script>
</body>
</html>
