<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Mesas - Arbitraje Digital VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <script>
        const urlParamsConfig = new URLSearchParams(window.location.search);
        if (urlParamsConfig.get('torneo')) localStorage.setItem('torneo_activo_id', urlParamsConfig.get('torneo'));
        if (urlParamsConfig.get('org')) localStorage.setItem('organizador_id', urlParamsConfig.get('org'));

        const orgIdCheck = localStorage.getItem('organizador_id');
        if (!orgIdCheck) {
            alert("🔒 Acceso Restringido: Inicia sesión en la Central de Torneos.");
            window.location.href = "torneos.html";
        }
    </script>
    <style>
        /* Paleta Titanium Slate Pro */
        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        body::before { content: ""; position: fixed; top: -15%; left: -10%; width: 600px; height: 600px; background: #1e3a8a; border-radius: 50%; filter: blur(200px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: -10%; right: -10%; width: 700px; height: 700px; background: #312e81; border-radius: 50%; filter: blur(200px); opacity: 0.1; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(148, 163, 184, 0.1); padding-bottom: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #f8fafc; margin: 0; }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(148, 163, 184, 0.15); color: #94a3b8; padding: 8px 16px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; letter-spacing: 1px; }
        .btn-filter-pill:hover { background: rgba(56, 189, 248, 0.12); color: #ffffff; }
        .btn-filter-pill.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
        .btn-filter-pill.active-resumen { background: #059669; color: #ffffff; border-color: #34d399; }
        
        .btn-cat-pill { background: rgba(56, 189, 248, 0.06); border: 1px solid rgba(56, 189, 248, 0.2); color: #7dd3fc; }
        .btn-cat-pill.active { background: #38bdf8; color: #000000; border-color: #38bdf8; }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; max-width: 1350px; margin: auto; }

        .card-mesa { background: rgba(20, 27, 44, 0.85); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(148, 163, 184, 0.12); border-bottom: 3px solid rgba(148, 163, 184, 0.2); padding: 20px; position: relative; transition: all 0.25s ease; display: flex; flex-direction: column; }
        .card-mesa:hover { border-color: rgba(56, 189, 248, 0.35); transform: translateY(-2px); }
        .card-mesa-llave { border-bottom: 3px solid #38bdf8 !important; }
        .card-mesa.vivo { border-bottom-color: #10b981 !important; }
        .card-mesa.finalizado { border-bottom-color: #475569 !important; opacity: 0.8; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); padding-bottom: 10px; }
        .mesa-title { font-size: 13px; font-weight: 800; color: #38bdf8; letter-spacing: 1.5px; }

        .badge-estado { padding: 3px 9px; border-radius: 9999px; font-weight: 800; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
        .est-pendiente { background: rgba(255, 255, 255, 0.05); color: #94a3b8; }
        .est-curso { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .est-fin { background: rgba(0, 0, 0, 0.4); color: #64748b; }

        .score-container { background: rgba(15, 23, 42, 0.7); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid rgba(148, 163, 184, 0.1); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }

        .grid-botones-mesa { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
        .btn-mesa-action { background: rgba(255,255,255,0.03); border: 1px solid rgba(148, 163, 184, 0.15); color: #cbd5e1; border-radius: 10px; padding: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; }
        .btn-mesa-action:hover:not(:disabled) { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #fff; }
        .btn-mesa-arbitrar { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
        .btn-mesa-arbitrar.reabrir { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }

        .header-hora { grid-column: 1 / -1; font-size: 12px; color: #94a3b8; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(148, 163, 184, 0.1); padding-bottom: 6px; margin-top: 20px; margin-bottom: 8px; letter-spacing: 2px; }
        .mensaje-vacio { text-align: center; color: #64748b; font-style: italic; font-weight: 600; grid-column: 1/-1; padding: 50px 20px; background: rgba(15, 23, 42, 0.4); border-radius: 14px; }

        /* ================= ÁRBOL DE LLAVES SVG CONTINUO ================= */
        .bracket-tree-container { display: flex; gap: 45px; padding: 30px 20px; background: rgba(15, 23, 42, 0.4); border-radius: 16px; overflow-x: auto; border: 1px solid rgba(148, 163, 184, 0.1); justify-content: flex-start; align-items: stretch; margin-top: 18px; min-width: max-content; position: relative; }
        .bracket-svg-overlay { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        .bracket-col-stage { display: flex; flex-direction: column; justify-content: space-around; gap: 22px; min-width: 260px; position: relative; z-index: 2; }
        
        .b-match-card { background: rgba(20, 27, 44, 0.85); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.4); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .b-match-header { font-size: 9px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 12px; text-align: center; border-bottom: 1px solid rgba(148, 163, 184, 0.1); background: rgba(30, 41, 59, 0.4); }
        .b-player-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); gap: 10px; }
        .b-player-row:last-child { border-bottom: none; }
        .b-player-info { flex: 1; min-width: 0; }
        .b-player-name { font-size: 12px; font-weight: 700; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .b-player-name.winner { color: #34d399; font-weight: 800; }
        .b-player-club { font-size: 9px; color: #64748b; font-weight: 600; display: block; margin-top: 1px; }
        .b-score-box { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; background: rgba(15, 23, 42, 0.8); padding: 3px 8px; border-radius: 5px; color: #cbd5e1; min-width: 24px; text-align: center; border: 1px solid rgba(148, 163, 184, 0.15); }
        .b-score-box.winner { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #131b2e; border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 16px; width: 100%; max-width: 500px; padding: 22px; color: white; }
    </style>
</head>
<body>

    <div class="header no-print">
        <div style="display: inline-block; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 5px 14px; border-radius: 9999px; letter-spacing: 2px; margin-bottom: 8px;">
            <i class="fa-solid fa-gavel mr-1"></i> CONTROL DE MESAS Y ARBITRAJE
        </div>
        <h1 id="nombre-torneo">CENTRAL DE MESAS</h1>
        
        <nav class="flex justify-center gap-2 mt-4 flex-wrap">
            <a href="#" onclick="window.location.href='admin.html?torneo=' + idTorneoActivo; return false;" class="btn-filter-pill no-underline">Admin</a>
            <a href="#" onclick="abrirVistaInteligente('sorteo'); return false;" class="btn-filter-pill no-underline">Sorteos</a>
            <a href="#" class="btn-filter-pill active no-underline">Mesas</a>
            <a href="#" onclick="enfocarPestanaEspectador(); return false;" class="btn-filter-pill no-underline">Público</a>
        </nav>
    </div>

    <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1.5px;"><i class="fa-solid fa-layer-group mr-1 text-sky-400"></i> Categoría</div>
    <div class="scrolling-bar no-print" id="bar-categorias">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1.5px;"><i class="fa-solid fa-eye mr-1 text-sky-400"></i> Vista de Datos</div>
    <div class="scrolling-bar no-print">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Cartelera Completa</button>
        <button class="btn-filter-pill" id="tab-vivo" onclick="filtrarEstado('en_curso')">🔴 En Vivo</button>
        <button class="btn-filter-pill" id="tab-pendientes" onclick="filtrarEstado('pendiente')">⏳ Por Jugar</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Resultados</button>
        <button class="btn-filter-pill" id="tab-resumen" onclick="filtrarEstado('resumen')" style="color:#34d399; border-color:rgba(16,185,129,0.3);">📊 Estadísticas y Llaves</button>
    </div>

    <div class="grid-espectador" id="contenedor-partidos">
        <div class="mensaje-vacio"><i class="fa-solid fa-spinner fa-spin text-sky-400 text-xl mb-2 block"></i> Conectando con las mesas...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = parseInt(new URLSearchParams(window.location.search).get('torneo')) || parseInt(localStorage.getItem('torneo_activo_id')) || 1;
        let orgId = localStorage.getItem('organizador_id') || 1; 

        let todosLosPartidos = [];
        let todasLasCategorias = [];
        let todosLosJugadoresAdmin = [];
        let estadoFiltro = 'todos';
        let categoriaFiltro = 'todas';

        function abrirVistaInteligente(destino) { window.location.href = destino + ".html?torneo=" + idTorneoActivo; }
        function enfocarPestanaEspectador() {
            let url = "espectador.html?torneo=" + idTorneoActivo;
            let win = window.open(url, 'espectador_view');
            if (win) win.focus();
        }

        async function inicializar() {
            try {
                const { data: torneoData } = await clienteSupabase.from('torneos').select('nombre, organizador_id').eq('id', idTorneoActivo).maybeSingle();
                if (torneoData) {
                    document.getElementById('nombre-torneo').innerText = torneoData.nombre;
                    if (torneoData.organizador_id) {
                        orgId = torneoData.organizador_id;
                        localStorage.setItem('organizador_id', orgId);
                    }
                }

                const [resCat, resJug] = await Promise.all([
                    clienteSupabase.from('categorias').select('*').eq('organizador_id', orgId),
                    clienteSupabase.from('jugadores').select('*').eq('organizador_id', orgId)
                ]);

                if (resCat.data) todasLasCategorias = resCat.data;
                if (resJug.data) todosLosJugadoresAdmin = resJug.data;

                await cargarPartidos();
                clienteSupabase.channel('mesas-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => { cargarPartidos(); }).subscribe();
            } catch (err) { console.error("Error inicializando:", err); }
        }

        async function cargarPartidos() {
            try {
                const { data } = await clienteSupabase.from('partidos')
                    .select('*, j1:jugador1_id(id, nombre, club, puntos_ranking, division), j2:jugador2_id(id, nombre, club, puntos_ranking, division), categorias(id, nombre)')
                    .eq('torneo_id', idTorneoActivo).order('id', { ascending: true });
                todosLosPartidos = data || [];
                generarBotonesCategorias(); 
                dibujarPantalla();
            } catch (err) { console.error(err); }
        }

        function generarBotonesCategorias() {
            const bar = document.getElementById('bar-categorias');
            const catsMap = new Map();
            todosLosPartidos.forEach(p => { if (p.categorias && p.categorias.nombre) catsMap.set(p.categorias.nombre, p.categorias.id); });
            let html = `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarCategoria('todas')">Todas las Categorías</button>`;
            catsMap.forEach((id, nombre) => { html += `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === nombre ? 'active' : ''}" onclick="filtrarCategoria('${nombre}')">🏆 ${nombre}</button>`; });
            bar.innerHTML = html;
        }

        function filtrarCategoria(catNombre) { categoriaFiltro = catNombre; dibujarPantalla(); }
        function filtrarEstado(est) {
            estadoFiltro = est;
            document.querySelectorAll('.btn-filter-pill').forEach(b => b.classList.remove('active', 'active-resumen'));
            if (est === 'resumen') document.getElementById('tab-resumen')?.classList.add('active-resumen');
            else document.getElementById('tab-' + est)?.classList.add('active');
            dibujarPantalla();
        }

        // ================= CONECTOR VECTORIAL SVG (SIN LÍNEAS CORTADAS) =================
        function actualizarLineasConectorasSVG(containerId, svgId) {
            const container = document.getElementById(containerId);
            const svg = document.getElementById(svgId);
            if (!container || !svg) return;

            const scrollW = Math.max(container.scrollWidth, container.clientWidth);
            const scrollH = Math.max(container.scrollHeight, container.clientHeight);
            svg.setAttribute('width', scrollW);
            svg.setAttribute('height', scrollH);
            svg.style.width = scrollW + 'px';
            svg.style.height = scrollH + 'px';

            const cRect = container.getBoundingClientRect();
            const sourceCards = container.querySelectorAll('[data-target]');
            let pathsHtml = '';

            sourceCards.forEach(card => {
                const targetId = card.getAttribute('data-target');
                if (!targetId) return;
                const targetEl = container.querySelector('#' + targetId);
                if (!targetEl) return;

                const slot = card.getAttribute('data-target-slot') || 'center';
                const r1 = card.getBoundingClientRect();
                const r2 = targetEl.getBoundingClientRect();

                const x1 = (r1.right - cRect.left) + container.scrollLeft;
                const y1 = (r1.top + r1.height / 2 - cRect.top) + container.scrollTop;

                const x2 = (r2.left - cRect.left) + container.scrollLeft;
                let y2 = (r2.top + r2.height / 2 - cRect.top) + container.scrollTop;

                if (slot === 'top') {
                    y2 = (r2.top + r2.height * 0.35 - cRect.top) + container.scrollTop;
                } else if (slot === 'bottom') {
                    y2 = (r2.top + r2.height * 0.72 - cRect.top) + container.scrollTop;
                }

                const xMid = Math.round((x1 + x2) / 2);
                const r = 8;
                const dirY = y2 > y1 ? 1 : -1;

                let d = '';
                if (Math.abs(y1 - y2) < 4) {
                    d = `M ${x1} ${y1} L ${x2} ${y2}`;
                } else {
                    d = `M ${x1} ${y1} L ${xMid - r} ${y1} Q ${xMid} ${y1} ${xMid} ${y1 + dirY * r} L ${xMid} ${y2 - dirY * r} Q ${xMid} ${y2} ${xMid + r} ${y2} L ${x2} ${y2}`;
                }

                pathsHtml += `<path d="${d}" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>`;
            });

            svg.innerHTML = pathsHtml;
        }

        // ================= DIBUJAR PANTALLA GENERAL Y ESTADÍSTICAS EN VIVO =================
        function dibujarPantalla() {
            const container = document.getElementById('contenedor-partidos');
            if (estadoFiltro === 'resumen') { 
                container.style.display = 'block'; 
                dibujarEstadisticasYLlaves(container); 
                return; 
            }

            container.style.display = 'grid';
            let filtrados = [...todosLosPartidos];
            if (categoriaFiltro !== 'todas') filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltro);
            if (estadoFiltro !== 'todos') filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === estadoFiltro);

            if (filtrados.length === 0) { 
                container.innerHTML = `<div class="mensaje-vacio">No hay partidos registrados bajo estos filtros.</div>`; 
                return; 
            }

            let htmlContent = '';
            filtrados.forEach(p => {
                let isFin = (p.estado || '').toLowerCase() === 'finalizado';
                let isVivo = (p.estado || '').toLowerCase() === 'en_curso';
                let n1 = p.j1 ? p.j1.nombre : 'Por definir';
                let n2 = p.j2 ? p.j2.nombre : 'Por definir';

                htmlContent += `
                    <div class="card-mesa ${isVivo ? 'vivo' : (isFin ? 'finalizado' : '')}">
                        <div class="top-bar">
                            <span class="mesa-title">MESA ${p.mesa || 1}</span>
                            <span class="badge-estado ${isVivo ? 'est-curso' : (isFin ? 'est-fin' : 'est-pendiente')}">
                                ${isVivo ? '🔴 EN VIVO' : (isFin ? '🏁 FINALIZADO' : '⏳ PENDIENTE')}
                            </span>
                        </div>
                        <div style="font-size: 10px; color: #94a3b8; margin-bottom: 10px; font-weight: 700;">
                            ${p.categorias?.nombre || 'Categoría'} • ${p.ronda_fase || (p.grupo_nombre ? 'Grupo ' + p.grupo_nombre : 'Partido')}
                        </div>
                        <div class="score-container">
                            <div class="jugador-box">
                                <span class="jugador-nombre">${n1}</span>
                                <span class="score-big">${isFin ? p.sets_j1 : (p.puntos_j1 || 0)}</span>
                            </div>
                            <div class="jugador-box">
                                <span class="jugador-nombre">${n2}</span>
                                <span class="score-big">${isFin ? p.sets_j2 : (p.puntos_j2 || 0)}</span>
                            </div>
                        </div>
                        <div class="grid-botones-mesa">
                            <a href="juez.html?partido=${p.id}" class="btn-mesa-action btn-mesa-arbitrar ${isFin ? 'reabrir' : ''}">
                                ${isFin ? '🏁 REABRIR' : '<i class="fa-solid fa-gavel"></i> ARBITRAR'}
                            </a>
                            <a href="espectador.html?partido=${p.id}" target="_blank" class="btn-mesa-action">
                                <i class="fa-solid fa-eye"></i> VER
                            </a>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
        }

        function dibujarEstadisticasYLlaves(container) {
            let catsList = [...new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean))];
            if (categoriaFiltro !== 'todas') catsList = catsList.filter(c => c === categoriaFiltro);

            if (catsList.length === 0) { 
                container.innerHTML = `<div class="mensaje-vacio">No hay datos de estadísticas en este momento.</div>`; 
                return; 
            }

            let htmlContent = '';
            catsList.forEach(catNombre => {
                const partidosCat = todosLosPartidos.filter(p => p.categorias?.nombre === catNombre);
                const esEliminacion = partidosCat.some(p => p.grupo_nombre === 'Eliminacion');
                
                // Mapear participantes
                let jugadoresMap = new Map();
                partidosCat.forEach(p => {
                    if (p.j1) jugadoresMap.set(p.j1.id, { ...p.j1, pj: 0, pg: 0, pp: 0, setsG: 0, setsP: 0 });
                    if (p.j2) jugadoresMap.set(p.j2.id, { ...p.j2, pj: 0, pg: 0, pp: 0, setsG: 0, setsP: 0 });
                });

                // Calcular victorias y sets en tiempo real
                partidosCat.filter(p => (p.estado || '').toLowerCase() === 'finalizado').forEach(p => {
                    if (p.j1 && jugadoresMap.has(p.j1.id)) {
                        let j = jugadoresMap.get(p.j1.id);
                        j.pj++;
                        j.setsG += (p.sets_j1 || 0);
                        j.setsP += (p.sets_j2 || 0);
                        if (p.ganador_id === p.jugador1_id) j.pg++; else j.pp++;
                    }
                    if (p.j2 && jugadoresMap.has(p.j2.id)) {
                        let j = jugadoresMap.get(p.j2.id);
                        j.pj++;
                        j.setsG += (p.sets_j2 || 0);
                        j.setsP += (p.sets_j1 || 0);
                        if (p.ganador_id === p.jugador2_id) j.pg++; else j.pp++;
                    }
                });

                let atletas = Array.from(jugadoresMap.values()).sort((a,b) => b.pg - a.pg || (b.setsG - b.setsP) - (a.setsG - a.setsP) || (b.puntos_ranking || 0) - (a.puntos_ranking || 0));
                let catSlug = catNombre.replace(/\s+/g, '_');

                htmlContent += `
                    <div class="panel-3d" style="margin-bottom: 25px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(148, 163, 184, 0.1); padding-bottom:12px; margin-bottom:16px;">
                            <div>
                                <h3 style="margin:0; border:none; color:#f8fafc; font-size:14px;">🏆 ${catNombre}</h3>
                                <span style="font-size:10px; color:#38bdf8; font-weight:700;">${esEliminacion ? 'Modalidad: Eliminación Directa' : 'Fase de Torneo'}</span>
                            </div>
                        </div>

                        <!-- TABLA GENERAL DE ATLETAS -->
                        <div style="overflow-x:auto;">
                            <table style="width:100%; border-collapse:collapse; font-size:12px;">
                                <thead>
                                    <tr style="font-size:9px; color:#94a3b8; text-transform:uppercase; border-bottom:1px solid rgba(148, 163, 184, 0.1);">
                                        <th style="padding:8px;">Pos</th>
                                        <th style="padding:8px;">Jugador</th>
                                        <th style="padding:8px; text-align:center;">PJ</th>
                                        <th style="padding:8px; text-align:center;">PG</th>
                                        <th style="padding:8px; text-align:center;">PP</th>
                                        <th style="padding:8px; text-align:center;">Sets (G - P)</th>
                                        <th style="padding:8px; text-align:center;">Pts Rank</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${atletas.map((at, idx) => `
                                        <tr style="border-bottom:1px solid rgba(255,255,255,0.03);">
                                            <td style="padding:10px 8px; font-weight:800; color:#64748b;">#${idx+1}</td>
                                            <td style="padding:10px 8px;">
                                                <strong style="color:#ffffff;">${at.nombre}</strong>
                                                <span style="font-size:9px; color:#64748b; display:block;">${at.club || 'Sin Club'}</span>
                                            </td>
                                            <td style="padding:10px 8px; text-align:center; color:#94a3b8;">${at.pj}</td>
                                            <td style="padding:10px 8px; text-align:center; color:#34d399; font-weight:700;">${at.pg}</td>
                                            <td style="padding:10px 8px; text-align:center; color:#f87171;">${at.pp}</td>
                                            <td style="padding:10px 8px; text-align:center;"><span style="color:#34d399;">${at.setsG}</span> : <span style="color:#f87171;">${at.setsP}</span></td>
                                            <td style="padding:10px 8px; text-align:center; font-family:'Orbitron',sans-serif; color:#38bdf8;">${at.puntos_ranking || 0}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <!-- PROYECCIÓN Y CUADRO DE LLAVES EN TIEMPO REAL -->
                        <div style="margin-top: 25px; border-top: 1px solid rgba(148, 163, 184, 0.1); padding-top: 20px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                                <span style="font-size: 12px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px;">
                                    <i class="fa-solid fa-sitemap mr-1"></i> Proyección y Cuadro de Llaves en Tiempo Real
                                </span>
                                <span style="font-size: 9px; color: #34d399; font-weight: 800; background: rgba(16, 185, 129, 0.12); padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(16, 185, 129, 0.25);">
                                    🔴 Actualización en Vivo
                                </span>
                            </div>
                            
                            <div id="bracket-mesas-${catSlug}" class="bracket-tree-container">
                                <svg id="bracket-svg-${catSlug}" class="bracket-svg-overlay"></svg>
                                ${generarCuadroEnVivoHTML(partidosCat, catSlug)}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;

            // Trazar las líneas SVG
            setTimeout(() => {
                catsList.forEach(catNombre => {
                    let catSlug = catNombre.replace(/\s+/g, '_');
                    actualizarLineasConectorasSVG(`bracket-mesas-${catSlug}`, `bracket-svg-${catSlug}`);
                });
            }, 80);
        }

        // ================= CONSTRUCCIÓN DEL ÁRBOL EN VIVO =================
        function generarCuadroEnVivoHTML(partidosCat, catSlug) {
            let colOctavos = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('octavo'));
            let colCuartos = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('cuarto'));
            let colSemis = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('semi'));
            let colFinal = partidosCat.filter(p => {
                let rf = String(p.ronda_fase).toLowerCase();
                return rf.includes('final') && !rf.includes('semi') && !rf.includes('cuarto') && !rf.includes('octavo');
            });

            let columnas = [];
            if (colOctavos.length > 0) columnas.push({ name: 'Octavos de Final', matches: colOctavos, stageKey: 'OCT' });
            if (colCuartos.length > 0) columnas.push({ name: 'Cuartos de Final', matches: colCuartos, stageKey: 'CUA' });
            if (colSemis.length > 0) columnas.push({ name: 'Semifinales', matches: colSemis, stageKey: 'SEM' });
            if (colFinal.length > 0) columnas.push({ name: 'Gran Final', matches: colFinal, stageKey: 'FIN' });

            if (columnas.length === 0) return '<div class="mensaje-vacio">Sin partidos de llaves registrados.</div>';

            // Resolver avances en vivo
            let ganadores = {};
            partidosCat.forEach(p => {
                if ((p.estado || '').toLowerCase() === 'finalizado' && p.ganador_id) {
                    let win = p.ganador_id === p.jugador1_id ? p.j1 : p.j2;
                    if (win) ganadores[p.ronda_fase] = win;
                }
            });

            let htmlCols = '';
            columnas.forEach((col, cIdx) => {
                htmlCols += `<div class="bracket-col-stage">`;
                htmlCols += `<div style="text-align:center; font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:-10px;">${col.name}</div>`;
                
                col.matches.forEach((p, mIdx) => {
                    let n1 = p.j1 ? p.j1.nombre : 'Por definir';
                    let n2 = p.j2 ? p.j2.nombre : 'Por definir';

                    // Si falta el jugador, revisar si ya se definió en vivo
                    if (n1 === 'Por definir' || n1.includes('Gana')) {
                        let prevKey = col.stageKey === 'CUA' ? `Octavos ${mIdx*2+1}` : (col.stageKey === 'SEM' ? `Cuartos ${mIdx*2+1}` : `Semifinal 1`);
                        if (ganadores[prevKey]) n1 = ganadores[prevKey].nombre;
                    }
                    if (n2 === 'Por definir' || n2.includes('Gana')) {
                        let prevKey = col.stageKey === 'CUA' ? `Octavos ${(mIdx+1)*2}` : (col.stageKey === 'SEM' ? `Cuartos ${(mIdx+1)*2}` : `Semifinal 2`);
                        if (ganadores[prevKey]) n2 = ganadores[prevKey].nombre;
                    }

                    let isFin = (p.estado || '').toLowerCase() === 'finalizado';
                    let isW1 = isFin && p.ganador_id === p.jugador1_id;
                    let isW2 = isFin && p.ganador_id === p.jugador2_id;

                    let targetAttr = '';
                    if (cIdx < columnas.length - 1) {
                        let nextStageKey = columnas[cIdx + 1].stageKey;
                        let targetMatchIdx = Math.floor(mIdx / 2) + 1;
                        let slot = mIdx % 2 === 0 ? 'top' : 'bottom';
                        if (col.stageKey === 'OCT') {
                            let rf = String(p.ronda_fase);
                            if (rf.includes('2')) { targetMatchIdx = 1; slot = 'bottom'; }
                            if (rf.includes('8')) { targetMatchIdx = 4; slot = 'bottom'; }
                        }
                        targetAttr = `data-target="mcard_${catSlug}_${nextStageKey}_${targetMatchIdx}" data-target-slot="${slot}"`;
                    }

                    htmlCols += `
                        <div class="b-match-card" id="mcard_${catSlug}_${col.stageKey}_${mIdx+1}" ${targetAttr}>
                            <div class="b-match-header">${p.ronda_fase} • MESA ${p.mesa}</div>
                            <div class="b-player-row">
                                <div class="b-player-info">
                                    <span class="b-player-name ${isW1 ? 'winner' : ''}">${isW1 ? '🏆 ' : ''}${n1}</span>
                                    <span class="b-player-club">${p.j1?.club || ''}</span>
                                </div>
                                <span class="b-score-box ${isW1 ? 'winner' : ''}">${p.sets_j1 || 0}</span>
                            </div>
                            <div class="b-player-row">
                                <div class="b-player-info">
                                    <span class="b-player-name ${isW2 ? 'winner' : ''}">${isW2 ? '🏆 ' : ''}${n2}</span>
                                    <span class="b-player-club">${p.j2?.club || ''}</span>
                                </div>
                                <span class="b-score-box ${isW2 ? 'winner' : ''}">${p.sets_j2 || 0}</span>
                            </div>
                        </div>
                    `;
                });
                htmlCols += `</div>`;
            });
            return htmlCols;
        }

        window.addEventListener('resize', () => {
            if (estadoFiltro === 'resumen') {
                let catsList = [...new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean))];
                catsList.forEach(catNombre => {
                    let catSlug = catNombre.replace(/\s+/g, '_');
                    actualizarLineasConectorasSVG(`bracket-mesas-${catSlug}`, `bracket-svg-${catSlug}`);
                });
            }
        });

        inicializar();
    </script>
</body>
</html>
