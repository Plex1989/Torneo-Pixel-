<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Central de Mesas - Arbitraje Digital VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        const urlParamsConfig = new URLSearchParams(window.location.search);
        if (urlParamsConfig.get('torneo')) localStorage.setItem('torneo_activo_id', urlParamsConfig.get('torneo'));
        if (urlParamsConfig.get('org')) localStorage.setItem('organizador_id', urlParamsConfig.get('org'));

        const orgIdCheck = localStorage.getItem('organizador_id');
        if (!orgIdCheck) {
            alert("🔒 Acceso Restringido: Faltan los parámetros del organizador. Pide el enlace de acceso correcto.");
            window.location.href = "torneos.html";
        }
    </script>
    <style>
        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #0a0a0c; color: #f8fafc; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        body::before { content: ""; position: fixed; top: -15%; left: -10%; width: 600px; height: 600px; background: #fbbf24; border-radius: 50%; filter: blur(200px); opacity: 0.08; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: -10%; right: -10%; width: 700px; height: 700px; background: #06b6d4; border-radius: 50%; filter: blur(200px); opacity: 0.06; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #ffffff; margin: 0; text-shadow: 0 0 15px rgba(255,255,255,0.2); }

        .scrolling-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: #94a3b8; padding: 10px 20px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.3s ease; letter-spacing: 1px; }
        .btn-filter-pill:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .btn-filter-pill.active { background: #fbbf24; color: #000000; border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
        .btn-filter-pill.active-resumen { background: #eab308; color: #000000; border-color: #eab308; box-shadow: 0 0 20px rgba(234, 179, 8, 0.4); } 
        
        .btn-cat-pill { background: rgba(251, 191, 36, 0.05); border: 1px solid rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .btn-cat-pill.active { background: #fbbf24; color: #000000; border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1300px; margin: auto; }

        .card-mesa { background: rgba(18, 18, 22, 0.7); backdrop-filter: blur(25px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); border-bottom: 3px solid rgba(255, 255, 255, 0.1); padding: 22px; position: relative; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .card-mesa-llave { border-bottom: 3px solid #fbbf24 !important; background: linear-gradient(180deg, rgba(251, 191, 36, 0.04) 0%, rgba(18, 18, 22, 0.8) 100%) !important; box-shadow: 0 8px 25px -5px rgba(251, 191, 36, 0.12) !important; border-top: 1px solid rgba(251, 191, 36, 0.15) !important; border-left: 1px solid rgba(251, 191, 36, 0.15) !important; border-right: 1px solid rgba(251, 191, 36, 0.15) !important; }
        .card-mesa.vivo { border-bottom-color: #34d399 !important; box-shadow: 0 0 25px rgba(52, 211, 153, 0.15) !important; border-top: 1px solid rgba(52, 211, 153, 0.2) !important; }
        .card-mesa.finalizado { border-bottom-color: #475569 !important; opacity: 0.8; filter: grayscale(15%); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .mesa-title { font-size: 13px; font-weight: 900; color: #38bdf8; letter-spacing: 2px; }
        .mesa-title-llave { font-size: 13px; font-weight: 900; color: #fbbf24; letter-spacing: 2px; text-shadow: 0 0 10px rgba(251,191,36,0.3); }

        .cat-badge { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; }

        .badge-estado { padding: 4px 10px; border-radius: 9999px; font-weight: 900; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
        .est-pendiente { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; }
        .est-curso { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); animation: pulse-border 2s infinite; }
        .est-fin { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: #64748b; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); } }

        .score-container { background: rgba(0,0,0,0.5); border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; border: 1px inset rgba(255,255,255,0.02); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .jugador-nombre { font-size: 14px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; transition: color 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .score-big { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: #ffffff; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .sets-badge { font-size: 11px; font-weight: 900; color: #64748b; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; margin-left: 10px; border: 1px solid rgba(255,255,255,0.02); }

        .grid-botones-mesa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .btn-mesa-action { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; border-radius: 12px; padding: 12px 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .btn-mesa-arbitrar { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
        .btn-mesa-qr { background: rgba(56, 189, 248, 0.05); border-color: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
        .btn-mesa-marcador { background: rgba(168, 85, 247, 0.05); border-color: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .btn-mesa-yt { background: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed !important; filter: grayscale(100%); }

        .header-hora { grid-column: 1 / -1; font-size: 13px; color: #fbbf24; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid rgba(251, 191, 36, 0.2); padding-bottom: 8px; margin-top: 25px; margin-bottom: 10px; letter-spacing: 2px; display: flex; align-items: center; }
        .mensaje-vacio { text-align: center; color: #64748b; font-style: italic; font-weight: 600; grid-column: 1/-1; padding: 60px 20px; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px dashed rgba(255,255,255,0.05); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: rgba(18, 18, 22, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; width: 100%; max-width: 680px; padding: 30px; color: white; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); }
        .input-tabla { background: rgba(0, 0, 0, 0.6) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; border-radius: 12px !important; color: #ffffff !important; font-size: 13px !important; outline: none !important; transition: all 0.3s !important; }

        /* BRACKET LLAVES DINÁMICO (ROSA) */
        .bracket-container { display: flex; gap: 40px; padding: 30px; background: rgba(0,0,0,0.4); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); justify-content: flex-start; align-items: stretch; min-width: max-content; margin-top: 20px; overflow-x: auto;}
        .bracket-col { display: flex; flex-direction: column; justify-content: space-around; gap: 30px; min-width: 250px; position: relative; }
        
        .b-match-pair { position: relative; display: flex; flex-direction: column; justify-content: center; }
        .b-match { background: rgba(18, 18, 22, 0.95); border: 1px solid rgba(236,72,153,0.3); border-radius: 16px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 2; display: flex; flex-direction: column; }
        
        .b-team { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; gap: 15px; }
        .b-team:last-child { border-bottom: none; }
        .b-team.winner-pink { background: rgba(236,72,153,0.1); border-left: 4px solid #ec4899; }
        .b-score { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px; color: #fff; }
        .b-team.winner-pink .b-score { color: #f472b6; }
        
        .b-match::after { content: ""; position: absolute; right: -20px; top: 50%; width: 20px; border-top: 2px solid #ec4899; z-index: 1; }
        .bracket-col:last-child .b-match::after { display: none; }
        .bracket-col:not(:first-child) .b-match::before { content: ""; position: absolute; left: -20px; top: 50%; width: 20px; border-top: 2px solid #ec4899; z-index: 1; }
        .bracket-col:not(:last-child) .b-match-pair::after { content: ""; position: absolute; right: -20px; top: 25%; bottom: 25%; width: 2px; background: #ec4899; z-index: 0; }
        
    </style>
</head>
<body>

    <!-- MODAL QR, EXPEDIENTE YOUTUBE, ETC OMITIDOS POR BREVEDAD. TODO SIGUE IGUAL. -->
    <div id="modal-qr" class="modal-overlay" style="display: none;"><div class="modal-card">QR Component</div></div>
    <div id="modal-marcador" class="modal-overlay" style="display: none;"><div class="modal-card">Marcador Component</div></div>
    <div id="modal-youtube" class="modal-overlay" style="display: none;"><div class="modal-card">Youtube Component</div></div>

    <div class="header no-print">
        <div style="display: inline-block; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: #38bdf8; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 6px 16px; border-radius: 9999px; letter-spacing: 3px; margin-bottom: 12px;">
            <i class="fa-solid fa-gavel mr-2"></i> PORTAL DE ARBITRAJE OFICIAL
        </div>
        <h1 id="nombre-torneo" class="m-0 mt-2">CENTRAL DE MESAS</h1>
    </div>

    <div style="font-size:10px; font-weight:900; color:#cbd5e1; text-transform:uppercase; margin-bottom:8px; letter-spacing:2px; display:flex; align-items:center; margin-top:5px;"><i class="fa-solid fa-layer-group mr-2 text-cyan-500"></i> Categoría</div>
    <div class="scrolling-bar no-print" id="bar-categorias">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div style="font-size:10px; font-weight:900; color:#cbd5e1; text-transform:uppercase; margin-bottom:8px; letter-spacing:2px; display:flex; align-items:center; margin-top:5px;"><i class="fa-solid fa-eye mr-2 text-cyan-500"></i> Vista de Datos</div>
    <div class="scrolling-bar no-print">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Cartelera Completa</button>
        <button class="btn-filter-pill" id="tab-vivo" onclick="filtrarEstado('en_curso')">🔴 En Vivo</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Resultados</button>
        <div style="width:1px; background:rgba(255,255,255,0.1); margin: 0 5px;"></div>
        <button class="btn-filter-pill" id="tab-resumen" onclick="filtrarEstado('resumen')" style="color:#10b981; border-color:rgba(16,185,129,0.3);">📊 Estadísticas y Llaves</button>
    </div>

    <div class="grid-espectador" id="contenedor-partidos">
        <div class="mensaje-vacio"><i class="fa-solid fa-spinner fa-spin text-cyan-500 text-2xl mb-3 block"></i> Conectando...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = localStorage.getItem('torneo_activo_id') || 1;
        const orgId = localStorage.getItem('organizador_id'); 

        let todosLosPartidos = [];
        let estadoFiltro = 'todos';
        let categoriaFiltro = 'todas';

        function getNombreParaTabla(p, isJ1) {
            if(isJ1 && p.j1) return p.j1.nombre;
            if(!isJ1 && p.j2) return p.j2.nombre;

            let rf = String(p.ronda_fase || p.rondaFase).toLowerCase();
            
            if (rf.includes('cuartos')) {
                let n = parseInt(rf.match(/\d+/)?.[0] || 1);
                return isJ1 ? `Gana Octavos ${n*2 - 1}` : `Gana Octavos ${n*2}`;
            }
            if (rf.includes('semi')) {
                let n = parseInt(rf.match(/\d+/)?.[0] || 1);
                return isJ1 ? `Gana Cuartos ${n*2 - 1}` : `Gana Cuartos ${n*2}`;
            }
            if (rf.includes('final') && !rf.includes('semi')) {
                return isJ1 ? `Gana Semi 1` : `Gana Semi 2`;
            }

            return isJ1 ? `Clasificado A` : `Clasificado B`;
        }

        async function inicializar() {
            try {
                const { data: torneoData } = await clienteSupabase.from('torneos').select('nombre').eq('id', idTorneoActivo).single();
                if (torneoData) document.getElementById('nombre-torneo').innerText = torneoData.nombre;

                await cargarPartidos();
                clienteSupabase.channel('mesas-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => { cargarPartidos(); }).subscribe();
            } catch (err) { console.error("Error inicializando mesas:", err); }
        }

        async function cargarPartidos() {
            try {
                const { data } = await clienteSupabase.from('partidos')
                    .select('*, j1:jugador1_id(id, nombre), j2:jugador2_id(id, nombre), categorias(id, nombre)')
                    .eq('torneo_id', idTorneoActivo).eq('organizador_id', orgId).order('id', { ascending: true });
                todosLosPartidos = data || [];
                generarBotonesCategorias(); dibujarPantalla();
            } catch (err) { console.error(err); }
        }

        function generarBotonesCategorias() {
            const bar = document.getElementById('bar-categorias');
            const catsMap = new Map();
            todosLosPartidos.forEach(p => { if (p.categorias && p.categorias.nombre) catsMap.set(p.categorias.nombre, p.categorias.id); });
            let html = `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarCategoria('todas')">Todas las Categorías</button>`;
            catsMap.forEach((id, nombre) => { html += `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === nombre ? 'active' : ''}" onclick="filtrarCategoria('${nombre}')">🏆 ${nombre}</button>`; });
            bar.innerHTML = html;
        }

        function filtrarCategoria(catNombre) { categoriaFiltro = catNombre; dibujarPantalla(); }

        function filtrarEstado(est) {
            estadoFiltro = est;
            document.querySelectorAll('#tab-todos, #tab-resumen, #tab-ranking, #tab-vivo, #tab-pendientes, #tab-finalizados').forEach(b => b.classList.remove('active', 'active-resumen'));
            if (est === 'resumen') document.getElementById('tab-resumen')?.classList.add('active-resumen');
            else document.getElementById('tab-' + est)?.classList.add('active');
            dibujarPantalla();
        }

        // DIBUJADOR DE LLAVES INTERACTIVO EN MESAS
        function dibujarEstadisticas(container) {
            let catsList = [...new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean))];
            if (categoriaFiltro !== 'todas') catsList = catsList.filter(c => c === categoriaFiltro);

            if (catsList.length === 0) { container.innerHTML = `<div class="mensaje-vacio">No hay información para mostrar.</div>`; return; }

            let htmlContent = '';
            catsList.forEach(catNombre => {
                const knockouts = todosLosPartidos.filter(p => p.categorias?.nombre === catNombre && !p.grupo_nombre && p.ronda_fase);
                if (knockouts.length === 0) return; // Si hay grupos, aquí agregarías la renderización de grupos.

                let octavos = knockouts.filter(m => String(m.ronda_fase).toLowerCase().includes('octavo'));
                let cuartos = knockouts.filter(m => String(m.ronda_fase).toLowerCase().includes('cuarto'));
                let semis = knockouts.filter(m => String(m.ronda_fase).toLowerCase().includes('semi'));
                let final = knockouts.filter(m => String(m.ronda_fase).toLowerCase().includes('final') && !String(m.ronda_fase).toLowerCase().includes('semi'));

                htmlContent += `
                    <div style="background:rgba(18, 18, 22, 0.8); border:1px solid rgba(236, 72, 153, 0.3); border-radius:24px; padding:30px; margin-bottom:30px;">
                        <h3 style="color:#f472b6; font-weight:900; margin-top:0; text-transform:uppercase;"><i class="fa-solid fa-sitemap"></i> LLAVES FINALES: ${catNombre}</h3>
                        <div class="bracket-container">
                `;

                const renderMatch = (m) => {
                    if(!m) return '';
                    let n1 = getNombreParaTabla(m, true);
                    let n2 = getNombreParaTabla(m, false);
                    let s1 = m.sets_j1 || m.pts_j1 || '';
                    let s2 = m.sets_j2 || m.pts_j2 || '';
                    let win1 = m.estado === 'finalizado' && m.ganador_id == (m.j1?.id || m.jugador1_id);
                    let win2 = m.estado === 'finalizado' && m.ganador_id == (m.j2?.id || m.jugador2_id);
                    
                    return `
                    <div class="b-match-pair">
                        <div class="b-match">
                            <div style="text-align:center; font-size:9px; font-weight:900; color:#ec4899; padding:6px; border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(0,0,0,0.4); text-transform:uppercase;">${m.ronda_fase}</div>
                            <div class="b-team ${win1 ? 'winner-pink' : ''}">
                                <div class="b-team-info"><span style="font-size:12px; font-weight:800; color:${win1 ? '#fff' : '#cbd5e1'};">${win1 ? '🏆 ' : ''}${n1}</span></div>
                                <span class="b-score">${s1}</span>
                            </div>
                            <div class="b-team ${win2 ? 'winner-pink' : ''}">
                                <div class="b-team-info"><span style="font-size:12px; font-weight:800; color:${win2 ? '#fff' : '#cbd5e1'};">${win2 ? '🏆 ' : ''}${n2}</span></div>
                                <span class="b-score">${s2}</span>
                            </div>
                        </div>
                    </div>`;
                };

                if (octavos.length > 0) {
                    htmlContent += `<div class="bracket-col">`;
                    octavos.forEach(m => htmlContent += renderMatch(m));
                    htmlContent += `</div>`;
                }
                if (cuartos.length > 0 || octavos.length > 0) {
                    htmlContent += `<div class="bracket-col">`;
                    for(let i=1; i<=4; i++) {
                        let m = cuartos.find(x => String(x.ronda_fase).includes(i.toString()));
                        if(m) htmlContent += renderMatch(m);
                    }
                    htmlContent += `</div>`;
                }
                if (semis.length > 0 || cuartos.length > 0) {
                    htmlContent += `<div class="bracket-col">`;
                    for(let i=1; i<=2; i++) {
                        let m = semis.find(x => String(x.ronda_fase).includes(i.toString()));
                        if(m) htmlContent += renderMatch(m);
                    }
                    htmlContent += `</div>`;
                }
                if (final.length > 0) {
                    htmlContent += `<div class="bracket-col" style="justify-content: center;">`;
                    htmlContent += renderMatch(final[0]);
                    htmlContent += `</div>`;
                }

                htmlContent += `</div></div>`;
            });
            container.innerHTML = htmlContent;
        }

        function dibujarPantalla() {
            const container = document.getElementById('contenedor-partidos');
            if (estadoFiltro === 'resumen') { container.style.display = 'block'; dibujarEstadisticas(container); return; }

            container.style.display = 'grid';
            let filtrados = [...todosLosPartidos];
            if (categoriaFiltro !== 'todas') filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltro);
            if (estadoFiltro !== 'todos') filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === estadoFiltro);

            if (filtrados.length === 0) { container.innerHTML = `<div class="mensaje-vacio">No hay partidos registrados bajo estos filtros.</div>`; return; }

            const gruposPorHora = {}; const horasOrdenadas = [];
            filtrados.forEach(p => { const h = p.hora || '09:00 AM'; if(!gruposPorHora[h]) { gruposPorHora[h] = []; horasOrdenadas.push(h); } gruposPorHora[h].push(p); });

            let htmlContent = '';
            horasOrdenadas.forEach(hora => {
                htmlContent += `<div class="header-hora"><i class="fa-regular fa-clock mr-2"></i> ${hora}</div>`;
                gruposPorHora[hora].forEach(p => {
                    let isFin = p.estado === 'finalizado'; let isVivo = p.estado === 'en_curso';
                    let isLlave = p.ronda_fase && (p.ronda_fase.toLowerCase().includes('cuarto') || p.ronda_fase.toLowerCase().includes('semi') || p.ronda_fase.toLowerCase().includes('final') || p.ronda_fase.toLowerCase().includes('octavo'));
                    
                    let cardClassStyle = isLlave ? 'card-mesa card-mesa-llave' : 'card-mesa';
                    if (isVivo) cardClassStyle += ' vivo';
                    if (isFin) cardClassStyle += ' finalizado';

                    let badgeEst = isVivo ? '<span class="badge-estado est-curso">EN VIVO</span>' : (isFin ? '<span class="badge-estado est-fin">Finalizado</span>' : '<span class="badge-estado est-pendiente">Pendiente</span>');
                    
                    let nomJ1 = getNombreParaTabla(p, true);
                    let nomJ2 = getNombreParaTabla(p, false);
                    
                    let iconJ1 = (isFin && p.ganador_id == p.jugador1_id && p.ganador_id !== null) ? '<i class="fa-solid fa-crown text-amber-400 mr-2"></i>' : '';
                    let iconJ2 = (isFin && p.ganador_id == p.jugador2_id && p.ganador_id !== null) ? '<i class="fa-solid fa-crown text-amber-400 mr-2"></i>' : '';

                    let score1 = isFin || isVivo ? `<span class="score-big">${isFin ? p.sets_j1 : p.puntos_j1 || 0}</span>` : '';
                    let score2 = isFin || isVivo ? `<span class="score-big p2">${isFin ? p.sets_j2 : p.puntos_j2 || 0}</span>` : '';

                    let eqGrupo = p.grupo_nombre || p.ronda_fase || 'Eliminatoria';
                    
                    htmlContent += `
                        <div class="${cardClassStyle}">
                            <div class="top-bar">
                                <div><span class="${isLlave ? 'mesa-title-llave' : 'mesa-title'}">MESA ${p.mesa || 1}</span></div>
                                ${badgeEst}
                            </div>
                            <div style="margin-bottom:15px;"><span class="cat-badge" style="background:rgba(255,255,255,0.1); color:white;">📍 ${eqGrupo}</span></div>
                            <div class="score-container">
                                <div class="jugador-box"><span class="jugador-nombre">${iconJ1}${nomJ1}</span><div style="display:flex; align-items:center;">${score1}</div></div>
                                <div style="height:1px; background:rgba(255,255,255,0.05); margin: 6px 0;"></div>
                                <div class="jugador-box"><span class="jugador-nombre">${iconJ2}${nomJ2}</span><div style="display:flex; align-items:center;">${score2}</div></div>
                            </div>
                        </div>
                    `;
                });
            });
            container.innerHTML = htmlContent;
        }
        window.onload = inicializar;
    </script>
</body>
</html>
