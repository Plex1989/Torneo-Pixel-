<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Mesas - Arbitraje Digital VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const urlParamsConfig = new URLSearchParams(window.location.search);
        if (urlParamsConfig.get('torneo')) localStorage.setItem('torneo_activo_id', urlParamsConfig.get('torneo'));
        if (urlParamsConfig.get('org')) localStorage.setItem('organizador_id', urlParamsConfig.get('org'));

        const orgIdCheck = localStorage.getItem('organizador_id');
        if (!orgIdCheck) {
            alert("🔒 Acceso Restringido: Inicia sesión en la Central de Torneos.");
            window.location.href = "torneos.html";
        }
    </script>
    <style>
        /* Paleta Titanium Slate Pro */
        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        body::before { content: ""; position: fixed; top: -15%; left: -10%; width: 600px; height: 600px; background: #1e3a8a; border-radius: 50%; filter: blur(200px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: -10%; right: -10%; width: 700px; height: 700px; background: #312e81; border-radius: 50%; filter: blur(200px); opacity: 0.1; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(148, 163, 184, 0.1); padding-bottom: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #f8fafc; margin: 0; }

        .btn-ws-header {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ws-header:hover {
            background: #22c55e;
            color: #000;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(148, 163, 184, 0.15); color: #94a3b8; padding: 8px 16px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; letter-spacing: 1px; }
        .btn-filter-pill:hover { background: rgba(56, 189, 248, 0.12); color: #ffffff; }
        .btn-filter-pill.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
        .btn-filter-pill.active-resumen { background: #059669; color: #ffffff; border-color: #34d399; }
        
        .btn-cat-pill { background: rgba(56, 189, 248, 0.06); border: 1px solid rgba(56, 189, 248, 0.2); color: #7dd3fc; }
        .btn-cat-pill.active { background: #38bdf8; color: #000000; border-color: #38bdf8; }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; max-width: 1350px; margin: auto; }

        .card-mesa { background: rgba(20, 27, 44, 0.85); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(148, 163, 184, 0.12); border-bottom: 3px solid rgba(148, 163, 184, 0.2); padding: 18px; position: relative; transition: all 0.25s ease; display: flex; flex-direction: column; }
        .card-mesa:hover { border-color: rgba(56, 189, 248, 0.35); transform: translateY(-2px); }
        .card-mesa.vivo { border-bottom-color: #10b981 !important; border-top: 1px solid rgba(16, 185, 129, 0.3); }
        
        .card-mesa.finalizado { 
            border-color: rgba(245, 158, 11, 0.35) !important; 
            border-left: 4px solid #f59e0b !important;
            background: rgba(24, 30, 48, 0.95) !important; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); padding-bottom: 10px; }
        .mesa-title { font-size: 13px; font-weight: 800; color: #38bdf8; letter-spacing: 1.5px; }

        .badge-estado { padding: 4px 10px; border-radius: 9999px; font-weight: 800; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
        .est-pendiente { background: rgba(255, 255, 255, 0.05); color: #94a3b8; }
        .est-curso { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .est-fin { background: rgba(245, 158, 11, 0.2); border: 1.5px solid #f59e0b; color: #fbbf24; font-weight: 900; }

        .score-container { background: rgba(15, 23, 42, 0.7); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid rgba(148, 163, 184, 0.1); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .jugador-nombre { font-size: 13px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
        .score-big { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 800; color: #f8fafc; }

        .grid-botones-mesa { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 7px; 
            margin-top: auto; 
        }
        .btn-mesa-action { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(148, 163, 184, 0.15); 
            color: #cbd5e1; 
            border-radius: 8px; 
            padding: 9px 8px; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px; 
            cursor: pointer; 
            text-decoration: none; 
        }
        .btn-mesa-action:hover { 
            background: rgba(56, 189, 248, 0.15); 
            border-color: #38bdf8; 
            color: #fff; 
        }
        .btn-mesa-arbitrar { 
            background: rgba(16, 185, 129, 0.12); 
            border-color: rgba(16, 185, 129, 0.35); 
            color: #34d399; 
        }
        .btn-mesa-arbitrar:hover { 
            background: #10b981; 
            color: #000; 
        }
        .btn-mesa-finalizado { 
            background: rgba(245, 158, 11, 0.2) !important; 
            border-color: #f59e0b !important; 
            color: #fbbf24 !important; 
            font-weight: 900 !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
        }
        .btn-mesa-finalizado:hover { 
            background: #f59e0b !important; 
            color: #000 !important; 
        }
        .btn-mesa-marcador { 
            background: rgba(56, 189, 248, 0.08); 
            border-color: rgba(56, 189, 248, 0.25); 
            color: #38bdf8; 
        }
        .btn-mesa-marcador:hover { 
            background: #0284c7; 
            color: #fff; 
        }
        .btn-mesa-qr { 
            background: rgba(99, 102, 241, 0.08); 
            border-color: rgba(99, 102, 241, 0.25); 
            color: #818cf8; 
        }
        .btn-mesa-grabar { 
            background: rgba(244, 63, 94, 0.08); 
            border-color: rgba(244, 63, 94, 0.25); 
            color: #fb7185; 
        }
        .btn-mesa-grabar:hover { 
            background: #e11d48; 
            color: #fff; 
        }
        .btn-mesa-yt { 
            background: rgba(239, 68, 68, 0.08); 
            border-color: rgba(239, 68, 68, 0.25); 
            color: #f87171; 
        }
        .btn-mesa-yt:hover { 
            background: #dc2626; 
            color: #fff; 
        }

        .header-hora { 
            grid-column: 1 / -1; 
            font-size: 13px; 
            color: #38bdf8; 
            font-weight: 800; 
            text-transform: uppercase; 
            border-bottom: 1px solid rgba(56, 189, 248, 0.25); 
            padding-bottom: 8px; 
            margin-top: 25px; 
            margin-bottom: 12px; 
            letter-spacing: 2px; 
            display: flex; 
            align-items: center; 
        }
        .header-hora::before { 
            content: ""; 
            display: inline-block; 
            width: 6px; 
            height: 6px; 
            background: #38bdf8; 
            border-radius: 50%; 
            margin-right: 10px; 
            box-shadow: 0 0 10px #38bdf8; 
        }

        .mensaje-vacio { text-align: center; color: #64748b; font-style: italic; font-weight: 600; grid-column: 1/-1; padding: 50px 20px; background: rgba(15, 23, 42, 0.4); border-radius: 14px; }

        /* ================= CONTENEDOR DESLIZABLE TÁCTIL (MÓVIL FLUIDO) ================= */
        .bracket-scroll-wrapper {
            width: 100%;
            max-width: 100%;
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            touch-action: pan-x pan-y !important;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.55);
            padding-bottom: 10px;
            margin-top: 15px;
        }

        .bracket-tree-container { 
            display: inline-flex !important; 
            min-width: max-content !important;
            gap: 45px; 
            padding: 30px 25px; 
            justify-content: flex-start; 
            align-items: stretch; 
            position: relative; 
        }

        .bracket-svg-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            pointer-events: none; 
            z-index: 1; 
        }

        .bracket-col-stage { 
            display: flex; 
            flex-direction: column; 
            justify-content: space-around; 
            gap: 22px; 
            min-width: 260px; 
            position: relative; 
            z-index: 2; 
        }
        
        .b-match-card { background: rgba(20, 27, 44, 0.95); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .b-match-header { font-size: 9px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 12px; text-align: center; border-bottom: 1px solid rgba(148, 163, 184, 0.1); background: rgba(30, 41, 59, 0.45); }
        .b-player-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); gap: 10px; }
        .b-player-row:last-child { border-bottom: none; }
        .b-player-info { flex: 1; min-width: 0; }
        .b-player-name { font-size: 12px; font-weight: 700; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .b-player-name.winner { color: #34d399; font-weight: 800; }
        .b-player-club { font-size: 9px; color: #64748b; font-weight: 600; display: block; margin-top: 1px; }
        .b-score-box { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; background: rgba(15, 23, 42, 0.85); padding: 3px 8px; border-radius: 5px; color: #cbd5e1; min-width: 24px; text-align: center; border: 1px solid rgba(148, 163, 184, 0.15); }
        .b-score-box.winner { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #131b2e; border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 16px; width: 100%; max-width: 480px; padding: 22px; color: white; }
        .input-tabla { background: rgba(15, 23, 42, 0.85) !important; border: 1px solid rgba(148, 163, 184, 0.25) !important; border-radius: 8px !important; color: #f8fafc !important; font-size: 12px !important; outline: none !important; }
    </style>
</head>
<body>

    <!-- MODAL MARCADOR MANUAL -->
    <div id="modal-marcador" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 420px; border-top: 4px solid #38bdf8;">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:20px;">
                <h3 style="color: #38bdf8; font-size: 15px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 1px;">
                    <i class="fa-solid fa-pen-to-square mr-2"></i> Asignar Marcador
                </h3>
                <button onclick="cerrarModalMarcador()" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 25px; background: rgba(15,23,42,0.8); padding: 18px; border-radius: 14px; border: 1px solid rgba(148,163,184,0.15);">
                <div style="flex: 1; text-align: center;">
                    <label id="lbl-marcador-j1" style="display: block; font-size: 11px; color: #fff; font-weight: 800; margin-bottom: 10px; min-height: 28px; line-height:1.2;"></label>
                    <input type="number" id="input-sets-j1" class="input-tabla" style="width: 100%; text-align: center; font-size: 32px !important; font-family:'Orbitron',sans-serif; font-weight: 900; padding: 10px !important;" min="0" max="7">
                </div>
                <div style="font-size: 16px; font-weight: 900; color: #64748b; margin-top: 20px;">VS</div>
                <div style="flex: 1; text-align: center;">
                    <label id="lbl-marcador-j2" style="display: block; font-size: 11px; color: #38bdf8; font-weight: 800; margin-bottom: 10px; min-height: 28px; line-height:1.2;"></label>
                    <input type="number" id="input-sets-j2" class="input-tabla" style="width: 100%; text-align: center; font-size: 32px !important; font-family:'Orbitron',sans-serif; font-weight: 900; padding: 10px !important;" min="0" max="7">
                </div>
            </div>
            <input type="hidden" id="hidden-marcador-partidoid">
            <input type="hidden" id="hidden-marcador-j1id">
            <input type="hidden" id="hidden-marcador-j2id">
            
            <button id="btn-guardar-marcador" onclick="guardarMarcadorManual()" class="btn-filter-pill" style="width: 100%; background: #0284c7; color: #fff; padding: 13px; font-size: 11px; font-weight: 800; border: none;">
                💾 Guardar Resultado
            </button>
        </div>
    </div>

    <!-- MODAL TRANSMITIR (QR OVERLAY) -->
    <div id="modal-qr" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 380px; border-top: 4px solid #38bdf8; text-align: center;">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:15px;">
                <h3 style="color: #38bdf8; font-size: 15px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 1px;">
                    <i class="fa-solid fa-qrcode mr-2"></i> Transmitir Partido
                </h3>
                <button onclick="cerrarModalQR()" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 15px; line-height: 1.5;">Enlace del Overlay para Prism Live Studio / OBS. Cópialo o escanea el QR.</p>
            
            <input type="text" id="link-overlay-visible" class="input-tabla" readonly style="width: 100%; margin-bottom: 15px; padding: 10px; text-align: center; color: #38bdf8; font-weight: 800; cursor: text;" onclick="this.select()">

            <div style="display: flex; justify-content: center; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <div id="qrcode-container" style="background: white; padding: 10px; border-radius: 8px;"></div>
            </div>
            <button onclick="copiarAlPortapapelesOverlay()" class="btn-filter-pill" style="width:100%; background:rgba(56,189,248,0.15); color:#7dd3fc; border-color:rgba(56,189,248,0.3); padding: 12px; font-size: 11px;">
                <i class="fa-regular fa-copy mr-2"></i> Copiar Link
            </button>
        </div>
    </div>

    <!-- MODAL YOUTUBE / RTMP -->
    <div id="modal-youtube" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 440px; border-top: 4px solid #ef4444;">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:15px;">
                <h3 style="color: #f87171; font-size: 15px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 1px;">
                    <i class="fa-solid fa-satellite-dish mr-2"></i> Transmisión YouTube / RTMP
                </h3>
                <button onclick="cerrarModalYouTube()" style="background:transparent; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
            </div>
            
            <div style="text-align: left; margin-bottom: 12px;">
                <label style="font-size: 9px; color: #f87171; font-weight: 800; text-transform: uppercase;">1. Link Público / ID (Espectadores)</label>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <input type="text" id="input-youtube-link" class="input-tabla" style="width: 100%; padding: 8px;" placeholder="https://youtu.be/...">
                    <button onclick="copiarDato(this, 'input-youtube-link')" class="btn-filter-pill" style="padding: 0 12px;"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <div style="text-align: left; margin-bottom: 12px;">
                <label style="font-size: 9px; color: #38bdf8; font-weight: 800; text-transform: uppercase;">2. URL del Servidor (RTMP)</label>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <input type="text" id="input-youtube-rtmp" class="input-tabla" style="width: 100%; padding: 8px;" placeholder="rtmp://a.rtmp.youtube.com/live2">
                    <button onclick="copiarDato(this, 'input-youtube-rtmp')" class="btn-filter-pill" style="padding: 0 12px;"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-size: 9px; color: #fbbf24; font-weight: 800; text-transform: uppercase;">3. Clave de Transmisión (Stream Key)</label>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <input type="password" id="input-youtube-key" class="input-tabla" style="width: 100%; padding: 8px;" placeholder="****-****-****-****">
                    <button onclick="copiarDato(this, 'input-youtube-key')" class="btn-filter-pill" style="padding: 0 12px;"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <input type="hidden" id="hidden-youtube-partidoid">
            <button id="btn-guardar-youtube" onclick="guardarLinkYouTube()" class="btn-filter-pill" style="width: 100%; background: #dc2626; color: #fff; padding: 12px; font-size: 11px; border: none;">
                💾 Guardar Datos de Transmisión
            </button>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <div class="header no-print">
        <div style="display: inline-block; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 5px 14px; border-radius: 9999px; letter-spacing: 2px; margin-bottom: 8px;">
            <i class="fa-solid fa-gavel mr-1"></i> CONTROL DE MESAS Y ARBITRAJE
        </div>
        
        <div class="flex justify-center items-center gap-3 flex-wrap mt-1">
            <h1 id="nombre-torneo" class="m-0">CENTRAL DE MESAS</h1>
            <button onclick="compartirLinkMesas()" class="btn-ws-header">
                <i class="fa-brands fa-whatsapp text-emerald-400 text-sm"></i> Invitar Jueces
            </button>
        </div>
        
        <nav class="flex justify-center gap-2 mt-4 flex-wrap">
            <a href="#" onclick="window.location.href='admin.html?torneo=' + idTorneoActivo; return false;" class="btn-filter-pill no-underline">Admin</a>
            <a href="#" onclick="abrirVistaInteligente('sorteo'); return false;" class="btn-filter-pill no-underline">Sorteos</a>
            <a href="#" class="btn-filter-pill active no-underline">Mesas</a>
            <a href="#" onclick="enfocarPestanaEspectador(); return false;" class="btn-filter-pill no-underline">Público</a>
        </nav>
    </div>

    <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1.5px;"><i class="fa-solid fa-layer-group mr-1 text-sky-400"></i> Categoría</div>
    <div class="scrolling-bar no-print" id="bar-categorias">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1.5px;"><i class="fa-solid fa-eye mr-1 text-sky-400"></i> Vista de Datos</div>
    <div class="scrolling-bar no-print">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Cartelera Completa</button>
        <button class="btn-filter-pill" id="tab-vivo" onclick="filtrarEstado('en_curso')">🔴 En Vivo</button>
        <button class="btn-filter-pill" id="tab-pendientes" onclick="filtrarEstado('pendiente')">⏳ Por Jugar</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Resultados</button>
        <button class="btn-filter-pill" id="tab-resumen" onclick="filtrarEstado('resumen')" style="color:#34d399; border-color:rgba(16,185,129,0.3);">📊 Estadísticas y Llaves</button>

        function timeToMinutes(timeStr) { 
            if (!timeStr) return 540; 
            let cleanStr = String(timeStr).trim().toLowerCase();
            let match = cleanStr.match(/^(\d+):(\d+)/);
            if (!match) return 540;
            let hrs = parseInt(match[1], 10);
            let mins = parseInt(match[2], 10);
            if (cleanStr.includes('p') && hrs < 12) hrs += 12;
            if (cleanStr.includes('a') && hrs === 12) hrs = 0;
            return hrs * 60 + mins; 
        }

        function calcularImpacto(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);

            let reglaGanaFav = null; let reglaGanaRet = null;
            if (reglasRango.length >= 2) {
                if (Number(reglasRango[0].puntos_ganador) < Number(reglasRango[1].puntos_ganador)) { reglaGanaFav = reglasRango[0]; reglaGanaRet = reglasRango[1]; } 
                else if (Number(reglasRango[0].puntos_ganador) > Number(reglasRango[1].puntos_ganador)) { reglaGanaFav = reglasRango[1]; reglaGanaRet = reglasRango[0]; } 
                else { let str = String(reglasRango[0].resultado_esperado).toLowerCase(); if (str.includes('retador') || str.includes('upset')) { reglaGanaRet = reglasRango[0]; reglaGanaFav = reglasRango[1]; } else { reglaGanaFav = reglasRango[0]; reglaGanaRet = reglasRango[1]; } }
            } else if (reglasRango.length === 1) {
                let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                if (str.includes('retador') || str.includes('upset')) reglaGanaRet = reglasRango[0]; else reglaGanaFav = reglasRango[0];
            }
            let ptsGanaFav = reglaGanaFav ? Number(reglaGanaFav.puntos_ganador) : 10;
            let ptsPierdeFav = reglaGanaRet ? -Math.abs(Number(reglaGanaRet.puntos_perdedor)) : -5;
            let ptsGanaRet = reglaGanaRet ? Number(reglaGanaRet.puntos_ganador) : 10;
            let ptsPierdeRet = reglaGanaFav ? -Math.abs(Number(reglaGanaFav.puntos_perdedor)) : -5;

        // ================= CONECTOR VECTORIAL SVG (SIN LÍNEAS CORTADAS) =================
        function actualizarLineasConectorasSVG(containerId, svgId) {
            const container = document.getElementById(containerId);
            const svg = document.getElementById(svgId);
            if (!container || !svg) return;

            const scrollW = Math.max(container.scrollWidth, container.clientWidth);
            const scrollH = Math.max(container.scrollHeight, container.clientHeight);
            svg.setAttribute('width', scrollW);
            svg.setAttribute('height', scrollH);
            svg.style.width = scrollW + 'px';
            svg.style.height = scrollH + 'px';

            const cRect = container.getBoundingClientRect();
            const sourceCards = container.querySelectorAll('[data-target]');
            let pathsHtml = '';

            sourceCards.forEach(card => {
                const targetId = card.getAttribute('data-target');
                if (!targetId) return;
                const targetEl = container.querySelector('#' + targetId);
                if (!targetEl) return;

                const slot = card.getAttribute('data-target-slot') || 'center';
                const r1 = card.getBoundingClientRect();
                const r2 = targetEl.getBoundingClientRect();

                const x1 = (r1.right - cRect.left);
                const y1 = (r1.top + r1.height / 2 - cRect.top);

                const x2 = (r2.left - cRect.left);
                let y2 = (r2.top + r2.height / 2 - cRect.top);

                if (slot === 'top') {
                    y2 = (r2.top + r2.height * 0.35 - cRect.top);
                } else if (slot === 'bottom') {
                    y2 = (r2.top + r2.height * 0.72 - cRect.top);
                }

                const xMid = Math.round((x1 + x2) / 2);
                const r = 8;
                const dirY = y2 > y1 ? 1 : -1;

                let d = '';
                if (Math.abs(y1 - y2) < 4) {
                    d = `M ${x1} ${y1} L ${x2} ${y2}`;
                } else {
                    d = `M ${x1} ${y1} L ${xMid - r} ${y1} Q ${xMid} ${y1} ${xMid} ${y1 + dirY * r} L ${xMid} ${y2 - dirY * r} Q ${xMid} ${y2} ${xMid + r} ${y2} L ${x2} ${y2}`;
                }

                pathsHtml += `<path d="${d}" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>`;
            });

            svg.innerHTML = pathsHtml;
        }

        // ================= VISTA DE ESTADÍSTICAS Y LLAVES EN VIVO =================

            let catsList = [...new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean))];

            let htmlContent = '';

                const esEliminacionPura = partidosCat.some(p => p.grupo_nombre === 'Eliminacion');
                
                // Extraer grupos activos
                const groupNames = [...new Set(partidosCat.map(p => p.grupo_nombre).filter(g => g && g !== 'Flash' && g !== 'Eliminacion'))].sort();
                const tieneGrupos = groupNames.length > 0;

                // Mapear participantes y estadísticas generales
                let jugadoresMap = new Map();
                partidosCat.forEach(p => {
                    [p.j1, p.j2].forEach(jObj => {
                        if (jObj && jObj.id && !jugadoresMap.has(jObj.id)) {
                            let jBD = todosLosJugadoresAdmin.find(x => x.id === jObj.id) || jObj;
                            let rIni = (jBD.puntos_ranking_ant !== undefined && jBD.puntos_ranking_ant !== null && jBD.puntos_ranking_ant > 0)
                                ? jBD.puntos_ranking_ant 
                                : (jBD.puntos_ranking || 0);

                            jugadoresMap.set(jObj.id, { 
                                id: jObj.id,
                                nombre: jObj.nombre,
                                club: jObj.club || jBD.club || 'Sin Club',
                                pj: 0, 
                                pg: 0, 
                                pp: 0, 
                                setsG: 0, 
                                setsP: 0,
                                ptsGrupo: 0,
                                grupoPertenece: null,
                                rankIni: rIni,
                                rankImpact: 0,
                                rankAct: rIni
                            });
                        }
                    });
                });

                // Asignar pertenencia de grupo
                partidosCat.forEach(p => {
                    if (p.grupo_nombre && p.grupo_nombre !== 'Flash' && p.grupo_nombre !== 'Eliminacion') {
                        if (p.j1 && jugadoresMap.has(p.j1.id)) jugadoresMap.get(p.j1.id).grupoPertenece = p.grupo_nombre;
                        if (p.j2 && jugadoresMap.has(p.j2.id)) jugadoresMap.get(p.j2.id).grupoPertenece = p.grupo_nombre;
                    }
                });

                // Calcular partidos y sets
                partidosCat.filter(p => (p.estado || '').toLowerCase() === 'finalizado').forEach(p => {
                    if (p.j1 && p.j2 && jugadoresMap.has(p.j1.id) && jugadoresMap.has(p.j2.id)) {
                        let j1 = jugadoresMap.get(p.j1.id);
                        let j2 = jugadoresMap.get(p.j2.id);

                        let s1 = p.sets_j1 || 0;
                        let s2 = p.sets_j2 || 0;
                        j1.pj++;
                        j2.pj++;
                        j1.setsG += s1;
                        j1.setsP += s2;
                        j2.setsG += s2;
                        j2.setsP += s1;

                        let imp = calcularImpacto(j1.rankAct, j2.rankAct);
                        let ganoJ1 = p.ganador_id === p.jugador1_id;
                        let delta1 = ganoJ1 ? imp.j1G : imp.j1P;
                        let delta2 = !ganoJ1 ? imp.j2G : imp.j2P;

                        if (ganoJ1) {
                            j1.pg++;
                            j1.ptsGrupo += 2;
                            j2.pp++;
                            j2.ptsGrupo += 1;
                        } else {
                            j2.pg++;
                            j2.ptsGrupo += 2;
                            j1.pp++;
                            j1.ptsGrupo += 1;
                        }

                        j1.rankImpact += delta1;
                        j2.rankImpact += delta2;
                        j1.rankAct += delta1;
                        j2.rankAct += delta2;
                    }
                });

                const ordenarAtletas = (lista) => {
                    return [...lista].sort((a, b) => {
                        if (tieneGrupos) {
                            if (b.ptsGrupo !== a.ptsGrupo) return b.ptsGrupo - a.ptsGrupo;
                        }
                        let statusA = a.pg > 0 ? 3 : (a.pj === 0 ? 2 : 1);
                        let statusB = b.pg > 0 ? 3 : (b.pj === 0 ? 2 : 1);
                        if (statusB !== statusA) return statusB - statusA;
                        if (b.pg !== a.pg) return b.pg - a.pg;
                        let diffA = a.setsG - a.setsP;
                        let diffB = b.setsG - b.setsP;
                        if (diffB !== diffA) return diffB - diffA;
                        return b.rankAct - a.rankAct;
                    });
                };

                let catSlug = catNombre.replace(/\s+/g, '_');

                const renderTablaAtletas = (lista) => `
                    <div style="overflow-x:auto;">
                        <table style="width:100%; border-collapse:collapse; font-size:12px;">
                            <thead>
                                <tr style="font-size:9px; color:#94a3b8; text-transform:uppercase; border-bottom:1px solid rgba(148, 163, 184, 0.1);">
                                    <th style="padding:10px 8px; width:45px;">Pos</th>
                                    <th style="padding:10px 8px;">Jugador</th>
                                    <th style="padding:10px 8px; text-align:center; width:45px;">PJ</th>
                                    <th style="padding:10px 8px; text-align:center; width:45px;">PG</th>
                                    <th style="padding:10px 8px; text-align:center; width:45px;">PP</th>
                                    <th style="padding:10px 8px; text-align:center; width:65px; color:#fbbf24;">% Efec</th>
                                    <th style="padding:10px 8px; text-align:center; width:95px;">Sets (G - P)</th>
                                    <th style="padding:10px 8px; text-align:center; width:65px;">R. Ini</th>
                                    <th style="padding:10px 8px; text-align:center; width:55px;">+/-</th>
                                    <th style="padding:10px 8px; text-align:center; width:75px; color:#38bdf8;">Pts Rank</th>
                                    ${tieneGrupos ? '<th style="padding:10px 8px; text-align:center; width:65px; color:#fbbf24;">PTS</th>' : ''}
                                </tr>
                            </thead>
                            <tbody>
                                ${lista.map((at, idx) => {
                                    let efec = at.pj > 0 ? Math.round((at.pg / at.pj) * 100) : 0;
                                    let diffHtml = at.rankImpact > 0 
                                        ? `<span style="color:#34d399; font-weight:800;">+${at.rankImpact}</span>` 
                                        : (at.rankImpact < 0 ? `<span style="color:#f87171; font-weight:800;">${at.rankImpact}</span>` : `<span style="color:#64748b; font-weight:800;">0</span>`);

                                    return `
                                        <tr style="border-bottom:1px solid rgba(255,255,255,0.03);">
                                            <td style="padding:10px 8px; font-weight:800; color:#64748b;">#${idx+1}</td>
                                            <td style="padding:10px 8px;">
                                                <strong style="color:#ffffff;">${at.nombre}</strong>
                                                <span style="font-size:9px; color:#64748b; display:block;">${at.club || 'Sin Club'}</span>
                                            </td>
                                            <td style="padding:10px 8px; text-align:center; color:#94a3b8; font-weight:700;">${at.pj}</td>
                                            <td style="padding:10px 8px; text-align:center; color:#34d399; font-weight:800;">${at.pg}</td>
                                            <td style="padding:10px 8px; text-align:center; color:#f87171; font-weight:800;">${at.pp}</td>
                                            <td style="padding:10px 8px; text-align:center; color:#fbbf24; font-weight:800;">${efec}%</td>
                                            <td style="padding:10px 8px; text-align:center;">
                                                <span style="color:#34d399; font-weight:700;">${at.setsG}</span> : <span style="color:#f87171; font-weight:700;">${at.setsP}</span>
                                            </td>
                                            <td style="padding:10px 8px; text-align:center; font-family:'Orbitron',sans-serif; color:#94a3b8; font-size:11px;">
                                                ${at.rankIni}
                                            </td>
                                            <td style="padding:10px 8px; text-align:center; font-family:'Orbitron',sans-serif; font-size:11px;">
                                                ${diffHtml}
                                            </td>
                                            <td style="padding:10px 8px; text-align:center; font-family:'Orbitron',sans-serif; color:#38bdf8; font-weight:900; font-size:13px;">
                                                ${at.rankAct}
                                            </td>
                                            ${tieneGrupos ? `<td style="padding:10px 8px; text-align:center; font-family:'Orbitron',sans-serif; color:#fbbf24; font-weight:900; font-size:14px;">${at.ptsGrupo}</td>` : ''}
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                let tablasHTML = '';
                if (tieneGrupos) {
                    groupNames.forEach(gName => {
                        let atletasGpo = ordenarAtletas(Array.from(jugadoresMap.values()).filter(j => j.grupoPertenece === gName));
                        tablasHTML += `
                            <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 12px; padding: 14px; margin-bottom: 16px;">
                                <div style="font-size: 12px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 8px;">
                                    <i class="fa-solid fa-users mr-1"></i> Grupo ${gName}
                                </div>
                                ${renderTablaAtletas(atletasGpo)}
                            </div>
                        `;
                    });
                } else {
                    tablasHTML = renderTablaAtletas(ordenarAtletas(Array.from(jugadoresMap.values())));
                }

                htmlContent += `
                    <div class="panel-3d" style="margin-bottom: 25px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(148, 163, 184, 0.1); padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                            <div>
                                <h3 style="margin:0; border:none; color:#f8fafc; font-size:14px; font-weight:800; text-transform:uppercase;">🏆 ${catNombre}</h3>
                                <span style="font-size:10px; color:#38bdf8; font-weight:700;">${tieneGrupos ? 'Fase de Grupos y Cuadro Clasificatorio' : (esEliminacionPura ? 'Modalidad: Eliminación Directa' : 'Fase de Torneo')}</span>
                            </div>
                            <button id="btn-share-wa-${catSlug}" onclick="compartirLlaveWhatsApp('${catSlug}', '${catNombre}')" class="btn-ws-header" style="font-size:10px; padding:7px 14px;">
                                <i class="fa-brands fa-whatsapp text-emerald-400 text-sm"></i> Compartir Llaves por WhatsApp
                            </button>
                        </div>

                        ${tablasHTML}

                        <!-- PROYECCIÓN Y CUADRO DE LLAVES EN TIEMPO REAL -->
                        <div id="seccion-captura-${catSlug}" style="margin-top: 25px; border-top: 1px solid rgba(148, 163, 184, 0.1); padding-top: 20px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                                <span style="font-size: 12px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px;">
                                    <i class="fa-solid fa-sitemap mr-1"></i> Proyección y Cuadro de Llaves en Tiempo Real
                                </span>
                                <span style="font-size: 9px; color: #34d399; font-weight: 800; background: rgba(16, 185, 129, 0.12); padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(16, 185, 129, 0.25);">
                                    🔴 Actualización en Vivo
                                </span>
                            </div>

                            <div class="md:hidden text-center text-[10px] text-sky-400 font-bold mb-3 bg-sky-950/40 p-2 rounded-lg border border-sky-500/20">
                                <i class="fa-solid fa-arrows-left-right mr-1 animate-pulse"></i> Desliza con tu dedo hacia los lados para ver todas las llaves
                            </div>
                            
                            <div class="bracket-scroll-wrapper">
                                <div id="bracket-mesas-${catSlug}" class="bracket-tree-container">
                                    <svg id="bracket-svg-${catSlug}" class="bracket-svg-overlay"></svg>
                                    ${generarCuadroEnVivoHTML(partidosCat, catSlug, jugadoresMap, groupNames)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;

            setTimeout(() => {
                catsList.forEach(catNombre => {
                    let catSlug = catNombre.replace(/\s+/g, '_');
                    actualizarLineasConectorasSVG(`bracket-mesas-${catSlug}`, `bracket-svg-${catSlug}`);
                });
            }, 80);
        }

        // ================= CONSTRUCCIÓN DEL ÁRBOL EN VIVO Y PROYECCIÓN =================
        function generarCuadroEnVivoHTML(partidosCat, catSlug, jugadoresMap, groupNames) {
            let colOctavos = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('octavo'));
            let colCuartos = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('cuarto'));
            let colSemis = partidosCat.filter(p => String(p.ronda_fase).toLowerCase().includes('semi'));
            let colFinal = partidosCat.filter(p => {
                let rf = String(p.ronda_fase).toLowerCase();
                return rf.includes('final') && !rf.includes('semi') && !rf.includes('cuarto') && !rf.includes('octavo');
            });

            const tieneGrupos = groupNames && groupNames.length >= 2;

            // PROYECCIÓN AUTOMÁTICA SI ESTAMOS EN MODO GRUPOS
            if (tieneGrupos) {
                // Calcular orden actual de cada grupo
                let standingsGpo = {};
                groupNames.forEach(g => {
                    let arr = Array.from(jugadoresMap.values()).filter(j => j.grupoPertenece === g);
                    arr.sort((a,b) => {
                        if (b.ptsGrupo !== a.ptsGrupo) return b.ptsGrupo - a.ptsGrupo;
                        let diffA = a.setsG - a.setsP;
                        let diffB = b.setsG - b.setsP;
                        if (diffB !== diffA) return diffB - diffA;
                        if (b.pg !== a.pg) return b.pg - a.pg;
                        return b.rankAct - a.rankAct;
                    });
                    standingsGpo[g] = arr;
                });

                if (groupNames.length === 2) {
                    // Semifinales proyectadas (1°A vs 2°B, 1°B vs 2°A)
                    let j1_A = standingsGpo['A']?.[0]?.nombre || '1° Grupo A';
                    let j2_A = standingsGpo['A']?.[1]?.nombre || '2° Grupo A';
                    let j1_B = standingsGpo['B']?.[0]?.nombre || '1° Grupo B';
                    let j2_B = standingsGpo['B']?.[1]?.nombre || '2° Grupo B';

                    let pSemi1 = colSemis.find(p => String(p.ronda_fase).includes('1')) || colSemis[0] || null;
                    let pSemi2 = colSemis.find(p => String(p.ronda_fase).includes('2')) || colSemis[1] || null;
                    let pFin = colFinal[0] || null;

                    let s1_n1 = pSemi1?.j1?.nombre || j1_A;
                    let s1_n2 = pSemi1?.j2?.nombre || j2_B;
                    let s2_n1 = pSemi2?.j1?.nombre || j1_B;
                    let s2_n2 = pSemi2?.j2?.nombre || j2_A;

                    let isFinS1 = (pSemi1?.estado || '').toLowerCase() === 'finalizado';
                    let isFinS2 = (pSemi2?.estado || '').toLowerCase() === 'finalizado';
                    let isFinF = (pFin?.estado || '').toLowerCase() === 'finalizado';

                    let winS1 = isFinS1 ? (pSemi1.ganador_id === pSemi1.jugador1_id ? s1_n1 : s1_n2) : null;
                    let winS2 = isFinS2 ? (pSemi2.ganador_id === pSemi2.jugador1_id ? s2_n1 : s2_n2) : null;

                    let f_n1 = pFin?.j1?.nombre || winS1 || 'Ganador Semi 1';
                    let f_n2 = pFin?.j2?.nombre || winS2 || 'Ganador Semi 2';

                    let s1_w1 = isFinS1 && pSemi1.ganador_id === pSemi1.jugador1_id;
                    let s1_w2 = isFinS1 && pSemi1.ganador_id === pSemi1.jugador2_id;
                    let s2_w1 = isFinS2 && pSemi2.ganador_id === pSemi2.jugador1_id;
                    let s2_w2 = isFinS2 && pSemi2.ganador_id === pSemi2.jugador2_id;
                    let f_w1 = isFinF && pFin.ganador_id === pFin.jugador1_id;
                    let f_w2 = isFinF && pFin.ganador_id === pFin.jugador2_id;

                    return `
                        <!-- COLUMNA SEMIFINALES -->
                        <div class="bracket-col-stage">
                            <div style="text-align:center; font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:-10px;">
                                Semifinales
                            </div>

                            <div class="b-match-card" id="mcard_${catSlug}_SEM_1" data-target="mcard_${catSlug}_FIN_1" data-target-slot="top">
                                <div class="b-match-header">Semifinal 1 ${pSemi1 ? `• MESA ${pSemi1.mesa}` : ''}</div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${s1_w1 ? 'winner' : ''}">${s1_w1 ? '🏆 ' : ''}${s1_n1}</span>
                                        <span class="b-player-club">1° Grupo A</span>
                                    </div>
                                    <span class="b-score-box ${s1_w1 ? 'winner' : ''}">${pSemi1?.sets_j1 || 0}</span>
                                </div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${s1_w2 ? 'winner' : ''}">${s1_w2 ? '🏆 ' : ''}${s1_n2}</span>
                                        <span class="b-player-club">2° Grupo B</span>
                                    </div>
                                    <span class="b-score-box ${s1_w2 ? 'winner' : ''}">${pSemi1?.sets_j2 || 0}</span>
                                </div>
                            </div>

                            <div class="b-match-card" id="mcard_${catSlug}_SEM_2" data-target="mcard_${catSlug}_FIN_1" data-target-slot="bottom">
                                <div class="b-match-header">Semifinal 2 ${pSemi2 ? `• MESA ${pSemi2.mesa}` : ''}</div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${s2_w1 ? 'winner' : ''}">${s2_w1 ? '🏆 ' : ''}${s2_n1}</span>
                                        <span class="b-player-club">1° Grupo B</span>
                                    </div>
                                    <span class="b-score-box ${s2_w1 ? 'winner' : ''}">${pSemi2?.sets_j1 || 0}</span>
                                </div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${s2_w2 ? 'winner' : ''}">${s2_w2 ? '🏆 ' : ''}${s2_n2}</span>
                                        <span class="b-player-club">2° Grupo A</span>
                                    </div>
                                    <span class="b-score-box ${s2_w2 ? 'winner' : ''}">${pSemi2?.sets_j2 || 0}</span>
                                </div>
                            </div>
                        </div>

                        <!-- COLUMNA GRAN FINAL -->
                        <div class="bracket-col-stage">
                            <div style="text-align:center; font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:-10px;">
                                Gran Final
                            </div>

                            <div class="b-match-card" id="mcard_${catSlug}_FIN_1">
                                <div class="b-match-header">Gran Final ${pFin ? `• MESA ${pFin.mesa}` : ''}</div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${f_w1 ? 'winner' : ''}">${f_w1 ? '🏆 ' : ''}${f_n1}</span>
                                        <span class="b-player-club">Gana Semi 1</span>
                                    </div>
                                    <span class="b-score-box ${f_w1 ? 'winner' : ''}">${pFin?.sets_j1 || 0}</span>
                                </div>
                                <div class="b-player-row">
                                    <div class="b-player-info">
                                        <span class="b-player-name ${f_w2 ? 'winner' : ''}">${f_w2 ? '🏆 ' : ''}${f_n2}</span>
                                        <span class="b-player-club">Gana Semi 2</span>
                                    </div>
                                    <span class="b-score-box ${f_w2 ? 'winner' : ''}">${pFin?.sets_j2 || 0}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            // MODO ELIMINACIÓN DIRECTA PURA O CUANDO YA HAY PARTIDOS GUARDADOS EN BD
            let columnas = [];
            if (colOctavos.length > 0) columnas.push({ name: 'Octavos de Final', matches: colOctavos, stageKey: 'OCT' });
            if (colCuartos.length > 0) columnas.push({ name: 'Cuartos de Final', matches: colCuartos, stageKey: 'CUA' });
            if (colSemis.length > 0) columnas.push({ name: 'Semifinales', matches: colSemis, stageKey: 'SEM' });
            if (colFinal.length > 0) columnas.push({ name: 'Gran Final', matches: colFinal, stageKey: 'FIN' });

            if (columnas.length === 0) return '<div class="mensaje-vacio">Sin partidos de eliminatoria registrados.</div>';

            let ganadores = {};
            partidosCat.forEach(p => {
                if ((p.estado || '').toLowerCase() === 'finalizado' && p.ganador_id) {
                    let win = p.ganador_id === p.jugador1_id ? p.j1 : p.j2;
                    if (win) ganadores[p.ronda_fase] = win;
                }
            });

            let htmlCols = '';
            columnas.forEach((col, cIdx) => {
                htmlCols += `<div class="bracket-col-stage">`;
                htmlCols += `<div style="text-align:center; font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:-10px;">${col.name}</div>`;
                
                col.matches.forEach((p, mIdx) => {
                    let n1 = p.j1 ? p.j1.nombre : 'Por definir';
                    let n2 = p.j2 ? p.j2.nombre : 'Por definir';

                    if (n1 === 'Por definir' || n1.includes('Gana') || n1.includes('Seed')) {
                        let prevKey = col.stageKey === 'CUA' ? `Octavos ${mIdx*2+1}` : (col.stageKey === 'SEM' ? `Cuartos ${mIdx*2+1}` : `Semifinal 1`);
                        if (ganadores[prevKey]) n1 = ganadores[prevKey].nombre;
                    }
                    if (n2 === 'Por definir' || n2.includes('Gana') || n2.includes('Seed')) {
                        let prevKey = col.stageKey === 'CUA' ? `Octavos ${(mIdx+1)*2}` : (col.stageKey === 'SEM' ? `Cuartos ${(mIdx+1)*2}` : `Semifinal 2`);
                        if (ganadores[prevKey]) n2 = ganadores[prevKey].nombre;
                    }

                    let isFin = (p.estado || '').toLowerCase() === 'finalizado';
                    let isW1 = isFin && p.ganador_id === p.jugador1_id;
                    let isW2 = isFin && p.ganador_id === p.jugador2_id;

                    let targetAttr = '';
                    if (cIdx < columnas.length - 1) {
                        let nextStageKey = columnas[cIdx + 1].stageKey;
                        let targetMatchIdx = Math.floor(mIdx / 2) + 1;
                        let slot = mIdx % 2 === 0 ? 'top' : 'bottom';
                        if (col.stageKey === 'OCT') {
                            let rf = String(p.ronda_fase);
                            if (rf.includes('2')) { targetMatchIdx = 1; slot = 'bottom'; }
                            if (rf.includes('8')) { targetMatchIdx = 4; slot = 'bottom'; }
                        }
                        targetAttr = `data-target="mcard_${catSlug}_${nextStageKey}_${targetMatchIdx}" data-target-slot="${slot}"`;
                    }

                    htmlCols += `
                        <div class="b-match-card" id="mcard_${catSlug}_${col.stageKey}_${mIdx+1}" ${targetAttr}>
                            <div class="b-match-header">${p.ronda_fase} • MESA ${p.mesa}</div>
                            <div class="b-player-row">
                                <div class="b-player-info">
                                    <span class="b-player-name ${isW1 ? 'winner' : ''}">${isW1 ? '🏆 ' : ''}${n1}</span>
                                    <span class="b-player-club">${p.j1?.club || ''}</span>
                                </div>
                                <span class="b-score-box ${isW1 ? 'winner' : ''}">${p.sets_j1 || 0}</span>
                            </div>
                            <div class="b-player-row">
                                <div class="b-player-info">
                                    <span class="b-player-name ${isW2 ? 'winner' : ''}">${isW2 ? '🏆 ' : ''}${n2}</span>
                                    <span class="b-player-club">${p.j2?.club || ''}</span>
                                </div>
                                <span class="b-score-box ${isW2 ? 'winner' : ''}">${p.sets_j2 || 0}</span>
                            </div>
                        </div>
                    `;
                });
                htmlCols += `</div>`;
            });
            return htmlCols;
        }

        // ================= COMPARTIR IMAGEN POR WHATSAPP =================
        async function compartirLlaveWhatsApp(catSlug, catNombre) {
            const btn = document.getElementById(`btn-share-wa-${catSlug}`);
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generando imagen...';

            try {
                const targetEl = document.getElementById(`seccion-captura-${catSlug}`);
                if (!targetEl) throw new Error("No se encontró el cuadro de llaves.");

                const canvas = await html2canvas(targetEl, {
                    backgroundColor: '#0b0f19',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert("Error al generar la imagen.");
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        return;
                    }

                    const fileName = `Resultados_Llaves_${catNombre.replace(/\s+/g, '_')}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: `🏆 Resultados y Llaves - ${catNombre}`,
                                text: `🏓 *Resultados y Llaves en Vivo - ${catNombre}*\nTorneo: *${torneoActivoObj?.nombre || 'Torneo'}*`,
                                files: [file]
                            });
                            btn.disabled = false;
                            btn.innerHTML = originalText;
                            return;
                        } catch (shareErr) {
                            if (shareErr.name === 'AbortError') {
                                btn.disabled = false;
                                btn.innerHTML = originalText;
                                return;
                            }
                        }
                    }

                    let copiado = false;
                    try {
                        if (navigator.clipboard && window.ClipboardItem) {
                            await navigator.clipboard.write([
                                new ClipboardItem({ 'image/png': blob })
                            ]);
                            copiado = true;
                        }
                    } catch (clipErr) {
                        console.warn("No se pudo copiar directamente:", clipErr);
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    const mensajeWS = `🏓 *CUADRO DE LLAVES Y RESULTADOS EN VIVO*\n🏆 Categoría: *${catNombre}*\nTorneo: *${torneoActivoObj?.nombre || 'Torneo'}*`;
                    const urlWS = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensajeWS)}`;

                    if (copiado) {
                        alert("📋 ¡Imagen copiada al portapapeles y descargada!\n\nSe abrirá WhatsApp para que solo presiones 'Pegar' (Ctrl + V) en tu grupo.");
                    } else {
                        alert("📥 Imagen generada. Se abrirá WhatsApp para que la adjuntes a tu grupo.");
                    }

                    window.open(urlWS, '_blank');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }, 'image/png');

            } catch (e) {
                alert("Error al compartir: " + e.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        window.addEventListener('resize', () => {
            if (estadoFiltro === 'resumen') {
                let catsList = [...new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean))];
                catsList.forEach(catNombre => {
                    let catSlug = catNombre.replace(/\s+/g, '_');
                    actualizarLineasConectorasSVG(`bracket-mesas-${catSlug}`, `bracket-svg-${catSlug}`);
                });
            }
        });

        inicializar();
    </script>
</body>
</html>
