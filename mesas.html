<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesa de Arbitraje - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 24px; }
        .score-p1 { border-top: 4px solid #06b6d4; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2); }
        .score-p2 { border-top: 4px solid #d946ef; box-shadow: 0 10px 30px rgba(217, 70, 239, 0.2); }
        .btn-action { transition: all 0.2s active; }
        .btn-action:active { transform: scale(0.95); }
        select option { background-color: #0f172a; color: #fff; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 bg-[#04060a]">

    <!-- PANTALLA MODAL DE GANADOR -->
    <div id="modal-ganador" class="hidden fixed inset-0 z-[100] bg-black/95 flex-col items-center justify-center">
        <img src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png" class="w-32 h-32 md:w-40 md:h-40 mb-4 drop-shadow-[0_0_20px_rgba(251,191,36,0.8)] animate-pulse" alt="Trophy">
        <h1 class="text-3xl md:text-5xl font-black text-amber-400 uppercase tracking-widest mb-1 text-center drop-shadow-lg">¡PARTIDO FINALIZADO!</h1>
        <h2 id="winner-name-modal" class="text-2xl md:text-4xl font-bold text-white text-center mt-2 uppercase tracking-wider">Nombre del Ganador</h2>
        <h3 id="winner-sets-modal" class="text-sm md:text-lg text-zinc-400 font-bold mb-8 uppercase tracking-widest">Ganó 0 a 0 en Sets</h3>
        
        <div class="flex flex-col gap-4 items-center w-full max-w-sm px-6">
            <button onclick="cerrarYRegresar()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black px-6 py-3 rounded-full font-black text-sm md:text-base uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                ✅ Volver a Mesas
            </button>
            
            <button onclick="ocultarAvisoVictoria()" class="w-full bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-full font-bold text-xs md:text-sm uppercase tracking-widest transition-all border border-slate-600">
                👁️ Ver Tablero (Opciones)
            </button>

            <button onclick="cerrarModalYCorregir()" class="text-rose-400 hover:text-rose-300 text-[10px] md:text-xs font-bold uppercase underline tracking-widest cursor-pointer mt-4">
                ⚙️ Deshacer Último Punto (Reabrir Partido)
            </button>
        </div>
    </div>

    <!-- HEADER DE CONTROL -->
    <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-white/10 mb-3">
        <button onclick="window.location.href='mesas.html'" class="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest text-white transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> Mesas
        </button>

        <div class="text-center">
            <span id="info-mesa-fase" class="text-[10px] font-black text-cyan-400 uppercase tracking-widest block">MESA -- • FASE</span>
            <select id="select-formato" onchange="cambiarFormato()" class="bg-transparent border border-zinc-600 text-zinc-400 hover:border-cyan-400 hover:text-cyan-400 text-[9px] font-bold uppercase rounded mt-1 outline-none text-center cursor-pointer transition-colors py-0.5 px-1 appearance-none text-center">
                <option value="2-3">Formato: 2 de 3 Sets</option>
                <option value="3-5" selected>Formato: 3 de 5 Sets</option>
                <option value="4-7">Formato: 4 de 7 Sets</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <div id="badge-espectadores" class="hidden bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all gap-1" title="Espectadores conectados en el torneo">
                <i class="fa-solid fa-eye animate-pulse"></i> <span id="contador-espectadores">0</span>
            </div>

            <button id="btn-toggle-ranking" onclick="toggleMostrarRanking()" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest transition-all">
                📊 Ranking: OFF
            </button>
            <button id="btn-audio" onclick="toggleAudio()" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 w-8 h-8 rounded-full flex items-center justify-center text-xs">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </div>

    <!-- MARCADOR PRINCIPAL -->
    <div class="flex-1 flex flex-col md:flex-row gap-4 my-2 min-h-0">
        
        <div class="flex-1 flex flex-col min-h-0 relative">
            <div class="bg-cyan-600/30 border border-cyan-500/40 p-3 rounded-2xl mb-2 text-center relative">
                <div id="badge-saque-left" onclick="forzarCambioSaqueInicial()" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest cursor-pointer shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all animate-pulse">
                    🎾 Saque
                </div>
                <h2 id="name-left" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate mt-1">JUGADOR 1</h2>
                <div id="ranking-info-left" class="text-[10px] font-extrabold text-cyan-300 mt-0.5">Calculando...</div>
            </div>
            
            <div onclick="addPointLeft()" class="flex-1 card-score score-p1 flex flex-col items-center justify-center cursor-pointer active:bg-cyan-950/40 transition-colors">
                <div id="score-left" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-cyan-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-left" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

        <div class="flex md:flex-col justify-center items-center gap-2 py-1 shrink-0 px-2 md:px-0">
            <button onclick="undo()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action w-full" title="Deshacer último punto">
                <i class="fa-solid fa-rotate-left md:mr-1"></i> <span class="hidden md:inline">Deshacer</span>
            </button>
            <button onclick="manualSwapSides()" class="bg-slate-800 hover:bg-slate-700 text-zinc-300 p-3 rounded-xl border border-white/10 text-xs font-bold uppercase tracking-wider btn-action w-full" title="Cambiar lados manualmente">
                <i class="fa-solid fa-arrows-rotate md:mr-1"></i> <span class="hidden md:inline">Lados</span>
            </button>
            <button onclick="forzarFinalizacion()" class="bg-amber-600/20 hover:bg-amber-500 text-amber-400 hover:text-black p-3 rounded-xl border border-amber-500/50 text-[10px] md:text-xs font-black uppercase tracking-wider btn-action mt-2 w-full transition-colors shadow-[0_0_10px_rgba(245,158,11,0.2)]" title="Finalizar partido manualmente">
                <i class="fa-solid fa-flag-checkered md:mr-1"></i> <span class="hidden md:inline">Finalizar</span>
            </button>
        </div>

        <div class="flex-1 flex flex-col min-h-0 relative">
            <div class="bg-fuchsia-600/30 border border-fuchsia-500/40 p-3 rounded-2xl mb-2 text-center relative">
                <div id="badge-saque-right" onclick="forzarCambioSaqueInicial()" class="hidden absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest cursor-pointer shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all animate-pulse">
                    🎾 Saque
                </div>
                <h2 id="name-right" class="text-lg md:text-2xl font-black uppercase tracking-wider text-white truncate mt-1">JUGADOR 2</h2>
                <div id="ranking-info-right" class="text-[10px] font-extrabold text-fuchsia-300 mt-0.5">Calculando...</div>
            </div>
            
            <div onclick="addPointRight()" class="flex-1 card-score score-p2 flex flex-col items-center justify-center cursor-pointer active:bg-fuchsia-950/40 transition-colors">
                <div id="score-right" class="font-digital text-[22vh] md:text-[35vh] font-black leading-none text-fuchsia-400 select-none">0</div>
                <div class="text-xs font-bold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="sets-right" class="text-white font-digital text-lg font-black ml-1">0</span></div>
            </div>
        </div>

    </div>

    <!-- HISTORIAL DE SETS -->
    <div id="container-historial" class="bg-slate-900/80 p-3 rounded-2xl border border-white/10 flex justify-center items-center gap-3 flex-wrap min-h-[45px]">
        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Historial de Sets:</span>
        <div id="list-sets" class="flex gap-2 flex-wrap"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const partidoId = urlParams.get('partido');

        let partidoData = null;
        let reglasRanking = [];
        let p1 = { id: null, nombre: 'JUGADOR 1', ptsBase: 0, ptsLive: 0, score: 0, sets: 0 };
        let p2 = { id: null, nombre: 'JUGADOR 2', ptsBase: 0, ptsLive: 0, score: 0, sets: 0 };
        let historialSets = [];
        let numSetActual = 1;
        let modoJuego = '3-5'; 
        let setsParaGanar = 3;
        
        let isSwapped = false;
        let firstServersBySet = [1];
        let audioMuted = false;
        let mostrarRankingImpacto = false;
        let historyStack = [];
        let canalEspectadores = null;

        const getApellido = (nom) => {
            if (!nom) return "";
            const partes = nom.trim().split(" ");
            return partes[partes.length - 1];
        };

        async function inicializarJuez() {
            if (!partidoId) { alert("ID de partido no especificado."); return; }
            
            try {
                const { data: reglas } = await clienteSupabase.from('reglas_ranking').select('*').order('diferencia_min', { ascending: true });
                reglasRanking = reglas || [];
                await cargarYResolverPartido();
            } catch (err) {
                console.error("Error inicializando:", err);
            }
        }

        async function cargarYResolverPartido() {
            try {
                const { data, error } = await clienteSupabase
                    .from('partidos')
                    .select('*, j1:jugador1_id(id, nombre, puntos_ranking), j2:jugador2_id(id, nombre, puntos_ranking), categorias(id, nombre)')
                    .eq('id', partidoId)
                    .single();

                if (error || !data) throw new Error("No se encontró el partido.");
                partidoData = data;

                if ((!data.jugador1_id || !data.jugador2_id) && (!data.grupo_nombre)) {
                    await resolverClasificadosLlave(data);
                    return; 
                }

                p1.id = data.jugador1_id; p1.nombre = data.j1 ? data.j1.nombre : 'Jugador 1'; p1.ptsBase = data.j1 ? data.j1.puntos_ranking || 0 : 0;
                p2.id = data.jugador2_id; p2.nombre = data.j2 ? data.j2.nombre : 'Jugador 2'; p2.ptsBase = data.j2 ? data.j2.puntos_ranking || 0 : 0;

                p1.score = parseInt(data.puntos_j1) || 0;
                p2.score = parseInt(data.puntos_j2) || 0;
                p1.sets = parseInt(data.sets_j1) || 0;
                p2.sets = parseInt(data.sets_j2) || 0;

                modoJuego = data.modo_juego || '3-5';
                setsParaGanar = 3; 
                if (modoJuego === '2-3') setsParaGanar = 2;
                else if (modoJuego === '4-7') setsParaGanar = 4;

                const selFormato = document.getElementById('select-formato');
                if (selFormato) selFormato.value = modoJuego;

                let hs = data.historial_sets;
                if (typeof hs === 'string') { try { hs = JSON.parse(hs); } catch(e) { hs = []; } }
                historialSets = Array.isArray(hs) ? hs : [];
                numSetActual = historialSets.length + 1;
                
                let memoriaLocalRanking = localStorage.getItem('preferencia_ranking_pixel');
                if (data.mostrar_ranking !== undefined && data.mostrar_ranking !== null) {
                    mostrarRankingImpacto = data.mostrar_ranking;
                } else {
                    mostrarRankingImpacto = (memoriaLocalRanking === 'true');
                }

                firstServersBySet = [1];
                for (let i = 1; i < numSetActual; i++) {
                    firstServersBySet.push(firstServersBySet[i-1] === 1 ? 2 : 1);
                }

                isSwapped = (numSetActual % 2 === 0);

                if (data.estado === 'finalizado' && data.ganador_id) {
                    let nomWin = data.ganador_id === p1.id ? p1.nombre : p2.nombre;
                    mostrarOverlayGanador(nomWin);
                }

                await calcularRankingEnVivoAcumulado();
                actualizarBotonRankingUI();
                actualizarUI();
                
                iniciarPresenciaEspectadores();

            } catch (err) {
                console.error("Crash:", err);
            }
        }

        async function resolverClasificadosLlave(p) {
            const { data: partidosCat } = await clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, nombre, puntos_ranking), j2:jugador2_id(id, nombre, puntos_ranking)').eq('torneo_id', p.torneo_id).eq('categoria_id', p.categoria_id);
            if (!partidosCat) return;

            const standings = {};
            partidosCat.filter(m => m.grupo_nombre).forEach(m => {
                const g = m.grupo_nombre; if (!standings[g]) standings[g] = {};
                [m.j1, m.j2].forEach(j => { if (j && j.id && !standings[g][j.id]) { standings[g][j.id] = { id: j.id, nombre: j.nombre, pts: 0, pg: 0, pj: 0, setsG: 0, setsP: 0 }; } });

                if ((m.estado || '').toLowerCase() === 'finalizado' && m.j1 && m.j2) {
                    const obj1 = standings[g][m.j1.id]; const obj2 = standings[g][m.j2.id];
                    if (obj1 && obj2) {
                        obj1.pj++; obj2.pj++; obj1.setsG += (m.sets_j1 || 0); obj1.setsP += (m.sets_j2 || 0); obj2.setsG += (m.sets_j2 || 0); obj2.setsP += (m.sets_j1 || 0);
                        if (m.ganador_id === m.jugador1_id) { obj1.pg++; obj1.pts += 2; obj2.pts += 1; } else { obj2.pg++; obj2.pts += 2; obj1.pts += 1; }
                    }
                }
            });

            const ordenarITTF = (lista) => { return [...lista].sort((a, b) => { if (b.pts !== a.pts) return b.pts - a.pts; const rSetA = a.setsG / (a.setsP || 0.0001); const rSetB = b.setsG / (b.setsP || 0.0001); return rSetB - rSetA; }); };
            const gA = standings['A'] ? ordenarITTF(Object.values(standings['A'])) : []; const gB = standings['B'] ? ordenarITTF(Object.values(standings['B'])) : [];

            let resJ1 = null, resJ2 = null; const rondaLimpia = (p.ronda_fase || '').toLowerCase();
            if (rondaLimpia.includes('semi') && (rondaLimpia.includes('1') || rondaLimpia.includes('cruce 1'))) { resJ1 = gA[0]?.id; resJ2 = gB[1]?.id; } 
            else if (rondaLimpia.includes('semi') && (rondaLimpia.includes('2') || rondaLimpia.includes('cruce 2'))) { resJ1 = gB[0]?.id; resJ2 = gA[1]?.id; } 
            else if (rondaLimpia.includes('final')) {
                const semi1 = partidosCat.find(m => (m.ronda_fase || '').toLowerCase().includes('semi') && ((m.ronda_fase || '').includes('1') || (m.ronda_fase || '').includes('cruce 1')));
                const semi2 = partidosCat.find(m => (m.ronda_fase || '').toLowerCase().includes('semi') && ((m.ronda_fase || '').includes('2') || (m.ronda_fase || '').includes('cruce 2')));
                if (semi1 && semi1.ganador_id) resJ1 = semi1.ganador_id; if (semi2 && semi2.ganador_id) resJ2 = semi2.ganador_id;
            }

            if (resJ1 || resJ2) { let updateObj = {}; if (resJ1) updateObj.jugador1_id = resJ1; if (resJ2) updateObj.jugador2_id = resJ2; await clienteSupabase.from('partidos').update(updateObj).eq('id', p.id); await cargarYResolverPartido(); }
        }

        async function calcularRankingEnVivoAcumulado() {
            if (!partidoData || !partidoData.torneo_id) return;
            try {
                const { data: finMatches } = await clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, puntos_ranking), j2:jugador2_id(id, puntos_ranking)').eq('torneo_id', partidoData.torneo_id).eq('estado', 'finalizado');
                let deltaP1 = 0; let deltaP2 = 0;
                if (finMatches && finMatches.length > 0) {
                    finMatches.forEach(m => {
                        if (m.id == partidoId) return;
                        let p1Base = m.j1 ? m.j1.puntos_ranking : 0; let p2Base = m.j2 ? m.j2.puntos_ranking : 0;
                        let impacto = calcularImpactoPuntos(p1Base, p2Base);
                        if (p1.id && m.jugador1_id === p1.id) { deltaP1 += (m.ganador_id === p1.id) ? impacto.j1Gana : impacto.j1Pierde; } else if (p1.id && m.jugador2_id === p1.id) { deltaP1 += (m.ganador_id === p1.id) ? impacto.j2Gana : impacto.j2Pierde; }
                        if (p2.id && m.jugador1_id === p2.id) { deltaP2 += (m.ganador_id === p2.id) ? impacto.j1Gana : impacto.j1Pierde; } else if (p2.id && m.jugador2_id === p2.id) { deltaP2 += (m.ganador_id === p2.id) ? impacto.j2Gana : impacto.j2Pierde; }
                    });
                }
                p1.ptsLive = p1.ptsBase + deltaP1; p2.ptsLive = p2.ptsBase + deltaP2;
            } catch(e) { p1.ptsLive = p1.ptsBase; p2.ptsLive = p2.ptsBase; }
        }

        function calcularImpactoPuntos(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB); let favoritoEsJ1 = ptsA >= ptsB;
            let reglaGanaJ1 = reglasRanking.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((favoritoEsJ1 && r.resultado_esperado === 'gana_favorito') || (!favoritoEsJ1 && r.resultado_esperado === 'gana_retador')));
            let reglaGanaJ2 = reglasRanking.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((!favoritoEsJ1 && r.resultado_esperado === 'gana_favorito') || (favoritoEsJ1 && r.resultado_esperado === 'gana_retador')));
            return { j1Gana: reglaGanaJ1 ? reglaGanaJ1.puntos_ganador : 10, j1Pierde: reglaGanaJ2 ? -Math.abs(reglaGanaJ2.puntos_perdedor) : -5, j2Gana: reglaGanaJ2 ? reglaGanaJ2.puntos_ganador : 10, j2Pierde: reglaGanaJ1 ? -Math.abs(reglaGanaJ1.puntos_perdedor) : -5 };
        }

        function getCurrentServer() {
            let currentSetIdx = numSetActual - 1; if(currentSetIdx >= firstServersBySet.length) { firstServersBySet[currentSetIdx] = firstServersBySet[currentSetIdx-1] === 1 ? 2 : 1; }
            let firstSrv = firstServersBySet[currentSetIdx]; let s1 = p1.score, s2 = p2.score; let total = s1 + s2;
            if(s1 >= 10 && s2 >= 10) { let extra = total - 20; return extra % 2 === 0 ? firstSrv : (firstSrv === 1 ? 2 : 1); } 
            else { let blocks = Math.floor(total / 2); return blocks % 2 === 0 ? firstSrv : (firstSrv === 1 ? 2 : 1); }
        }

        function forzarCambioSaqueInicial() { let currentSetIdx = numSetActual - 1; firstServersBySet[currentSetIdx] = firstServersBySet[currentSetIdx] === 1 ? 2 : 1; actualizarUI(); }

        async function cambiarFormato() {
            const nuevoFormato = document.getElementById('select-formato').value;
            modoJuego = nuevoFormato;
            setsParaGanar = (modoJuego === '2-3') ? 2 : ((modoJuego === '4-7') ? 4 : 3);
            await clienteSupabase.from('partidos').update({ modo_juego: modoJuego }).eq('id', partidoId);
        }

        function iniciarPresenciaEspectadores() {
            if (!partidoData || canalEspectadores) return;
            canalEspectadores = clienteSupabase.channel(`espectadores_torneo_${partidoData.torneo_id}`);
            canalEspectadores.on('presence', { event: 'sync' }, () => {
                const newState = canalEspectadores.presenceState();
                const numSpectators = Object.keys(newState).length;
                const badge = document.getElementById('badge-espectadores');
                const contador = document.getElementById('contador-espectadores');
                if (numSpectators > 0) {
                    badge.classList.remove('hidden'); badge.classList.add('flex');
                    contador.innerText = numSpectators;
                } else {
                    badge.classList.add('hidden'); badge.classList.remove('flex');
                }
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await canalEspectadores.track({ rol: 'juez', partidoId: partidoId, timestamp: Date.now() });
                }
            });
        }

        function actualizarBotonRankingUI() {
            const btn = document.getElementById('btn-toggle-ranking');
            btn.innerText = `📊 Ranking: ${mostrarRankingImpacto ? 'ON' : 'OFF'}`;
            btn.className = mostrarRankingImpacto 
                ? "bg-amber-500 text-black border border-amber-400 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest shadow-[0_0_12px_rgba(245,158,11,0.5)]" 
                : "bg-amber-500/20 text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest";
        }

        async function toggleMostrarRanking() {
            mostrarRankingImpacto = !mostrarRankingImpacto;
            actualizarBotonRankingUI();
            localStorage.setItem('preferencia_ranking_pixel', mostrarRankingImpacto);
            await clienteSupabase.from('partidos').update({ mostrar_ranking: mostrarRankingImpacto }).eq('id', partidoId);
            actualizarUI();
        }

        function actualizarUI() {
            let leftJ = isSwapped ? p2 : p1; let rightJ = isSwapped ? p1 : p2;
            document.getElementById('name-left').innerText = leftJ.nombre; document.getElementById('name-right').innerText = rightJ.nombre;
            document.getElementById('score-left').innerText = leftJ.score; document.getElementById('score-right').innerText = rightJ.score;
            document.getElementById('sets-left').innerText = leftJ.sets; document.getElementById('sets-right').innerText = rightJ.sets;
            
            let txtFase = partidoData?.grupo_nombre ? 'GRUPO ' + partidoData.grupo_nombre : (partidoData?.ronda_fase || 'FASE FINAL');
            document.getElementById('info-mesa-fase').innerText = `MESA ${partidoData?.mesa || 1} • ${txtFase}`;

            let isFin = (partidoData?.estado || '').toLowerCase() === 'finalizado';
            let impactoLive = calcularImpactoPuntos(p1.ptsLive, p2.ptsLive);

            let ptsShowP1 = p1.ptsLive; let ptsShowP2 = p2.ptsLive;
            if (isFin) {
                if (partidoData.ganador_id === p1.id) { ptsShowP1 += impactoLive.j1Gana; ptsShowP2 += impactoLive.j2Pierde; } 
                else if (partidoData.ganador_id === p2.id) { ptsShowP1 += impactoLive.j1Pierde; ptsShowP2 += impactoLive.j2Gana; }
            }

            let textRankP1 = mostrarRankingImpacto ? `<strong>${ptsShowP1} pts ${isFin ? '(Final)' : '(En Vivo)'}</strong> | <span class="text-emerald-400">🏆 +${impactoLive.j1Gana}</span> <span class="text-rose-400">❌ ${impactoLive.j1Pierde}</span>` : `${ptsShowP1} pts ${isFin ? '(Final)' : '(En Vivo)'}`;
            let textRankP2 = mostrarRankingImpacto ? `<strong>${ptsShowP2} pts ${isFin ? '(Final)' : '(En Vivo)'}</strong> | <span class="text-emerald-400">🏆 +${impactoLive.j2Gana}</span> <span class="text-rose-400">❌ ${impactoLive.j2Pierde}</span>` : `${ptsShowP2} pts ${isFin ? '(Final)' : '(En Vivo)'}`;

            document.getElementById('ranking-info-left').innerHTML = isSwapped ? textRankP2 : textRankP1; 
            document.getElementById('ranking-info-right').innerHTML = isSwapped ? textRankP1 : textRankP2;

            let currServer = getCurrentServer(); let visualServerLeft = (!isSwapped && currServer === 1) || (isSwapped && currServer === 2);
            if (visualServerLeft) { document.getElementById('badge-saque-left').classList.remove('hidden'); document.getElementById('badge-saque-right').classList.add('hidden'); } 
            else { document.getElementById('badge-saque-left').classList.add('hidden'); document.getElementById('badge-saque-right').classList.remove('hidden'); }

            const listSetsEl = document.getElementById('list-sets'); listSetsEl.innerHTML = '';
            historialSets.forEach(s => { listSetsEl.innerHTML += `<span class="bg-black/60 border border-white/10 px-2.5 py-1 rounded-lg text-[10px] font-bold">Set ${s.numSet}: <span class="${s.s1 > s.s2 ? 'text-cyan-400' : 'text-zinc-400'}">${s.s1}</span> - <span class="${s.s2 > s.s1 ? 'text-fuchsia-400' : 'text-zinc-400'}">${s.s2}</span></span>`; });
        }

        function saveSnapshot() { historyStack.push(JSON.parse(JSON.stringify({ p1, p2, historialSets, numSetActual, isSwapped, firstServersBySet }))); }

        function addPointLeft() { addPoint(isSwapped ? 2 : 1); }
        function addPointRight() { addPoint(isSwapped ? 1 : 2); }

        async function addPoint(jugadorOriginalNum) {
            if (p1.sets >= setsParaGanar || p2.sets >= setsParaGanar || (partidoData && partidoData.estado === 'finalizado')) {
                let ganadorFinal = (p1.sets > p2.sets) ? p1.nombre : p2.nombre;
                if (partidoData && partidoData.ganador_id) {
                    ganadorFinal = partidoData.ganador_id === p1.id ? p1.nombre : p2.nombre;
                }
                mostrarOverlayGanador(ganadorFinal);
                return;
            }

            saveSnapshot();
            
            if (jugadorOriginalNum === 1) p1.score++; else p2.score++;
            let s1 = p1.score, s2 = p2.score;
            let partidoGanado = false; let ganadorId = null;

            if ((s1 >= 11 || s2 >= 11) && Math.abs(s1 - s2) >= 2) {
                let ganadorSet = s1 > s2 ? 1 : 2;
                if (ganadorSet === 1) p1.sets++; else p2.sets++;
                
                historialSets.push({ numSet: numSetActual, s1: s1, s2: s2 });
                numSetActual++;

                if (p1.sets >= setsParaGanar) { partidoGanado = true; ganadorId = p1.id; }
                else if (p2.sets >= setsParaGanar) { partidoGanado = true; ganadorId = p2.id; }

                if (!partidoGanado) {
                    p1.score = 0; p2.score = 0;
                    isSwapped = !isSwapped; 
                    let prevFirst = firstServersBySet[firstServersBySet.length - 1];
                    firstServersBySet.push(prevFirst === 1 ? 2 : 1);
                }
            }

            if (partidoGanado) { partidoData.estado = 'finalizado'; partidoData.ganador_id = ganadorId; }

            actualizarUI();
            anunciarMarcador(p1.nombre, p1.score, p2.nombre, p2.score, partidoGanado);

            await clienteSupabase.from('partidos').update({
                puntos_j1: p1.score, puntos_j2: p2.score, sets_j1: p1.sets, sets_j2: p2.sets, historial_sets: historialSets,
                estado: partidoGanado ? 'finalizado' : 'en_curso', ganador_id: ganadorId
            }).eq('id', partidoId);

            if (partidoGanado) mostrarOverlayGanador(ganadorId === p1.id ? p1.nombre : p2.nombre);
        }

        async function forzarFinalizacion() {
            if (partidoData && partidoData.estado === 'finalizado') {
                mostrarOverlayGanador(partidoData.ganador_id === p1.id ? p1.nombre : p2.nombre);
                return;
            }

            let numRespuesta = prompt(`⚠️ El partido no ha alcanzado los sets automáticos.\n¿Deseas FINALIZARLO MANUALMENTE?\n\nEscribe 1 para declarar ganador a: ${p1.nombre}\nEscribe 2 para declarar ganador a: ${p2.nombre}\n\nDejar en blanco para cancelar.`);
            
            if (numRespuesta === '1' || numRespuesta === '2') {
                saveSnapshot();
                let ganadorId = (numRespuesta === '1') ? p1.id : p2.id;
                let nombreGanador = (numRespuesta === '1') ? p1.nombre : p2.nombre;

                partidoData.estado = 'finalizado';
                partidoData.ganador_id = ganadorId;

                actualizarUI();
                anunciarMarcador(p1.nombre, p1.score, p2.nombre, p2.score, true);

                await clienteSupabase.from('partidos').update({ estado: 'finalizado', ganador_id: ganadorId }).eq('id', partidoId);
                mostrarOverlayGanador(nombreGanador);
            }
        }

        // ==========================================
        // CÓDIGO CORREGIDO PARA BOTÓN DESHACER (UNDO)
        // ==========================================
        async function undo(skipConfirm = false) {
            if (historyStack.length > 0) {
                // Hay memoria reciente guardada en la RAM
                const snap = historyStack.pop();
                p1 = snap.p1; p2 = snap.p2; historialSets = snap.historialSets; numSetActual = snap.numSetActual; isSwapped = snap.isSwapped; firstServersBySet = snap.firstServersBySet;
                
                if (partidoData) { partidoData.estado = 'en_curso'; partidoData.ganador_id = null; }
                actualizarUI();
                await clienteSupabase.from('partidos').update({ puntos_j1: p1.score, puntos_j2: p2.score, sets_j1: p1.sets, sets_j2: p2.sets, historial_sets: historialSets, estado: 'en_curso', ganador_id: null }).eq('id', partidoId);
            } else {
                // No hay memoria (ej. se recargó la página o se abrió desde la tabla de Mesas)
                if (p1.score === 0 && p2.score === 0 && historialSets.length === 0) return; // Nada que deshacer

                if (!skipConfirm) {
                    let confirmacion = confirm("⚠️ No hay memoria reciente. ¿Deseas anular el último set y reabrir el marcador manual?");
                    if (!confirmacion) return;
                }

                if (p1.sets > 0 || p2.sets > 0 || (partidoData && partidoData.estado === 'finalizado')) {
                    
                    // Restamos el set al ganador
                    if (partidoData && partidoData.ganador_id === p1.id) p1.sets = Math.max(0, p1.sets - 1);
                    else if (partidoData && partidoData.ganador_id === p2.id) p2.sets = Math.max(0, p2.sets - 1);
                    else {
                        if (p1.sets > p2.sets) p1.sets = Math.max(0, p1.sets - 1); 
                        else p2.sets = Math.max(0, p2.sets - 1);
                    }
                    
                    // Recuperamos el marcador exacto de donde se quedaron antes de terminar el set
                    if (historialSets.length > 0) {
                        let lastSet = historialSets.pop();
                        numSetActual = Math.max(1, numSetActual - 1);
                        p1.score = lastSet.s1;
                        p2.score = lastSet.s2;
                        // Le restamos el punto de victoria
                        if (p1.score > p2.score) p1.score--; else p2.score--;
                    } else {
                        p1.score = 0; p2.score = 0;
                    }
                } else {
                    alert("Para corregir puntos a mitad de un set sin historial, por favor usa el botón de Editar o la base de datos.");
                    return;
                }

                if (partidoData) { partidoData.estado = 'en_curso'; partidoData.ganador_id = null; }
                actualizarUI();
                await clienteSupabase.from('partidos').update({ sets_j1: p1.sets, sets_j2: p2.sets, puntos_j1: p1.score, puntos_j2: p2.score, historial_sets: historialSets, estado: 'en_curso', ganador_id: null }).eq('id', partidoId);
            }
        }

        async function cerrarModalYCorregir() {
            document.getElementById('modal-ganador').classList.add('hidden');
            document.getElementById('modal-ganador').classList.remove('flex');
            await undo(true); // Mandamos 'true' para saltarnos la pregunta de confirmación
        }
        // ==========================================

        function manualSwapSides() { isSwapped = !isSwapped; actualizarUI(); }

        function mostrarOverlayGanador(nombre) {
            document.getElementById('winner-name-modal').innerText = nombre;
            let textoSets = "Victoria Asegurada";
            if (nombre === p1.nombre) textoSets = `Ganó ${p1.sets} a ${p2.sets} en Sets`;
            else if (nombre === p2.nombre) textoSets = `Ganó ${p2.sets} a ${p1.sets} en Sets`;
            document.getElementById('winner-sets-modal').innerText = textoSets;

            document.getElementById('modal-ganador').classList.remove('hidden');
            document.getElementById('modal-ganador').classList.add('flex');
        }

        function ocultarAvisoVictoria() {
            document.getElementById('modal-ganador').classList.add('hidden');
            document.getElementById('modal-ganador').classList.remove('flex');
        }

        function cerrarYRegresar() { window.location.href = 'mesas.html'; }

        function toggleAudio() { audioMuted = !audioMuted; document.getElementById('btn-audio').innerHTML = audioMuted ? '<i class="fa-solid fa-volume-xmark text-rose-400"></i>' : '<i class="fa-solid fa-volume-high text-cyan-400"></i>'; }
        function anunciarMarcador(n1, s1, n2, s2, fin) { if (audioMuted || !window.speechSynthesis) return; window.speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(fin ? `¡Juego finalizado!` : `${getApellido(n1)} ${s1}, ${getApellido(n2)} ${s2}`); u.lang = 'es-MX'; window.speechSynthesis.speak(u); }

        inicializarJuez();
    </script>
