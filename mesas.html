<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central de Mesas - Arbitraje Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Orbitron:wght@700;800&display=swap');

        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #04060a; color: #f8fafc; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .header h1 { margin: 0; font-size: 18px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 16px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; }
        .btn-filter-pill.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        
        .btn-cat-pill { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
        .btn-cat-pill.active { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }

        .grid-partidos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; max-width: 1100px; margin: auto; }
        .card-partido { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 4px solid #0e7490; border-radius: 18px; padding: 18px; transition: all 0.3s ease; }
        
        .card-finalizado { opacity: 0.85; border-bottom-color: #475569 !important; background: rgba(15, 23, 42, 0.8); }

        .badge-cat { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block; }

        .top-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge-mesa { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: #38bdf8; padding: 4px 10px; border-radius: 9999px; font-weight: 800; font-size: 10px; text-transform: uppercase; }
        .badge-estado { padding: 4px 10px; border-radius: 9999px; font-weight: 800; font-size: 9px; text-transform: uppercase; }
        .est-pendiente { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .est-curso { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .est-fin { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; }

        .duelo-box { background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .jugador-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; font-weight: 700; }
        .score-digital { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800; color: #06b6d4; }

        .btn-arbitrar { width: 100%; padding: 12px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24; border-radius: 9999px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
        .btn-arbitrar:hover { background: #f59e0b; color: #000000; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }

        .header-hora { grid-column: 1 / -1; font-size: 13px; color: #38bdf8; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 6px; margin-top: 20px; margin-bottom: 5px; letter-spacing: 1.5px; }

        .seccion-llaves-footer { grid-column: 1 / -1; margin-top: 30px; background: rgba(10, 15, 26, 0.85); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); }
    </style>
</head>
<body>

    <div class="header">
        <p style="color:#06b6d4; font-weight:800; font-size:10px; text-transform:uppercase; margin:0 0 4px 0;">Portal de Arbitraje Oficial</p>
        <h1 id="nombre-torneo">CENTRAL DE MESAS</h1>
    </div>

    <div style="font-size:9px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1px;">🏆 Filtrar por Categoría:</div>
    <div class="scrolling-bar" id="bar-categorias">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div style="font-size:9px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; letter-spacing:1px;">📌 Estado de Juego:</div>
    <div class="scrolling-bar">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Todos</button>
        <button class="btn-filter-pill" id="tab-pendientes" onclick="filtrarEstado('pendientes_vivo')">⏳ Pendientes / En Vivo</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Finalizados</button>
    </div>

    <div class="scrolling-bar" id="bar-mesas">
        <button class="btn-filter-pill active" onclick="filtrarMesa('todas')">Todas las Mesas</button>
    </div>

    <div class="grid-partidos" id="contenedor-partidos">
        <div style="text-align:center; color:#64748b; grid-column:1/-1;">Cargando partidos...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = localStorage.getItem('torneo_activo_id') || 1;
        let todosLosPartidos = [];
        let mesaFiltro = 'todas';
        let estadoFiltro = 'todos';
        let categoriaFiltro = 'todas';
        let pinJuecesActual = "1234";

        const obtenerEstiloCategoria = (catId) => {
            const paleta = [
                { bg: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.5)', text: '#fbbf24' },
                { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.5)', text: '#38bdf8' },
                { bg: 'rgba(217, 70, 239, 0.15)', border: 'rgba(217, 70, 239, 0.5)', text: '#f0abfc' },
                { bg: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.5)', text: '#34d399' }
            ];
            return paleta[(catId || 0) % paleta.length];
        };

        async function inicializar() {
            const { data: torneo } = await clienteSupabase.from('torneos').select('nombre, pin_jueces').eq('id', idTorneoActivo).single();
            if (torneo) {
                document.getElementById('nombre-torneo').innerText = torneo.nombre;
                if (torneo.pin_jueces) pinJuecesActual = torneo.pin_jueces;
            }

            cargarPartidos();

            clienteSupabase
                .channel('mesas-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => {
                    cargarPartidos();
                })
                .subscribe();
        }

        async function cargarPartidos() {
            const { data } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(id, nombre, club), j2:jugador2_id(id, nombre, club), categorias(id, nombre)')
                .eq('torneo_id', idTorneoActivo)
                .order('id', { ascending: true });

            todosLosPartidos = data || [];
            generarBotonesCategorias();
            generarBotonesMesas();
            dibujarPartidos();
        }

        function generarBotonesCategorias() {
            const bar = document.getElementById('bar-categorias');
            const catsMap = new Map();
            todosLosPartidos.forEach(p => {
                if (p.categorias && p.categorias.nombre) {
                    catsMap.set(p.categorias.nombre, p.categorias.id);
                }
            });

            let html = `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarCategoria('todas')">Todas las Categorías</button>`;
            catsMap.forEach((id, nombre) => {
                html += `<button class="btn-filter-pill btn-cat-pill ${categoriaFiltro === nombre ? 'active' : ''}" onclick="filtrarCategoria('${nombre}')">🏆 ${nombre}</button>`;
            });
            bar.innerHTML = html;
        }

        function filtrarCategoria(catNombre) {
            categoriaFiltro = catNombre;
            generarBotonesCategorias();
            dibujarPartidos();
        }

        function generarBotonesMesas() {
            const bar = document.getElementById('bar-mesas');
            let mesasUnicas = [...new Set(todosLosPartidos.map(p => p.mesa))].sort((a,b) => a-b);

            let html = `<button class="btn-filter-pill ${mesaFiltro === 'todas' ? 'active' : ''}" onclick="filtrarMesa('todas')">Todas las Mesas</button>`;
            mesasUnicas.forEach(m => {
                if(m) html += `<button class="btn-filter-pill ${mesaFiltro == m ? 'active' : ''}" onclick="filtrarMesa(${m})">Mesa ${m}</button>`;
            });
            bar.innerHTML = html;
        }

        function filtrarMesa(m) {
            mesaFiltro = m;
            generarBotonesMesas();
            dibujarPartidos();
        }

        function filtrarEstado(est) {
            estadoFiltro = est;
            document.getElementById('tab-todos').classList.remove('active');
            document.getElementById('tab-pendientes').classList.remove('active');
            document.getElementById('tab-finalizados').classList.remove('active');

            if (est === 'todos') document.getElementById('tab-todos').classList.add('active');
            else if (est === 'pendientes_vivo') document.getElementById('tab-pendientes').classList.add('active');
            else if (est === 'finalizado') document.getElementById('tab-finalizados').classList.add('active');

            dibujarPartidos();
        }

        function timeStringToMinutes(timeStr) {
            if (!timeStr) return 0;
            let match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)?/i);
            if (!match) return 0;
            let hrs = parseInt(match[1]);
            let mins = parseInt(match[2]);
            let ampm = match[3] ? match[3].toUpperCase() : null;
            if (ampm === 'PM' && hrs < 12) hrs += 12;
            if (ampm === 'AM' && hrs === 12) hrs = 0;
            return hrs * 60 + mins;
        }

        function calcularStandingsGrupos() {
            const porCategoria = {};

            todosLosPartidos.forEach(m => {
                if (!m.grupo_nombre) return; 
                const catNombre = m.categorias?.nombre || 'General';
                if (!porCategoria[catNombre]) porCategoria[catNombre] = {};
                
                const gpoNombre = m.grupo_nombre;
                if (!porCategoria[catNombre][gpoNombre]) porCategoria[catNombre][gpoNombre] = {};

                const grupoObj = porCategoria[catNombre][gpoNombre];

                [m.j1, m.j2].forEach(j => {
                    if (j && j.id && !grupoObj[j.id]) {
                        grupoObj[j.id] = { id: j.id, nombre: j.nombre, pj: 0, pg: 0, pp: 0, pts: 0, setsG: 0, setsP: 0 };
                    }
                });

                let estLimpio = (m.estado || '').trim().toLowerCase();
                if (estLimpio === 'finalizado' && m.j1 && m.j2) {
                    const j1 = grupoObj[m.j1.id];
                    const j2 = grupoObj[m.j2.id];

                    if (j1 && j2) {
                        j1.pj += 1; j2.pj += 1;
                        j1.setsG += (m.sets_j1 || 0); j1.setsP += (m.sets_j2 || 0);
                        j2.setsG += (m.sets_j2 || 0); j2.setsP += (m.sets_j1 || 0);

                        if (m.ganador_id === m.jugador1_id) {
                            j1.pg += 1; j1.pts += 2;
                            j2.pp += 1; j2.pts += 1;
                        } else if (m.ganador_id === m.jugador2_id) {
                            j2.pg += 1; j2.pts += 2;
                            j1.pp += 1; j1.pts += 1;
                        }
                    }
                }
            });

            return porCategoria;
        }

        function getPosNombre(grupoArr, posIndex, fallbackText) {
            if (!grupoArr || grupoArr.length <= posIndex) return fallbackText;
            const jugador = grupoArr[posIndex];
            if (jugador && (jugador.pts > 0 || jugador.pj > 0)) {
                return jugador.nombre;
            }
            return fallbackText;
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                return rSetB - rSetA;
            });
        }

        function dibujarPartidos() {
            const contenedor = document.getElementById('contenedor-partidos');
            contenedor.innerHTML = '';

            let filtrados = todosLosPartidos.filter(p => p.grupo_nombre);

            if (mesaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.mesa == mesaFiltro);
            }

            if (categoriaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltro);
            }

            if (estadoFiltro === 'pendientes_vivo') {
                filtrados = filtrados.filter(p => (p.estado || '').trim().toLowerCase() !== 'finalizado');
            } else if (estadoFiltro === 'finalizado') {
                filtrados = filtrados.filter(p => (p.estado || '').trim().toLowerCase() === 'finalizado');
            }

            const gruposPorHora = {};
            filtrados.forEach(p => {
                const h = p.hora || '09:00 AM';
                if(!gruposPorHora[h]) gruposPorHora[h] = [];
                gruposPorHora[h].push(p);
            });

            const horasOrdenadas = Object.keys(gruposPorHora).sort((a, b) => {
                return timeStringToMinutes(a) - timeStringToMinutes(b);
            });

            horasOrdenadas.forEach(hora => {
                contenedor.innerHTML += `<div class="header-hora">⏰ ${hora}</div>`;
                
                gruposPorHora[hora].forEach(p => {
                    let estLimpio = (p.estado || '').trim().toLowerCase();
                    let badgeEst = estLimpio === 'en_curso' ? '<span class="badge-estado est-curso">🔴 En Vivo</span>' : 
                                  (estLimpio === 'finalizado' ? '<span class="badge-estado est-fin">🏁 Finalizado</span>' : '<span class="badge-estado est-pendiente">⏳ Pendiente</span>');
                    
                    let isFin = estLimpio === 'finalizado';
                    let opacidadClass = isFin ? 'card-finalizado' : '';
                    let catId = p.categorias ? p.categorias.id : 0;
                    let estiloCat = obtenerEstiloCategoria(catId);

                    contenedor.innerHTML += `
                        <div class="card-partido ${opacidadClass}">
                            <div class="top-info">
                                <span class="badge-mesa">MESA ${p.mesa || '-'}</span>
                                ${badgeEst}
                            </div>

                            <div style="margin-bottom:12px;">
                                <span class="badge-cat" style="color:${estiloCat.text}; background:${estiloCat.bg}; border:1px solid ${estiloCat.border};">
                                    🏆 ${p.categorias ? p.categorias.nombre : 'Categoría'} • Gpo ${p.grupo_nombre}
                                </span>
                            </div>

                            <div class="duelo-box">
                                <div class="jugador-row">
                                    <span style="color:#ffffff;">${p.j1 ? p.j1.nombre : 'J1'}</span>
                                    <span class="score-digital">${p.puntos_j1 || 0} (${p.sets_j1 || 0})</span>
                                </div>
                                <div class="jugador-row" style="border-top:1px solid rgba(255,255,255,0.05); margin-top:4px; padding-top:6px;">
                                    <span style="color:#ffffff;">${p.j2 ? p.j2.nombre : 'J2'}</span>
                                    <span class="score-digital" style="color:#d946ef;">${p.puntos_j2 || 0} (${p.sets_j2 || 0})</span>
                                </div>
                            </div>

                            <div style="display:flex; gap:10px;">
                                <button class="btn-arbitrar" onclick="abrirScoreboardJuez(${p.id})">🏓 Arbitrar Partido</button>
                            </div>
                        </div>
                    `;
                });
            });

            dibujarLlavesInferiores(contenedor);
        }

        function dibujarLlavesInferiores(contenedor) {
            const standings = calcularStandingsGrupos();
            const categoriasSet = new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean));
            let catsList = [...categoriasSet];

            if (categoriaFiltro !== 'todas') {
                catsList = catsList.filter(c => c === categoriaFiltro);
            }

            if (catsList.length === 0) return;

            const partidosLlaveBD = todosLosPartidos.filter(p => !p.grupo_nombre || p.ronda_fase?.toLowerCase().includes('cruce') || p.ronda_fase?.toLowerCase().includes('semifinal') || p.ronda_fase?.toLowerCase().includes('final'));

            catsList.forEach(catNombre => {
                const gruposCat = standings[catNombre] || {};
                const gpoA_arr = gruposCat['A'] ? ordenarJugadoresITTF(Object.values(gruposCat['A'])) : [];
                const gpoB_arr = gruposCat['B'] ? ordenarJugadoresITTF(Object.values(gruposCat['B'])) : [];

                const primeroA = getPosNombre(gpoA_arr, 0, '1° Grupo A');
                const segundoA = getPosNombre(gpoA_arr, 1, '2° Grupo A');
                const primeroB = getPosNombre(gpoB_arr, 0, '1° Grupo B');
                const segundoB = getPosNombre(gpoB_arr, 1, '2° Grupo B');

                const partidosCatGpo = todosLosPartidos.filter(p => p.grupo_nombre && p.categorias?.nombre === catNombre);
                const totalGpo = partidosCatGpo.length;
                const finGpo = partidosCatGpo.filter(p => (p.estado || '').trim().toLowerCase() === 'finalizado').length;
                const gpoCompleto = totalGpo > 0 && totalGpo === finGpo;

                // CORRECCIÓN MATEMÁTICA Y LÓGICA PARA EVITAR REPETICIÓN
                const partidoSemi1 = partidosLlaveBD.find(p => p.categorias?.nombre === catNombre && p.ronda_fase?.toLowerCase().includes('semi') && (p.ronda_fase?.includes('1') || p.ronda_fase?.toLowerCase().includes('cruce 1')));
                const partidoSemi2 = partidosLlaveBD.find(p => p.categorias?.nombre === catNombre && p.ronda_fase?.toLowerCase().includes('semi') && (p.ronda_fase?.includes('2') || p.ronda_fase?.toLowerCase().includes('cruce 2')));
                const partidoFinal = partidosLlaveBD.find(p => p.categorias?.nombre === catNombre && p.ronda_fase?.toLowerCase().includes('final') && !p.ronda_fase?.toLowerCase().includes('semi'));

                let nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : primeroA;
                let nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : segundoB;

                let nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : primeroB;
                let nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : segundoA;

                let nomFinal_j1 = partidoFinal?.j1 ? partidoFinal.j1.nombre : (partidoSemi1?.ganador_id ? (partidoSemi1.ganador_id === partidoSemi1.jugador1_id ? nomSemi1_j1 : nomSemi1_j2) : 'Ganador Semi 1');
                let nomFinal_j2 = partidoFinal?.j2 ? partidoFinal.j2.nombre : (partidoSemi2?.ganador_id ? (partidoSemi2.ganador_id === partidoSemi2.jugador1_id ? nomSemi2_j1 : nomSemi2_j2) : 'Ganador Semi 2');

                contenedor.innerHTML += `
                    <div class="seccion-llaves-footer">
                        <div style="text-align:center; margin-bottom:15px;">
                            <span style="font-size:10px; color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:4px;">Fase Final de Eliminatoria Directa</span>
                            <h3 style="margin:0; border:none; padding:0; font-size:16px; color:#ffffff;">🏆 LLAVES ELIMINATORIAS - ${catNombre}</h3>
                        </div>

                        ${gpoCompleto ? `
                            <div style="background:rgba(16,185,129,0.2); border:1px solid rgba(16,185,129,0.5); color:#34d399; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:10px; text-transform:uppercase; margin-bottom:18px;">
                                ✅ ¡LLAVE DEFINITIVA CONFIRMADA! (Grupos 100% completados)
                            </div>
                        ` : `
                            <div style="background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.4); color:#fbbf24; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:10px; text-transform:uppercase; margin-bottom:18px;">
                                ⏳ PROYECCIÓN PRELIMINAR EN TIEMPO REAL (En espera de finalizar grupos)
                            </div>
                        `}

                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px;">
                            
                            <!-- CRUCE 1 -->
                            <div style="background:rgba(0,0,0,0.4); padding:16px; border-radius:14px; border:1px solid rgba(255,255,255,0.08);">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                    <span style="font-size:10px; color:#38bdf8; font-weight:800; text-transform:uppercase;">Semifinal 1</span>
                                    <span style="font-size:9px; color:#94a3b8; font-weight:700;">Mesa ${partidoSemi1?.mesa || 1}</span>
                                </div>

                                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                                    <strong style="font-size:12px; color:#fff;">🥇 ${nomSemi1_j1}</strong>
                                    <span style="font-size:9px; background:rgba(245,158,11,0.2); color:#fbbf24; padding:2px 6px; border-radius:4px; font-weight:800;">1° Gpo A</span>
                                </div>

                                <div style="text-align:center; font-size:10px; color:#64748b; font-weight:800; margin:4px 0;">VS</div>

                                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                                    <strong style="font-size:12px; color:#fff;">🥈 ${nomSemi1_j2}</strong>
                                    <span style="font-size:9px; background:rgba(6,182,212,0.2); color:#38bdf8; padding:2px 6px; border-radius:4px; font-weight:800;">2° Gpo B</span>
                                </div>

                                <button class="btn-arbitrar" onclick="abrirScoreboardJuez(${partidoSemi1 ? partidoSemi1.id : 0})">
                                    🏓 Arbitrar Semifinal 1
                                </button>
                            </div>

                            <!-- CRUCE 2 -->
                            <div style="background:rgba(0,0,0,0.4); padding:16px; border-radius:14px; border:1px solid rgba(255,255,255,0.08);">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                    <span style="font-size:10px; color:#f0abfc; font-weight:800; text-transform:uppercase;">Semifinal 2</span>
                                    <span style="font-size:9px; color:#94a3b8; font-weight:700;">Mesa ${partidoSemi2?.mesa || 2}</span>
                                </div>

                                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                                    <strong style="font-size:12px; color:#fff;">🥇 ${nomSemi2_j1}</strong>
                                    <span style="font-size:9px; background:rgba(245,158,11,0.2); color:#fbbf24; padding:2px 6px; border-radius:4px; font-weight:800;">1° Gpo B</span>
                                </div>

                                <div style="text-align:center; font-size:10px; color:#64748b; font-weight:800; margin:4px 0;">VS</div>

                                <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                                    <strong style="font-size:12px; color:#fff;">🥈 ${nomSemi2_j2}</strong>
                                    <span style="font-size:9px; background:rgba(6,182,212,0.2); color:#38bdf8; padding:2px 6px; border-radius:4px; font-weight:800;">2° Gpo A</span>
                                </div>

                                <button class="btn-arbitrar" onclick="abrirScoreboardJuez(${partidoSemi2 ? partidoSemi2.id : 0})">
                                    🏓 Arbitrar Semifinal 2
                                </button>
                            </div>

                            <!-- GRAN FINAL (NUEVO MÓDULO AGREGADO) -->
                            <div style="grid-column: 1 / -1; display:flex; justify-content:center; margin-top: 10px;">
                                <div style="background:rgba(245,158,11,0.1); padding:16px; border-radius:14px; border:1px solid rgba(245,158,11,0.3); width: 100%; max-width: 450px;">
                                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                        <span style="font-size:12px; color:#fbbf24; font-weight:900; text-transform:uppercase;">🏆 Gran Final</span>
                                        <span style="font-size:9px; color:#94a3b8; font-weight:700;">Mesa ${partidoFinal?.mesa || 1}</span>
                                    </div>

                                    <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                                        <strong style="font-size:14px; color:#fff;">🥇 ${nomFinal_j1}</strong>
                                        <span style="font-size:9px; background:rgba(6,182,212,0.2); color:#38bdf8; padding:2px 6px; border-radius:4px; font-weight:800;">Gana Semi 1</span>
                                    </div>

                                    <div style="text-align:center; font-size:10px; color:#64748b; font-weight:800; margin:4px 0;">VS</div>

                                    <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                                        <strong style="font-size:14px; color:#fff;">🥈 ${nomFinal_j2}</strong>
                                        <span style="font-size:9px; background:rgba(217,70,239,0.2); color:#d946ef; padding:2px 6px; border-radius:4px; font-weight:800;">Gana Semi 2</span>
                                    </div>

                                    <button class="btn-arbitrar" style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24;" onclick="abrirScoreboardJuez(${partidoFinal ? partidoFinal.id : 0})">
                                        🏆 Arbitrar Gran Final
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            });
        }

        async function abrirScoreboardJuez(partidoId) {
            if (!partidoId || partidoId === 0) {
                alert("⚠️ La fase final debe guardarse primero desde 'Sorteo y Rol' para activar el arbitraje oficial de esta llave.");
                return;
            }

            let pin = prompt("🔒 Ingrese el PIN de Autorización para Arbitrar:");
            if (pin === pinJuecesActual) {
                window.location.href = `juez.html?partido=${partidoId}`;
            } else if (pin !== null) {
                alert("❌ PIN de autorización incorrecto.");
            }
        }

        inicializar();
    </script>
</body>
</html>
