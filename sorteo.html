<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Inteligente - Central</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // GUARDIA DE SEGURIDAD GLOBAL: Revisa si inició sesión en torneos.html
        if (localStorage.getItem('admin_autenticado') !== 'true') {
            alert("🔒 Acceso Restringido: Inicia sesión en la Central de Torneos.");
            window.location.href = "torneos.html";
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #0e0f12; color: #ffffff; }
        
        .navbar { background: #181a20; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d37; flex-wrap: wrap; gap: 10px; }
        .nav-title { font-weight: 800; font-size: 18px; color: #f5a623; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { color: #a0a5b1; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #232630; border: 1px solid #323644; transition: 0.2s; }
        .nav-btn:hover { background: #f5a623; color: #000; border-color: #f5a623; }
        .nav-btn.active { background: #f5a623; color: #000000; border-color: #f5a623; }
        .nav-btn.public { background: #28a745; color: white; border-color: #28a745; }

        .main-content { padding: 25px; max-width: 1100px; margin: auto; }
        .container { background: #181a20; padding: 25px; border-radius: 12px; border: 1px solid #2a2d37; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #f5a623; border-bottom: 1px solid #2a2d37; padding-bottom: 12px; margin-top: 0; font-size: 20px; text-transform: uppercase; }
        
        .banner-torneo { background: #232630; border-left: 4px solid #f5a623; padding: 12px 15px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; color: #ffffff; font-weight: bold; }
        
        .controles { margin-bottom: 20px; padding: 15px; background: #0e0f12; border-radius: 8px; border: 1px solid #323644; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #323644; background: #181a20; color: #fff; font-size: 14px; }
        select:focus { border-color: #f5a623; outline: none; }
        
        .btn-sorteo { background: #f5a623; color: #000; border: none; cursor: pointer; font-weight: bold; }
        .btn-sorteo:hover { background: #d98c18; }
        .btn-guardar { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px 20px; font-size: 16px; margin-top: 25px; width: 100%; border-radius: 8px; display: none; }
        .btn-guardar:hover { background: #218838; }
        
        .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 20px; }
        .grupo-card { background: #232630; border: 1px solid #323644; border-radius: 10px; overflow: hidden; }
        .grupo-header { background: #0e0f12; color: #f5a623; font-weight: bold; font-size: 16px; padding: 12px; text-align: center; border-bottom: 1px solid #323644; text-transform: uppercase; letter-spacing: 1px; }
        .jugador-item { padding: 12px; border-bottom: 1px solid #2a2d37; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .jugador-item:last-child { border-bottom: none; }
        .jugador-info { flex: 1; }
        .jugador-item span { display: block; color: #a0a5b1; font-size: 12px; margin-top: 3px; }
        .tag-club { background: #0e0f12; color: #f5a623; border: 1px solid #323644; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; margin-top: 3px; }
        .select-mover { padding: 5px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #323644; background: #0e0f12; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">🏆 CENTRAL DE TORNEOS</div>
        <div class="nav-links">
            <a href="torneos.html" class="nav-btn">📂 Mis Torneos</a>
            <a href="admin.html" class="nav-btn">⚙️ Administrador</a>
            <a href="sorteo.html" class="nav-btn active">🧠 Sorteo</a>
            <a href="horarios.html" class="nav-btn">📅 Horarios WS</a>
            <a href="index.html" target="_blank" class="nav-btn public">🌐 Portal Público</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <h2>Cerebro del Torneo: Sorteo y Ajuste Manual 🧠🏆</h2>
            
            <div id="banner-torneo-info" class="banner-torneo">Cargando torneo activo...</div>
            
            <div class="controles">
                <select id="filtro-categoria" onchange="contarJugadores()">
                    <option value="">Cargando categorías...</option>
                </select>
                
                <select id="tamano-grupo">
                    <option value="3">Grupos de 3 jugadores</option>
                    <option value="4">Grupos de 4 jugadores</option>
                </select>

                <button class="btn-sorteo" onclick="prepararSorteo()">🎲 Generar Sorteo Serpiente</button>

                <div style="margin-left: auto; font-size: 14px; color:#a0a5b1;">
                    Jugadores confirmados: <strong id="contador-jugadores" style="color:#f5a623; font-size: 18px;">0</strong>
                </div>
            </div>

            <div id="contenedor-grupos" class="grupos-grid"></div>

            <button id="btn-guardar-grupos" class="btn-guardar" onclick="guardarGruposBD()">💾 Guardar Grupos Definitivos en Base de Datos</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = localStorage.getItem('torneo_activo_id') || 1;
        let jugadoresListos = [];
        let gruposGlobal = [];

        async function inicializarSorteo() {
            const { data: torneoData } = await clienteSupabase.from('torneos').select('*').eq('id', idTorneoActivo).single();
            if (torneoData) {
                document.getElementById('banner-torneo-info').innerText = `📌 Torneo Seleccionado: ${torneoData.nombre} (${torneoData.fecha_evento || 'Sin fecha'})`;
            } else {
                document.getElementById('banner-torneo-info').innerText = `⚠️ No hay ningún torneo seleccionado. Ve a 'Mis Torneos' para elegir uno.`;
            }

            const { data } = await clienteSupabase.from('categorias').select('*').order('puntos_minimos', { ascending: true });
            const select = document.getElementById('filtro-categoria');
            select.innerHTML = '<option value="">-- Elige la categoría a sortear --</option>';
            if (data) data.forEach(cat => select.innerHTML += `<option value="${cat.id}">${cat.nombre}</option>`);
        }

        async function contarJugadores() {
            const idCat = document.getElementById('filtro-categoria').value;
            const contador = document.getElementById('contador-jugadores');
            document.getElementById('contenedor-grupos').innerHTML = '';
            document.getElementById('btn-guardar-grupos').style.display = 'none';

            if (!idCat) { contador.innerText = '0'; return; }
            
            contador.innerText = '...';
            
            const { count, error } = await clienteSupabase.from('inscripciones')
                .select('*', { count: 'exact', head: true })
                .eq('categoria_id', idCat)
                .eq('torneo_id', idTorneoActivo)
                .eq('estatus_pago', 'Pagado');
            
            contador.innerText = error ? '0' : count;
        }

        async function prepararSorteo() {
            const idCategoria = document.getElementById('filtro-categoria').value;
            const tamanoGrupo = parseInt(document.getElementById('tamano-grupo').value);
            const contenedor = document.getElementById('contenedor-grupos');

            if (!idCategoria) { alert("Selecciona una categoría."); return; }

            contenedor.innerHTML = '<p style="text-align:center; width: 100%; color:#a0a5b1;">Generando grupos...</p>';

            const { data } = await clienteSupabase.from('inscripciones')
                .select(`jugadores ( id, nombre, puntos_ranking, club )`)
                .eq('categoria_id', idCategoria)
                .eq('torneo_id', idTorneoActivo)
                .eq('estatus_pago', 'Pagado');

            if (!data || data.length === 0) {
                contenedor.innerHTML = ''; 
                alert("No hay jugadores confirmados (Pagados) en esta categoría para este torneo."); 
                return;
            }

            jugadoresListos = data.map(ins => ins.jugadores).sort((a, b) => b.puntos_ranking - a.puntos_ranking);
            ejecutarSerpiente(tamanoGrupo);
        }

        function ejecutarSerpiente(tamanoGrupo) {
            const numGrupos = Math.ceil(jugadoresListos.length / tamanoGrupo);
            gruposGlobal = Array.from({ length: numGrupos }, (_, i) => ({ 
                nombre: String.fromCharCode(65 + i), 
                jugadores: [] 
            }));

            let direccion = 1, indiceGrupo = 0;

            for (let i = 0; i < jugadoresListos.length; i++) {
                let jugador = jugadoresListos[i];
                jugador.seedOriginal = i + 1;
                gruposGlobal[indiceGrupo].jugadores.push(jugador);
                
                indiceGrupo += direccion;
                if (indiceGrupo === numGrupos) { direccion = -1; indiceGrupo = numGrupos - 1; } 
                else if (indiceGrupo === -1) { direccion = 1; indiceGrupo = 0; }
            }

            dibujarGrupos();
        }

        function dibujarGrupos() {
            const contenedor = document.getElementById('contenedor-grupos');
            contenedor.innerHTML = '';

            gruposGlobal.forEach((grupo, idxGrupo) => {
                let html = `<div class="grupo-card"><div class="grupo-header">Grupo ${grupo.nombre}</div>`;
                
                grupo.jugadores.forEach((j) => {
                    html += `
                        <div class="jugador-item">
                            <div class="jugador-info">
                                <strong style="color:#ffffff;">${j.nombre}</strong>
                                <div><span class="tag-club">🏠 ${j.club || 'Sin Club'}</span></div>
                                <span>${j.puntos_ranking} pts (Seed #${j.seedOriginal})</span>
                            </div>
                            <select class="select-mover" onchange="moverJugador(${j.id}, ${idxGrupo}, this.value)">
                                ${gruposGlobal.map((g, index) => `<option value="${index}" ${index === idxGrupo ? 'selected' : ''}>Grupo ${g.nombre}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });
                
                contenedor.innerHTML += html + `</div>`;
            });

            document.getElementById('btn-guardar-grupos').style.display = 'block';
        }

        function moverJugador(jugadorId, grupoOrigenIdx, grupoDestinoIdx) {
            grupoDestinoIdx = parseInt(grupoDestinoIdx);
            if (grupoOrigenIdx === grupoDestinoIdx) return;

            const idxEnGrupo = gruposGlobal[grupoOrigenIdx].jugadores.findIndex(j => j.id === jugadorId);
            const [jugador] = gruposGlobal[grupoOrigenIdx].jugadores.splice(idxEnGrupo, 1);
            gruposGlobal[grupoDestinoIdx].jugadores.push(jugador);
            dibujarGrupos();
        }

        async function guardarGruposBD() {
            const idCategoria = document.getElementById('filtro-categoria').value;
            const btn = document.getElementById('btn-guardar-grupos');

            if (!idCategoria || !confirm("¿Deseas guardar estos grupos como definitivos para este torneo?")) return;

            btn.disabled = true;
            btn.innerText = "Guardando en base de datos...";

            await clienteSupabase.from('grupos_torneo')
                .delete()
                .eq('categoria_id', idCategoria)
                .eq('torneo_id', idTorneoActivo);

            let registros = [];
            gruposGlobal.forEach(grupo => {
                grupo.jugadores.forEach(j => {
                    registros.push({
                        torneo_id: parseInt(idTorneoActivo),
                        categoria_id: parseInt(idCategoria),
                        nombre_grupo: grupo.nombre,
                        jugador_id: j.id,
                        seed_original: j.seedOriginal
                    });
                });
            });

            const { error } = await clienteSupabase.from('grupos_torneo').insert(registros);

            if (error) {
                alert("Error al guardar los grupos.");
                btn.disabled = false;
                btn.innerText = "💾 Guardar Grupos Definitivos en Base de Datos";
                return;
            }

            alert("✅ ¡Grupos guardados con éxito para el torneo activo!");
            btn.disabled = false;
            btn.innerText = "💾 Guardar Grupos Definitivos en Base de Datos";
        }

        inicializarSorteo();
    </script>
</body>
</html>
