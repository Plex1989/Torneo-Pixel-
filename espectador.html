<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Transmisión en Vivo - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sora', sans-serif; margin: 0; padding: 15px; background-color: #04060a; color: #f8fafc; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        .header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin: 0; }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }

        .btn-filter-pill { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 16px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; transition: all 0.2s ease; }
        .btn-filter-pill.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        .btn-filter-pill.active-flash { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        .btn-filter-pill.active-resumen { background: #a855f7; color: #ffffff; border-color: #c084fc; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
        
        .btn-cat-pill { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
        .btn-cat-pill.active { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; max-width: 1200px; margin: auto; }

        .card-mesa { background: rgba(10, 15, 26, 0.7); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 4px solid #0e7490; padding: 18px; position: relative; transition: all 0.3s ease; cursor: pointer; }
        .card-mesa:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
        .card-mesa.vivo { border-bottom-color: #34d399 !important; box-shadow: 0 0 25px rgba(52, 211, 153, 0.15); }
        .card-mesa.finalizado { border-bottom-color: #64748b !important; opacity: 0.85; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .mesa-title { font-size: 12px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .cat-badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        .badge-estado { padding: 3px 8px; border-radius: 9999px; font-weight: 800; font-size: 9px; text-transform: uppercase; }
        .est-pendiente { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; }
        .est-curso { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .est-fin { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; }

        .score-container { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.03); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .jugador-nombre { font-size: 13px; font-weight: 800; color: #ffffff; cursor: pointer; transition: color 0.2s; }
        .jugador-nombre:hover { color: #38bdf8; }
        .score-big { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: #06b6d4; }
        .score-big.p2 { color: #d946ef; }

        .sets-badge { font-size: 10px; font-weight: 800; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 6px; margin-left: 6px; }

        .proyeccion-bar { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 8px 12px; margin-top: 10px; text-align: center; font-size: 10px; font-weight: 800; color: #fbbf24; }

        .sets-history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.08); }
        .set-chip { font-size: 9px; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 6px; font-weight: 800; border: 1px solid rgba(255,255,255,0.05); }

        .header-hora { grid-column: 1 / -1; font-size: 12px; color: #38bdf8; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid rgba(56, 189, 248, 0.3); padding-bottom: 6px; margin-top: 15px; margin-bottom: 5px; letter-spacing: 1.5px; }

        .seccion-llaves-footer { grid-column: 1 / -1; margin-top: 20px; background: rgba(10, 15, 26, 0.85); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 20px; padding: 20px; backdrop-filter: blur(15px); }

        .mensaje-vacio { text-align: center; color: #475569; font-style: italic; grid-column: 1/-1; padding: 40px; }

        .card-score-fs { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-radius: 24px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; width: 100%; max-width: 520px; padding: 24px; color: white; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body>

    <!-- MODAL PANTALLA COMPLETA PARTIDO ESPECTADOR -->
    <div id="modal-fullscreen-partido" class="fixed inset-0 z-[100] bg-[#04060a] p-4 flex-col justify-between overflow-y-auto no-print" style="display: none;">
        <div class="flex justify-between items-center bg-slate-900/80 p-3 rounded-2xl border border-white/10 shrink-0">
            <button onclick="cerrarPartidoFullScreen()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full text-xs font-black uppercase tracking-widest text-white transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver a Cartelera
            </button>
            <div class="text-center">
                <span id="fs-mesa-fase" class="text-xs font-black text-cyan-400 uppercase tracking-widest block">MESA -- • FASE</span>
                <span id="fs-cat-nombre" class="text-[9px] text-amber-400 font-extrabold uppercase">CATEGORÍA</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="compartirPartidoWhatsAppActual()" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all hover:bg-emerald-500 hover:text-black">
                    <i class="fa-brands fa-whatsapp text-sm mr-1"></i> <span class="hidden md:inline">Compartir</span>
                </button>
                <button id="fs-btn-audio" onclick="toggleAudioEspectador()" class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 w-9 h-9 rounded-full flex items-center justify-center text-xs">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col md:flex-row gap-4 my-4 min-h-0">
            <div class="flex-1 flex flex-col min-h-0">
                <div class="bg-cyan-600/30 border border-cyan-500/40 p-4 rounded-2xl mb-2 text-center">
                    <h2 id="fs-name-j1" class="text-xl md:text-3xl font-black uppercase tracking-wider text-white truncate cursor-pointer hover:text-cyan-300 transition-colors">JUGADOR 1</h2>
                    <span id="fs-club-j1" class="text-xs text-zinc-400 font-bold block">CLUB</span>
                    <div id="fs-ranking-j1" class="text-xs font-extrabold text-cyan-300 mt-1">-- pts</div>
                </div>
                <div class="flex-1 card-score-fs border-t-4 border-cyan-500 flex flex-col items-center justify-center p-4 relative">
                    <div id="fs-winner-icon1" class="hidden absolute top-4 right-4 text-4xl text-amber-400 animate-pulse">🏆</div>
                    <div id="fs-score-j1" class="font-digital text-[20vh] md:text-[32vh] font-black leading-none text-cyan-400 select-none">0</div>
                    <div class="text-sm font-extrabold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="fs-sets-j1" class="text-white font-digital text-2xl font-black ml-2">0</span></div>
                </div>
            </div>

            <div class="flex md:flex-col justify-center items-center shrink-0">
                <span class="font-digital font-black text-2xl text-zinc-600">VS</span>
            </div>

            <div class="flex-1 flex flex-col min-h-0">
                <div class="bg-fuchsia-600/30 border border-fuchsia-500/40 p-4 rounded-2xl mb-2 text-center">
                    <h2 id="fs-name-j2" class="text-xl md:text-3xl font-black uppercase tracking-wider text-white truncate cursor-pointer hover:text-fuchsia-300 transition-colors">JUGADOR 2</h2>
                    <span id="fs-club-j2" class="text-xs text-zinc-400 font-bold block">CLUB</span>
                    <div id="fs-ranking-j2" class="text-xs font-extrabold text-fuchsia-300 mt-1">-- pts</div>
                </div>
                <div class="flex-1 card-score-fs border-t-4 border-fuchsia-500 flex flex-col items-center justify-center p-4 relative">
                    <div id="fs-winner-icon2" class="hidden absolute top-4 right-4 text-4xl text-amber-400 animate-pulse">🏆</div>
                    <div id="fs-score-j2" class="font-digital text-[20vh] md:text-[32vh] font-black leading-none text-fuchsia-400 select-none">0</div>
                    <div class="text-sm font-extrabold text-zinc-400 uppercase tracking-widest mt-2">Sets Ganados: <span id="fs-sets-j2" class="text-white font-digital text-2xl font-black ml-2">0</span></div>
                </div>
            </div>
        </div>

        <div class="shrink-0 flex flex-col gap-2">
            <div id="fs-proyeccion-box" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-400 p-3 rounded-2xl text-center text-xs font-bold"></div>
            <div class="bg-slate-900/80 p-3 rounded-2xl border border-white/10 flex justify-center items-center gap-3 flex-wrap">
                <span class="text-xs font-bold text-zinc-400 uppercase tracking-widest">Historial de Sets:</span>
                <div id="fs-list-sets" class="flex gap-2 flex-wrap"></div>
            </div>
        </div>
    </div>

    <!-- HEADER GENERAL -->
    <div class="header no-print">
        <p style="color:#a855f7; font-weight:800; font-size:10px; text-transform:uppercase; margin:0 0 4px 0;">Transmisión en Tiempo Real para Fans</p>
        <h1 id="torneo-nombre-header">CARTELERA DE MARCADORES</h1>
    </div>

    <div class="scrolling-bar no-print" id="bar-categorias" style="margin-bottom:6px;">
        <button class="btn-filter-pill btn-cat-pill active" onclick="filtrarCategoria('todas')">Todas las Categorías</button>
    </div>

    <div class="scrolling-bar no-print">
        <button class="btn-filter-pill active" id="tab-todos" onclick="filtrarEstado('todos')">📋 Todos</button>
        <button class="btn-filter-pill" id="tab-resumen" onclick="filtrarEstado('resumen')">📊 Posiciones y Estadísticas</button>
        <button class="btn-filter-pill" id="tab-ranking" onclick="filtrarEstado('ranking')" style="border-color:#a855f7; color:#c084fc;">🏆 Ranking Global</button>
        <button class="btn-filter-pill" id="tab-flash" onclick="filtrarEstado('flash')" style="color: #fbbf24; border-color: rgba(245,158,11,0.5);">⚡ Liga Flash</button>
        <button class="btn-filter-pill" id="tab-vivo" onclick="filtrarEstado('en_curso')">🔴 En Vivo</button>
        <button class="btn-filter-pill" id="tab-pendientes" onclick="filtrarEstado('pendiente')">⏳ Pendientes</button>
        <button class="btn-filter-pill" id="tab-finalizados" onclick="filtrarEstado('finalizado')">🏁 Finalizados</button>
    </div>

    <div class="scrolling-bar no-print" id="bar-mesas">
        <button class="btn-filter-pill active" onclick="filtrarMesa('todas')">Todas las Mesas</button>
    </div>

    <div class="grid-espectador" id="contenedor-espectador">
        <div class="mensaje-vacio">Cargando marcadores en vivo...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        let idTorneoActivo = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id');
        let partidoUrlId = urlParams.get('partido');

        let ORG_ID = null; 
        let todosLosPartidos = [];
        let reglasRankingList = [];
        let todasLasCategorias = [];
        let todosLosJugadores = [];
        let bonoPaseActivo = false;
        let bonoPaseValor = 0;

        let mesaFiltro = 'todas';
        let estadoFiltro = 'todos';
        let categoriaFiltro = 'todas';

        let activePartidoFullScreenId = null;
        let audioMuted = false;
        let lastAnnouncedScore = "";

        const coloresMesasFlash = [
            { border: '#10b981', bg: 'rgba(16, 185, 129, 0.15)', text: '#10b981' }, 
            { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.15)', text: '#3b82f6' }, 
            { border: '#d946ef', bg: 'rgba(217, 70, 239, 0.15)', text: '#d946ef' }, 
            { border: '#eab308', bg: 'rgba(234, 179, 8, 0.15)', text: '#eab308' },  
            { border: '#a855f7', bg: 'rgba(168, 85, 247, 0.15)', text: '#a855f7' }, 
            { border: '#f97316', bg: 'rgba(249, 115, 22, 0.15)', text: '#f97316' }, 
            { border: '#06b6d4', bg: 'rgba(6, 182, 212, 0.15)', text: '#06b6d4' }   
        ];

        const obtenerEstiloCategoria = (catId) => {
            const paleta = [
                { bg: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.5)', text: '#fbbf24' },
                { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.5)', text: '#38bdf8' },
                { bg: 'rgba(217, 70, 239, 0.15)', border: 'rgba(217, 70, 239, 0.5)', text: '#f0abfc' },
                { bg: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.5)', text: '#34d399' }
            ];
            return paleta[(catId || 0) % paleta.length];
        };

        const obtenerColorGrupo = (texto) => {
            if (!texto) return { color: '#94a3b8', bg: 'rgba(148,163,184,0.15)', border: 'rgba(148,163,184,0.4)' };
            let str = String(texto).toUpperCase();
            let letra = '';
            
            if (str.includes('GPO A') || str.includes('GRUPO A') || str.includes('(A)')) letra = 'A';
            else if (str.includes('GPO B') || str.includes('GRUPO B') || str.includes('(B)')) letra = 'B';
            else if (str.includes('GPO C') || str.includes('GRUPO C') || str.includes('(C)')) letra = 'C';
            else if (str.includes('GPO D') || str.includes('GRUPO D') || str.includes('(D)')) letra = 'D';
            else if (str.includes('GPO E') || str.includes('GRUPO E') || str.includes('(E)')) letra = 'E';
            else if (str.includes('GPO F') || str.includes('GRUPO F') || str.includes('(F)')) letra = 'F';

            switch(letra) {
                case 'A': return { color: '#06b6d4', bg: 'rgba(6,182,212,0.15)', border: 'rgba(6,182,212,0.4)' }; 
                case 'B': return { color: '#a855f7', bg: 'rgba(168,85,247,0.15)', border: 'rgba(168,85,247,0.4)' }; 
                case 'C': return { color: '#10b981', bg: 'rgba(16,185,129,0.15)', border: 'rgba(16,185,129,0.4)' }; 
                case 'D': return { color: '#f59e0b', bg: 'rgba(245,158,11,0.15)', border: 'rgba(245,158,11,0.4)' }; 
                case 'E': return { color: '#f43f5e', bg: 'rgba(244,63,94,0.15)', border: 'rgba(244,63,94,0.4)' }; 
                case 'F': return { color: '#3b82f6', bg: 'rgba(59,130,246,0.15)', border: 'rgba(59,130,246,0.4)' }; 
                default:  return { color: '#cbd5e1', bg: 'rgba(255,255,255,0.05)', border: 'rgba(255,255,255,0.1)' }; 
            }
        };

        const getApellido = (nom) => {
            if (!nom) return "";
            const partes = String(nom).trim().split(" ");
            return partes[partes.length - 1];
        };

        async function inicializarEspectador() {
            try {
                if (!idTorneoActivo && partidoUrlId) {
                    const { data: pData } = await clienteSupabase.from('partidos').select('torneo_id').eq('id', partidoUrlId).maybeSingle();
                    if (pData && pData.torneo_id) { idTorneoActivo = pData.torneo_id; }
                }
                
                if (!idTorneoActivo) idTorneoActivo = 1;

                const { data: torneoData, error: errTorneo } = await clienteSupabase
                    .from('torneos').select('id, nombre, organizador_id').eq('id', idTorneoActivo).maybeSingle();
                
                if (errTorneo) throw new Error("No se pudo cargar el torneo: " + errTorneo.message);

                if (torneoData) {
                    document.getElementById('torneo-nombre-header').innerText = torneoData.nombre;
                    ORG_ID = torneoData.organizador_id;
                } else {
                    throw new Error("El torneo no existe o el enlace está incompleto.");
                }

                const [resReglas, resConfig, resCat, resJugadores] = await Promise.allSettled([
                    clienteSupabase.from('reglas_ranking').select('id, diferencia_min, diferencia_max, puntos_ganador, puntos_perdedor, resultado_esperado').eq('organizador_id', ORG_ID).order('diferencia_min', { ascending: true }),
                    clienteSupabase.from('configuracion').select('id, clave, valor, activo').eq('clave', 'bono_pase_grupos').eq('organizador_id', ORG_ID).maybeSingle(),
                    clienteSupabase.from('categorias').select('id, nombre, puntos_minimos, puntos_maximos, costo_inscripcion').eq('organizador_id', ORG_ID).order('puntos_minimos', { ascending: false }),
                    clienteSupabase.from('jugadores').select('id, nombre, club, puntos_ranking, puntos_ranking_ant, division, handicap').eq('organizador_id', ORG_ID).order('puntos_ranking', { ascending: false })
                ]);

                reglasRankingList = resReglas.status === 'fulfilled' ? (resReglas.value.data || []) : [];
                todasLasCategorias = resCat.status === 'fulfilled' ? (resCat.value.data || []) : [];
                todosLosJugadores = resJugadores.status === 'fulfilled' ? (resJugadores.value.data || []) : [];

                if (resConfig.status === 'fulfilled' && resConfig.value.data) {
                    bonoPaseActivo = resConfig.value.data.activo;
                    bonoPaseValor = resConfig.value.data.valor;
                }

                await cargarMarcadores();

                if (partidoUrlId) {
                    abrirPartidoFullScreen(partidoUrlId);
                }

                clienteSupabase
                    .channel('espectador-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => {
                        cargarMarcadores();
                    })
                    .subscribe();
            } catch (err) {
                console.error("Error inicializando espectador:", err);
                const cont = document.getElementById('contenedor-espectador');
                if(cont) cont.innerHTML = `<div class="mensaje-vacio text-rose-500">Error conectando con el torneo: ${err.message}</div>`;
            }
        }

        async function cargarMarcadores() {
            const { data: partidos, error } = await clienteSupabase
                .from('partidos')
                .select('id, torneo_id, categoria_id, organizador_id, grupo_nombre, ronda_fase, mesa, hora, modo_juego, jugador1_id, jugador2_id, ganador_id, puntos_j1, puntos_j2, sets_j1, sets_j2, historial_sets, estado, juez, mostrar_ranking, j1:jugador1_id(id, nombre, club, puntos_ranking, division, handicap), j2:jugador2_id(id, nombre, club, puntos_ranking, division, handicap), categorias(id, nombre)')
                .eq('torneo_id', idTorneoActivo)
                .eq('organizador_id', ORG_ID)
                .order('id', { ascending: true });

            if (error) { console.error("Error al cargar marcadores:", error); return; }

            todosLosPartidos = partidos || [];
            
            todosLosPartidos.forEach(p => {
                if (p.historial_sets && typeof p.historial_sets === 'string') {
                    try { p.historial_sets = JSON.parse(p.historial_sets); } catch(e) { p.historial_sets = []; }
                }
            });

            generarBotonesCategorias();
            generarBotonesMesas();
            dibujarPantalla();

            if (activePartidoFullScreenId) {
                actualizarModalFullScreen();
            }
        }

        function generarBotonesCategorias() {
            const bar = document.getElementById('bar-categorias');
            if(!bar) return;
            const catsMap = new Map();
            todosLosPartidos.forEach(p => {
                if (p.categorias && p.categorias.nombre) {

        function timeStringToMinutes(timeStr) {
            if (!timeStr) return 0;
            let cleanStr = String(timeStr).trim().toLowerCase().replace(/\s+/g, '');
            let match = cleanStr.match(/^(\d+):(\d+)(am|pm|a\.m\.|p\.m\.)?/);
            if (!match) return 0;
            let hrs = parseInt(match[1]);
            let mins = parseInt(match[2]);
            let ampm = match[3] ? match[3].replace(/\./g, '') : null;
            if (ampm === 'pm' && hrs < 12) hrs += 12;
            if (ampm === 'am' && hrs === 12) hrs = 0;
            return hrs * 60 + mins;
        }

        function calcularRankingEnVivo(jugadorId, basePts, finMatches, partidoActualId) {
            if (!jugadorId || !basePts) return 0;
            let delta = 0;

            finMatches.forEach(m => {
                if (m.id == partidoActualId) return;
                let p1Base = m.j1 ? m.j1.puntos_ranking : 0;
                let p2Base = m.j2 ? m.j2.puntos_ranking : 0;
                
                let impacto = calcularImpacto(p1Base, p2Base);

                if (m.jugador1_id === jugadorId) {
                    delta += (m.ganador_id === jugadorId) ? impacto.j1G : impacto.j1P;
                } else if (m.jugador2_id === jugadorId) {
                    delta += (m.ganador_id === jugadorId) ? impacto.j2G : impacto.j2P;
                }
            });

            return basePts + delta;
        }

        function calcularImpacto(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);
            let favoritoEsJ1 = ptsA >= ptsB;

            let reglasRango = reglasRankingList.filter(r => diff >= Number(r.diferencia_min) && diff <= Number(r.diferencia_max));
            
            let reglaGanaFav = null;
            let reglaGanaRet = null;

            if (reglasRango.length >= 2) {
                if (Number(reglasRango[0].puntos_ganador) < Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[0];
                    reglaGanaRet = reglasRango[1];
                } else if (Number(reglasRango[0].puntos_ganador) > Number(reglasRango[1].puntos_ganador)) {
                    reglaGanaFav = reglasRango[1];
                    reglaGanaRet = reglasRango[0];
                } else {
                    let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                    if (str.includes('retador') || str.includes('upset')) { reglaGanaRet = reglasRango[0]; reglaGanaFav = reglasRango[1]; }
                    else { reglaGanaFav = reglasRango[0]; reglaGanaRet = reglasRango[1]; }
                }
            } else if (reglasRango.length === 1) {
                let str = String(reglasRango[0].resultado_esperado).toLowerCase();
                if (str.includes('retador') || str.includes('upset')) reglaGanaRet = reglasRango[0];
                else reglaGanaFav = reglasRango[0];
            }

            let ptsGanaFav = reglaGanaFav ? Number(reglaGanaFav.puntos_ganador) : 10;
            let ptsPierdeFav = reglaGanaRet ? -Math.abs(Number(reglaGanaRet.puntos_perdedor)) : -5;
            
            let ptsGanaRet = reglaGanaRet ? Number(reglaGanaRet.puntos_ganador) : 10;
            let ptsPierdeRet = reglaGanaFav ? -Math.abs(Number(reglaGanaFav.puntos_perdedor)) : -5;

            return { 
                j1G: favoritoEsJ1 ? ptsGanaFav : ptsGanaRet, 
                j1P: favoritoEsJ1 ? ptsPierdeFav : ptsPierdeRet, 
                j2G: favoritoEsJ1 ? ptsGanaRet : ptsGanaFav, 
                j2P: favoritoEsJ1 ? ptsPierdeRet : ptsPierdeFav 
            };
        }

        function calcularDetallesRankingPartido(p, finMatches) {
            let ptsPrevJ1 = p.j1 ? calcularRankingEnVivo(p.j1.id, p.j1.puntos_ranking || 0, finMatches, p.id) : 0;
            let ptsPrevJ2 = p.j2 ? calcularRankingEnVivo(p.j2.id, p.j2.puntos_ranking || 0, finMatches, p.id) : 0;
            let impacto = calcularImpacto(ptsPrevJ1, ptsPrevJ2);

            let isFin = String(p.estado || '').toLowerCase() === 'finalizado';
            let ptsFinalJ1 = ptsPrevJ1;
            let ptsFinalJ2 = ptsPrevJ2;
            let deltaJ1 = 0;
            let deltaJ2 = 0;

            if (isFin && p.j1 && p.j2) {
                if (p.ganador_id === p.jugador1_id) {
                    deltaJ1 = impacto.j1G;
                    deltaJ2 = impacto.j2P;
                } else if (p.ganador_id === p.jugador2_id) {
                    deltaJ1 = impacto.j1P;
                    deltaJ2 = impacto.j2G;
                }
                ptsFinalJ1 += deltaJ1;
                ptsFinalJ2 += deltaJ2;
            }

            return { ptsPrevJ1, ptsPrevJ2, ptsFinalJ1, ptsFinalJ2, deltaJ1, deltaJ2, impacto, isFin };
        }

        function calcularStandingsGrupos() {
            const porCategoria = {};

            todosLosPartidos.forEach(m => {
                if (!m.grupo_nombre || m.grupo_nombre === 'Flash') return; 
                
                const catNombre = m.categorias?.nombre || 'General';
                if (!porCategoria[catNombre]) porCategoria[catNombre] = {};
                
                const gpoNombre = m.grupo_nombre;
                if (!porCategoria[catNombre][gpoNombre]) porCategoria[catNombre][gpoNombre] = {};

                const grupoObj = porCategoria[catNombre][gpoNombre];

                [m.j1, m.j2].forEach(j => {
                    if (j && j.id && !grupoObj[j.id]) {
                        grupoObj[j.id] = { 
                            id: j.id, nombre: j.nombre, club: j.club, div: j.division || 1, 
                            pj: 0, pg: 0, pp: 0, pts: 0, setsG: 0, setsP: 0, 
                            rankImpact: 0, rivalesStr: [] 
                        };
                    }
                });

                let estLimpio = String(m.estado || '').trim().toLowerCase();
                if (estLimpio === 'finalizado' && m.j1 && m.j2) {
                    const j1 = grupoObj[m.j1.id];
                    const j2 = grupoObj[m.j2.id];

                    if (j1 && j2) {
                        j1.pj += 1; j2.pj += 1;
                        j1.setsG += (m.sets_j1 || 0); j1.setsP += (m.sets_j2 || 0);
                        j2.setsG += (m.sets_j2 || 0); j2.setsP += (m.sets_j1 || 0);

                        if (m.ganador_id === m.jugador1_id) {
                            j1.pg += 1; j1.pts += 2;
                            j2.pp += 1; j2.pts += 1;
                        } else if (m.ganador_id === m.jugador2_id) {
                            j2.pg += 1; j2.pts += 2;
                            j1.pp += 1; j1.pts += 1;
                        }
                    }
                }
            });

            return porCategoria;
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                if (Math.abs(rSetB - rSetA) > 0.0001) return rSetB - rSetA;
                return b.pg - a.pg; 
            });
        }

                            <small style="color:#64748b; display:block; font-size:9px;">${j.club || 'Sin Club'}</small>
                        </td>
                        <td style="padding:8px 6px; text-align:center; color:#94a3b8; font-weight:700;">${j.pj}</td>

        function generarTarjetaLlaveEspectador(partido, titulo, colorTitulo, mesaDefault, nomJ1, nomJ2, descJ1, descJ2, colorDesc2) {
            let isFin = partido && String(partido.estado || '').trim().toLowerCase() === 'finalizado';
            let isVivo = partido && String(partido.estado || '').trim().toLowerCase() === 'en_curso';
            
            let opacidad = isFin ? 'opacity: 0.85;' : '';
            
            let badgeEst = isFin ? '<span class="badge-estado est-fin">🏁 Finalizado</span>' : 
                          (isVivo ? '<span class="badge-estado est-curso">🔴 En Vivo</span>' : '<span class="badge-estado est-pendiente">⏳ Pendiente</span>');

            let score1 = isFin || isVivo ? `<span class="score-big ml-3 text-lg">${isFin ? partido.sets_j1 : (partido.puntos_j1 || 0)}</span>` : '';
            let score2 = isFin || isVivo ? `<span class="score-big p2 ml-3 text-lg">${isFin ? partido.sets_j2 : (partido.puntos_j2 || 0)}</span>` : '';

            if (isVivo) {
                score1 += `<span class="sets-badge">(${partido.sets_j1 || 0})</span>`;
                score2 += `<span class="sets-badge">(${partido.sets_j2 || 0})</span>`;
            }

            let win1 = isFin && partido.ganador_id === partido.jugador1_id;
            let win2 = isFin && partido.ganador_id === partido.jugador2_id;
            
            let styleN1 = isFin && !win1 ? 'color:#64748b;' : 'color:#ffffff;';
            let styleN2 = isFin && !win2 ? 'color:#64748b;' : 'color:#ffffff;';
            let icon1 = win1 ? '🏆 ' : '';
            let icon2 = win2 ? '🏆 ' : '';

            let clickAction = partido ? `onclick="abrirPartidoFullScreen(${partido.id})"` : '';
            let hoverFX = partido ? 'hover:-translate-y-1 hover:border-white/20 transition-all cursor-pointer' : '';

            let flexWrapper = titulo === 'Gran Final' ? 'grid-column: 1 / -1; display:flex; justify-content:center; margin-top:10px;' : '';
            let innerStyle = `background:rgba(0,0,0,0.4); padding:16px; border-radius:14px; border:1px solid rgba(255,255,255,0.08); ${opacidad} width:100%;`;
            if(titulo === 'Gran Final') innerStyle += ' max-width:450px; text-align:left;';

            return `
                ${titulo === 'Gran Final' ? `<div style="${flexWrapper}">` : ''}
                <div style="${innerStyle}" class="${hoverFX}" ${clickAction}>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:${titulo==='Gran Final' ? '12px' : '10px'}; color:${colorTitulo}; font-weight:900; text-transform:uppercase;">${titulo==='Gran Final' ? '🏆 ' : ''}${titulo}</span>
                            ${partido ? badgeEst : ''}
                        </div>
                        <div style="text-align:right;">
                            <span style="font-size:9px; color:#94a3b8; font-weight:700;">Mesa ${partido?.mesa || mesaDefault}</span>
                            ${partido?.juez ? `<span style="font-size:9px; color:#a855f7; font-weight:700; display:block; margin-top:2px;">⚖️ ${partido.juez}</span>` : ''}
                        </div>
                    </div>

                    <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="font-size:14px; ${styleN1}">${icon1}${nomJ1}</strong>
                        </div>
                        <div style="display:flex; align-items:center;">
                            ${score1}
                            <span style="font-size:9px; background:rgba(245,158,11,0.2); color:#fbbf24; padding:2px 6px; border-radius:4px; font-weight:800; margin-left:8px;">${descJ1}</span>
                        </div>
                    </div>

                    <div style="text-align:center; font-size:10px; color:#64748b; font-weight:800; margin:4px 0;">VS</div>

                    <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="font-size:14px; ${styleN2}">${icon2}${nomJ2}</strong>
                        </div>
                        <div style="display:flex; align-items:center;">
                            ${score2}
                            <span style="font-size:9px; background:${colorDesc2}; padding:2px 6px; border-radius:4px; font-weight:800; margin-left:8px;">${descJ2}</span>
                        </div>
                    </div>
                </div>
                ${titulo === 'Gran Final' ? `</div>` : ''}
            `;
        }

        function dibujarLlavesInferiores(container) {
            const standings = calcularStandingsGrupos();
            const categoriasSet = new Set(todosLosPartidos.map(p => p.categorias?.nombre).filter(Boolean));
            let catsList = [...categoriasSet];

            if (categoriaFiltro !== 'todas') {
                catsList = catsList.filter(c => c === categoriaFiltro);
            }

            if (catsList.length === 0) return;

            const partidosLlaveBD = todosLosPartidos.filter(p => (!p.grupo_nombre || p.grupo_nombre !== 'Flash') && (String(p.ronda_fase || '').toLowerCase().includes('cuarto') || String(p.ronda_fase || '').toLowerCase().includes('cruce') || String(p.ronda_fase || '').toLowerCase().includes('semifinal') || String(p.ronda_fase || '').toLowerCase().includes('final')));

            let footerHtml = '';

            catsList.forEach(catNombre => {
                const gruposCat = standings[catNombre] || {};
                const numGrupos = Object.keys(gruposCat).length;
                
                if (gruposCat['Único'] || (numGrupos === 0 && partidosLlaveBD.filter(p => p.categorias?.nombre === catNombre).length === 0)) return;

                let clasificados = [];
                Object.keys(gruposCat).forEach(gpoNombre => {
                    let jugArr = ordenarJugadoresITTF(Object.values(gruposCat[gpoNombre]));
                    if(jugArr[0]) clasificados.push({ ...jugArr[0], seedType: 1, gpo: gpoNombre });
                    if(jugArr[1]) clasificados.push({ ...jugArr[1], seedType: 2, gpo: gpoNombre });
                });
                
                clasificados.sort((a,b) => {
                    if(a.seedType !== b.seedType) return a.seedType - b.seedType;
                    if(b.pts !== a.pts) return b.pts - a.pts;
                    let diffA = (a.setsG||0) - (a.setsP||0);
                    let diffB = (b.setsG||0) - (b.setsP||0);
                    return diffB - diffA;
                });

                let s1 = clasificados[0] || { nombre: 'Seed 1', gpo: '-' };
                let s2 = clasificados[1] || { nombre: 'Seed 2', gpo: '-' };
                let s3 = clasificados[2] || { nombre: 'Seed 3', gpo: '-' };
                let s4 = clasificados[3] || { nombre: 'Seed 4', gpo: '-' };
                let s5 = clasificados[4] || { nombre: 'Seed 5', gpo: '-' };
                let s6 = clasificados[5] || { nombre: 'Seed 6', gpo: '-' };
                let s7 = clasificados[6] || { nombre: 'Seed 7', gpo: '-' };
                let s8 = clasificados[7] || { nombre: 'Seed 8', gpo: '-' };

                const partidosCatGpo = todosLosPartidos.filter(p => p.grupo_nombre && p.grupo_nombre !== 'Flash' && p.categorias?.nombre === catNombre);
                const totalGpo = partidosCatGpo.length;
                const finGpo = partidosCatGpo.filter(p => String(p.estado || '').trim().toLowerCase() === 'finalizado').length;
                const gpoCompleto = totalGpo > 0 && totalGpo === finGpo;

                const llavesCat = partidosLlaveBD.filter(p => p.categorias?.nombre === catNombre);
                const pCuartos1 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('1'));
                const pCuartos2 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('2'));
                const pCuartos3 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('3'));
                const pCuartos4 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('cuartos') && String(p.ronda_fase || '').includes('4'));

                const partidoSemi1 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('1') || String(p.ronda_fase || '').toLowerCase().includes('cruce 1')));
                const partidoSemi2 = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('semi') && (String(p.ronda_fase || '').includes('2') || String(p.ronda_fase || '').toLowerCase().includes('cruce 2')));
                const partidoFinal = llavesCat.find(p => String(p.ronda_fase || '').toLowerCase().includes('final') && !String(p.ronda_fase || '').toLowerCase().includes('semi'));

                let hayCuartos = pCuartos1 || pCuartos2 || pCuartos3 || pCuartos4 || numGrupos > 2;
                if(!hayCuartos && !partidoSemi1 && !partidoSemi2 && !partidoFinal && numGrupos === 0) return;

                let nomC1_j1 = pCuartos1?.j1 ? pCuartos1.j1.nombre : s1.nombre;
                let nomC1_j2 = pCuartos1?.j2 ? pCuartos1.j2.nombre : s8.nombre;
                let nomC2_j1 = pCuartos2?.j1 ? pCuartos2.j1.nombre : s4.nombre;
                let nomC2_j2 = pCuartos2?.j2 ? pCuartos2.j2.nombre : s5.nombre;
                let nomC3_j1 = pCuartos3?.j1 ? pCuartos3.j1.nombre : s3.nombre;
                let nomC3_j2 = pCuartos3?.j2 ? pCuartos3.j2.nombre : s6.nombre;
                let nomC4_j1 = pCuartos4?.j1 ? pCuartos4.j1.nombre : s2.nombre;
                let nomC4_j2 = pCuartos4?.j2 ? pCuartos4.j2.nombre : s7.nombre;

                let nomSemi1_j1, nomSemi1_j2, nomSemi2_j1, nomSemi2_j2;
                let tC1_1 = `Seed 1 (Gpo ${s1.gpo})`; let tC1_2 = `Seed 8 (Gpo ${s8.gpo})`;
                let tC2_1 = `Seed 4 (Gpo ${s4.gpo})`; let tC2_2 = `Seed 5 (Gpo ${s5.gpo})`;
                let tC3_1 = `Seed 3 (Gpo ${s3.gpo})`; let tC3_2 = `Seed 6 (Gpo ${s6.gpo})`;
                let tC4_1 = `Seed 2 (Gpo ${s2.gpo})`; let tC4_2 = `Seed 7 (Gpo ${s7.gpo})`;
                let tS1_1, tS1_2, tS2_1, tS2_2;
                
                if (hayCuartos) {
                    nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : (pCuartos1?.ganador_id ? (pCuartos1.ganador_id === pCuartos1.jugador1_id ? nomC1_j1 : nomC1_j2) : 'Gana C1');
                    nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : (pCuartos2?.ganador_id ? (pCuartos2.ganador_id === pCuartos2.jugador1_id ? nomC2_j1 : nomC2_j2) : 'Gana C2');
                    tS1_1 = 'Gana C1'; tS1_2 = 'Gana C2';
                    
                    nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : (pCuartos3?.ganador_id ? (pCuartos3.ganador_id === pCuartos3.jugador1_id ? nomC3_j1 : nomC3_j2) : 'Gana C3');
                    nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : (pCuartos4?.ganador_id ? (pCuartos4.ganador_id === pCuartos4.jugador1_id ? nomC4_j1 : nomC4_j2) : 'Gana C4');
                    tS2_1 = 'Gana C3'; tS2_2 = 'Gana C4';
                } else {
                    nomSemi1_j1 = partidoSemi1?.j1 ? partidoSemi1.j1.nombre : s1.nombre;
                    nomSemi1_j2 = partidoSemi1?.j2 ? partidoSemi1.j2.nombre : s4.nombre;
                    tS1_1 = `Seed 1 (${s1.gpo})`; tS1_2 = `Seed 4 (${s4.gpo})`;
                    
                    nomSemi2_j1 = partidoSemi2?.j1 ? partidoSemi2.j1.nombre : s2.nombre;
                    nomSemi2_j2 = partidoSemi2?.j2 ? partidoSemi2.j2.nombre : s3.nombre;
                    tS2_1 = `Seed 2 (${s2.gpo})`; tS2_2 = `Seed 3 (${s3.gpo})`;
                }

                let nomFinal_j1 = partidoFinal?.j1 ? partidoFinal.j1.nombre : (partidoSemi1?.ganador_id ? (partidoSemi1.ganador_id === partidoSemi1.jugador1_id ? nomSemi1_j1 : nomSemi1_j2) : 'Ganador Semi 1');
                let nomFinal_j2 = partidoFinal?.j2 ? partidoFinal.j2.nombre : (partidoSemi2?.ganador_id ? (partidoSemi2.ganador_id === partidoSemi2.jugador1_id ? nomSemi2_j1 : nomSemi2_j2) : 'Ganador Semi 2');

                let cardsHtml = '';
                if (hayCuartos) {
                    cardsHtml += generarTarjetaLlaveEspectador(pCuartos1, 'Cuartos 1', '#10b981', 1, nomC1_j1, nomC1_j2, tC1_1, tC1_2, 'rgba(16,185,129,0.2); color:#10b981;');
                    cardsHtml += generarTarjetaLlaveEspectador(pCuartos2, 'Cuartos 2', '#10b981', 2, nomC2_j1, nomC2_j2, tC2_1, tC2_2, 'rgba(16,185,129,0.2); color:#10b981;');
                    cardsHtml += generarTarjetaLlaveEspectador(pCuartos3, 'Cuartos 3', '#10b981', 3, nomC3_j1, nomC3_j2, tC3_1, tC3_2, 'rgba(16,185,129,0.2); color:#10b981;');
                    cardsHtml += generarTarjetaLlaveEspectador(pCuartos4, 'Cuartos 4', '#10b981', 4, nomC4_j1, nomC4_j2, tC4_1, tC4_2, 'rgba(16,185,129,0.2); color:#10b981;');
                }
                
                cardsHtml += generarTarjetaLlaveEspectador(partidoSemi1, 'Semifinal 1', '#38bdf8', 1, nomSemi1_j1, nomSemi1_j2, tS1_1, tS1_2, 'rgba(6,182,212,0.2); color:#38bdf8;');
                cardsHtml += generarTarjetaLlaveEspectador(partidoSemi2, 'Semifinal 2', '#f0abfc', 2, nomSemi2_j1, nomSemi2_j2, tS2_1, tS2_2, 'rgba(217,70,239,0.2); color:#d946ef;');
                cardsHtml += generarTarjetaLlaveEspectador(partidoFinal, 'Gran Final', '#fbbf24', 1, nomFinal_j1, nomFinal_j2, 'Gana Semi 1', 'Gana Semi 2', 'rgba(217,70,239,0.2); color:#d946ef;');

                footerHtml += `
                    <div class="seccion-llaves-footer">
                        <div style="text-align:center; margin-bottom:15px;">
                            <span style="font-size:10px; color:#fbbf24; font-weight:800; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:4px;">Fase Final de Eliminatoria Directa</span>
                            <h3 style="margin:0; border:none; padding:0; font-size:16px; color:#ffffff;">🏆 LLAVES ELIMINATORIAS - ${catNombre}</h3>
                        </div>

                        ${gpoCompleto ? `
                            <div style="background:rgba(16,185,129,0.2); border:1px solid rgba(16,185,129,0.5); color:#34d399; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:11px; text-transform:uppercase; margin-bottom:18px;">

                            <div style="background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.4); color:#fbbf24; padding:10px; border-radius:10px; text-align:center; font-weight:800; font-size:10px; text-transform:uppercase; margin-bottom:18px;">

                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px;">
                            ${cardsHtml}

            if (footerHtml !== '') container.innerHTML += footerHtml;
        }

        function dibujarPantalla() {
            const container = document.getElementById('contenedor-espectador');
            if (!container) return;
            
            container.innerHTML = '';

            if (estadoFiltro === 'resumen') {
                container.style.display = 'block';
                dibujarResumenYLlaves(container);
                return;
            }

            if (estadoFiltro === 'ranking') {
                container.style.display = 'block';
                const finMatches = todosLosPartidos.filter(p => String(p.estado || '').toLowerCase() === 'finalizado');
                dibujarRankingGlobal(container, finMatches);
                return;
            }
            
            if (estadoFiltro === 'flash') {
                container.style.display = 'block';
                dibujarEstadisticasFlash(container);
                return;
            }

            container.style.display = 'grid';

            let filtrados = todosLosPartidos.filter(p => p.grupo_nombre && p.grupo_nombre !== 'Flash');

            if (mesaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.mesa == mesaFiltro);
            }

            if (categoriaFiltro !== 'todas') {
                filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltro);
            }

            if (estadoFiltro === 'en_curso') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'en_curso');
            } else if (estadoFiltro === 'pendiente') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'pendiente');
            } else if (estadoFiltro === 'finalizado') {
                filtrados = filtrados.filter(p => String(p.estado || '').trim().toLowerCase() === 'finalizado');
            }

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="mensaje-vacio">No hay partidos registrados bajo este filtro.</div>`;
                return;
            }

            const gruposPorHora = {};
            const horasOrdenadas = [];
            
            filtrados.forEach(p => {
                const h = p.hora || '09:00 AM';
                if(!gruposPorHora[h]) {
                    gruposPorHora[h] = [];
                    horasOrdenadas.push(h); 
                }
                gruposPorHora[h].push(p);
            });

            let htmlContent = '';

            horasOrdenadas.forEach(hora => {
                htmlContent += `<div class="header-hora">⏰ ${hora}</div>`;

                gruposPorHora[hora].forEach(p => {
                    let est = String(p.estado || '').toLowerCase();
                    let isFin = est === 'finalizado';
                    let isVivo = est === 'en_curso';

                    let badgeEst = isVivo ? '<span class="badge-estado est-curso">🔴 En Vivo</span>' : 
                                  (isFin ? '<span class="badge-estado est-fin">🏁 Finalizado</span>' : '<span class="badge-estado est-pendiente">⏳ Pendiente</span>');

                    let nomJ1 = p.j1?.nombre || (p.ronda_fase ? `${p.ronda_fase} J1` : 'Por definir');
                    let nomJ2 = p.j2?.nombre || (p.ronda_fase ? `${p.ronda_fase} J2` : 'Por definir');

                    let iconJ1 = (isFin && p.ganador_id === p.jugador1_id) ? '🏆 ' : '';
                    let iconJ2 = (isFin && p.ganador_id === p.jugador2_id) ? '🏆 ' : '';

                    let catStyle = obtenerEstiloCategoria(p.categorias?.id || 0);
                    let eqGrupo = p.grupo_nombre === 'Único' ? 'Liga Única' : (p.grupo_nombre ? 'Gpo ' + p.grupo_nombre : (p.ronda_fase || 'Llave'));
                    let cGpo = obtenerColorGrupo(p.grupo_nombre || p.ronda_fase);

                    let score1 = isFin || isVivo ? `<span class="score-big">${isFin ? p.sets_j1 : p.puntos_j1 || 0}</span>` : '';
                    let score2 = isFin || isVivo ? `<span class="score-big p2">${isFin ? p.sets_j2 : p.puntos_j2 || 0}</span>` : '';
                    
                    if (isVivo) {
                        score1 += `<span class="sets-badge">(${p.sets_j1 || 0})</span>`;
                        score2 += `<span class="sets-badge">(${p.sets_j2 || 0})</span>`;
                    }

                    let cardClass = isVivo ? 'vivo' : (isFin ? 'finalizado' : '');
                    
                    let customStyle = '';
                    let mesaColor = '';

                    htmlContent += `
                        <div class="card-mesa ${cardClass} hover:-translate-y-1 hover:border-white/20 cursor-pointer" style="${customStyle}" onclick="abrirPartidoFullScreen(${p.id})">
                            <div class="top-bar">
                                <div>
                                    <span class="mesa-title" style="${mesaColor}">MESA ${p.mesa || 1}</span>
                                    <span style="font-size:9px; color:#a855f7; font-weight:700; margin-left:8px; text-transform:uppercase;">⚖️ Juez: ${p.juez || 'Comité'}</span>
                                </div>
                                ${badgeEst}
                            </div>

                            <div style="margin-bottom:12px; display: flex; gap: 8px; flex-wrap: wrap;">
                                <span class="cat-badge" style="color:${catStyle.text}; background:${catStyle.bg}; border:1px solid ${catStyle.border};">
                                    🏆 ${p.categorias ? p.categorias.nombre : 'Categoría'}
                                </span>
                                <span class="cat-badge" style="color:${cGpo.color}; background:${cGpo.bg}; border:1px solid ${cGpo.border};">
                                    📍 ${eqGrupo}
                                </span>
                            </div>

                            <div class="score-container">
                                <div class="jugador-box">
                                    <div>
                                        <span class="jugador-nombre">${iconJ1}${nomJ1}</span>
                                    </div>
                                    <div style="display:flex; align-items:center;">${score1}</div>
                                </div>

                                <div class="jugador-box" style="border-top:1px solid rgba(255,255,255,0.05); margin-top:6px; padding-top:10px;">
                                    <div>
                                        <span class="jugador-nombre">${iconJ2}${nomJ2}</span>
                                    </div>
                                    <div style="display:flex; align-items:center;">${score2}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });

            container.innerHTML = htmlContent;
        }

        function dibujarRankingGlobal(container, finMatches) {
            let jugadoresActivos = [...todosLosJugadores];

            if (categoriaFiltro !== 'todas') {
                const catObj = todasLasCategorias.find(c => c.nombre === categoriaFiltro);
                if (catObj) {
                    jugadoresActivos = jugadoresActivos.filter(j => j.puntos_ranking >= catObj.puntos_minimos && j.puntos_ranking <= catObj.puntos_maximos);
                }
            }

            if (jugadoresActivos.length === 0) {
                container.innerHTML = `<div class="mensaje-vacio">No hay jugadores registrados en el ranking global bajo este filtro.</div>`;
                return;
            }

            jugadoresActivos.forEach(j => {
                j.puntosEnVivo = calcularRankingEnVivo(j.id, j.puntos_ranking, finMatches, null);
                j.difPuntos = j.puntosEnVivo - (j.puntos_ranking_ant || j.puntos_ranking);
            });

            jugadoresActivos.sort((a, b) => b.puntosEnVivo - a.puntosEnVivo);

            let html = `
                <div style="background:rgba(10,15,26,0.85); border:1px solid rgba(168,85,247,0.3); border-radius:20px; padding:22px; margin-bottom:25px; backdrop-filter:blur(15px);">
                    <div style="text-align:center; margin-bottom:20px;">
                        <span style="font-size:14px; color:#c084fc; font-weight:900; text-transform:uppercase; letter-spacing:2px; display:block;">🏆 Ranking Global Oficial en Vivo</span>
                        <span style="font-size:10px; color:#94a3b8; display:block; margin-top:6px;">Esta tabla se actualiza en tiempo real con cada partido finalizado.</span>
                    </div>
                    <div style="overflow-x:auto;">
                        <table style="width:100%; border-collapse:collapse; font-size:12px; text-align:left;">
                            <thead>
                                <tr style="font-size:9px; color:#94a3b8; font-weight:800; text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,0.1);">
                                    <th style="padding:6px; text-align:center; width:50px;">Pos</th>
                                    <th style="padding:6px;">Jugador</th>
                                    <th style="padding:6px;">Club</th>
                                    <th style="padding:6px; text-align:center;">Pts Iniciales</th>
                                    <th style="padding:6px; text-align:center;">+/-</th>
                                    <th style="padding:6px; text-align:center; color:#c084fc;">Pts Actuales</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            jugadoresActivos.forEach((j, idx) => {
                let difStr = j.difPuntos > 0 ? `<span style="color:#10b981;">▲ +${j.difPuntos}</span>` : 
                            (j.difPuntos < 0 ? `<span style="color:#ef4444;">▼ ${j.difPuntos}</span>` : `<span style="color:#64748b;">-</span>`);

                html += `
                    <tr style="border-bottom:1px solid rgba(255,255,255,0.04); transition:all 0.2s ease;">
                        <td style="padding:10px 6px; font-weight:800; color:#64748b; text-align:center;">#${idx + 1}</td>
                        <td style="padding:10px 6px;"><strong style="color:#ffffff;">${j.nombre}</strong></td>
                        <td style="padding:10px 6px;"><span style="color:#94a3b8; font-size:10px;">${j.club || 'S/C'}</span></td>
                        <td style="padding:10px 6px; text-align:center; color:#94a3b8; font-family:'Orbitron', sans-serif; font-size:10px;">${j.puntos_ranking_ant || j.puntos_ranking}</td>
                        <td style="padding:10px 6px; text-align:center; font-weight:800; font-size:10px;">${difStr}</td>
                        <td style="padding:10px 6px; text-align:center; font-weight:900; color:#c084fc; font-family:'Orbitron', sans-serif; font-size:14px;">${j.puntosEnVivo}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function toggleAudioEspectador() {
            audioMuted = !audioMuted;
            document.getElementById('fs-btn-audio').innerHTML = audioMuted ? '<i class="fa-solid fa-volume-xmark text-rose-400"></i>' : '<i class="fa-solid fa-volume-high text-cyan-400"></i>';
        }

        function anunciarScoreAudio(n1, s1, n2, s2) {
            if (audioMuted || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            let u = new SpeechSynthesisUtterance(`${getApellido(n1)} ${s1}, ${getApellido(n2)} ${s2}`);
            u.lang = 'es-MX';
            window.speechSynthesis.speak(u);
        }

        function compartirPartidoWhatsAppActual() {
            if (!activePartidoFullScreenId) return;
            const url = `${window.location.origin}/espectador.html?torneo=${idTorneoActivo}&partido=${activePartidoFullScreenId}`;
            const p = todosLosPartidos.find(x => x.id == activePartidoFullScreenId);
            const nom1 = p.j1?.nombre || 'J1';
            const nom2 = p.j2?.nombre || 'J2';
            
            const estLimpio = String(p.estado || '').trim().toLowerCase();
            const esFin = estLimpio === 'finalizado';
            let scoreText = esFin ? `${p.sets_j1} - ${p.sets_j2} (Sets)` : `${p.puntos_j1 || 0} - ${p.puntos_j2 || 0} (Puntos)`;

            let texto = `🏓 *¡Sigue este partido en Vivo!*\n\n*${nom1}* vs *${nom2}*\nMarcador: ${scoreText}\nMesa: ${p.mesa || 1}\n\n👉 Míralo aquí en tiempo real:\n${url}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }

        function abrirPartidoFullScreen(partidoId) {
            if (!partidoId || partidoId === 0) return;
            activePartidoFullScreenId = partidoId;
            const modal = document.getElementById('modal-fullscreen-partido');
            modal.style.display = 'flex';
            actualizarModalFullScreen();
        }

        function cerrarPartidoFullScreen() {
            activePartidoFullScreenId = null;
            const modal = document.getElementById('modal-fullscreen-partido');
            modal.style.display = 'none';
            
            if(partidoUrlId) {
                const url = new URL(window.location);
                url.searchParams.delete('partido');
                window.history.pushState({}, '', url);
                partidoUrlId = null;
            }
        }

        function actualizarModalFullScreen() {
            if (!activePartidoFullScreenId) return;

            const p = todosLosPartidos.find(item => item.id == activePartidoFullScreenId);
            if (!p) return;

            let est = String(p.estado || '').toLowerCase();
            let isFin = est === 'finalizado';

            document.getElementById('fs-mesa-fase').innerText = `MESA ${p.mesa || 1} • ${p.grupo_nombre === 'Flash' ? 'LIGA CONTINUA' : (p.grupo_nombre === 'Único' ? 'LIGA ÚNICA' : (p.grupo_nombre ? 'GRUPO ' + p.grupo_nombre : (p.ronda_fase || 'FASE FINAL')))}`;
            document.getElementById('fs-cat-nombre').innerText = p.categorias?.nombre || 'CATEGORÍA GENERAL';

            let nomJ1 = p.j1?.nombre || (p.ronda_fase ? `${p.ronda_fase} J1` : 'Por definir');
            let nomJ2 = p.j2?.nombre || (p.ronda_fase ? `${p.ronda_fase} J2` : 'Por definir');

            document.getElementById('fs-name-j1').innerText = nomJ1;
            document.getElementById('fs-name-j2').innerText = nomJ2;
            document.getElementById('fs-club-j1').innerText = p.j1?.club || 'Sin Club';
            document.getElementById('fs-club-j2').innerText = p.j2?.club || 'Sin Club';

            const finMatches = todosLosPartidos.filter(m => String(m.estado || '').toLowerCase() === 'finalizado');
            let rDetails = calcularDetallesRankingPartido(p, finMatches);

            if (p.mostrar_ranking) {
                let rankBase1 = isFin ? rDetails.ptsFinalJ1 : rDetails.ptsPrevJ1;
                let rankBase2 = isFin ? rDetails.ptsFinalJ2 : rDetails.ptsPrevJ2;
                
                document.getElementById('fs-ranking-j1').innerHTML = `
                    ${rankBase1} pts
                    <span class="text-emerald-400 font-bold ml-2 hidden md:inline">🏆 +${rDetails.impacto.j1G}</span> 
                    <span class="text-rose-400 font-bold ml-1 hidden md:inline">❌ ${rDetails.impacto.j1P}</span>
                `;
                document.getElementById('fs-ranking-j2').innerHTML = `
                    ${rankBase2} pts
                    <span class="text-emerald-400 font-bold ml-2 hidden md:inline">🏆 +${rDetails.impacto.j2G}</span> 
                    <span class="text-rose-400 font-bold ml-1 hidden md:inline">❌ ${rDetails.impacto.j2P}</span>
                `;

                const boxProy = document.getElementById('fs-proyeccion-box');
                boxProy.classList.remove('hidden');
                
                let winDesc1 = p.j1?.nombre ? getApellido(p.j1.nombre) : 'J1';
                let winDesc2 = p.j2?.nombre ? getApellido(p.j2.nombre) : 'J2';
                
                if (isFin) {
                    boxProy.innerHTML = `🏁 Impacto Final: ${p.ganador_id === p.jugador1_id ? 
                        `${winDesc1} (+${rDetails.impacto.j1G}) | ${winDesc2} (${rDetails.impacto.j2P})` : 
                        `${winDesc2} (+${rDetails.impacto.j2G}) | ${winDesc1} (${rDetails.impacto.j1P})`}`;
                } else {
                    boxProy.innerHTML = `📊 Si gana ${winDesc1}: (+${rDetails.impacto.j1G} / ${rDetails.impacto.j2P}) &nbsp;|&nbsp; Si gana ${winDesc2}: (+${rDetails.impacto.j2G} / ${rDetails.impacto.j1P})`;
                }
            } else {
                document.getElementById('fs-ranking-j1').innerHTML = '-- pts';
                document.getElementById('fs-ranking-j2').innerHTML = '-- pts';
                document.getElementById('fs-proyeccion-box').classList.add('hidden');
            }

            document.getElementById('fs-score-j1').innerText = isFin ? p.sets_j1 : (p.puntos_j1 || 0);
            document.getElementById('fs-score-j2').innerText = isFin ? p.sets_j2 : (p.puntos_j2 || 0);
            document.getElementById('fs-sets-j1').innerText = p.sets_j1 || 0;
            document.getElementById('fs-sets-j2').innerText = p.sets_j2 || 0;

            const listSets = document.getElementById('fs-list-sets');
            listSets.innerHTML = '';
            
            if (p.historial_sets && Array.isArray(p.historial_sets)) {
                p.historial_sets.forEach(s => {
                    let col1 = s.s1 > s.s2 ? 'text-cyan-400' : 'text-zinc-500';
                    let col2 = s.s2 > s.s1 ? 'text-fuchsia-400' : 'text-zinc-500';
                    listSets.innerHTML += `<span class="set-chip">Set ${s.numSet}: <span class="${col1}">${s.s1}</span> - <span class="${col2}">${s.s2}</span></span>`;
                });
            }

            let iconWin1 = document.getElementById('fs-winner-icon1');
            let iconWin2 = document.getElementById('fs-winner-icon2');
            
            if (isFin && p.ganador_id === p.jugador1_id) { iconWin1.classList.remove('hidden'); iconWin2.classList.add('hidden'); }
            else if (isFin && p.ganador_id === p.jugador2_id) { iconWin2.classList.remove('hidden'); iconWin1.classList.add('hidden'); }
            else { iconWin1.classList.add('hidden'); iconWin2.classList.add('hidden'); }

            let scoreText = `${p.puntos_j1 || 0} a ${p.puntos_j2 || 0}`;
            if (!isFin && scoreText !== lastAnnouncedScore) {
                lastAnnouncedScore = scoreText;
                anunciarScoreAudio(nomJ1, p.puntos_j1 || 0, nomJ2, p.puntos_j2 || 0);
            }
        }

        inicializarEspectador();
    </script>
</body>
</html>
