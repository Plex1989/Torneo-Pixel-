<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión en Vivo - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Orbitron:wght@700;900&display=swap');

        body { font-family: 'Sora', sans-serif; margin: 0; padding: 20px; background-color: #04060a; color: #f8fafc; min-height: 100vh; box-sizing: border-box; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }

        .header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin: 0; }

        .grid-espectador { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }

        .card-mesa { background: rgba(10, 15, 26, 0.7); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; position: relative; transition: all 0.3s ease; }
        .card-mesa.vivo { border-top: 4px solid #34d399; box-shadow: 0 0 25px rgba(52, 211, 153, 0.15); }
        .card-mesa.finalizado { border-top: 4px solid #64748b; opacity: 0.85; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .mesa-title { font-size: 13px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .cat-badge { font-size: 10px; font-weight: 800; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        .score-container { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03); }
        .jugador-box { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .jugador-nombre { font-size: 14px; font-weight: 800; color: #ffffff; }
        .jugador-club { font-size: 10px; color: #64748b; font-weight: 600; display: block; }
        .score-big { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: #06b6d4; }
        .score-big.p2 { color: #d946ef; }

        .sets-badge { font-size: 11px; font-weight: 800; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px; margin-left: 8px; }

        .proyeccion-bar { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 8px 12px; margin-top: 10px; text-align: center; font-size: 10px; font-weight: 800; color: #fbbf24; }

        .sets-history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.08); }
        .set-chip { font-size: 9px; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 6px; font-weight: 800; border: 1px solid rgba(255,255,255,0.05); }

        .mensaje-vacio { text-align: center; color: #475569; font-style: italic; grid-column: 1/-1; padding: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <p style="color:#a855f7; font-weight:800; font-size:10px; text-transform:uppercase; margin:0 0 4px 0;">Transmisión en Tiempo Real para Fans</p>
        <h1 id="torneo-nombre-header">CARTELERA DE MARCADORES</h1>
    </div>

    <div class="grid-espectador" id="contenedor-espectador">
        <div class="mensaje-vacio">Cargando marcadores en vivo...</div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        let idTorneoActivo = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

        let reglasRankingList = [];

        async function inicializarEspectador() {
            const { data: torneo } = await clienteSupabase.from('torneos').select('nombre').eq('id', idTorneoActivo).single();
            if (torneo) document.getElementById('torneo-nombre-header').innerText = torneo.nombre;

            const { data: reglas } = await clienteSupabase.from('reglas_ranking').select('*').order('diferencia_min', { ascending: true });
            reglasRankingList = reglas || [];

            cargarMarcadores();

            // Suscripción Realtime
            clienteSupabase
                .channel('espectador-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => {
                    cargarMarcadores();
                })
                .subscribe();
        }

        async function cargarMarcadores() {
            const { data: partidos } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(id, nombre, club, puntos_ranking), j2:jugador2_id(id, nombre, club, puntos_ranking), categorias(id, nombre)')
                .eq('torneo_id', idTorneoActivo)
                .order('mesa', { ascending: true });

            if (!partidos || partidos.length === 0) {
                document.getElementById('contenedor-espectador').innerHTML = `<div class="mensaje-vacio">No hay marcadores activos en este momento.</div>`;
                return;
            }

            // Cargar partidos finalizados para cálculo acumulado en vivo
            const { data: finMatches } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(id, puntos_ranking), j2:jugador2_id(id, puntos_ranking)')
                .eq('torneo_id', idTorneoActivo)
                .eq('estado', 'finalizado');

            dibujarMarcadores(partidos, finMatches || []);
        }

        function calcularRankingEnVivo(jugadorId, basePts, finMatches, partidoActualId) {
            if (!jugadorId || !basePts) return 0;
            let delta = 0;

            finMatches.forEach(m => {
                if (m.id == partidoActualId) return;
                let p1Base = m.j1 ? m.j1.puntos_ranking : 0;
                let p2Base = m.j2 ? m.j2.puntos_ranking : 0;
                let diff = Math.abs(p1Base - p2Base);
                let favJ1 = p1Base >= p2Base;

                let rJ1 = reglasRankingList.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((favJ1 && r.resultado_esperado === 'gana_favorito') || (!favJ1 && r.resultado_esperado === 'gana_retador')));
                let rJ2 = reglasRankingList.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((!favJ1 && r.resultado_esperado === 'gana_favorito') || (favJ1 && r.resultado_esperado === 'gana_retador')));

                let j1Gana = rJ1 ? rJ1.puntos_ganador : 10;
                let j1Pierde = rJ2 ? -Math.abs(rJ2.puntos_perdedor) : -5;
                let j2Gana = rJ2 ? rJ2.puntos_ganador : 10;
                let j2Pierde = rJ1 ? -Math.abs(rJ1.puntos_perdedor) : -5;

                if (m.jugador1_id === jugadorId) {
                    delta += (m.ganador_id === jugadorId) ? j1Gana : j1Pierde;
                } else if (m.jugador2_id === jugadorId) {
                    delta += (m.ganador_id === jugadorId) ? j2Gana : j2Pierde;
                }
            });

            return basePts + delta;
        }

        function calcularImpacto(ptsA, ptsB) {
            let diff = Math.abs(ptsA - ptsB);
            let favJ1 = ptsA >= ptsB;

            let rJ1 = reglasRankingList.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((favJ1 && r.resultado_esperado === 'gana_favorito') || (!favJ1 && r.resultado_esperado === 'gana_retador')));
            let rJ2 = reglasRankingList.find(r => diff >= r.diferencia_min && diff <= r.diferencia_max && ((!favJ1 && r.resultado_esperado === 'gana_favorito') || (favJ1 && r.resultado_esperado === 'gana_retador')));

            return {
                j1G: rJ1 ? rJ1.puntos_ganador : 10, j1P: rJ2 ? -Math.abs(rJ2.puntos_perdedor) : -5,
                j2G: rJ2 ? rJ2.puntos_ganador : 10, j2P: rJ1 ? -Math.abs(rJ1.puntos_perdedor) : -5
            };
        }

        function dibujarMarcadores(partidos, finMatches) {
            const container = document.getElementById('contenedor-espectador');
            container.innerHTML = '';

            partidos.forEach(p => {
                let est = (p.estado || '').toLowerCase();
                let isFin = est === 'finalizado';
                let isVivo = est === 'en_curso';

                let nomJ1 = p.j1 ? p.j1.nombre : (p.ronda_fase ? `${p.ronda_fase} J1` : 'Por definir');
                let nomJ2 = p.j2 ? p.j2.nombre : (p.ronda_fase ? `${p.ronda_fase} J2` : 'Por definir');

                let ptsLiveJ1 = p.j1 ? calcularRankingEnVivo(p.j1.id, p.j1.puntos_ranking || 0, finMatches, p.id) : 0;
                let ptsLiveJ2 = p.j2 ? calcularRankingEnVivo(p.j2.id, p.j2.puntos_ranking || 0, finMatches, p.id) : 0;

                let impacto = calcularImpacto(ptsLiveJ1, ptsLiveJ2);

                let proyeccionHtml = '';
                if (p.mostrar_ranking && p.j1 && p.j2) {
                    proyeccionHtml = `
                        <div class="proyeccion-bar">
                            📊 Proyección de Ranking:<br>
                            ${p.j1.nombre.split(' ')[0]}: <span style="color:#34d399;">+${impacto.j1G}</span> / <span style="color:#f87171;">${impacto.j1P}</span> | 
                            ${p.j2.nombre.split(' ')[0]}: <span style="color:#34d399;">+${impacto.j2G}</span> / <span style="color:#f87171;">${impacto.j2P}</span>
                        </div>
                    `;
                }

                let historialHtml = '';
                if (p.historial_sets && p.historial_sets.length > 0) {
                    historialHtml = `<div class="sets-history">`;
                    p.historial_sets.forEach(s => {
                        let c1 = s.s1 > s.s2 ? '#22d3ee' : '#64748b';
                        let c2 = s.s2 > s.s1 ? '#e879f9' : '#64748b';
                        historialHtml += `<div class="set-chip">Set ${s.numSet}: <span style="color:${c1}">${s.s1}</span> - <span style="color:${c2}">${s.s2}</span></div>`;
                    });
                    historialHtml += `</div>`;
                }

                container.innerHTML += `
                    <div class="card-mesa ${isVivo ? 'vivo' : (isFin ? 'finalizado' : '')}">
                        <div class="top-bar">
                            <span class="mesa-title">MESA ${p.mesa || 1}</span>
                            <span class="cat-badge">🏆 ${p.categorias?.nombre || 'Categoría'}</span>
                        </div>

                        <div class="score-container">
                            <div class="jugador-box">
                                <div>
                                    <span class="jugador-nombre">${nomJ1}</span>
                                    <span class="jugador-club">${p.j1?.club || ''} ${p.mostrar_ranking && ptsLiveJ1 ? `(${ptsLiveJ1} pts)` : ''}</span>
                                </div>
                                <div style="display:flex; align-items:center;">
                                    <span class="score-big">${isFin ? p.sets_j1 : p.puntos_j1 || 0}</span>
                                    ${!isFin ? `<span class="sets-badge">(${p.sets_j1 || 0})</span>` : ''}
                                </div>
                            </div>

                            <div class="jugador-box" style="border-top:1px solid rgba(255,255,255,0.05); margin-top:6px; padding-top:10px;">
                                <div>
                                    <span class="jugador-nombre">${nomJ2}</span>
                                    <span class="jugador-club">${p.j2?.club || ''} ${p.mostrar_ranking && ptsLiveJ2 ? `(${ptsLiveJ2} pts)` : ''}</span>
                                </div>
                                <div style="display:flex; align-items:center;">
                                    <span class="score-big p2">${isFin ? p.sets_j2 : p.puntos_j2 || 0}</span>
                                    ${!isFin ? `<span class="sets-badge">(${p.sets_j2 || 0})</span>` : ''}
                                </div>
                            </div>
                        </div>

                        ${proyeccionHtml}
                        ${historialHtml}
                    </div>
                `;
            });
        }

        inicializarEspectador();
    </script>
</body>
</html>
