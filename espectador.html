<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmisión en Vivo - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); margin-bottom: 8px; }
        .score-p1 { border-top: 3px solid #06b6d4; box-shadow: 0 8px 0 #020617; }
        .score-p2 { border-top: 3px solid #d946ef; box-shadow: 0 8px 0 #020617; }
        .name-p1 { background-color: #0891b2; box-shadow: 0 6px 0 #164e63; margin-bottom: 6px; }
        .name-p2 { background-color: #c026d3; box-shadow: 0 6px 0 #701a75; margin-bottom: 6px; }
        .glass-dark { background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(20px); }
        
        .tab-filter { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 14px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; white-space: nowrap; }
        .tab-filter.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        
        /* Sticky Header for Filters */
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(4, 6, 10, 0.9); backdrop-filter: blur(10px); padding: 15px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('loading'); 
            const [partidoData, setPartidoData] = useState(null);
            const [h2hHistory, setH2hHistory] = useState([]);
            const [lobbyMatches, setLobbyMatches] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null);
            const [estadoFiltro, setEstadoFiltro] = useState('en_curso'); // Pestaña por defecto

            const [p1, setP1] = useState("");
            const [p2, setP2] = useState("");
            const [score1, setScore1] = useState(0);
            const [score2, setScore2] = useState(0);
            const [sets1, setSets1] = useState(0);
            const [sets2, setSets2] = useState(0);
            const [mode, setMode] = useState('2-3');
            const [historialSets, setHistorialSets] = useState([]);
            const [winner, setWinner] = useState(null);
            const [isMuted, setIsMuted] = useState(false); // AUDIO ENCENDIDO POR DEFECTO PARA ESPECTADORES (Si el navegador lo permite)

            const urlParams = new URLSearchParams(window.location.search);
            const partidoId = urlParams.get('partido');
            const torneoId = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

            // Extraer solo la última palabra (apellido)
            const getApellido = (nombreCompleto) => {
                if(!nombreCompleto) return "";
                const partes = nombreCompleto.trim().split(" ");
                return partes[partes.length - 1];
            };

            const announceScore = (nom1, s1, nom2, s2, isWin = false, winName = "") => {
                if (isMuted || !window.speechSynthesis) return;
                window.speechSynthesis.cancel(); 
                
                const n1 = getApellido(nom1);
                const n2 = getApellido(nom2);
                
                const text = isWin ? `¡Ganador ${winName}!` : `${n1} ${s1}, ${n2} ${s2}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX'; 
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            };

            useEffect(() => {
                if (!partidoId) {
                    async function fetchLobby() {
                        const { data } = await clienteSupabase
                            .from('partidos')
                            .select('*, j1:jugador1_id(nombre), j2:jugador2_id(nombre), categorias(nombre)')
                            .eq('torneo_id', torneoId)
                            .order('hora', { ascending: true })
                            .order('mesa', { ascending: true });
                        
                        setLobbyMatches(data || []);
                        setView('lobby');
                    }
                    fetchLobby();

                    const channel = clienteSupabase.channel('public:partidos:lobby')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => fetchLobby())
                        .subscribe();

                    return () => clienteSupabase.removeChannel(channel);
                } else {
                    async function fetchMatch() {
                        const { data, error } = await clienteSupabase
                            .from('partidos')
                            .select('*, j1:jugador1_id(id, nombre), j2:jugador2_id(id, nombre)')
                            .eq('id', partidoId)
                            .single();

                        if (error || !data) {
                            setErrorMsg("Partido no encontrado.");
                            setView('error');
                            return;
                        }

                        setPartidoData(data);
                        let nom1 = data.j1 ? data.j1.nombre : 'Jugador 1';
                        let nom2 = data.j2 ? data.j2.nombre : 'Jugador 2';
                        setP1(nom1);
                        setP2(nom2);
                        setScore1(data.puntos_j1 || 0);
                        setScore2(data.puntos_j2 || 0);
                        setSets1(data.sets_j1 || 0);
                        setSets2(data.sets_j2 || 0);
                        setMode(data.modo_juego || '2-3');
                        setHistorialSets(data.historial_sets || []);

                        if (data.estado === 'finalizado') {
                            setWinner(data.ganador_id === data.jugador1_id ? nom1 : nom2);
                            setView('match');
                        } else if (data.estado === 'en_curso') {
                            setView('match');
                        } else {
                            const { data: historial } = await clienteSupabase
                                .from('partidos')
                                .select('*, torneos(nombre, fecha_evento)')
                                .eq('estado', 'finalizado')
                                .or(`and(jugador1_id.eq.${data.jugador1_id},jugador2_id.eq.${data.jugador2_id}),and(jugador1_id.eq.${data.jugador2_id},jugador2_id.eq.${data.jugador1_id})`)
                                .order('created_at', { ascending: false });

                            setH2hHistory(historial || []);
                            setView('h2h');
                        }
                    }
                    fetchMatch();

                    const channel = clienteSupabase
                        .channel(`public:partidos:id=eq.${partidoId}`)
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'partidos', filter: `id=eq.${partidoId}` }, payload => {
                            const m = payload.new;
                            
                            if (m.puntos_j1 !== score1 || m.puntos_j2 !== score2) {
                                announceScore(p1, m.puntos_j1, p2, m.puntos_j2);
                            }

                            setScore1(m.puntos_j1);
                            setScore2(m.puntos_j2);
                            setSets1(m.sets_j1);
                            setSets2(m.sets_j2);
                            setMode(m.modo_juego || '2-3');
                            setHistorialSets(m.historial_sets || []);

                            if (m.estado === 'en_curso') setView('match');
                            if (m.estado === 'finalizado') {
                                setWinner(m.ganador_id === m.jugador1_id ? p1 : p2);
                                setView('match');
                            }
                        })
                        .subscribe();

                    return () => clienteSupabase.removeChannel(channel);
                }
            }, [partidoId, p1, p2, score1, score2]);

            if (view === 'loading') return <div className="min-h-screen flex items-center justify-center text-cyan-400 font-bold uppercase tracking-widest text-sm">Cargando Transmisión...</div>;
            if (view === 'error') return <div className="min-h-screen flex items-center justify-center text-rose-500 font-bold uppercase">{errorMsg}</div>;

            // ==========================================
            // VISTA CARTELERA (NUEVO DISEÑO TIPO ADMIN PARA CELULAR)
            // ==========================================
            if (view === 'lobby') {
                
                let filtrados = lobbyMatches;
                if (estadoFiltro === 'en_curso') filtrados = lobbyMatches.filter(p => p.estado === 'en_curso');
                else if (estadoFiltro === 'pendiente') filtrados = lobbyMatches.filter(p => p.estado === 'pendiente');
                else if (estadoFiltro === 'finalizado') filtrados = lobbyMatches.filter(p => p.estado === 'finalizado');

                return (
                    <div className="min-h-screen bg-[#04060a] overflow-x-hidden text-white">
                        
                        {/* ENCABEZADO Y FILTROS FIJOS (STICKY) */}
                        <div className="sticky-header">
                            <div className="text-center mb-4">
                                <div className="text-rose-500 font-bold uppercase tracking-widest text-[9px] mb-1 animate-pulse">🔴 Transmisiones Oficiales</div>
                                <h1 className="text-lg font-black text-cyan-400 uppercase tracking-widest">Cartelera</h1>
                            </div>
                            
                            <div className="flex justify-center gap-2 px-4 overflow-x-auto hide-scrollbar">
                                <button className={`tab-filter ${estadoFiltro === 'en_curso' ? 'active' : ''}`} onClick={() => setEstadoFiltro('en_curso')}>🔴 En Vivo</button>
                                <button className={`tab-filter ${estadoFiltro === 'pendiente' ? 'active' : ''}`} onClick={() => setEstadoFiltro('pendiente')}>⏳ Pendientes</button>
                                <button className={`tab-filter ${estadoFiltro === 'finalizado' ? 'active' : ''}`} onClick={() => setEstadoFiltro('finalizado')}>🏁 Finalizados</button>
                                <button className={`tab-filter ${estadoFiltro === 'todos' ? 'active' : ''}`} onClick={() => setEstadoFiltro('todos')}>📋 Todos</button>
                            </div>
                        </div>
                        
                        <div className="p-4 max-w-3xl mx-auto space-y-4">
                            {filtrados.length === 0 ? (
                                <div className="text-center text-zinc-500 font-bold text-xs uppercase tracking-widest italic py-8 border border-white/5 rounded-2xl bg-white/5 mt-10">No hay partidos en esta categoría.</div>
                            ) : (
                                filtrados.map(p => {
                                    let estadoColor = p.estado === 'en_curso' ? '#34d399' : (p.estado === 'finalizado' ? '#94a3b8' : '#fbbf24');
                                    let estadoTexto = p.estado === 'en_curso' ? '🔴 EN VIVO' : (p.estado === 'finalizado' ? '🏁 FINALIZADO' : '⏳ PENDIENTE');
                                    let isFin = p.estado === 'finalizado';

                                    return (
                                        <div key={p.id} onClick={() => window.location.href=`espectador.html?partido=${p.id}`} 
                                             className={`bg-slate-900/80 p-4 rounded-[16px] border border-white/10 cursor-pointer transition-all ${isFin ? 'opacity-60 grayscale-[50%]' : 'hover:border-cyan-400 hover:shadow-[0_0_20px_rgba(6,182,212,0.2)]'}`}>
                                            
                                            <div className="flex justify-between items-center mb-3">
                                                <span className="font-bold text-[11px] text-cyan-400">MESA {p.mesa || 1} <span className="text-zinc-500 ml-2 font-normal">⏰ {p.hora}</span></span>
                                                <span style={{color: estadoColor, borderColor: estadoColor}} className="border px-2 py-1 rounded-full text-[8px] font-black uppercase">{estadoTexto}</span>
                                            </div>
                                            
                                            <div className="text-[9px] text-zinc-400 font-bold uppercase mb-3 bg-white/5 inline-block px-2 py-1 rounded">
                                                🏆 {p.categorias?.nombre} • Gpo {p.grupo_nombre}
                                            </div>
                                            
                                            <div className="bg-black/40 rounded-xl p-3 flex justify-between items-center mb-2 border border-white/5">
                                                <span className="font-bold text-sm truncate">{p.j1?.nombre || 'J1'}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-digital text-cyan-400 text-xl font-bold">{p.puntos_j1}</span>
                                                    <span className="text-xs text-zinc-500 font-bold">({p.sets_j1})</span>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-black/40 rounded-xl p-3 flex justify-between items-center border border-white/5">
                                                <span className="font-bold text-sm truncate">{p.j2?.nombre || 'J2'}</span>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-digital text-fuchsia-400 text-xl font-bold">{p.puntos_j2}</span>
                                                    <span className="text-xs text-zinc-500 font-bold">({p.sets_j2})</span>
                                                </div>
                                            </div>
                                            
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>
                )
            }

            // VISTA: H2H PÚBLICO
            if (view === 'h2h') {
                let p1Wins = 0, p2Wins = 0;
                h2hHistory.forEach(h => {
                    if (h.ganador_id === partidoData.jugador1_id) p1Wins++;
                    if (h.ganador_id === partidoData.jugador2_id) p2Wins++;
                });

                return (
                    <div className="fixed inset-0 bg-[#04060a] p-6 overflow-y-auto z-50 text-white flex flex-col items-center">
                        <div className="mt-8 text-center text-rose-500 font-bold uppercase tracking-widest text-xs mb-2 animate-pulse">🔴 Transmisión Oficial</div>
                        <h1 className="text-2xl md:text-3xl font-black text-cyan-400 mb-6 uppercase tracking-widest text-center">Frente a Frente</h1>
                        
                        <div className="flex w-full max-w-md justify-between items-center bg-slate-900/50 p-6 rounded-[30px] border border-white/10 mb-8 shadow-[0_0_30px_rgba(6,182,212,0.1)]">
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-cyan-400 font-bold mb-2">{p1Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p1}</div>
                            </div>
                            <div className="text-2xl font-black italic text-zinc-600">VS</div>
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-fuchsia-400 font-bold mb-2">{p2Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p2}</div>
                            </div>
                        </div>

                        <div className="w-full max-w-md mb-10">
                            {h2hHistory.length === 0 ? (
                                <div className="text-center text-zinc-500 font-bold text-xs uppercase tracking-widest italic py-8 border border-white/5 rounded-2xl bg-white/5">Es la primera vez que se enfrentan en torneos.</div>
                            ) : (
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest border-b border-white/10 pb-2 mb-4">Últimos Enfrentamientos</h3>
                                    {h2hHistory.map(h => (
                                        <div key={h.id} className="bg-white/5 p-4 rounded-xl flex justify-between items-center border border-white/5">
                                            <div>
                                                <div className="text-[11px] font-bold text-cyan-200 uppercase">{h.torneos?.nombre || 'Torneo Anterior'}</div>
                                                <div className="text-[9px] text-zinc-500 font-bold tracking-widest mt-1">{h.torneos?.fecha_evento || ''}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] font-bold uppercase text-white mb-1">🏆 Ganó: {h.ganador_id === partidoData.jugador1_id ? p1 : p2}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-auto mb-6 text-center text-zinc-400 font-bold text-[10px] tracking-[0.2em] uppercase">
                            <i className="fa-solid fa-hourglass-half animate-spin mr-2"></i> Esperando que el juez inicie el partido...
                        </div>
                        <button onClick={() => window.location.href = `espectador.html?torneo=${partidoData.torneo_id}`} className="mt-4 w-full max-w-md py-4 rounded-xl border border-white/20 text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-colors">Volver a Cartelera</button>
                    </div>
                )
            }

            // VISTA: SCOREBOARD PÚBLICO EN VIVO
            return (
                <div className="fixed inset-0 flex flex-col z-50 bg-[#04060a] overflow-hidden">
                    <div className="glass-dark py-3 px-6 flex justify-between items-center text-white shrink-0 z-20 border-b border-white/5">
                        <div>
                            <span className="text-[10px] font-bold tracking-[0.2em] text-rose-500 uppercase animate-pulse">🔴 EN VIVO • MESA {partidoData?.mesa || 1}</span>
                            <div className="text-[9px] text-cyan-400 font-bold uppercase mt-1">Formato: {mode === '2-3' ? '2 de 3 Sets' : (mode === '3-5' ? '3 de 5 Sets' : '4 de 7 Sets')}</div>
                        </div>

                        <button onClick={() => setIsMuted(!isMuted)} className={`flex items-center gap-2 px-3 py-1.5 rounded-full font-bold text-[9px] uppercase tracking-widest transition-colors ${isMuted ? 'bg-rose-500/20 text-rose-500 border border-rose-500/50' : 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50'}`}>
                            {isMuted ? <><i className="fa-solid fa-volume-xmark"></i> Voz Apagada</> : <><i className="fa-solid fa-volume-high"></i> Voz Encendida</>}
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col landscape:flex-row w-full p-3 landscape:p-6 gap-4 overflow-hidden min-h-0">
                        {/* JUGADOR 1 */}
                        <div className="flex-1 flex flex-col min-h-0 min-w-0">
                            <div className="name-p1 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10"></div> 
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p1}</h2>
                                    <span className="text-[10px] font-black text-cyan-200 mt-1 uppercase tracking-widest">Sets: {sets1}</span>
                                </div>
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets1}</div>
                            </div>
                            <div className="flex-1 card-score score-p1 rounded-[30px] flex flex-col items-center justify-center relative overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score1}</div>
                            </div>
                        </div>

                        <div className="flex flex-row landscape:flex-col items-center justify-center gap-3 shrink-0 py-1 landscape:py-0 z-20">
                            <div className="text-zinc-600 font-black italic text-2xl">VS</div>
                        </div>

                        {/* JUGADOR 2 */}
                        <div className="flex-1 flex flex-col min-h-0 min-w-0">
                            <div className="name-p2 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets2}</div>
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p2}</h2>
                                    <span className="text-[10px] font-black text-fuchsia-200 mt-1 uppercase tracking-widest">Sets: {sets2}</span>
                                </div>
                                <div className="w-10"></div>
                            </div>
                            <div className="flex-1 card-score score-p2 rounded-[30px] flex flex-col items-center justify-center relative overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score2}</div>
                            </div>
                        </div>
                    </div>

                    {/* HISTORIAL DE SETS ANTERIORES EN EL ESPECTADOR */}
                    {historialSets.length > 0 && (
                        <div className="bg-slate-900/90 border-t border-white/10 p-3 flex justify-center items-center gap-3 flex-wrap shrink-0">
                            <span className="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Historial:</span>
                            {historialSets.map((s, idx) => (
                                <div key={idx} className="bg-black/50 border border-white/10 px-3 py-1.5 rounded-lg text-center font-semibold text-xs">
                                    <span className="text-zinc-500 text-[8px] block font-bold uppercase mb-0.5">Set {s.numSet}</span>
                                    <span className={s.s1 > s.s2 ? 'text-cyan-400 font-bold' : 'text-zinc-400'}>{s.s1}</span>
                                    <span className="text-zinc-600 mx-1">-</span>
                                    <span className={s.s2 > s.s1 ? 'text-fuchsia-400 font-bold' : 'text-zinc-400'}>{s.s2}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-black py-3 px-6 flex justify-center shrink-0 border-t border-white/5">
                        <button onClick={() => window.location.href = `espectador.html?torneo=${partidoData.torneo_id}`} className="text-zinc-500 font-bold text-[10px] uppercase tracking-widest hover:text-white transition-colors"><i className="fa-solid fa-list mr-2"></i> Ver Cartelera Completa</button>
                    </div>

                    {winner && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-xl z-[600] flex flex-col items-center justify-center text-center p-6 animate-in zoom-in duration-500">
                            <div className="w-20 h-20 rounded-full bg-cyan-600 flex items-center justify-center mb-6"><i className="fa-solid fa-trophy text-3xl text-white"></i></div>
                            <p className="text-cyan-400 font-bold uppercase tracking-[0.4em] text-[10px] mb-3">Ganador del Partido</p>
                            <h2 className="text-[6vh] font-black text-white mb-12 uppercase tracking-widest leading-none">{winner}</h2>
                            <button onClick={() => window.location.href = `espectador.html?torneo=${partidoData.torneo_id}`} className="py-4 px-8 rounded-xl font-black uppercase tracking-widest text-xs bg-white text-black">Ver Siguiente Partido</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
