<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmisión en Vivo - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #04060a; color: white; font-family: 'Sora', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; overflow-x: hidden; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .card-score { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); margin-bottom: 8px; }
        .score-p1 { border-top: 3px solid #06b6d4; box-shadow: 0 8px 0 #020617; }
        .score-p2 { border-top: 3px solid #d946ef; box-shadow: 0 8px 0 #020617; }
        .name-p1 { background-color: #0891b2; box-shadow: 0 6px 0 #164e63; margin-bottom: 6px; }
        .name-p2 { background-color: #c026d3; box-shadow: 0 6px 0 #701a75; margin-bottom: 6px; }
        .glass-dark { background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(20px); }
        
        .tab-filter { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 8px 14px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0; }
        .tab-filter.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(4, 6, 10, 0.95); backdrop-filter: blur(15px); padding: 15px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const { useState, useEffect, useRef } = React;

        const obtenerEstiloCategoria = (catId) => {
            const paleta = [
                { bg: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.5)', text: '#fbbf24' }, 
                { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.5)', text: '#38bdf8' },  
                { bg: 'rgba(217, 70, 239, 0.15)', border: 'rgba(217, 70, 239, 0.5)', text: '#f0abfc' }, 
                { bg: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.5)', text: '#34d399' }, 
                { bg: 'rgba(168, 85, 247, 0.15)', border: 'rgba(168, 85, 247, 0.5)', text: '#c084fc' }  
            ];
            const idx = (catId || 0) % paleta.length;
            return paleta[idx];
        };

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            
            const [activePartidoId, setActivePartidoId] = useState(urlParams.get('partido'));
            const [view, setView] = useState('loading'); 
            
            const [partidoData, setPartidoData] = useState(null);
            const [h2hHistory, setH2hHistory] = useState([]);
            const [lobbyMatches, setLobbyMatches] = useState([]);
            const [errorMsg, setErrorMsg] = useState(null);
            const [estadoFiltro, setEstadoFiltro] = useState('en_curso');

            const [p1, setP1] = useState("");
            const [p2, setP2] = useState("");
            const [score1, setScore1] = useState(0);
            const [score2, setScore2] = useState(0);
            const [sets1, setSets1] = useState(0);
            const [sets2, setSets2] = useState(0);
            const [mode, setMode] = useState('2-3');
            const [historialSets, setHistorialSets] = useState([]);
            const [winner, setWinner] = useState(null);
            
            const [isMuted, setIsMuted] = useState(true);
            const [viewerCount, setViewerCount] = useState(1); 
            
            const [jugadorModal, setJugadorModal] = useState(null);
            const [categoriaResumenSel, setCategoriaResumenSel] = useState(null);

            const matchStateRef = useRef({ p1: '', p2: '', score1: 0, score2: 0 });
            const torneoId = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

            useEffect(() => {
                const userId = 'espectador-' + Math.random().toString(36).substring(2, 10);
                const room = clienteSupabase.channel(`espectadores_torneo_${torneoId}`, {
                    config: { presence: { key: userId } }
                });

                room.on('presence', { event: 'sync' }, () => {
                    const newState = room.presenceState();
                    const numSpectators = Object.keys(newState).length;
                    setViewerCount(numSpectators > 0 ? numSpectators : 1);
                }).subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await room.track({ online_at: new Date().toISOString() });
                    }
                });

                return () => { clienteSupabase.removeChannel(room); };
            }, [torneoId]);

            const entrarAlPartido = (id) => {
                setActivePartidoId(id);
                setIsMuted(false); 
                window.history.pushState({}, '', `?partido=${id}`);
                
                let docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(()=>{});
            };

            const volverACartelera = () => {
                setActivePartidoId(null);
                setIsMuted(true); 
                window.history.pushState({}, '', `?torneo=${partidoData?.torneo_id || torneoId}`);
                
                if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(()=>{});
                else if (document.webkitExitFullscreen && document.fullscreenElement) document.webkitExitFullscreen().catch(()=>{});
            };

            const getApellido = (nombreCompleto) => {
                if(!nombreCompleto) return "";
                const partes = nombreCompleto.trim().split(" ");
                return partes[partes.length - 1];
            };

            const announceScore = (nom1, s1, nom2, s2, isWin = false, winName = "") => {
                if (isMuted || !window.speechSynthesis) return;
                window.speechSynthesis.cancel(); 
                
                const n1 = getApellido(nom1);
                const n2 = getApellido(nom2);
                
                const text = isWin ? `¡Ganador ${winName}!` : `${n1} ${s1}, ${n2} ${s2}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX'; 
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            };

            const timeStringToMinutes = (timeStr) => {
                if (!timeStr) return 0;
                let match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)?/i);
                if (!match) return 0;
                let hrs = parseInt(match[1]);
                let mins = parseInt(match[2]);
                let ampm = match[3] ? match[3].toUpperCase() : null;
                if (ampm === 'PM' && hrs < 12) hrs += 12;
                if (ampm === 'AM' && hrs === 12) hrs = 0;
                return hrs * 60 + mins;
            };

            useEffect(() => {
                let channel;

                if (!activePartidoId) {
                    setView('loading');
                    async function fetchLobby() {
                        const { data } = await clienteSupabase
                            .from('partidos')
                            .select('*, j1:jugador1_id(id, nombre, club), j2:jugador2_id(id, nombre, club), categorias(id, nombre)')
                            .eq('torneo_id', torneoId)
                            .order('hora', { ascending: true })
                            .order('mesa', { ascending: true });
                        
                        setLobbyMatches(data || []);
                        setView('lobby');
                    }
                    fetchLobby();

                    channel = clienteSupabase.channel('public:partidos:lobby')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => fetchLobby())
                        .subscribe();

                } else {
                    setView('loading');
                    setWinner(null); 
                    
                    async function fetchMatch() {
                        const { data, error } = await clienteSupabase
                            .from('partidos')
                            .select('*, j1:jugador1_id(id, nombre), j2:jugador2_id(id, nombre)')
                            .eq('id', activePartidoId)
                            .single();

                        if (error || !data) {
                            setErrorMsg("Partido no encontrado.");
                            setView('error');
                            return;
                        }

                        setPartidoData(data);
                        let nom1 = data.j1 ? data.j1.nombre : 'Jugador 1';
                        let nom2 = data.j2 ? data.j2.nombre : 'Jugador 2';
                        setP1(nom1);
                        setP2(nom2);
                        setScore1(data.puntos_j1 || 0);
                        setScore2(data.puntos_j2 || 0);
                        setSets1(data.sets_j1 || 0);
                        setSets2(data.sets_j2 || 0);
                        setMode(data.modo_juego || '2-3');
                        setHistorialSets(data.historial_sets || []);

                        matchStateRef.current = { p1: nom1, p2: nom2, score1: data.puntos_j1 || 0, score2: data.puntos_j2 || 0 };

                        if (data.estado === 'finalizado') {
                            setWinner(data.ganador_id === data.jugador1_id ? nom1 : nom2);
                            setView('match');
                        } else if (data.estado === 'en_curso') {
                            setView('match');
                        } else {
                            const { data: historial } = await clienteSupabase
                                .from('partidos')
                                .select('*, torneos(nombre, fecha_evento)')
                                .eq('estado', 'finalizado')
                                .or(`and(jugador1_id.eq.${data.jugador1_id},jugador2_id.eq.${data.jugador2_id}),and(jugador1_id.eq.${data.jugador2_id},jugador2_id.eq.${data.jugador1_id})`)
                                .order('created_at', { ascending: false });

                            setH2hHistory(historial || []);
                            setView('h2h');
                        }
                    }
                    fetchMatch();

                    channel = clienteSupabase.channel(`public:partidos:id=eq.${activePartidoId}`)
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'partidos', filter: `id=eq.${activePartidoId}` }, payload => {
                            const m = payload.new;
                            const refs = matchStateRef.current;
                            
                            if (m.puntos_j1 !== refs.score1 || m.puntos_j2 !== refs.score2) {
                                announceScore(refs.p1, m.puntos_j1, refs.p2, m.puntos_j2);
                            }

                            refs.score1 = m.puntos_j1;
                            refs.score2 = m.puntos_j2;
                            setScore1(m.puntos_j1);
                            setScore2(m.puntos_j2);
                            setSets1(m.sets_j1);
                            setSets2(m.sets_j2);
                            setMode(m.modo_juego || '2-3');
                            setHistorialSets(m.historial_sets || []);

                            if (m.estado === 'en_curso') setView('match');
                            if (m.estado === 'finalizado') {
                                setWinner(m.ganador_id === m.jugador1_id ? refs.p1 : refs.p2);
                                setView('match');
                            }
                        })
                        .subscribe();
                }

                return () => { if(channel) clienteSupabase.removeChannel(channel); };
            }, [activePartidoId, torneoId, isMuted]);

            const calcularResumenCategorias = () => {
                const porCategoria = {};

                lobbyMatches.forEach(m => {
                    const catNombre = m.categorias?.nombre || 'General';
                    if (!porCategoria[catNombre]) porCategoria[catNombre] = { id: m.categorias?.id || 0, grupos: {} };
                    
                    const gpoNombre = m.grupo_nombre || 'A';
                    if (!porCategoria[catNombre].grupos[gpoNombre]) {
                        porCategoria[catNombre].grupos[gpoNombre] = {};
                    }

                    const grupoObj = porCategoria[catNombre].grupos[gpoNombre];

                    [m.j1, m.j2].forEach(j => {
                        if (j && j.id && !grupoObj[j.id]) {
                            grupoObj[j.id] = { id: j.id, nombre: j.nombre, club: j.club, pj: 0, pg: 0, pp: 0, pts: 0, ganoA: [] };
                        }
                    });

                    if (m.estado === 'finalizado' && m.j1 && m.j2) {
                        const j1 = grupoObj[m.j1.id];
                        const j2 = grupoObj[m.j2.id];

                        if (j1 && j2) {
                            j1.pj += 1; j2.pj += 1;
                            if (m.ganador_id === m.jugador1_id) {
                                j1.pg += 1; j1.pts += 2; j1.ganoA.push(getApellido(m.j2.nombre));
                                j2.pp += 1; j2.pts += 1;
                            } else if (m.ganador_id === m.jugador2_id) {
                                j2.pg += 1; j2.pts += 2; j2.ganoA.push(getApellido(m.j1.nombre));
                                j1.pp += 1; j1.pts += 1;
                            }
                        }
                    }
                });

                return porCategoria;
            };

            if (view === 'loading') return <div className="min-h-screen flex items-center justify-center text-cyan-400 font-bold uppercase tracking-widest text-sm">Cargando Transmisión...</div>;
            if (view === 'error') return <div className="min-h-screen flex items-center justify-center text-rose-500 font-bold uppercase">{errorMsg}</div>;

            // ==========================================
            // VISTA CARTELERA / RESUMEN
            // ==========================================
            if (view === 'lobby') {
                const resumenData = calcularResumenCategorias();
                const listaCategoriasNombres = Object.keys(resumenData);

                let catNombreActual = categoriaResumenSel || (listaCategoriasNombres[0] || null);

                // VERIFICAR SI TODOS LOS PARTIDOS DE GRUPO DE ESTA CATEGORÍA FINALIZARON
                const partidosCat = lobbyMatches.filter(m => (m.categorias?.nombre || 'General') === catNombreActual);
                const totalPartidosGpo = partidosCat.length;
                const finalizadosGpo = partidosCat.filter(m => m.estado === 'finalizado').length;
                const gpoCompleto = totalPartidosGpo > 0 && totalPartidosGpo === finalizadosGpo;

                return (
                    <div className="min-h-screen bg-[#04060a] overflow-x-hidden text-white pb-10">
                        
                        <div className="sticky-header">
                            <div className="text-center mb-4">
                                <div className="flex justify-center items-center gap-3 mb-1">
                                    <div className="text-rose-500 font-bold uppercase tracking-widest text-[9px] animate-pulse">🔴 Transmisiones Oficiales</div>
                                    <div className="text-zinc-400 font-bold text-[9px] uppercase tracking-widest bg-white/5 border border-white/10 px-2 py-0.5 rounded-full">
                                        <i className="fa-solid fa-eye text-cyan-400 mr-1"></i> {viewerCount}
                                    </div>
                                </div>
                                <h1 className="text-lg font-black text-cyan-400 uppercase tracking-widest">Cartelera</h1>
                            </div>
                            
                            <div className="flex justify-start sm:justify-center gap-2 px-6 overflow-x-auto no-scrollbar pb-2">
                                <button className={`tab-filter ${estadoFiltro === 'en_curso' ? 'active' : ''}`} onClick={() => setEstadoFiltro('en_curso')}>🔴 En Vivo</button>
                                <button className={`tab-filter ${estadoFiltro === 'resumen' ? 'active' : ''}`} onClick={() => setEstadoFiltro('resumen')}>📊 Resumen y Llaves</button>
                                <button className={`tab-filter ${estadoFiltro === 'pendiente' ? 'active' : ''}`} onClick={() => setEstadoFiltro('pendiente')}>⏳ Pendientes</button>
                                <button className={`tab-filter ${estadoFiltro === 'finalizado' ? 'active' : ''}`} onClick={() => setEstadoFiltro('finalizado')}>🏁 Finalizados</button>
                                <button className={`tab-filter ${estadoFiltro === 'todos' ? 'active' : ''}`} onClick={() => setEstadoFiltro('todos')}>📋 Todos</button>
                            </div>
                        </div>

                        {estadoFiltro === 'resumen' ? (
                            <div className="p-4 max-w-4xl mx-auto space-y-6">
                                
                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1 justify-center">
                                    {listaCategoriasNombres.map(cat => (
                                        <button key={cat} onClick={() => setCategoriaResumenSel(cat)}
                                                className={`px-4 py-2 rounded-xl font-extrabold text-[10px] uppercase border transition-all ${catNombreActual === cat ? 'bg-amber-500/20 border-amber-500 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]' : 'bg-slate-900 border-white/10 text-zinc-400'}`}>
                                            🏆 {cat}
                                        </button>
                                    ))}
                                </div>

                                {catNombreActual && resumenData[catNombreActual] ? (
                                    <div className="space-y-6">
                                        
                                        {Object.keys(resumenData[catNombreActual].grupos).sort().map(gpoNombre => {
                                            const jugadoresMap = resumenData[catNombreActual].grupos[gpoNombre];
                                            const listaJugadores = Object.values(jugadoresMap).sort((a,b) => b.pts - a.pts || b.pg - a.pg);

                                            return (
                                                <div key={gpoNombre} className="bg-slate-900/80 rounded-2xl p-4 border border-white/10 shadow-lg">
                                                    <div className="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
                                                        <span className="font-extrabold text-sm text-cyan-400 uppercase tracking-wider"><i className="fa-solid fa-users mr-2"></i> Grupo {gpoNombre}</span>
                                                        <span className="text-[9px] text-zinc-500 font-bold uppercase">Haz click en un jugador para ver sus partidos</span>
                                                    </div>

                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-left text-xs">
                                                            <thead>
                                                                <tr className="text-[9px] text-zinc-400 font-black uppercase border-b border-white/10">
                                                                    <th className="py-2 px-2">Pos</th>
                                                                    <th className="py-2 px-2">Jugador</th>
                                                                    <th className="py-2 px-1 text-center">PJ</th>
                                                                    <th className="py-2 px-1 text-center">PG</th>
                                                                    <th className="py-2 px-1 text-center">PP</th>
                                                                    <th className="py-2 px-2 text-center text-amber-400 font-bold">Pts</th>
                                                                    <th className="py-2 px-2">Ganó a:</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {listaJugadores.map((j, idx) => (
                                                                    <tr key={j.id} onClick={() => setJugadorModal(j)}
                                                                        className="border-b border-white/5 hover:bg-cyan-500/10 cursor-pointer transition-colors">
                                                                        <td className="py-3 px-2 font-black text-zinc-500">#{idx + 1}</td>
                                                                        <td className="py-3 px-2">
                                                                            <strong className="text-white text-xs block truncate">{j.nombre}</strong>
                                                                            <span className="text-[9px] text-zinc-500 font-bold block">{j.club || 'Sin Club'}</span>
                                                                        </td>
                                                                        <td className="py-3 px-1 text-center font-bold text-zinc-400">{j.pj}</td>
                                                                        <td className="py-3 px-1 text-center font-bold text-emerald-400">{j.pg}</td>
                                                                        <td className="py-3 px-1 text-center font-bold text-rose-400">{j.pp}</td>
                                                                        <td className="py-3 px-2 text-center font-black text-amber-400 text-sm">{j.pts}</td>
                                                                        <td className="py-3 px-2 text-[10px] text-zinc-300">
                                                                            {j.ganoA.length > 0 ? (
                                                                                <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/30 font-bold">{j.ganoA.join(', ')}</span>
                                                                            ) : <span className="text-zinc-600 italic">-</span>}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            );
                                        })}

                                        {/* LLAVES ELIMINATORIAS CON BANNER CLARO DE ESTADO */}
                                        <div className="bg-slate-900/90 rounded-2xl p-5 border border-amber-500/30 shadow-xl mt-8">
                                            <div className="text-center mb-4">
                                                <span className="text-amber-400 text-[10px] font-extrabold uppercase tracking-widest block mb-1">Fase Final de Eliminatoria Directa</span>
                                                <h3 className="text-lg font-black text-white uppercase tracking-wider">🏆 Cuadro de Llaves</h3>
                                            </div>

                                            {/* BANNER INDICADOR DE ESTADO EN TIEMPO REAL */}
                                            {gpoCompleto ? (
                                                <div className="bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 p-3 rounded-xl text-center font-extrabold text-[11px] uppercase tracking-widest mb-6 animate-pulse">
                                                    ✅ ¡LLAVE DEFINITIVA CONFIRMADA! (Fase de grupos 100% completada)
                                                </div>
                                            ) : (
                                                <div className="bg-amber-500/20 border border-amber-500/50 text-amber-400 p-3 rounded-xl text-center font-extrabold text-[10px] uppercase tracking-widest mb-6">
                                                    ⏳ PROYECCIÓN EN TIEMPO REAL (Resultados preliminares según partidos jugados hasta el momento)
                                                </div>
                                            )}

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {/* CRUCE 1 */}
                                                <div className="bg-black/40 p-4 rounded-xl border border-white/10 space-y-3">
                                                    <span className="text-[9px] text-cyan-400 font-extrabold uppercase tracking-wider block border-b border-white/10 pb-1">Semifinal / Cruce 1</span>
                                                    
                                                    <div className="flex justify-between items-center bg-white/5 p-2.5 rounded-lg border border-white/5">
                                                        <span className="text-xs font-extrabold text-white">
                                                            🥇 {resumenData[catNombreActual]?.grupos['A'] && Object.values(resumenData[catNombreActual].grupos['A'])[0]?.nombre ? Object.values(resumenData[catNombreActual].grupos['A'])[0].nombre : '1° Grupo A'}
                                                        </span>
                                                        <span className="text-[9px] bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded">1° Gpo A</span>
                                                    </div>

                                                    <div className="text-center text-[10px] text-zinc-600 font-black italic">VS</div>

                                                    <div className="flex justify-between items-center bg-white/5 p-2.5 rounded-lg border border-white/5">
                                                        <span className="text-xs font-extrabold text-white">
                                                            🥈 {resumenData[catNombreActual]?.grupos['B'] && Object.values(resumenData[catNombreActual].grupos['B'])[1]?.nombre ? Object.values(resumenData[catNombreActual].grupos['B'])[1].nombre : '2° Grupo B'}
                                                        </span>
                                                        <span className="text-[9px] bg-cyan-500/20 text-cyan-400 font-bold px-2 py-0.5 rounded">2° Gpo B</span>
                                                    </div>
                                                </div>

                                                {/* CRUCE 2 */}
                                                <div className="bg-black/40 p-4 rounded-xl border border-white/10 space-y-3">
                                                    <span className="text-[9px] text-fuchsia-400 font-extrabold uppercase tracking-wider block border-b border-white/10 pb-1">Semifinal / Cruce 2</span>
                                                    
                                                    <div className="flex justify-between items-center bg-white/5 p-2.5 rounded-lg border border-white/5">
                                                        <span className="text-xs font-extrabold text-white">
                                                            🥇 {resumenData[catNombreActual]?.grupos['B'] && Object.values(resumenData[catNombreActual].grupos['B'])[0]?.nombre ? Object.values(resumenData[catNombreActual].grupos['B'])[0].nombre : '1° Grupo B'}
                                                        </span>
                                                        <span className="text-[9px] bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded">1° Gpo B</span>
                                                    </div>

                                                    <div className="text-center text-[10px] text-zinc-600 font-black italic">VS</div>

                                                    <div className="flex justify-between items-center bg-white/5 p-2.5 rounded-lg border border-white/5">
                                                        <span className="text-xs font-extrabold text-white">
                                                            🥈 {resumenData[catNombreActual]?.grupos['A'] && Object.values(resumenData[catNombreActual].grupos['A'])[1]?.nombre ? Object.values(resumenData[catNombreActual].grupos['A'])[1].nombre : '2° Grupo A'}
                                                        </span>
                                                        <span className="text-[9px] bg-cyan-500/20 text-cyan-400 font-bold px-2 py-0.5 rounded">2° Gpo A</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* LA GRAN FINAL */}
                                            <div className="mt-6 pt-4 border-t border-white/10 text-center">
                                                <div className="bg-gradient-to-r from-amber-500/10 via-yellow-500/20 to-amber-500/10 p-4 rounded-xl border border-amber-500/40 inline-block w-full max-w-md">
                                                    <span className="text-amber-400 font-black text-xs uppercase tracking-widest block mb-2">🏆 Gran Final de Categoría</span>
                                                    <div className="flex justify-around items-center text-xs font-extrabold">
                                                        <span>Ganador Cruce 1</span>
                                                        <span className="text-amber-400 italic">VS</span>
                                                        <span>Ganador Cruce 2</span>
                                                    </div>
                                                </div>
                                            </div>

                                        </div>

                                    </div>
                                ) : (
                                    <div className="text-center text-zinc-500 font-bold text-xs uppercase italic py-10">No hay datos suficientes para calcular posiciones.</div>
                                )}

                            </div>
                        ) : (
                            <div className="p-4 max-w-3xl mx-auto space-y-4">
                                {(() => {
                                    let filtrados = lobbyMatches;
                                    if (estadoFiltro === 'en_curso') filtrados = lobbyMatches.filter(p => p.estado === 'en_curso');
                                    else if (estadoFiltro === 'pendiente') filtrados = lobbyMatches.filter(p => p.estado === 'pendiente');
                                    else if (estadoFiltro === 'finalizado') filtrados = lobbyMatches.filter(p => p.estado === 'finalizado');

                                    filtrados.sort((a, b) => timeStringToMinutes(a.hora) - timeStringToMinutes(b.hora));

                                    if (filtrados.length === 0) {
                                        return <div className="text-center text-zinc-500 font-bold text-xs uppercase tracking-widest italic py-8 border border-white/5 rounded-2xl bg-white/5 mt-10">No hay partidos en esta categoría.</div>;
                                    }

                                    return filtrados.map(p => {
                                        let estadoColor = p.estado === 'en_curso' ? '#34d399' : (p.estado === 'finalizado' ? '#94a3b8' : '#fbbf24');
                                        let estadoTexto = p.estado === 'en_curso' ? '🔴 EN VIVO' : (p.estado === 'finalizado' ? '🏁 FINALIZADO' : '⏳ PENDIENTE');
                                        
                                        let isFin = p.estado === 'finalizado';
                                        let isJ1Win = p.ganador_id === p.jugador1_id;
                                        let isJ2Win = p.ganador_id === p.jugador2_id;

                                        const catObj = p.categorias || {};
                                        const estiloCat = obtenerEstiloCategoria(catObj.id || 0);

                                        return (
                                            <div key={p.id} onClick={() => entrarAlPartido(p.id)} 
                                                 className={`bg-slate-900/80 p-4 rounded-[16px] border border-white/10 cursor-pointer transition-all ${isFin ? 'opacity-90 border-slate-800' : 'hover:border-cyan-400 hover:shadow-[0_0_20px_rgba(6,182,212,0.2)]'}`}>
                                                
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="font-bold text-[11px] text-cyan-400">MESA {p.mesa || 1} <span className="text-zinc-500 ml-2 font-normal">⏰ {p.hora}</span></span>
                                                    <span style={{color: estadoColor, borderColor: estadoColor}} className="border px-2 py-1 rounded-full text-[8px] font-black uppercase">{estadoTexto}</span>
                                                </div>
                                                
                                                <div style={{ color: estiloCat.text, backgroundColor: estiloCat.bg, borderColor: estiloCat.border }} 
                                                     className="text-[9px] font-bold uppercase mb-3 border inline-block px-2 py-1 rounded">
                                                    🏆 {catObj.nombre || 'Categoría'} • Gpo {p.grupo_nombre}
                                                </div>
                                                
                                                <div className="bg-black/40 rounded-xl p-3 flex justify-between items-center mb-2 border border-white/5">
                                                    <span className={`font-bold text-sm truncate ${isFin && !isJ1Win ? 'text-zinc-500' : 'text-white'}`}>
                                                        {isFin && isJ1Win ? '🏆 ' : ''}{p.j1?.nombre || 'J1'}
                                                    </span>
                                                    <div className="flex items-center gap-3">
                                                        <span className={`font-digital text-xl font-bold ${isFin && !isJ1Win ? 'text-zinc-600' : 'text-cyan-400'}`}>
                                                            {isFin ? p.sets_j1 : p.puntos_j1}
                                                        </span>
                                                        {!isFin && <span className="text-xs text-zinc-500 font-bold">({p.sets_j1})</span>}
                                                    </div>
                                                </div>
                                                
                                                <div className="bg-black/40 rounded-xl p-3 flex justify-between items-center border border-white/5">
                                                    <span className={`font-bold text-sm truncate ${isFin && !isJ2Win ? 'text-zinc-500' : 'text-white'}`}>
                                                        {isFin && isJ2Win ? '🏆 ' : ''}{p.j2?.nombre || 'J2'}
                                                    </span>
                                                    <div className="flex items-center gap-3">
                                                        <span className={`font-digital text-xl font-bold ${isFin && !isJ2Win ? 'text-zinc-600' : 'text-fuchsia-400'}`}>
                                                            {isFin ? p.sets_j2 : p.puntos_j2}
                                                        </span>
                                                        {!isFin && <span className="text-xs text-zinc-500 font-bold">({p.sets_j2})</span>}
                                                    </div>
                                                </div>

                                                {isFin && p.historial_sets && p.historial_sets.length > 0 && (
                                                    <div className="flex gap-2 flex-wrap mt-3 justify-center pt-3 border-t border-white/10 border-dashed">
                                                        <span className="text-[9px] text-zinc-500 font-bold uppercase flex items-center mr-1">Sets:</span>
                                                        {p.historial_sets.map((s, idx) => (
                                                            <span key={idx} className="text-[10px] bg-black/60 px-2 py-1 rounded font-bold">
                                                                <span className={s.s1 > s.s2 ? "text-cyan-400" : "text-zinc-500"}>{s.s1}</span>
                                                                <span className="text-zinc-600 mx-1">-</span>
                                                                <span className={s.s2 > s.s1 ? "text-fuchsia-400" : "text-zinc-500"}>{s.s2}</span>
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                                
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        )}

                        {/* MODAL DETALLE DE PARTIDOS DE UN JUGADOR */}
                        {jugadorModal && (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-white/20 rounded-2xl w-full max-w-lg p-5 text-white max-h-[85vh] overflow-y-auto">
                                    <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                                        <div>
                                            <h3 className="font-black text-lg text-cyan-400 uppercase">{jugadorModal.nombre}</h3>
                                            <span className="text-[10px] text-zinc-400 font-bold">{jugadorModal.club || 'Sin Club'}</span>
                                        </div>
                                        <button onClick={() => setJugadorModal(null)} className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white font-bold">✕</button>
                                    </div>

                                    <div className="space-y-3">
                                        <h4 className="text-[10px] font-extrabold uppercase text-amber-400 tracking-wider">Historial de Partidos en este Torneo:</h4>
                                        
                                        {(() => {
                                            const partidosDelJugador = lobbyMatches.filter(m => m.j1?.id === jugadorModal.id || m.j2?.id === jugadorModal.id);
                                            
                                            if (partidosDelJugador.length === 0) return <div className="text-xs text-zinc-500 italic">No hay partidos registrados.</div>;

                                            return partidosDelJugador.map(m => {
                                                const esJ1 = m.j1?.id === jugadorModal.id;
                                                const rival = esJ1 ? m.j2?.nombre : m.j1?.nombre;
                                                const misSets = esJ1 ? m.sets_j1 : m.sets_j2;
                                                const rivalSets = esJ1 ? m.sets_j2 : m.sets_j1;
                                                const gano = m.ganador_id === jugadorModal.id;
                                                const esFin = m.estado === 'finalizado';

                                                return (
                                                    <div key={m.id} className="bg-black/50 p-3 rounded-xl border border-white/5 space-y-2">
                                                        <div className="flex justify-between items-center text-xs">
                                                            <span className="font-bold text-zinc-300">vs <strong className="text-white">{rival}</strong></span>
                                                            {esFin ? (
                                                                <span className={`px-2 py-0.5 rounded font-black text-[9px] uppercase ${gano ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                                    {gano ? '¡GANÓ!' : 'PERDIÓ'} ({misSets} - {rivalSets})
                                                                </span>
                                                            ) : <span className="text-[9px] text-amber-400 font-bold bg-amber-500/10 px-2 py-0.5 rounded">⏳ {m.hora}</span>}
                                                        </div>

                                                        {m.historial_sets && m.historial_sets.length > 0 && (
                                                            <div className="flex gap-2 flex-wrap pt-1 border-t border-white/5">
                                                                {m.historial_sets.map((s, idx) => (
                                                                    <span key={idx} className="text-[9px] bg-white/5 px-2 py-1 rounded font-bold">
                                                                        Set {s.numSet}: <span className="text-cyan-400">{esJ1 ? s.s1 : s.s2}</span> - <span className="text-fuchsia-400">{esJ1 ? s.s2 : s.s1}</span>
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            });
                                        })()}
                                    </div>

                                    <button onClick={() => setJugadorModal(null)} className="w-full mt-6 py-3 bg-cyan-500 text-black font-black uppercase text-xs rounded-xl tracking-widest">
                                        Cerrar Detalle
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                )
            }

            // VISTA: H2H PÚBLICO
            if (view === 'h2h') {
                let p1Wins = 0, p2Wins = 0;
                h2hHistory.forEach(h => {
                    if (h.ganador_id === partidoData.jugador1_id) p1Wins++;
                    if (h.ganador_id === partidoData.jugador2_id) p2Wins++;
                });

                return (
                    <div className="fixed inset-0 bg-[#04060a] p-6 overflow-y-auto z-50 text-white flex flex-col items-center">
                        <div className="mt-8 text-center text-rose-500 font-bold uppercase tracking-widest text-xs mb-2 flex items-center justify-center gap-3">
                            <span className="animate-pulse">🔴 Transmisión Oficial</span>
                            <span className="text-zinc-400 font-bold text-[9px] uppercase tracking-widest bg-white/5 border border-white/10 px-2 py-0.5 rounded-full not-italic">
                                <i className="fa-solid fa-eye text-cyan-400 mr-1"></i> {viewerCount}
                            </span>
                        </div>
                        <h1 className="text-2xl md:text-3xl font-black text-cyan-400 mb-6 uppercase tracking-widest text-center">Frente a Frente</h1>
                        
                        <div className="flex w-full max-w-md justify-between items-center bg-slate-900/50 p-6 rounded-[30px] border border-white/10 mb-8 shadow-[0_0_30px_rgba(6,182,212,0.1)]">
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-cyan-400 font-bold mb-2">{p1Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p1}</div>
                            </div>
                            <div className="text-2xl font-black italic text-zinc-600">VS</div>
                            <div className="text-center w-1/3">
                                <div className="text-5xl font-digital text-fuchsia-400 font-bold mb-2">{p2Wins}</div>
                                <div className="text-xs font-bold uppercase truncate">{p2}</div>
                            </div>
                        </div>

                        <div className="w-full max-w-md mb-10">
                            {h2hHistory.length === 0 ? (
                                <div className="text-center text-zinc-500 font-bold text-xs uppercase tracking-widest italic py-8 border border-white/5 rounded-2xl bg-white/5">
                                    ES LA PRIMERA VEZ QUE SE ENFRENTAN EN TORNEOS.
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest border-b border-white/10 pb-2 mb-4">Últimos Enfrentamientos</h3>
                                    {h2hHistory.map(h => (
                                        <div key={h.id} className="bg-white/5 p-4 rounded-xl flex justify-between items-center border border-white/5">
                                            <div>
                                                <div className="text-[11px] font-bold text-cyan-200 uppercase">{h.torneos?.nombre || 'Torneo Anterior'}</div>
                                                <div className="text-[9px] text-zinc-500 font-bold tracking-widest mt-1">{h.torneos?.fecha_evento || ''}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[10px] font-bold uppercase text-white mb-1">🏆 Ganó: {h.ganador_id === partidoData.jugador1_id ? p1 : p2}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-auto mb-6 text-center text-zinc-400 font-bold text-[10px] tracking-[0.2em] uppercase">
                            <i className="fa-solid fa-hourglass-half animate-spin mr-2"></i> Esperando que el juez inicie el partido...
                        </div>
                        <button onClick={volverACartelera} className="mt-4 w-full max-w-md py-4 rounded-xl border border-white/20 text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-colors">Volver a Cartelera</button>
                    </div>
                )
            }

            // VISTA: SCOREBOARD PÚBLICO EN VIVO
            return (
                <div className="fixed inset-0 flex flex-col z-50 bg-[#04060a] overflow-hidden">
                    <div className="glass-dark py-2 px-3 flex justify-between items-center text-white shrink-0 z-20 border-b border-white/5">
                        <button onClick={volverACartelera} className="flex items-center gap-1 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest text-white transition-colors shrink-0">
                            <i className="fa-solid fa-arrow-left"></i> <span className="hidden sm:inline ml-1">Volver</span>
                        </button>

                        <div className="text-center flex-1 px-2">
                            <span className="text-[10px] font-bold tracking-[0.2em] text-rose-500 uppercase animate-pulse block truncate">🔴 MESA {partidoData?.mesa || 1}</span>
                            <div className="text-[8px] text-cyan-400 font-bold uppercase mt-0.5 truncate">Formato: {mode === '2-3' ? '2 de 3' : (mode === '3-5' ? '3 de 5' : '4 de 7')} Sets</div>
                        </div>

                        <div className="flex items-center gap-2">
                            <div className="text-zinc-400 font-bold text-[9px] uppercase tracking-widest bg-white/5 border border-white/10 px-2 py-1.5 rounded-full flex items-center">
                                <i className="fa-solid fa-eye text-cyan-400 mr-1"></i> {viewerCount}
                            </div>
                            <button onClick={() => setIsMuted(!isMuted)} className={`flex items-center justify-center w-8 h-8 rounded-full transition-colors shrink-0 ${isMuted ? 'bg-rose-500/20 text-rose-500 border border-rose-500/50' : 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50'}`}>
                                {isMuted ? <i className="fa-solid fa-volume-xmark"></i> : <i className="fa-solid fa-volume-high"></i>}
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col landscape:flex-row w-full p-3 landscape:p-6 gap-4 overflow-hidden min-h-0">
                        <div className="flex-1 flex flex-col min-h-0 min-w-0">
                            <div className="name-p1 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10"></div> 
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p1}</h2>
                                    <span className="text-[10px] font-black text-cyan-200 mt-1 uppercase tracking-widest">Sets: {sets1}</span>
                                </div>
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets1}</div>
                            </div>
                            <div className="flex-1 card-score score-p1 rounded-[30px] flex flex-col items-center justify-center relative overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score1}</div>
                            </div>
                        </div>

                        <div className="flex flex-row landscape:flex-col items-center justify-center gap-3 shrink-0 py-1 landscape:py-0 z-20">
                            <div className="text-zinc-600 font-black italic text-2xl">VS</div>
                        </div>

                        <div className="flex-1 flex flex-col min-h-0 min-w-0">
                            <div className="name-p2 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0">
                                <div className="w-10 h-10 bg-black/30 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets2}</div>
                                <div className="flex flex-col items-center">
                                    <h2 className="text-white text-center font-extrabold text-xl landscape:text-2xl tracking-wider uppercase leading-none">{p2}</h2>
                                    <span className="text-[10px] font-black text-fuchsia-200 mt-1 uppercase tracking-widest">Sets: {sets2}</span>
                                </div>
                                <div className="w-10"></div>
                            </div>
                            <div className="flex-1 card-score score-p2 rounded-[30px] flex flex-col items-center justify-center relative overflow-hidden min-h-0">
                                <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none">{score2}</div>
                            </div>
                        </div>
                    </div>

                    {historialSets.length > 0 && (
                        <div className="bg-slate-900/90 border-t border-white/10 p-3 flex justify-center items-center gap-3 flex-wrap shrink-0">
                            <span className="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Historial:</span>
                            {historialSets.map((s, idx) => (
                                <div key={idx} className="bg-black/50 border border-white/10 px-3 py-1.5 rounded-lg text-center font-semibold text-xs">
                                    <span className="text-zinc-500 text-[8px] block font-bold uppercase mb-0.5">Set {s.numSet}</span>
                                    <span className={s.s1 > s.s2 ? 'text-cyan-400 font-bold' : 'text-zinc-400'}>{s.s1}</span>
                                    <span className="text-zinc-600 mx-1">-</span>
                                    <span className={s.s2 > s.s1 ? 'text-fuchsia-400 font-bold' : 'text-zinc-400'}>{s.s2}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {winner && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-xl z-[600] flex flex-col items-center justify-center text-center p-6 animate-in zoom-in duration-500">
                            <div className="w-20 h-20 rounded-full bg-cyan-600 flex items-center justify-center mb-6"><i className="fa-solid fa-trophy text-3xl text-white"></i></div>
                            <p className="text-cyan-400 font-bold uppercase tracking-[0.4em] text-[10px] mb-3">Ganador del Partido</p>
                            <h2 className="text-[6vh] font-black text-white mb-12 uppercase tracking-widest leading-none">{winner}</h2>
                            <button onClick={volverACartelera} className="py-4 px-8 rounded-xl font-black uppercase tracking-widest text-xs bg-white text-black">Ver Cartelera de Partidos</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
