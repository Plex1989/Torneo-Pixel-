<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Forzamos la resolución a 1920px para que PRISM Live detecte un lienzo fijo y te dé el cuadro sombreado -->
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Overlay de Transmisión - Torneo Pixel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Orbitron:wght@700;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body {
            width: 1920px;
            height: 1080px;
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden;
            font-family: 'Sora', sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* CARÁTULA DE PORTADA / MINIATURA (PRIMEROS 5 SEGUNDOS) */
        #caratula-portada {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 9999;
            background: radial-gradient(circle at center, #0b1329 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            box-sizing: border-box;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .portada-box {
            width: 1600px;
            background: rgba(15, 23, 42, 0.95);
            border: 6px solid #38bdf8;
            box-shadow: 0 0 80px rgba(56, 189, 248, 0.35);
            border-radius: 40px;
            padding: 60px 40px;
            text-align: center;
        }

        .badge-torneo {
            display: inline-block;
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 15px 35px;
            border-radius: 9999px;
            margin-bottom: 30px;
        }

        .portada-info-partido {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .duelo-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 40px;
            margin: 30px 0;
            width: 100%;
        }

        .jugador-portada {
            flex: 1;
            padding: 20px;
            width: 40%;
        }

        .nombre-gigante {
            font-family: 'Montserrat', sans-serif;
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            word-break: break-word;
        }

        .club-subtitulo {
            font-size: 24px;
            color: #94a3b8;
            font-weight: 700;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .vs-circulo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.2);
            border: 4px solid #ef4444;
            color: #ef4444;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        /* MARCADOR PERMANENTE ESTILO TV BROADCAST */
        #marcador-stream {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 1700px; /* Ancho muy grande dentro de los 1920px */
            background: linear-gradient(90deg, rgba(10, 15, 26, 0.95) 0%, rgba(15, 23, 42, 0.95) 50%, rgba(10, 15, 26, 0.95) 100%);
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-bottom: 8px solid #06b6d4;
            border-radius: 100px;
            padding: 20px 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            white-space: nowrap;
        }

        .mesa-info-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 3px solid rgba(255,255,255,0.1);
            padding-right: 40px;
            min-width: 250px;
        }

        #score-mesa-label {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
        }

        #score-fase-label {
            color: #fbbf24;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .fila-jugador-marcador {
            display: flex;
            align-items: center;
            gap: 30px;
            flex: 1;
        }

        .fila-jugador-marcador.left {
            justify-content: flex-end;
        }
        
        .fila-jugador-marcador.right {
            justify-content: flex-start;
        }

        .marcador-nombre {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            text-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }

        .caja-puntos {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-sets {
            background: rgba(255, 255, 255, 0.1);
            color: #fbbf24;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 32px;
            padding: 8px 24px;
            border-radius: 12px;
            border: 2px solid rgba(251, 191, 36, 0.3);
            text-align: center;
        }

        .badge-puntos {
            background: #06b6d4;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 54px;
            padding: 8px 30px;
            border-radius: 16px;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
        }

        .badge-puntos.p2 {
            background: #d946ef;
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.5);
        }

        .vs-text {
            font-size: 24px;
            font-weight: 900;
            color: #64748b;
            font-style: italic;
            padding: 0 10px;
        }
    </style>
</head>
<body>

    <!-- 1. CARÁTULA GIGANTE DE 5 SEGUNDOS (PARA LA MINIATURA) -->
    <div id="caratula-portada">
        <div class="portada-box">
            <span id="portada-torneo" class="badge-torneo">Torneo Pixel</span>
            <div id="portada-info" class="portada-info-partido">Mesa 1 • Grupo A • Categoría Primera</div>

            <div class="duelo-container">
                <div class="jugador-portada">
                    <div id="portada-j1-nombre" class="nombre-gigante text-cyan-400">Jugador 1</div>
                    <div id="portada-j1-club" class="club-subtitulo">Club México</div>
                </div>

                <div class="vs-circulo">VS</div>

                <div class="jugador-portada">
                    <div id="portada-j2-nombre" class="nombre-gigante text-fuchsia-400">Jugador 2</div>
                    <div id="portada-j2-club" class="club-subtitulo">Club Puebla</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. MARCADOR EN VIVO (BARRA INFERIOR DE 1920px DE ANCHO) -->
    <div id="marcador-stream">
        <div class="mesa-info-bar">
            <span id="score-mesa-label"><i class="fa-solid fa-table-tennis-paddle-ball text-cyan-400 mr-2"></i> MESA 1</span>
            <span id="score-fase-label">FASE DE GRUPOS</span>
        </div>

        <div class="fila-jugador-marcador left">
            <span id="score-j1-nombre" class="marcador-nombre" style="text-align: right;">Jugador 1</span>
            <div class="caja-puntos">
                <span id="score-j1-sets" class="badge-sets">0</span>
                <span id="score-j1-puntos" class="badge-puntos">0</span>
            </div>
        </div>

        <div class="vs-text">VS</div>

        <div class="fila-jugador-marcador right">
            <div class="caja-puntos">
                <span id="score-j2-puntos" class="badge-puntos p2">0</span>
                <span id="score-j2-sets" class="badge-sets">0</span>
            </div>
            <span id="score-j2-nombre" class="marcador-nombre" style="text-align: left;">Jugador 2</span>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const partidoId = urlParams.get('partido');

        // Función que retira la carátula al segundo 5
        function iniciarTemporizadorPortada() {
            setTimeout(() => {
                const portada = document.getElementById('caratula-portada');
                if (portada) {
                    portada.style.opacity = '0';
                    portada.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        portada.style.display = 'none';
                    }, 800);
                }
            }, 5000); 
        }

        async function cargarDatosPartido() {
            if (!partidoId) {
                iniciarTemporizadorPortada();
                return;
            }

            try {
                const { data: p, error } = await clienteSupabase
                    .from('partidos')
                    .select('*, j1:jugador1_id(id, nombre, club), j2:jugador2_id(id, nombre, club), categorias(id, nombre), torneos(nombre)')
                    .eq('id', partidoId)
                    .single();

                if (error || !p) {
                    console.error("Error cargando partido:", error);
                    iniciarTemporizadorPortada();
                    return;
                }

                // Nombres y detalles
                const nomJ1 = p.j1?.nombre || 'Jugador 1';
                const clubJ1 = p.j1?.club || 'Sin Club';
                const nomJ2 = p.j2?.nombre || 'Jugador 2';
                const clubJ2 = p.j2?.club || 'Sin Club';
                const numMesa = p.mesa || 1;
                const catNombre = p.categorias?.nombre || 'Categoría Oficial';
                const fase = p.grupo_nombre 
                    ? (p.grupo_nombre === 'Único' ? 'Liga Única' : (p.grupo_nombre === 'Flash' ? 'Liga Flash' : `Grupo ${p.grupo_nombre}`))
                    : (p.ronda_fase || 'Eliminatoria');

                // 1. Asignar datos a la Carátula de Portada
                document.getElementById('portada-torneo').innerText = p.torneos?.nombre || 'Torneo Pixel';
                document.getElementById('portada-info').innerText = `MESA ${numMesa} • ${fase} • ${catNombre}`;
                document.getElementById('portada-j1-nombre').innerText = nomJ1;
                document.getElementById('portada-j1-club').innerText = clubJ1;
                document.getElementById('portada-j2-nombre').innerText = nomJ2;
                document.getElementById('portada-j2-club').innerText = clubJ2;

                // 2. Asignar datos al Marcador Permanente
                document.getElementById('score-mesa-label').innerHTML = `<i class="fa-solid fa-table-tennis-paddle-ball text-cyan-400 mr-2"></i> MESA ${numMesa}`;
                document.getElementById('score-fase-label').innerText = fase;
                document.getElementById('score-j1-nombre').innerText = nomJ1;
                document.getElementById('score-j2-nombre').innerText = nomJ2;
                document.getElementById('score-j1-sets').innerText = p.sets_j1 || 0;
                document.getElementById('score-j2-sets').innerText = p.sets_j2 || 0;
                document.getElementById('score-j1-puntos').innerText = p.puntos_j1 || 0;
                document.getElementById('score-j2-puntos').innerText = p.puntos_j2 || 0;

                iniciarTemporizadorPortada();

                // 3. Suscripción en tiempo real
                clienteSupabase
                    .channel(`partido-score-${partidoId}`)
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'partidos',
                        filter: `id=eq.${partidoId}`
                    }, (payload) => {
                        const nuevo = payload.new;
                        document.getElementById('score-j1-sets').innerText = nuevo.sets_j1 || 0;
                        document.getElementById('score-j2-sets').innerText = nuevo.sets_j2 || 0;
                        document.getElementById('score-j1-puntos').innerText = nuevo.puntos_j1 || 0;
                        document.getElementById('score-j2-puntos').innerText = nuevo.puntos_j2 || 0;
                    })
                    .subscribe();

            } catch (err) {
                console.error("Error inesperado:", err);
                iniciarTemporizadorPortada();
            }
        }

        window.onload = cargarDatosPartido;
    </script>
</body>
</html>
