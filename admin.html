<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if (localStorage.getItem('admin_autenticado') !== 'true') {
            alert("🔒 Acceso Restringido: Inicia sesión en la Central de Torneos.");
            window.location.href = "torneos.html";
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Orbitron:wght@700;800&display=swap');

        body { font-family: 'Sora', sans-serif; margin: 0; padding: 0; background-color: #04060a; color: #f8fafc; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; animation: pulse-slow 10s infinite alternate; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; animation: pulse-slow 12s infinite alternate-reverse; }
        @keyframes pulse-slow { 0% { transform: scale(1) translate(0px, 0px); } 100% { transform: scale(1.3) translate(40px, -60px); } }

        .navbar { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 50; }
        .nav-title { font-weight: 800; font-size: 15px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { color: #94a3b8; text-decoration: none; padding: 8px 18px; border-radius: 9999px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-btn:hover { color: #000000; background: #f5a623; border-color: #f5a623; box-shadow: 0 0 25px rgba(245, 166, 35, 0.8); transform: translateY(-2px); }
        .nav-btn.active { color: #ffffff; border-color: #8b5cf6; background: rgba(139, 92, 246, 0.3); box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .nav-btn.public { color: #34d399; border-color: rgba(16, 185, 129, 0.5); }
        .nav-btn.public:hover { color: #000000; background: #10b981; border-color: #10b981; box-shadow: 0 0 25px rgba(16, 185, 129, 0.8); }

        .main-content { padding: 30px; max-width: 1100px; margin: auto; position: relative; z-index: 10; }

        .panel-3d { background: rgba(10, 15, 26, 0.45); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.03); padding: 26px; margin-bottom: 26px; transition: all 0.3s ease; }

        .panel-cyan { border-bottom: 5px solid #0e7490; }
        .panel-emerald { border-bottom: 5px solid #064e3b; }
        .panel-amber { border-bottom: 5px solid #451a03; }
        .panel-purple { border-bottom: 5px solid #2e1065; }

        h2, h3 { color: #ffffff; margin-top: 0; padding-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; }

        .tab-filter { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 6px 14px; border-radius: 9999px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; white-space: nowrap; }
        .tab-filter.active { background: #06b6d4; color: #000000; border-color: #38bdf8; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }
        .tab-cat-pill { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }
        .tab-cat-pill.active { background: #f59e0b; color: #000000; border-color: #fbbf24; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }

        .btn-console { display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 9999px; color: #f1f5f9; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
        .btn-console:hover { background: #06b6d4; color: #000000; border-color: #38bdf8; }

        .scrolling-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 15px; scrollbar-width: none; }
        .scrolling-bar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <nav class="navbar no-print">
        <div class="nav-title">CENTRAL DE TORNEOS</div>
        <div class="nav-links">
            <a href="torneos.html" class="nav-btn">Mis Torneos</a>
            <a href="admin.html" class="nav-btn active">Administrador</a>
            <a href="sorteo.html" class="nav-btn">Sorteo y Rol</a>
            <a href="mesas.html" target="_blank" class="nav-btn" style="border-color:#06b6d4; color:#38bdf8;">🏓 Mesas</a>
            <a href="espectador.html" target="_blank" class="nav-btn" style="border-color:#d946ef; color:#f0abfc;">👁️ Espectador</a>
            <a href="index.html" target="_blank" class="nav-btn public">Portal Público</a>
            <button onclick="cerrarSesionAdmin()" class="nav-btn" style="border-color: rgba(239,68,68,0.4); color: #f87171; cursor:pointer;">SALIR</button>
        </div>
    </nav>

    <div class="main-content">
        
        <div class="panel-3d panel-cyan no-print" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 20px 28px;">
            <div>
                <span style="font-size: 9px; font-weight: 800; text-transform: uppercase; color:#a855f7; letter-spacing: 2px;">Torneo Activo en el Sistema</span>
                <h3 id="nombre-torneo-banner" style="margin: 4px 0 0 0; border: none; padding: 0; color:#ffffff; font-size:18px; letter-spacing: 1px;">Cargando...</h3>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn-console btn-ws-style" onclick="compartirLinkInscripcionWS()">📲 LINK INSCRIPCIÓN</button>
                <button class="btn-console btn-purple" onclick="compartirLinkTransmisionWS()">📺 LINK TRANSMISIÓN (FANS)</button>
            </div>
        </div>

        <div class="panel-3d panel-cyan no-print" id="panel-monitoreo-vivo">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 12px; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <h2 style="border: none; margin: 0; padding: 0;">🔴 Monitoreo de Scoreboards</h2>
                    <div id="badge-espectadores" style="display: none; background: rgba(34, 211, 238, 0.15); border: 1px solid rgba(34, 211, 238, 0.4); color: #22d3ee; padding: 4px 10px; border-radius: 9999px; font-weight: 800; font-size: 10px; text-transform: uppercase;">
                        <i class="fa-solid fa-eye mr-1"></i> <span id="contador-espectadores">0</span> Conectados
                    </div>
                </div>

                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="tab-filter active" id="tab-en_curso" onclick="cambiarFiltroEstadoMonitor('en_curso')">🔴 En Vivo</button>
                    <button class="tab-filter" id="tab-pendiente" onclick="cambiarFiltroEstadoMonitor('pendiente')">⏳ Pendientes</button>
                    <button class="tab-filter" id="tab-finalizado" onclick="cambiarFiltroEstadoMonitor('finalizado')">🏁 Finalizados</button>
                    <button class="tab-filter" id="tab-todos" onclick="cambiarFiltroEstadoMonitor('todos')">📋 Todos</button>
                </div>
            </div>

            <!-- FILTRO DE CATEGORÍAS NEÓN EN EL MONITOR DEL ADMIN -->
            <div class="scrolling-bar" id="bar-admin-categorias">
                <button class="tab-filter tab-cat-pill active" onclick="filtrarAdminCategoria('todas')">Todas las Categorías</button>
            </div>

            <div id="grid-mesas-vivo" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:18px;">
                <div class="mensaje-vacio">Cargando partidos...</div>
            </div>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let idTorneoActivo = localStorage.getItem('torneo_activo_id') || 1;
        let torneoActivoObj = null;
        let filtroEstadoMonitor = 'en_curso'; 
        let categoriaFiltroAdmin = 'todas';
        let partidosMonitoreo = [];
        let canalEspectadores = null;

        const obtenerEstiloCategoria = (catId) => {
            const paleta = [
                { bg: 'rgba(245, 158, 11, 0.15)', border: 'rgba(245, 158, 11, 0.5)', text: '#fbbf24' },
                { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.5)', text: '#38bdf8' },
                { bg: 'rgba(217, 70, 239, 0.15)', border: 'rgba(217, 70, 239, 0.5)', text: '#f0abfc' },
                { bg: 'rgba(16, 185, 129, 0.15)', border: 'rgba(16, 185, 129, 0.5)', text: '#34d399' },
                { bg: 'rgba(168, 85, 247, 0.15)', border: 'rgba(168, 85, 247, 0.5)', text: '#c084fc' }
            ];
            const idx = (catId || 0) % paleta.length;
            return paleta[idx];
        };

        function cerrarSesionAdmin() {
            localStorage.removeItem('admin_autenticado');
            window.location.reload();
        }

        async function cargarDatosIniciales() {
            const { data: torneoData } = await clienteSupabase.from('torneos').select('*').eq('id', idTorneoActivo).single();
            if (torneoData) {
                torneoActivoObj = torneoData;
                document.getElementById('nombre-torneo-banner').innerText = `${torneoData.nombre} (${torneoData.fecha_evento || 'Sin Fecha'})`;
            }

            activarSuscripcionEspectadores();
            activarSuscripcionRealtime();
        }

        function activarSuscripcionEspectadores() {
            if (canalEspectadores) clienteSupabase.removeChannel(canalEspectadores);
            canalEspectadores = clienteSupabase.channel(`espectadores_torneo_${idTorneoActivo}`);
            
            canalEspectadores.on('presence', { event: 'sync' }, () => {
                const newState = canalEspectadores.presenceState();
                const numSpectators = Object.keys(newState).length;
                const badge = document.getElementById('badge-espectadores');
                const contador = document.getElementById('contador-espectadores');
                if (numSpectators > 0) {
                    badge.style.display = 'inline-block';
                    contador.innerText = numSpectators;
                } else {
                    badge.style.display = 'none';
                }
            }).subscribe();
        }

        function cambiarFiltroEstadoMonitor(nuevoEstado) {
            filtroEstadoMonitor = nuevoEstado;
            document.querySelectorAll('.tab-filter').forEach(btn => {
                if (!btn.classList.contains('tab-cat-pill')) btn.classList.remove('active');
            });
            document.getElementById(`tab-${nuevoEstado}`).classList.add('active');
            dibujarPartidosMonitor();
        }

        function filtrarAdminCategoria(catNombre) {
            categoriaFiltroAdmin = catNombre;
            generarBotonesCategoriasAdmin();
            dibujarPartidosMonitor();
        }

        function generarBotonesCategoriasAdmin() {
            const bar = document.getElementById('bar-admin-categorias');
            const catsMap = new Map();
            partidosMonitoreo.forEach(p => {
                if (p.categorias && p.categorias.nombre) {
                    catsMap.set(p.categorias.nombre, p.categorias.id);
                }
            });

            let html = `<button class="tab-filter tab-cat-pill ${categoriaFiltroAdmin === 'todas' ? 'active' : ''}" onclick="filtrarAdminCategoria('todas')">Todas las Categorías</button>`;
            catsMap.forEach((id, nombre) => {
                html += `<button class="tab-filter tab-cat-pill ${categoriaFiltroAdmin === nombre ? 'active' : ''}" onclick="filtrarAdminCategoria('${nombre}')">🏆 ${nombre}</button>`;
            });
            bar.innerHTML = html;
        }

        function activarSuscripcionRealtime() {
            clienteSupabase
                .channel('partidos-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos' }, () => {
                    cargarPartidosEnVivo();
                })
                .subscribe();

            cargarPartidosEnVivo();
        }

        function timeStringToMinutes(timeStr) {
            if (!timeStr) return 0;
            let match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)?/i);
            if (!match) return 0;
            let hrs = parseInt(match[1]);
            let mins = parseInt(match[2]);
            let ampm = match[3] ? match[3].toUpperCase() : null;
            if (ampm === 'PM' && hrs < 12) hrs += 12;
            if (ampm === 'AM' && hrs === 12) hrs = 0;
            return hrs * 60 + mins;
        }

        async function cargarPartidosEnVivo() {
            const { data } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(nombre), j2:jugador2_id(nombre), categorias(id, nombre)')
                .eq('torneo_id', idTorneoActivo);

            partidosMonitoreo = data || [];
            generarBotonesCategoriasAdmin();
            dibujarPartidosMonitor();
        }

        function dibujarPartidosMonitor() {
            const grid = document.getElementById('grid-mesas-vivo');
            if (!grid) return;
            grid.innerHTML = '';

            let filtrados = partidosMonitoreo;

            if (filtroEstadoMonitor !== 'todos') {
                filtrados = filtrados.filter(p => (p.estado || '').trim().toLowerCase() === filtroEstadoMonitor);
            }

            if (categoriaFiltroAdmin !== 'todas') {
                filtrados = filtrados.filter(p => p.categorias && p.categorias.nombre === categoriaFiltroAdmin);
            }

            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="mensaje-vacio">No hay partidos registrados bajo este filtro.</div>`;
                return;
            }

            filtrados.sort((a, b) => timeStringToMinutes(a.hora) - timeStringToMinutes(b.hora));

            filtrados.forEach(p => {
                let estLimpio = (p.estado || '').trim().toLowerCase();
                let estadoColor = estLimpio === 'en_curso' ? '#34d399' : (estLimpio === 'finalizado' ? '#94a3b8' : '#fbbf24');
                let estadoTexto = estLimpio === 'en_curso' ? '🔴 EN VIVO' : (estLimpio === 'finalizado' ? '🏁 FINALIZADO' : '⏳ PENDIENTE');
                
                let isFin = estLimpio === 'finalizado';
                let isJ1Win = p.ganador_id === p.jugador1_id;
                let isJ2Win = p.ganador_id === p.jugador2_id;

                let mainScore1 = isFin ? p.sets_j1 : p.puntos_j1;
                let mainScore2 = isFin ? p.sets_j2 : p.puntos_j2;
                let subScore1 = isFin ? '' : `<span style="font-weight:800; font-size:11px; color:#94a3b8;">(${p.sets_j1})</span>`;
                let subScore2 = isFin ? '' : `<span style="font-weight:800; font-size:11px; color:#94a3b8;">(${p.sets_j2})</span>`;
                
                let colorJ1 = (isFin && !isJ1Win) ? '#64748b' : '#ffffff';
                let colorJ2 = (isFin && !isJ2Win) ? '#64748b' : '#ffffff';
                let iconJ1 = (isFin && isJ1Win) ? '🏆 ' : '';
                let iconJ2 = (isFin && isJ2Win) ? '🏆 ' : '';

                let colorScore1 = (isFin && !isJ1Win) ? '#64748b' : '#06b6d4';
                let colorScore2 = (isFin && !isJ2Win) ? '#64748b' : '#d946ef';

                const catObj = p.categorias || {};
                const estiloCat = obtenerEstiloCategoria(catObj.id || 0);

                let nombreJ1 = p.j1 ? p.j1.nombre : (p.ronda_fase ? `${p.ronda_fase} J1` : 'Por definir');
                let nombreJ2 = p.j2 ? p.j2.nombre : (p.ronda_fase ? `${p.ronda_fase} J2` : 'Por definir');

                let historialHtml = '';
                if (isFin && p.historial_sets && p.historial_sets.length > 0) {
                    historialHtml = `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; justify-content:center; padding-top:10px; border-top:1px dashed rgba(255,255,255,0.1);">`;
                    historialHtml += `<span style="font-size:9px; color:#94a3b8; font-weight:800; text-transform:uppercase; margin-right:2px; display:flex; align-items:center;">Sets:</span>`;
                    p.historial_sets.forEach(s => {
                        let col1 = s.s1 > s.s2 ? '#22d3ee' : '#64748b'; 
                        let col2 = s.s2 > s.s1 ? '#e879f9' : '#64748b'; 
                        historialHtml += `<span style="font-size:10px; background:rgba(0,0,0,0.5); padding:3px 8px; border-radius:6px; font-weight:800;"><span style="color:${col1}">${s.s1}</span><span style="color:#475569; margin:0 3px;">-</span><span style="color:${col2}">${s.s2}</span></span>`;
                    });
                    historialHtml += `</div>`;
                }

                grid.innerHTML += `
                    <div style="background:rgba(15,23,42,0.7); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:16px; ${isFin ? 'opacity:0.85;' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="font-weight:800; font-size:12px; color:#38bdf8;">MESA ${p.mesa || 1} <span style="color:#64748b; font-weight:400; margin-left:4px; font-size:10px;">⏰ ${p.hora}</span></span>
                            <span style="font-size:9px; font-weight:800; color:${estadoColor}; border:1px solid ${estadoColor}; padding:2px 8px; border-radius:999px;">${estadoTexto}</span>
                        </div>
                        
                        <div style="font-size:10px; color:${estiloCat.text}; background:${estiloCat.bg}; border:1px solid ${estiloCat.border}; display:inline-block; padding:3px 8px; border-radius:6px; font-weight:800; text-transform:uppercase; margin-bottom:12px;">
                            🏆 ${catObj.nombre || 'Categoría'} • ${p.grupo_nombre ? `Gpo ${p.grupo_nombre}` : (p.ronda_fase || 'Eliminatoria')}
                        </div>

                        <div style="background:rgba(0,0,0,0.4); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; border:1px solid rgba(255,255,255,0.02);">
                            <span style="font-weight:700; font-size:12px; color:${colorJ1};">${iconJ1}${nombreJ1}</span>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <span style="font-family:'Orbitron', sans-serif; font-weight:800; font-size:18px; color:${colorScore1};">${mainScore1}</span>
                                ${subScore1}
                            </div>
                        </div>

                        <div style="background:rgba(0,0,0,0.4); border-radius:10px; padding:10px; display:flex; justify-content:space-between; align-items:center; border:1px solid rgba(255,255,255,0.02);">
                            <span style="font-weight:700; font-size:12px; color:${colorJ2};">${iconJ2}${nombreJ2}</span>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <span style="font-family:'Orbitron', sans-serif; font-weight:800; font-size:18px; color:${colorScore2};">${mainScore2}</span>
                                ${subScore2}
                            </div>
                        </div>
                        
                        ${historialHtml}

                        <div style="display:flex; gap:6px; margin-top:12px;">
                            <a href="juez.html?partido=${p.id}" target="_blank" class="btn-console btn-gold" style="flex:1; justify-content:center; font-size:9px; padding:6px; text-decoration:none;">🏓 Juez</a>
                            <a href="espectador.html?partido=${p.id}" target="_blank" class="btn-console btn-purple" style="flex:1; justify-content:center; font-size:9px; padding:6px; text-decoration:none;">👁️ Ver</a>
                        </div>
                    </div>
                `;
            });
        }

        cargarDatosIniciales(); 
    </script>
</body>
</html>
