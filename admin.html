<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #04060a; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; pointer-events: none; z-index: -1; }
        
        .panel-3d { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-dark { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 10px 14px; border-radius: 10px; width: 100%; outline: none; transition: border 0.3s; font-size: 12px; font-weight: 600; }
        .input-dark:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        
        .tab-btn { padding: 10px 20px; background: transparent; color: #94a3b8; border-bottom: 2px solid transparent; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; transition: all 0.3s; }
        .tab-btn.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
        .tab-btn:hover:not(.active) { color: white; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th { background: rgba(255,255,255,0.03); color: #94a3b8; font-weight: 800; text-transform: uppercase; padding: 12px; text-align: left; letter-spacing: 1px; font-size: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; font-weight: 600; }
        .data-table tr:hover td { background: rgba(56, 189, 248, 0.05); }

        .btn-action { padding: 8px 16px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.3s; }
        .btn-blue { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .btn-blue:hover { background: #0ea5e9; color: black; box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
        .btn-green { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .btn-green:hover { background: #10b981; color: black; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn-red { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-red:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body>

    <!-- SCRIPT DE SEGURIDAD (Si no hay usuario activo, lo saca) -->
    <script>
        const checkOrgId = localStorage.getItem('organizador_id');
        const checkTorId = localStorage.getItem('torneo_activo_id');
        if (!checkOrgId || !checkTorId) {
            window.location.href = 'torneos.html';
        }
    </script>

    <!-- NAVEGACIÓN PRINCIPAL -->
    <nav class="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 p-4 sticky top-0 z-50 flex justify-between items-center flex-wrap gap-4 shadow-lg">
        <div class="font-black text-white tracking-widest uppercase flex items-center gap-3">
            <i class="fa-solid fa-gear text-cyan-400"></i> PANEL ADMINISTRADOR
        </div>
        <div class="flex gap-2 flex-wrap">
            <button onclick="window.location.href='torneos.html'" class="btn-action bg-white/5 border border-white/10 text-white hover:bg-amber-500 hover:text-black hover:border-amber-500">⬅ Torneos</button>
            <button onclick="window.location.href='sorteo.html'" class="btn-action btn-blue"><i class="fa-solid fa-sitemap mr-1"></i> Sorteo y Rol</button>
            <button onclick="window.location.href='mesas.html'" class="btn-action btn-green"><i class="fa-solid fa-tv mr-1"></i> C. Mesas</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-6 mt-4">
        
        <!-- PESTAÑAS -->
        <div class="flex border-b border-white/10 mb-6 overflow-x-auto no-scrollbar">
            <button class="tab-btn active" onclick="mostrarTab('tab-jugadores', this)"><i class="fa-solid fa-users mr-2"></i> Base Jugadores</button>
            <button class="tab-btn" onclick="mostrarTab('tab-categorias', this)"><i class="fa-solid fa-layer-group mr-2"></i> Categorías</button>
            <button class="tab-btn" onclick="mostrarTab('tab-inscripciones', this)"><i class="fa-solid fa-ticket mr-2"></i> Inscripciones (Torneo Actual)</button>
        </div>

        <!-- TAB: BASE DE JUGADORES -->
        <div id="tab-jugadores" class="tab-content">
            <div class="panel-3d mb-6 border-t-4 border-cyan-500">
                <h3 class="text-cyan-400 font-black tracking-widest uppercase text-sm mb-4">Añadir / Editar Jugador</h3>
                <input type="hidden" id="jugador-id">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Nombre Completo</label>
                        <input type="text" id="jugador-nombre" class="input-dark" placeholder="Ej. Rogelio Castro">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Club / Entidad</label>
                        <input type="text" id="jugador-club" class="input-dark" placeholder="Ej. Halcones UV">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Puntos Ranking (Inicial)</label>
                        <input type="number" id="jugador-puntos" class="input-dark" placeholder="0">
                    </div>
                </div>
                <div class="mt-4 flex gap-2">
                    <button class="btn-action btn-blue" onclick="guardarJugador()">Guardar Jugador</button>
                    <button class="btn-action border border-white/10 text-white" onclick="limpiarFormJugador()">Limpiar</button>
                </div>
            </div>

            <div class="panel-3d overflow-x-auto">
                <table class="data-table">
                    <thead><tr><th>ID</th><th>Nombre</th><th>Club</th><th class="text-center">Pts Ranking</th><th class="text-right">Acciones</th></tr></thead>
                    <tbody id="tabla-jugadores"><tr><td colspan="5" class="text-center text-zinc-500">Cargando jugadores...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- TAB: CATEGORÍAS -->
        <div id="tab-categorias" class="tab-content hidden">
            <div class="panel-3d mb-6 border-t-4 border-fuchsia-500">
                <h3 class="text-fuchsia-400 font-black tracking-widest uppercase text-sm mb-4">Crear / Editar Categoría</h3>
                <input type="hidden" id="categoria-id">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Nombre (Ej. Primera Fuerza)</label>
                        <input type="text" id="cat-nombre" class="input-dark" placeholder="Nombre">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Pts Mínimos</label>
                        <input type="number" id="cat-min" class="input-dark" placeholder="0">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Pts Máximos</label>
                        <input type="number" id="cat-max" class="input-dark" placeholder="9999">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Costo Inscripción ($)</label>
                        <input type="number" id="cat-costo" class="input-dark" placeholder="200">
                    </div>
                </div>
                <div class="mt-4 flex gap-2">
                    <button class="btn-action bg-fuchsia-500/20 text-fuchsia-400 border border-fuchsia-500 hover:bg-fuchsia-500 hover:text-black" onclick="guardarCategoria()">Guardar Categoría</button>
                    <button class="btn-action border border-white/10 text-white" onclick="limpiarFormCategoria()">Limpiar</button>
                </div>
            </div>

            <div class="panel-3d overflow-x-auto">
                <table class="data-table">
                    <thead><tr><th>Nombre Categoría</th><th class="text-center">Rango Puntos</th><th class="text-center">Costo</th><th class="text-right">Acciones</th></tr></thead>
                    <tbody id="tabla-categorias"><tr><td colspan="4" class="text-center text-zinc-500">Cargando categorías...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- TAB: INSCRIPCIONES AL TORNEO ACTIVO -->
        <div id="tab-inscripciones" class="tab-content hidden">
            <div class="panel-3d mb-6 border-t-4 border-amber-500">
                <h3 class="text-amber-400 font-black tracking-widest uppercase text-sm mb-4">Inscribir Jugador al Torneo Activo</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Seleccionar Jugador</label>
                        <select id="ins-jugador" class="input-dark cursor-pointer"></select>
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Seleccionar Categoría</label>
                        <select id="ins-categoria" class="input-dark cursor-pointer"></select>
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 font-bold uppercase tracking-wider mb-1 block">Estatus de Pago</label>
                        <select id="ins-pago" class="input-dark cursor-pointer">
                            <option value="Pendiente de Pago">Pendiente de Pago</option>
                            <option value="Pagado">Pagado ✅</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <button class="btn-action bg-amber-500/20 text-amber-400 border border-amber-500 hover:bg-amber-500 hover:text-black" onclick="guardarInscripcion()"><i class="fa-solid fa-plus mr-1"></i> Registrar Inscripción</button>
                </div>
            </div>

            <div class="panel-3d overflow-x-auto">
                <table class="data-table">
                    <thead><tr><th>Jugador</th><th>Club</th><th>Categoría</th><th class="text-center">Estatus Pago</th><th class="text-right">Acciones</th></tr></thead>
                    <tbody id="tabla-inscripciones"><tr><td colspan="5" class="text-center text-zinc-500">Cargando inscritos...</td></tr></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // VARIABLES GLOBALES (BLINDAJE MULTI-USUARIO)
        const ORG_ID = localStorage.getItem('organizador_id');
        const TORNEO_ID = localStorage.getItem('torneo_activo_id');

        let dataJugadores = [];
        let dataCategorias = [];
        let dataInscripciones = [];

        // INICIALIZACIÓN
        document.addEventListener("DOMContentLoaded", () => {
            if(!ORG_ID || !TORNEO_ID) return;
            cargarTodo();
        });

        function mostrarTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        async function cargarTodo() {
            await Promise.all([
                cargarJugadores(),
                cargarCategorias()
            ]);
            // Inscripciones necesita que jugadores y categorias ya estén cargados
            await cargarInscripciones();
            llenarSelectsInscripcion();
        }

        // =====================================
        // MÓDULO: JUGADORES
        // =====================================
        async function cargarJugadores() {
            try {
                // FILTRO ESTRICTO DE ORGANIZADOR
                const { data, error } = await clienteSupabase
                    .from('jugadores')
                    .select('*')
                    .eq('organizador_id', ORG_ID)
                    .order('nombre', { ascending: true });
                
                if (error) throw error;
                dataJugadores = data || [];
                renderJugadores();
            } catch (err) { console.error("Error Jugadores:", err); }
        }

        function renderJugadores() {
            const tbody = document.getElementById('tabla-jugadores');
            tbody.innerHTML = '';
            if (dataJugadores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-zinc-500 py-4">No hay jugadores registrados.</td></tr>';
                return;
            }
            dataJugadores.forEach(j => {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-zinc-500 font-black">#${j.id}</td>
                        <td class="text-white font-bold">${j.nombre}</td>
                        <td class="text-zinc-400">${j.club || 'Sin Club'}</td>
                        <td class="text-center text-amber-400 font-bold">${j.puntos_ranking || 0}</td>
                        <td class="text-right">
                            <button onclick="editarJugador(${j.id})" class="btn-action btn-blue mr-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="borrarJugador(${j.id}, '${j.nombre}')" class="btn-action btn-red"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarJugador() {
            const id = document.getElementById('jugador-id').value;
            const nombre = document.getElementById('jugador-nombre').value.trim();
            const club = document.getElementById('jugador-club').value.trim();
            const puntos = parseInt(document.getElementById('jugador-puntos').value) || 0;

            if (!nombre) { alert("El nombre es obligatorio."); return; }

            // PAYLOAD BLINDADO CON EL ORG_ID
            const payload = { nombre, club, puntos_ranking: puntos, organizador_id: ORG_ID };

            try {
                if (id) {
                    await clienteSupabase.from('jugadores').update(payload).eq('id', id).eq('organizador_id', ORG_ID);
                } else {
                    await clienteSupabase.from('jugadores').insert([payload]);
                }
                limpiarFormJugador();
                await cargarJugadores();
                llenarSelectsInscripcion();
            } catch (err) { alert("Error al guardar."); console.error(err); }
        }

        function editarJugador(id) {
            const j = dataJugadores.find(x => x.id == id);
            if (!j) return;
            document.getElementById('jugador-id').value = j.id;
            document.getElementById('jugador-nombre').value = j.nombre;
            document.getElementById('jugador-club').value = j.club || '';
            document.getElementById('jugador-puntos').value = j.puntos_ranking || 0;
            window.scrollTo(0,0);
        }

        function limpiarFormJugador() {
            document.getElementById('jugador-id').value = '';
            document.getElementById('jugador-nombre').value = '';
            document.getElementById('jugador-club').value = '';
            document.getElementById('jugador-puntos').value = '';
        }

        async function borrarJugador(id, nombre) {
            if (!confirm(`¿Eliminar a ${nombre}?`)) return;
            try {
                // Borra la inscripción asociada primero para que no haya error de llave foránea
                await clienteSupabase.from('inscripciones').delete().eq('jugador_id', id).eq('organizador_id', ORG_ID);
                await clienteSupabase.from('jugadores').delete().eq('id', id).eq('organizador_id', ORG_ID);
                await cargarJugadores();
                await cargarInscripciones();
                llenarSelectsInscripcion();
            } catch (err) { alert("Error al eliminar."); }
        }

        // =====================================
        // MÓDULO: CATEGORÍAS
        // =====================================
        async function cargarCategorias() {
            try {
                const { data, error } = await clienteSupabase
                    .from('categorias')
                    .select('*')
                    .eq('organizador_id', ORG_ID)
                    .order('puntos_minimos', { ascending: false });
                
                if (error) throw error;
                dataCategorias = data || [];
                renderCategorias();
            } catch (err) { console.error("Error Categorias:", err); }
        }

        function renderCategorias() {
            const tbody = document.getElementById('tabla-categorias');
            tbody.innerHTML = '';
            if (dataCategorias.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-zinc-500 py-4">No hay categorías registradas.</td></tr>';
                return;
            }
            dataCategorias.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-white font-bold">🏆 ${c.nombre}</td>
                        <td class="text-center text-cyan-400 font-bold">${c.puntos_minimos} a ${c.puntos_maximos} pts</td>
                        <td class="text-center text-emerald-400 font-bold">$${c.costo_inscripcion || 0}</td>
                        <td class="text-right">
                            <button onclick="editarCategoria(${c.id})" class="btn-action btn-blue mr-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="borrarCategoria(${c.id})" class="btn-action btn-red"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarCategoria() {
            const id = document.getElementById('categoria-id').value;
            const nombre = document.getElementById('cat-nombre').value.trim();
            const pMin = parseInt(document.getElementById('cat-min').value) || 0;
            const pMax = parseInt(document.getElementById('cat-max').value) || 9999;
            const costo = parseInt(document.getElementById('cat-costo').value) || 0;

            if (!nombre) { alert("Nombre de categoría obligatorio."); return; }

            const payload = { nombre, puntos_minimos: pMin, puntos_maximos: pMax, costo_inscripcion: costo, organizador_id: ORG_ID };

            try {
                if (id) {
                    await clienteSupabase.from('categorias').update(payload).eq('id', id).eq('organizador_id', ORG_ID);
                } else {
                    await clienteSupabase.from('categorias').insert([payload]);
                }
                limpiarFormCategoria();
                await cargarCategorias();
                llenarSelectsInscripcion();
            } catch (err) { alert("Error al guardar categoría."); }
        }

        function editarCategoria(id) {
            const c = dataCategorias.find(x => x.id == id);
            if (!c) return;
            document.getElementById('categoria-id').value = c.id;
            document.getElementById('cat-nombre').value = c.nombre;
            document.getElementById('cat-min').value = c.puntos_minimos;
            document.getElementById('cat-max').value = c.puntos_maximos;
            document.getElementById('cat-costo').value = c.costo_inscripcion;
        }

        function limpiarFormCategoria() {
            document.getElementById('categoria-id').value = '';
            document.getElementById('cat-nombre').value = '';
            document.getElementById('cat-min').value = '';
            document.getElementById('cat-max').value = '';
            document.getElementById('cat-costo').value = '';
        }

        async function borrarCategoria(id) {
            if (!confirm(`¿Eliminar categoría?`)) return;
            try {
                await clienteSupabase.from('categorias').delete().eq('id', id).eq('organizador_id', ORG_ID);
                await cargarCategorias();
                llenarSelectsInscripcion();
            } catch (err) { alert("Error al eliminar."); }
        }

        // =====================================
        // MÓDULO: INSCRIPCIONES
        // =====================================
        async function cargarInscripciones() {
            try {
                const { data, error } = await clienteSupabase
                    .from('inscripciones')
                    .select('*, jugador:jugador_id(id, nombre, club), categoria:categoria_id(id, nombre)')
                    .eq('torneo_id', TORNEO_ID)
                    .eq('organizador_id', ORG_ID)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                dataInscripciones = data || [];
                renderInscripciones();
            } catch (err) { console.error("Error Inscripciones:", err); }
        }

        function llenarSelectsInscripcion() {
            const selJugador = document.getElementById('ins-jugador');
            const selCat = document.getElementById('ins-categoria');
            
            selJugador.innerHTML = '<option value="">-- Seleccionar Jugador --</option>';
            dataJugadores.forEach(j => {
                selJugador.innerHTML += `<option value="${j.id}">${j.nombre} (${j.puntos_ranking} pts)</option>`;
            });

            selCat.innerHTML = '<option value="">-- Seleccionar Categoría --</option>';
            dataCategorias.forEach(c => {
                selCat.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            });
        }

        function renderInscripciones() {
            const tbody = document.getElementById('tabla-inscripciones');
            tbody.innerHTML = '';
            if (dataInscripciones.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-zinc-500 py-4">No hay inscritos en este torneo.</td></tr>';
                return;
            }

            dataInscripciones.forEach(ins => {
                const isPagado = ins.estatus_pago === 'Pagado';
                const badgePago = isPagado 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500 px-2 py-1 rounded text-[9px] font-bold uppercase">Pagado ✅</span>`
                    : `<span class="bg-amber-500/20 text-amber-400 border border-amber-500 px-2 py-1 rounded text-[9px] font-bold uppercase">Pendiente ⏳</span>`;
                
                const btnPago = isPagado
                    ? `<button onclick="cambiarEstatusPago(${ins.id}, 'Pendiente de Pago')" class="btn-action bg-amber-500/10 text-amber-500 mr-1" title="Marcar Pendiente"><i class="fa-solid fa-clock-rotate-left"></i></button>`
                    : `<button onclick="cambiarEstatusPago(${ins.id}, 'Pagado')" class="btn-action btn-green mr-1" title="Marcar Pagado"><i class="fa-solid fa-check"></i></button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="text-white font-bold">${ins.jugador?.nombre || 'Jugador Borrado'}</td>
                        <td class="text-zinc-400">${ins.jugador?.club || '---'}</td>
                        <td class="text-fuchsia-400 font-bold">${ins.categoria?.nombre || '---'}</td>
                        <td class="text-center">${badgePago}</td>
                        <td class="text-right">
                            ${btnPago}
                            <button onclick="borrarInscripcion(${ins.id})" class="btn-action btn-red"><i class="fa-solid fa-xmark"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function guardarInscripcion() {
            const jId = document.getElementById('ins-jugador').value;
            const cId = document.getElementById('ins-categoria').value;
            const pago = document.getElementById('ins-pago').value;

            if (!jId || !cId) { alert("Selecciona un jugador y una categoría."); return; }

            // Revisar si ya está inscrito
            const yaInscrito = dataInscripciones.find(x => x.jugador_id == jId && x.categoria_id == cId);
            if (yaInscrito) { alert("Este jugador ya está inscrito en esa categoría."); return; }

            const payload = {
                torneo_id: TORNEO_ID,
                jugador_id: jId,
                categoria_id: cId,
                estatus_pago: pago,
                organizador_id: ORG_ID
            };

            try {
                await clienteSupabase.from('inscripciones').insert([payload]);
                await cargarInscripciones();
                // Limpiar select
                document.getElementById('ins-jugador').value = '';
            } catch (err) { alert("Error al inscribir."); }
        }

        async function cambiarEstatusPago(id, nuevoEstatus) {
            try {
                await clienteSupabase.from('inscripciones').update({estatus_pago: nuevoEstatus}).eq('id', id).eq('organizador_id', ORG_ID);
                await cargarInscripciones();
            } catch (err) { alert("Error al cambiar estatus."); }
        }

        async function borrarInscripcion(id) {
            if (!confirm(`¿Dar de baja a este jugador del torneo actual?`)) return;
            try {
                await clienteSupabase.from('inscripciones').delete().eq('id', id).eq('organizador_id', ORG_ID);
                await cargarInscripciones();
            } catch (err) { alert("Error al eliminar."); }
        }

    </script>
</body>
</html>
