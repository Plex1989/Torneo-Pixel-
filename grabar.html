<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grabación Broadcast - Pixel Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000;
            font-family: 'Sora', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Contenedor de Video de Fondo */
        #video-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            background: #000;
        }
        #preview-camara {
            width: 100%; height: 100%;
            object-fit: cover; 
        }

        /* Capa de la Interfaz */
        .broadcast-layer {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Barra Superior */
        .top-broadcast-bar {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .tv-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .live-badge {
            background: #ef4444;
            color: white;
            font-weight: 900;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            animation: pulse-live 2s infinite;
        }

        @keyframes pulse-live { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Paneles Laterales Más Pequeños y Transparentes */
        .side-panels-container {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }

        .side-panel {
            background: rgba(15, 23, 42, 0.4); /* Mucho más transparente */
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 12px;
            width: 140px; /* Ancho muy reducido */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .side-panel.p1 { border-left: 3px solid #06b6d4; }
        .side-panel.p2 { border-right: 3px solid #d946ef; text-align: right; }

        .stat-group { margin-bottom: 6px; }
        .stat-group:last-child { margin-bottom: 0; }
        .stat-label { font-size: 7px; color: #cbd5e1; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; }
        .stat-value { font-size: 10px; color: #ffffff; font-weight: 900; font-family: 'Orbitron', sans-serif; }
        .stat-value.cyan { color: #06b6d4; }
        .stat-value.purple { color: #d946ef; }

        /* Marcador Inferior Compacto */
        .bottom-scoreboard {
            padding: 0 10px 20px 10px;
            display: flex;
            justify-content: center;
            pointer-events: auto;
            width: 100%;
        }

        .score-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: stretch;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px; /* Límite para que no se desborde */
        }

        .player-row {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .player-row:last-child { border-bottom: none; }
        
        .player-color-indicator { width: 4px; height: 100%; border-radius: 2px; margin-right: 8px; }
        .c-cyan { background: #06b6d4; box-shadow: 0 0 5px #06b6d4; }
        .c-purple { background: #d946ef; box-shadow: 0 0 5px #d946ef; }

        .player-name { flex: 1; font-size: 11px; font-weight: 900; color: white; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .score-sets { background: rgba(0,0,0,0.4); padding: 0 8px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); min-width: 35px; }
        .sets-txt { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900; color: #cbd5e1; }
        
        .score-points { padding: 0 12px; display: flex; align-items: center; justify-content: center; min-width: 50px; }
        .pts-txt { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; }

        .match-info-vertical {
            background: #1e293b;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            min-width: 80px;
        }
        .m-mesa { color: #f5a623; font-weight: 900; font-size: 10px; text-transform: uppercase; margin-bottom: 2px; }
        .m-fase { color: #94a3b8; font-weight: 800; font-size: 6px; text-transform: uppercase; }

        /* Controles de Grabación */
        .record-controls {
            position: absolute;
            top: 15px; right: 15px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .btn-rec {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            background: rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .btn-rec .inner-circle { width: 30px; height: 30px; border-radius: 50%; background: #ef4444; transition: all 0.3s ease; }
        .btn-rec.recording .inner-circle { border-radius: 6px; width: 16px; height: 16px; background: #ef4444; animation: pulse-red 2s infinite; }

        @media (orientation: portrait) {
            /* En vertical, ocultamos los paneles laterales para que no estorben la mesa */
            .side-panels-container { display: none; }
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="preview-camara" autoplay muted playsinline></video>
    </div>

    <div class="broadcast-layer hidden" id="broadcast-ui">
        
        <div class="top-broadcast-bar">
            <div class="flex flex-col gap-2">
                <div class="tv-logo">
                    <i class="fa-solid fa-table-tennis-paddle-ball text-cyan-400"></i>
                    PIXEL STUDIO TV
                </div>
                <div class="flex gap-2">
                    <button onclick="window.close()" class="bg-black/50 text-white border border-white/20 px-3 py-1.5 rounded-full text-[8px] font-bold uppercase tracking-widest flex items-center gap-1 w-max hover:bg-white/20 transition-colors">
                        <i class="fa-solid fa-arrow-left"></i> Salir
                    </button>
                    <!-- BOTÓN PANTALLA COMPLETA -->
                    <button onclick="toggleFullScreen()" id="btn-fullscreen" class="bg-black/50 text-white border border-white/20 px-3 py-1.5 rounded-full text-[8px] font-bold uppercase tracking-widest flex items-center gap-1 w-max hover:bg-white/20 transition-colors">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
            
            <div id="live-indicator" class="live-badge hidden">
                <i class="fa-solid fa-circle text-[6px]"></i> REC
                <span id="tiempo-grabacion" class="font-digital ml-1 tracking-wider">00:00</span>
            </div>
        </div>

        <div class="record-controls">
            <div id="status-camara" class="bg-amber-500/20 text-amber-400 border border-amber-500/50 px-2 py-1 rounded-full text-[8px] font-black uppercase tracking-widest backdrop-blur-md hidden">
                Sin Cámara
            </div>
            <button id="btn-rec" class="btn-rec" onclick="toggleGrabacion()" title="Iniciar Grabación Local">
                <div class="inner-circle"></div>
            </button>
        </div>

        <!-- PANELES LATERALES (Se ocultan automáticamente en vertical) -->
        <div class="side-panels-container">
            <div class="side-panel p1">
                <div class="stat-group">
                    <div class="stat-label">Ranking Oficial</div>
                    <div class="stat-value cyan" id="sp-rank-j1">0 pts</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">Club</div>
                    <div class="stat-value text-[8px] truncate" id="sp-club-j1">Sin Club</div>
                </div>
            </div>
            <div class="side-panel p2">
                <div class="stat-group">
                    <div class="stat-label">Ranking Oficial</div>
                    <div class="stat-value purple" id="sp-rank-j2">0 pts</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">Club</div>
                    <div class="stat-value text-[8px] truncate" id="sp-club-j2">Sin Club</div>
                </div>
            </div>
        </div>

        <div class="bottom-scoreboard">
            <div class="score-box">
                <div class="flex-1 flex flex-col justify-center">
                    <div class="player-row">
                        <div class="player-color-indicator c-cyan"></div>
                        <div class="player-name" id="sb-nombre-j1">JUGADOR 1</div>
                        <div class="score-sets"><span class="sets-txt" id="sb-sets-j1">0</span></div>
                        <div class="score-points"><span class="pts-txt text-cyan-400" id="sb-pts-j1">0</span></div>
                    </div>
                    <div class="player-row">
                        <div class="player-color-indicator c-purple"></div>
                        <div class="player-name" id="sb-nombre-j2">JUGADOR 2</div>
                        <div class="score-sets"><span class="sets-txt" id="sb-sets-j2">0</span></div>
                        <div class="score-points"><span class="pts-txt text-fuchsia-400" id="sb-pts-j2">0</span></div>
                    </div>
                </div>
                <div class="match-info-vertical">
                    <div class="m-mesa" id="sb-mesa">MESA 1</div>
                    <div class="m-fase" id="sb-fase">CATEGORÍA<br>FASE GRUPOS</div>
                </div>
            </div>
        </div>

    </div>

    <!-- PANTALLA DE ERROR/ESPERA -->
    <div id="pantalla-espera" class="fixed inset-0 flex items-center justify-center bg-black/80 backdrop-blur-md z-[100]">
        <div class="bg-slate-900 border border-white/10 p-6 rounded-3xl text-center shadow-2xl max-w-xs">
            <i class="fa-solid fa-satellite-dish text-4xl text-cyan-500 animate-pulse mb-4"></i>
            <h2 class="text-white font-black uppercase tracking-widest text-lg mb-2">Conectando...</h2>
            <p id="txt-espera" class="text-zinc-400 font-bold text-xs">Buscando datos del partido.</p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const partidoId = urlParams.get('partido');

        let partidoData = null;
        let mediaRecorder;
        let recordedChunks = [];
        let streamActivo = null;
        let isRecording = false;
        let startTime = 0;
        let timerInterval;

        // PANTALLA COMPLETA
        function toggleFullScreen() {
            const btn = document.getElementById('btn-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                }).catch(err => alert(`Error intentando pantalla completa: ${err.message}`));
            } else {
                document.exitFullscreen().then(() => {
                    btn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                });
            }
        }

        async function inicializarCamaraYDatos() {
            if (!partidoId) {
                document.getElementById('txt-espera').innerHTML = '<span class="text-rose-400">Error: Falta ID del partido en la URL.</span>';
                return;
            }

            await cargarPartido();

            clienteSupabase
                .channel('grabar-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'partidos', filter: `id=eq.${partidoId}` }, payload => {
                    procesarPartidoUI(payload.new);
                })
                .subscribe();

            try {
                streamActivo = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: "environment" },
                    audio: true
                });
                
                const videoElement = document.getElementById('preview-camara');
                videoElement.srcObject = streamActivo;
                
                document.getElementById('pantalla-espera').classList.add('hidden');
                document.getElementById('broadcast-ui').classList.remove('hidden');

            } catch (err) {
                document.getElementById('txt-espera').innerHTML = '<span class="text-rose-400">Error: Permite el acceso a la cámara y micrófono para continuar.</span>';
                document.getElementById('status-camara').classList.remove('hidden');
                document.getElementById('btn-rec').classList.add('hidden');
            }
        }

        async function cargarPartido() {
            const { data, error } = await clienteSupabase
                .from('partidos')
                .select('*, j1:jugador1_id(nombre, club, puntos_ranking, division), j2:jugador2_id(nombre, club, puntos_ranking, division), categorias(nombre)')
                .eq('id', partidoId)
                .single();

            if (data) {
                partidoData = data;
                procesarPartidoUI(data);
                
                document.getElementById('sp-rank-j1').innerText = `${data.j1?.puntos_ranking || 0} pts`;
                document.getElementById('sp-club-j1').innerText = data.j1?.club || 'Sin Club';

                document.getElementById('sp-rank-j2').innerText = `${data.j2?.puntos_ranking || 0} pts`;
                document.getElementById('sp-club-j2').innerText = data.j2?.club || 'Sin Club';
            }
        }

        function procesarPartidoUI(p) {
            let nomJ1 = p.j1?.nombre || partidoData.j1?.nombre || 'J1';
            let nomJ2 = p.j2?.nombre || partidoData.j2?.nombre || 'J2';

            document.getElementById('sb-nombre-j1').innerText = nomJ1;
            document.getElementById('sb-pts-j1').innerText = p.puntos_j1 || 0;
            document.getElementById('sb-sets-j1').innerText = p.sets_j1 || 0;

            document.getElementById('sb-nombre-j2').innerText = nomJ2;
            document.getElementById('sb-pts-j2').innerText = p.puntos_j2 || 0;
            document.getElementById('sb-sets-j2').innerText = p.sets_j2 || 0;

            document.getElementById('sb-mesa').innerText = `MESA ${p.mesa || 1}`;
            
            let catName = p.categorias?.nombre || partidoData?.categorias?.nombre || 'Cat';
            let fase = p.grupo_nombre ? 'Grupo ' + p.grupo_nombre : (p.ronda_fase || 'Fase Final');
            document.getElementById('sb-fase').innerHTML = `${catName}<br>${fase}`;
        }

        function toggleGrabacion() {
            if (!streamActivo) return;

            const btnRec = document.getElementById('btn-rec');
            const liveIndicator = document.getElementById('live-indicator');
            const timeDisplay = document.getElementById('tiempo-grabacion');

            if (!isRecording) {
                recordedChunks = [];
                const options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 1500000 };
                
                try { mediaRecorder = new MediaRecorder(streamActivo, options); } 
                catch (e) { mediaRecorder = new MediaRecorder(streamActivo); }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    document.body.appendChild(a);
                    a.style = 'display: none';
                    a.href = url;
                    
                    let fase = (partidoData?.ronda_fase || partidoData?.grupo_nombre || 'PARTIDO').replace(/\s+/g, '').toUpperCase();
                    let div = partidoData?.j1?.division || 1;
                    let nombreJ1 = (partidoData?.j1?.nombre || 'J1').replace(/\s+/g, '-').toUpperCase();
                    let nombreJ2 = (partidoData?.j2?.nombre || 'J2').replace(/\s+/g, '-').toUpperCase();
                    
                    a.download = `${fase}_DIV${div}_${nombreJ1}_vs_${nombreJ2}.mp4`;
                    a.click();
                    window.URL.revokeObjectURL(url);
                };

                mediaRecorder.start();
                isRecording = true;
                
                btnRec.classList.add('recording');
                liveIndicator.classList.remove('hidden');
                startTime = Date.now();
                
                timerInterval = setInterval(() => {
                    let diff = Math.floor((Date.now() - startTime) / 1000);
                    let m = Math.floor(diff / 60).toString().padStart(2, '0');
                    let s = (diff % 60).toString().padStart(2, '0');
                    timeDisplay.innerText = `${m}:${s}`;
                }, 1000);

            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnRec.classList.remove('recording');
                clearInterval(timerInterval);
                timeDisplay.innerText = "00:00";
                liveIndicator.classList.add('hidden');
            }
        }

        window.onload = inicializarCamaraYDatos;
    </script>
</body>
</html>
