<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al Torneo - Pixel Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');

        /* FONDO OSCURO PROFUNDO (#04060a) */
        body { 
            font-family: 'Sora', sans-serif; 
            padding: 20px; 
            max-width: 520px; 
            margin: auto; 
            background-color: #04060a; 
            color: #f8fafc; 
            min-height: 100vh; 
            position: relative; 
            overflow-x: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box;
        }
        
        /* ORBES ATMOSFÉRICOS DE FONDO */
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 400px; height: 400px; background: #06b6d4; border-radius: 50%; filter: blur(140px); opacity: 0.15; pointer-events: none; z-index: -1; animation: pulse-slow 10s infinite alternate; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 500px; height: 500px; background: #8b5cf6; border-radius: 50%; filter: blur(140px); opacity: 0.15; pointer-events: none; z-index: -1; animation: pulse-slow 12s infinite alternate-reverse; }
        @keyframes pulse-slow { 0% { transform: scale(1) translate(0px, 0px); } 100% { transform: scale(1.3) translate(40px, -60px); } }

        /* CONTENEDOR GLASSMORPHISM PRINCIPAL (CIAN) */
        .formulario { 
            position: relative; 
            width: 100%;
            background: rgba(10, 15, 26, 0.55); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-bottom: 5px solid #0e7490; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6); 
            padding: 28px; 
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .formulario:hover {
            border-bottom-color: #06b6d4;
            box-shadow: 0 25px 45px -10px rgba(6, 182, 212, 0.35);
        }

        /* BANNER ENCABEZADO CON NOMBRE, FECHA Y LUGAR */
        .banner-torneo { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: white; 
            padding: 18px; 
            border-radius: 14px; 
            text-align: center; 
            margin-bottom: 22px; 
        }
        .banner-torneo .sub-header { margin: 0 0 6px 0; font-size: 10px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
        .banner-torneo h2 { margin: 0; font-size: 18px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .banner-torneo .detalles-evento { font-size: 11px; color: #fbbf24; margin-top: 10px; font-weight: 700; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        label { font-weight: 800; display: block; margin-top: 18px; margin-bottom: 8px; color: #ffffff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* INPUTS Y SELECTS GENERALES */
        input[type="text"], input[type="password"], select { 
            width: 100%; 
            padding: 11px 14px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.18) !important; 
            background: rgba(10, 15, 26, 0.85) !important; 
            color: #ffffff !important; 
            font-size: 12px; 
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            box-sizing: border-box; 
            transition: all 0.2s ease; 
        }

        select option { background-color: #0a0b10 !important; color: #ffffff !important; padding: 10px; }

        input[type="text"]:focus, select:focus { 
            border-color: #38bdf8 !important; 
            outline: none; 
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.55); 
        }

        /* CAJA DE SEGURIDAD NIP (ROJA NEÓN) */
        .caja-seguridad { 
            background: rgba(15, 23, 42, 0.6); 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(239, 68, 68, 0.2); 
            border-bottom: 3px solid #7f1d1d;
            margin-top: 18px; 
            display: none; 
            transition: all 0.3s ease;
        }

        .caja-seguridad:hover {
            border-color: rgba(239, 68, 68, 0.5);
            border-bottom-color: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.35);
        }

        #nip-jugador:focus {
            border-color: #ef4444 !important; 
            outline: none; 
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.55);
        }

        /* BOTÓN PÍLDORA ÁMBAR / DORADO */
        .btn-submit { 
            width: 100%;
            margin-top: 24px;
            padding: 14px; 
            background: rgba(245, 158, 11, 0.15); 
            color: #fbbf24; 
            border: 1px solid rgba(245, 158, 11, 0.5); 
            border-radius: 9999px; 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            font-family: 'Sora', sans-serif;
        }

        .btn-submit:hover:not(:disabled) { 
            background: #f59e0b; 
            color: #000000; 
            border-color: #fbbf24; 
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.85); 
            transform: translateY(-2px); 
        }

        .btn-submit:disabled { background: rgba(255,255,255,0.03); color: #64748b; border-color: rgba(255,255,255,0.06); cursor: not-allowed; opacity: 0.6; }

        #info-puntos { color: #38bdf8; font-size: 11px; margin-top: 6px; font-weight: 700; }
        .ya-inscrito { color: #34d399; font-size: 11px; font-weight: 700; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
    </style>
</head>
<body>

    <div class="formulario">
        
        <div class="banner-torneo">
            <p class="sub-header">Portal Oficial de Registro</p>
            <!-- NOMBRE DEL TORNEO -->
            <h2 id="nombre-torneo-header">Cargando Torneo...</h2>
            <!-- FECHA Y LUGAR / SEDE DEL EVENTO -->
            <div id="info-fecha-lugar" class="detalles-evento"></div>
        </div>
        
        <label>1. Busca y selecciona tu nombre:</label>
        <div style="margin-bottom: 8px;">
            <input type="text" id="buscador" placeholder="🔎 Escribe tu nombre o apellido..." onkeyup="filtrarJugadores()">
        </div>
        <select id="select-jugador" onchange="evaluarCategorias()" size="4" style="margin-bottom: 8px;">
            <option value="">Cargando base de datos...</option>
        </select>
        <div id="info-puntos"></div>
        <div id="info-inscripciones"></div>

        <label for="select-categoria">2. Categorías disponibles para tu nivel:</label>
        <select id="select-categoria" disabled>
            <option value="">Primero selecciona tu nombre</option>
        </select>

        <div id="caja-nip" class="caja-seguridad">
            <label for="nip-jugador" style="margin-top: 0; color:#f87171;">🔒 3. Ingresa tu NIP de seguridad:</label>
            <input type="password" id="nip-jugador" maxlength="4" placeholder="Ej. 1234">
            <div style="font-size: 10px; color: #94a3b8; margin-top: 6px; font-weight:600;">*Tu NIP por defecto es 1234.</div>
        </div>

        <button id="btn-inscribir" class="btn-submit" disabled onclick="inscribirJugador()">Reservar mi lugar (Pendiente de Pago)</button>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let torneoActivo = null;
        let todosLosJugadores = [], todasLasCategorias = [], todasLasInscripciones = [];

        async function inicializar() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('torneo');
            
            let idTorneoCargar = null;

            if (idParam) {
                idTorneoCargar = parseInt(idParam);
                localStorage.setItem('torneo_activo_id', idTorneoCargar);
            } else if (localStorage.getItem('torneo_activo_id')) {
                idTorneoCargar = parseInt(localStorage.getItem('torneo_activo_id'));
            }

            let queryTorneo = clienteSupabase.from('torneos').select('*');

            if (idTorneoCargar) {
                queryTorneo = queryTorneo.eq('id', idTorneoCargar);
            } else {
                queryTorneo = queryTorneo.neq('estado', 'finalizado').order('created_at', { ascending: false }).limit(1);
            }

            const { data: torneoData } = await queryTorneo;

            if (torneoData && torneoData.length > 0) {
                torneoActivo = torneoData[0];
                
                // ASIGNAR NOMBRE DEL TORNEO
                document.getElementById('nombre-torneo-header').innerText = torneoActivo.nombre;

                // ASIGNAR FECHA Y LUGAR DEL EVENTO
                let detalles = [];
                if (torneoActivo.fecha_evento) detalles.push(`📅 ${torneoActivo.fecha_evento}`);
                if (torneoActivo.lugar_evento) detalles.push(`📍 ${torneoActivo.lugar_evento}`);
                
                document.getElementById('info-fecha-lugar').innerText = detalles.length > 0 ? detalles.join('  •  ') : '📅 Fecha y Sede por confirmar';
            } else {
                document.getElementById('nombre-torneo-header').innerText = "Sin Torneo Activo";
                alert("No se encontró el torneo especificado.");
                return;
            }

            const [resJugadores, resCategorias, resInscripciones] = await Promise.all([
                clienteSupabase.from('jugadores').select('*').order('nombre', { ascending: true }),
                clienteSupabase.from('categorias').select('*').order('puntos_minimos', { ascending: true }),
                clienteSupabase.from('inscripciones').select('*').eq('torneo_id', torneoActivo.id)
            ]);

            todosLosJugadores = resJugadores.data || [];
            todasLasCategorias = resCategorias.data || [];
            todasLasInscripciones = resInscripciones.data || [];
            
            filtrarJugadores();
        }

        function filtrarJugadores() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const selectJugador = document.getElementById('select-jugador');
            selectJugador.innerHTML = '';
            
            const filtrados = todosLosJugadores.filter(j => j.nombre.toLowerCase().includes(texto));
            if (filtrados.length === 0) {
                selectJugador.innerHTML = '<option value="" disabled>No se encontraron jugadores</option>';
            } else {
                filtrados.forEach(j => {
                    let opt = document.createElement('option');
                    opt.value = j.id; 
                    opt.textContent = `${j.nombre} (${j.club || 'Sin Club'}) - ${j.puntos_ranking} pts`;
                    selectJugador.appendChild(opt);
                });
            }
            evaluarCategorias();
        }

        function evaluarCategorias() {
            const idSeleccionado = document.getElementById('select-jugador').value;
            const selectCategoria = document.getElementById('select-categoria');
            const infoPuntos = document.getElementById('info-puntos');
            const infoInscripciones = document.getElementById('info-inscripciones');
            const btnInscribir = document.getElementById('btn-inscribir');
            const cajaNip = document.getElementById('caja-nip');
            
            if (!idSeleccionado) {
                selectCategoria.innerHTML = '<option value="">Primero selecciona tu nombre</option>';
                selectCategoria.disabled = true; btnInscribir.disabled = true; cajaNip.style.display = 'none';
                infoPuntos.innerText = ""; infoInscripciones.innerHTML = ""; return;
            }

            const jugador = todosLosJugadores.find(j => j.id == idSeleccionado);
            const pts = jugador.puntos_ranking;
            infoPuntos.innerText = `Ranking actual: ${pts} pts | Club: ${jugador.club || 'Sin Club'}`;

            const misInscripciones = todasLasInscripciones.filter(ins => ins.jugador_id == idSeleccionado).map(ins => ins.categoria_id);
            if (misInscripciones.length > 0) {
                const nombres = todasLasCategorias.filter(c => misInscripciones.includes(c.id)).map(c => c.nombre).join(', ');
                infoInscripciones.innerHTML = `<div class="ya-inscrito">Inscrito en este torneo en: ${nombres}</div>`;
            } else {
                infoInscripciones.innerHTML = "";
            }

            let htmlOpciones = '<option value="">-- Selecciona una categoría --</option>';
            let opcionesDisponibles = 0;

            todasLasCategorias.forEach(cat => {
                const nombreCatLower = cat.nombre.toLowerCase();
                const esLibre = nombreCatLower === 'libre';
                const esPrimera = nombreCatLower.includes('primera');

                let permitido = false;

                if (esLibre) {
                    permitido = true;
                } else if (esPrimera) {
                    permitido = pts >= cat.puntos_minimos;
                } else {
                    permitido = pts <= cat.puntos_maximos;
                }

                if (permitido) {
                    if (misInscripciones.includes(cat.id)) {
                        htmlOpciones += `<option value="${cat.id}" disabled>${cat.nombre} (Ya inscrito)</option>`;
                    } else {
                        htmlOpciones += `<option value="${cat.id}">${cat.nombre}</option>`;
                        opcionesDisponibles++;
                    }
                }
            });

            selectCategoria.innerHTML = opcionesDisponibles === 0 ? '<option value="">No cumples el ranking para más categorías</option>' : htmlOpciones;
            selectCategoria.disabled = false;
            
            selectCategoria.onchange = () => {
                const categoriaValida = selectCategoria.value !== "";
                btnInscribir.disabled = !categoriaValida;
                cajaNip.style.display = categoriaValida ? 'block' : 'none';
                document.getElementById('nip-jugador').value = '';
            };
        }

        async function inscribirJugador() {
            const idJugador = document.getElementById('select-jugador').value;
            const nipIngresado = document.getElementById('nip-jugador').value;
            const selectCategoria = document.getElementById('select-categoria');
            const btnInscribir = document.getElementById('btn-inscribir');

            const jugadorActual = todosLosJugadores.find(j => j.id == idJugador);
            if (nipIngresado !== jugadorActual.nip_seguridad) {
                alert("❌ NIP incorrecto. Intenta de nuevo.");
                return;
            }
            
            btnInscribir.disabled = true; btnInscribir.innerText = "Guardando reserva...";

            const { error } = await clienteSupabase.from('inscripciones').insert([{ 
                torneo_id: torneoActivo.id,
                jugador_id: idJugador, 
                categoria_id: selectCategoria.value,
                estatus_pago: 'Pendiente de Pago'
            }]);

            if (error) { alert("Error al guardar."); btnInscribir.innerText = "Reservar mi lugar"; btnInscribir.disabled = false; return; }

            alert(`¡Listo! Reserva guardada para el torneo "${torneoActivo.nombre}". Envia tu comprobante para validar el pago.`);
            window.location.reload();
        }

        inicializar();
    </script>
</body>
</html>
