<!DOCTYPE html>
<html lang="es">
<head>

    <title>Inscripción al Torneo - Pixel Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');

        body { 
            font-family: 'Sora', sans-serif; 
            padding: 20px; 
            max-width: 520px; 
            margin: auto; 
            background-color: #04060a; 
            color: #f8fafc; 
            min-height: 100vh; 
            position: relative; 
            overflow-x: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box;
        }
        
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 400px; height: 400px; background: #06b6d4; border-radius: 50%; filter: blur(140px); opacity: 0.15; pointer-events: none; z-index: -1; animation: pulse-slow 10s infinite alternate; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 500px; height: 500px; background: #8b5cf6; border-radius: 50%; filter: blur(140px); opacity: 0.15; pointer-events: none; z-index: -1; animation: pulse-slow 12s infinite alternate-reverse; }
        @keyframes pulse-slow { 0% { transform: scale(1) translate(0px, 0px); } 100% { transform: scale(1.3) translate(40px, -60px); } }

        .formulario { 
            position: relative; 
            width: 100%;
            background: rgba(10, 15, 26, 0.55); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-bottom: 5px solid #0e7490; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6); 
            padding: 28px; 
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .formulario:hover { border-bottom-color: #06b6d4; box-shadow: 0 25px 45px -10px rgba(6, 182, 212, 0.35); }

        .logo-resplandor {
            max-width: 180px; 
            display: block;
            margin: 0 auto 20px auto;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.8)) drop-shadow(0 0 25px rgba(217, 70, 239, 0.6));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-resplandor:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 25px rgba(6, 182, 212, 1)) drop-shadow(0 0 40px rgba(217, 70, 239, 0.9));
        }

        .banner-torneo { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: white; 
            padding: 18px; 
            border-radius: 14px; 
            text-align: center; 
            margin-bottom: 22px; 
        }
        .banner-torneo .sub-header { margin: 0 0 6px 0; font-size: 10px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
        .banner-torneo h2 { margin: 0; font-size: 18px; color: #ffffff; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .banner-torneo .detalles-evento { font-size: 11px; color: #fbbf24; margin-top: 10px; font-weight: 700; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        .btn-convocatoria {
            width: 100%;
            background: rgba(244, 63, 94, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-convocatoria:hover {
            background: rgba(251, 191, 36, 0.15);
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            transform: translateY(-2px);
        }
