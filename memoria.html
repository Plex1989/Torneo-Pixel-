<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Técnica e Histórico - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #04060a; color: #f8fafc; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(10, 15, 26, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            body::before, body::after { display: none; }
            .no-print { display: none !important; }
            .glass-panel, .glass-card { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #000 !important; page-break-inside: avoid; }
            * { color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
            .badge-ascenso { background: #dcfce7 !important; color: #15803d !important; border: 1px solid #86efac !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- HEADER -->
        <div class="text-center mb-8 pb-6 border-b border-white/10">
            <p class="text-amber-400 font-black text-xs uppercase tracking-widest mb-2"><i class="fa-solid fa-book-journal-whills mr-2"></i> Reporte Oficial e Histórico de Torneo</p>
            <h1 class="text-2xl md:text-4xl font-black uppercase tracking-widest text-white mb-2">MEMORIA TÉCNICA</h1>
            <h2 id="torneo-nombre" class="text-lg text-cyan-400 font-bold uppercase tracking-widest">Cargando Torneo...</h2>
            
            <div class="mt-6 flex justify-center gap-3 flex-wrap no-print">
                <button onclick="mostrarSeccion('memoria')" id="btn-tab-memoria" class="bg-cyan-500 text-black px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                    📋 Resumen de Partidos
                </button>
                <button onclick="mostrarSeccion('ranking')" id="btn-tab-ranking" class="bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all border border-white/10">
                    🏆 Ranking General y Ascensos
                </button>
                <button onclick="window.print()" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500 hover:text-black px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all">
                    <i class="fa-solid fa-print mr-2"></i> Imprimir / PDF
                </button>
            </div>
        </div>

        <div id="loader" class="text-center text-zinc-500 font-bold animate-pulse my-20">Procesando expediente del torneo...</div>

        <!-- SECCIÓN 1: MEMORIA DE GRUPOS Y EXPEDIENTES -->
        <div id="seccion-memoria" class="hidden flex flex-col gap-8"></div>

        <!-- SECCIÓN 2: RANKING GENERAL Y ASCENSOS DE CATEGORÍA -->
        <div id="seccion-ranking-general" class="hidden flex flex-col gap-8"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        let idTorneoActivo = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

        let reglasRankingList = [];
        let categoriasList = [];
        let todosLosJugadoresBD = [];
        let bonoPaseActivo = false;
        let bonoPaseValor = 0;
        let reporteGlobal = null;

        async function cargarMemoria() {
            try {
                const [resTorneo, resPartidos, resReglas, resConfig, resCat, resJugadores] = await Promise.all([
                    clienteSupabase.from('torneos').select('nombre').eq('id', idTorneoActivo).single(),
                    clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, nombre, club, puntos_ranking), j2:jugador2_id(id, nombre, club, puntos_ranking), categorias(id, nombre)').eq('torneo_id', idTorneoActivo).eq('estado', 'finalizado'),
                    clienteSupabase.from('reglas_ranking').select('*'),
                    clienteSupabase.from('configuracion').select('*').eq('clave', 'bono_pase_grupos').single(),
                    clienteSupabase.from('categorias').select('*').order('puntos_minimos', { ascending: false }),
                    clienteSupabase.from('jugadores').select('*').order('puntos_ranking', { ascending: false })
                ]);

                if (resTorneo.data) document.getElementById('torneo-nombre').innerText = resTorneo.data.nombre;
                reglasRankingList = resReglas.data || [];
                categoriasList = resCat.data || [];
                todosLosJugadoresBD = resJugadores.data || [];
                
                if (resConfig.data) {
                    bonoPaseActivo = resConfig.data.activo;
                    bonoPaseValor = resConfig.data.valor;
                }

                procesarDatos(resPartidos.data || []);

            } catch (error) {
                console.error("Error cargando memoria:", error);
                document.getElementById('loader').innerText = "Error cargando los datos del torneo.";
            }
        }

        function calcularPuntosMatch(p1Pts, p2Pts, ganadorId, j1Id, j2Id) {
            let diff = Math.abs(p1Pts - p2Pts);
            let favoritoId = p1Pts >= p2Pts ? j1Id : j2Id;
            let esUpset = ganadorId !== favoritoId; 

            let reglaExacta = reglasRankingList.find(r => 
                diff >= r.diferencia_min && diff <= r.diferencia_max && 
                ((esUpset && r.resultado_esperado === 'gana_retador') || (!esUpset && r.resultado_esperado === 'gana_favorito'))
            );

            return { 
                ptsGanador: reglaExacta ? reglaExacta.puntos_ganador : 10, 
                ptsPerdedor: reglaExacta ? -Math.abs(reglaExacta.puntos_perdedor) : -5 
            };
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                return rSetB - rSetA;
            });
        }

        function obtenerCategoriaDePuntos(pts) {
            let catEncontrada = categoriasList.find(c => {
                let nom = c.nombre.toLowerCase();
                if (nom === 'libre') return false;
                if (nom.includes('primera')) return pts >= c.puntos_minimos;
                return pts >= c.puntos_minimos && pts <= c.puntos_maximos;
            });
            return catEncontrada || categoriasList.find(c => c.nombre.toLowerCase() === 'libre') || { nombre: 'General', puntos_minimos: 0 };
        }

        function procesarDatos(partidosFin) {
            let reporteData = { categorias: {}, expedientes: {} };

            // INICIALIZAR EXPEDIENTES
            partidosFin.forEach(p => {
                [p.j1, p.j2].forEach(j => {
                    if (j && !reporteData.expedientes[j.id]) {
                        reporteData.expedientes[j.id] = {
                            id: j.id, nombre: j.nombre, club: j.club, ranking_inicial: j.puntos_ranking || 0,
                            pts_ganados: 0, pts_perdidos: 0, partidos: [], ranking_final: j.puntos_ranking || 0
                        };
                    }
                });
            });

            // PROCESAR PARTIDOS Y TABLAS
            partidosFin.forEach(p => {
                let catNombre = p.categorias?.nombre || 'General';
                if (!reporteData.categorias[catNombre]) reporteData.categorias[catNombre] = { grupos: {}, llaves: [] };
                
                let exp1 = reporteData.expedientes[p.jugador1_id];
                let exp2 = reporteData.expedientes[p.jugador2_id];

                if(exp1 && exp2) {
                    let calculo = calcularPuntosMatch(exp1.ranking_inicial, exp2.ranking_inicial, p.ganador_id, p.jugador1_id, p.jugador2_id);
                    let desc1="", desc2="";
                    let resSets = `${p.sets_j1} - ${p.sets_j2}`;

                    if(p.ganador_id === p.jugador1_id) {
                        exp1.pts_ganados += calculo.ptsGanador; exp1.ranking_final += calculo.ptsGanador;
                        exp2.pts_perdidos += calculo.ptsPerdedor; exp2.ranking_final += calculo.ptsPerdedor;
                        desc1 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador})</span> vs ${exp2.nombre}`;
                        desc2 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor})</span> vs ${exp1.nombre}`;
                    } else {
                        exp2.pts_ganados += calculo.ptsGanador; exp2.ranking_final += calculo.ptsGanador;
                        exp1.pts_perdidos += calculo.ptsPerdedor; exp1.ranking_final += calculo.ptsPerdedor;
                        desc2 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador})</span> vs ${exp1.nombre}`;
                        desc1 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor})</span> vs ${exp2.nombre}`;
                    }

                    let faseNombre = p.grupo_nombre ? `Gpo ${p.grupo_nombre}` : (p.ronda_fase || 'Llave');
                    exp1.partidos.push({ fase: faseNombre, res: resSets, desc: desc1 });
                    exp2.partidos.push({ fase: faseNombre, res: `${p.sets_j2} - ${p.sets_j1}`, desc: desc2 });
                }

                if (p.grupo_nombre) {
                    let gpoObj = reporteData.categorias[catNombre].grupos;
                    if(!gpoObj[p.grupo_nombre]) gpoObj[p.grupo_nombre] = {};
                    
                    [p.j1, p.j2].forEach(j => { 
                        if(j && !gpoObj[p.grupo_nombre][j.id]) {
                            gpoObj[p.grupo_nombre][j.id] = { id:j.id, nombre:j.nombre, club:j.club, pj:0, pg:0, pp:0, pts:0, setsG:0, setsP:0 };
                        }
                    });

                    if(p.j1 && p.j2) {
                        let obj1 = gpoObj[p.grupo_nombre][p.j1.id];
                        let obj2 = gpoObj[p.grupo_nombre][p.j2.id];
                        obj1.pj++; obj2.pj++;
                        obj1.setsG += (p.sets_j1||0); obj1.setsP += (p.sets_j2||0);
                        obj2.setsG += (p.sets_j2||0); obj2.setsP += (p.sets_j1||0);

                        if(p.ganador_id === p.jugador1_id) { obj1.pg++; obj1.pts+=2; obj2.pp++; obj2.pts+=1; }
                        else { obj2.pg++; obj2.pts+=2; obj1.pp++; obj1.pts+=1; }
                    }
                }
            });

            // APLICAR BONO DE CLASIFICACIÓN (+10 PTS)
            if (bonoPaseActivo && bonoPaseValor > 0) {
                let idsEnLlaves = new Set();
                partidosFin.filter(p => !p.grupo_nombre && p.ronda_fase).forEach(p => {
                    if (p.jugador1_id) idsEnLlaves.add(p.jugador1_id);
                    if (p.jugador2_id) idsEnLlaves.add(p.jugador2_id);
                });

                idsEnLlaves.forEach(id => {
                    let exp = reporteData.expedientes[id];
                    if (exp) {
                        exp.pts_ganados += bonoPaseValor;
                        exp.ranking_final += bonoPaseValor;
                        exp.partidos.unshift({
                            fase: '🏆 Clasificación',
                            res: '-',
                            desc: `<span class="text-amber-400 font-bold">Bono por Pase a Fase Final (+${bonoPaseValor} pts)</span>`
                        });
                    }
                });
            }

            reporteGlobal = reporteData;
            renderizarMemoriaUI();
            renderizarRankingGeneralUI();
            document.getElementById('loader').style.display = 'none';
            mostrarSeccion('memoria');
        }

        function renderizarMemoriaUI() {
            const container = document.getElementById('seccion-memoria');
            let html = '';

            Object.keys(reporteGlobal.categorias).forEach(catNombre => {
                const catData = reporteGlobal.categorias[catNombre];
                
                html += `<div class="glass-panel p-6 md:p-8 rounded-3xl print-border">`;
                html += `<h2 class="text-xl font-black text-cyan-400 uppercase tracking-widest mb-6 border-b border-cyan-500/30 pb-4"><i class="fa-solid fa-trophy mr-2 text-amber-400"></i> Categoría: ${catNombre}</h2>`;

                if (Object.keys(catData.grupos).length > 0) {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">`;
                    
                    Object.keys(catData.grupos).sort().forEach(gpoNombre => {
                        const jugArr = ordenarJugadoresITTF(Object.values(catData.grupos[gpoNombre]));
                        
                        html += `
                            <div class="glass-card rounded-2xl p-4 print-border">
                                <h4 class="text-amber-400 font-black uppercase mb-3 text-sm">Grupo ${gpoNombre}</h4>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs text-left">
                                        <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                            <tr>
                                                <th class="py-2">Pos</th>
                                                <th class="py-2">Jugador</th>
                                                <th class="py-2 text-center">PJ</th>
                                                <th class="py-2 text-center">PG</th>
                                                <th class="py-2 text-center">PP</th>
                                                <th class="py-2 text-center">Sets</th>
                                                <th class="py-2 text-center text-amber-400">Pts</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-white/5">
                                            ${jugArr.map((j, idx) => `
                                                <tr>
                                                    <td class="py-3 font-black text-zinc-500">#${idx+1}</td>
                                                    <td class="py-3">
                                                        <strong class="text-white block text-[11px]">${j.nombre}</strong>
                                                        <span class="text-[9px] text-zinc-500">${j.club || 'Sin Club'}</span>
                                                    </td>
                                                    <td class="py-3 text-center text-zinc-400 font-bold">${j.pj}</td>
                                                    <td class="py-3 text-center text-emerald-400 font-bold">${j.pg}</td>
                                                    <td class="py-3 text-center text-rose-400 font-bold">${j.pp}</td>
                                                    <td class="py-3 text-center">
                                                        <span class="text-emerald-400 font-bold">${j.setsG}</span><span class="text-zinc-600 mx-1">:</span><span class="text-rose-400 font-bold">${j.setsP}</span>
                                                    </td>
                                                    <td class="py-3 text-center text-amber-400 font-black text-sm">${j.pts}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `</div>`;
            });

            // EXPEDIENTES
            html += `<div class="mt-6">
                        <h2 class="text-xl font-black text-fuchsia-400 uppercase tracking-widest mb-6 border-b border-fuchsia-500/30 pb-4"><i class="fa-solid fa-id-card mr-2"></i> Desglose de Puntuación por Jugador</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

            const expOrdenados = Object.values(reporteGlobal.expedientes).sort((a,b) => b.ranking_final - a.ranking_inicial);

            expOrdenados.forEach(e => {
                let dif = e.ranking_final - e.ranking_inicial;
                let difStr = dif >= 0 ? `<span class="text-emerald-400">+${dif}</span>` : `<span class="text-rose-400">${dif}</span>`;
                
                let trs = e.partidos.map(p => `
                    <tr class="border-b border-white/5">
                        <td class="py-2 text-zinc-400 whitespace-nowrap">${p.fase}</td>
                        <td class="py-2">${p.desc}</td>
                        <td class="py-2 text-center font-digital text-white">${p.res}</td>
                    </tr>
                `).join('');

                if(e.partidos.length === 0) trs = `<tr><td colspan="3" class="py-4 text-center text-zinc-500 italic">Sin partidos registrados</td></tr>`;

                html += `
                    <div class="glass-card rounded-2xl p-5 print-border flex flex-col">
                        <div class="flex justify-between items-start mb-4 border-b border-white/10 pb-4">
                            <div>
                                <h4 class="text-sm font-black text-white uppercase">${e.nombre}</h4>
                                <span class="text-[10px] text-zinc-500 font-bold">${e.club || 'Sin Club'}</span>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black text-amber-400">${e.ranking_final} <span class="text-xs text-zinc-500 font-bold">pts</span></div>
                                <div class="text-[10px] font-bold">${e.ranking_inicial} ➔ ${e.ranking_final} (${difStr})</div>
                            </div>
                        </div>
                        <div class="overflow-y-auto max-h-48 pr-2 custom-scroll flex-1">
                            <table class="w-full text-[10px] text-left">
                                <tbody class="divide-y divide-white/5">
                                    ${trs}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderizarRankingGeneralUI() {
            const container = document.getElementById('seccion-ranking-general');
            let html = '';

            // Mapear el nuevo ranking de los jugadores procesados
            let jugadoresProcesadosMap = new Map();
            Object.values(reporteGlobal.expedientes).forEach(exp => {
                jugadoresProcesadosMap.set(exp.id, exp);
            });

            // Crear lista consolidada de toda la BD con su ranking proyectado tras el torneo
            let listaCompletaProyectada = todosLosJugadoresBD.map(j => {
                let exp = jugadoresProcesadosMap.get(j.id);
                let rInicial = j.puntos_ranking || 0;
                let rFinal = exp ? exp.ranking_final : rInicial;
                
                let catInicial = obtenerCategoriaDePuntos(rInicial);
                let catFinal = obtenerCategoriaDePuntos(rFinal);

                let subióCat = false;
                if (catInicial.id !== catFinal.id && catFinal.puntos_minimos > catInicial.puntos_minimos) {
                    subióCat = true;
                }

                return {
                    id: j.id,
                    nombre: j.nombre,
                    club: j.club || 'Sin Club',
                    rInicial: rInicial,
                    rFinal: rFinal,
                    dif: rFinal - rInicial,
                    catInicial: catInicial,
                    catFinal: catFinal,
                    subióCat: subióCat
                };
            });

            // Agrupar por Categorías de Destino
            const categoriasFuerza = categoriasList.filter(c => c.nombre && c.nombre.toLowerCase() !== 'libre').sort((a, b) => b.puntos_minimos - a.puntos_minimos);

            categoriasFuerza.forEach(cat => {
                const jugsEnCat = listaCompletaProyectada.filter(j => j.catFinal.id === cat.id).sort((a, b) => b.rFinal - a.rFinal);

                html += `
                    <div class="glass-panel p-6 md:p-8 rounded-3xl print-border">
                        <div class="flex justify-between items-center border-b border-purple-500/30 pb-4 mb-6">
                            <h3 class="text-lg md:text-xl font-black text-purple-400 uppercase tracking-widest"><i class="fa-solid fa-layer-group mr-2"></i> ${cat.nombre}</h3>
                            <span class="text-xs text-zinc-500 font-bold uppercase tracking-wider">Rango: ${cat.puntos_minimos} a ${cat.puntos_maximos} Pts</span>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-left">
                                <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                    <tr>
                                        <th class="py-2">Pos</th>
                                        <th class="py-2">Jugador</th>
                                        <th class="py-2">Club / Entidad</th>
                                        <th class="py-2 text-center">Ranking Inicial</th>
                                        <th class="py-2 text-center">Variación</th>
                                        <th class="py-2 text-center text-amber-400">Nuevo Ranking</th>
                                        <th class="py-2 text-right">Estatus / Mención</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${jugsEnCat.length === 0 ? `<tr><td colspan="7" class="py-4 text-center text-zinc-600 italic">Sin jugadores en este rango.</td></tr>` : 
                                    jugsEnCat.map((j, idx) => {
                                        let difHtml = j.dif > 0 ? `<span class="text-emerald-400 font-bold">+${j.dif}</span>` : (j.dif < 0 ? `<span class="text-rose-400 font-bold">${j.dif}</span>` : `<span class="text-zinc-600">0</span>`);
                                        
                                        let mencionAscenso = j.subióCat ? `
                                            <span class="badge-ascenso bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider inline-block animate-pulse">
                                                🎉 ¡Felicidades! Ascendiste a ${cat.nombre}
                                            </span>
                                        ` : '';

                                        return `
                                            <tr>
                                                <td class="py-3 font-black text-zinc-500">#${idx + 1}</td>
                                                <td class="py-3 font-bold text-white">${j.nombre}</td>
                                                <td class="py-3 text-zinc-400 font-semibold">${j.club}</td>
                                                <td class="py-3 text-center text-zinc-400 font-bold">${j.rInicial} pts</td>
                                                <td class="py-3 text-center font-bold">${difHtml}</td>
                                                <td class="py-3 text-center text-amber-400 font-black text-sm">${j.rFinal} pts</td>
                                                <td class="py-3 text-right">${mencionAscenso}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function mostrarSeccion(sec) {
            const btnMemoria = document.getElementById('btn-tab-memoria');
            const btnRanking = document.getElementById('btn-tab-ranking');
            const secMemoria = document.getElementById('seccion-memoria');
            const secRanking = document.getElementById('seccion-ranking-general');

            if (sec === 'memoria') {
                secMemoria.classList.remove('hidden');
                secRanking.classList.add('hidden');
                btnMemoria.className = "bg-cyan-500 text-black px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]";
                btnRanking.className = "bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all border border-white/10";
            } else {
                secMemoria.classList.add('hidden');
                secRanking.classList.remove('hidden');
                btnRanking.className = "bg-purple-500 text-white px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(168,85,247,0.4)]";
                btnMemoria.className = "bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-widest transition-all border border-white/10";
            }
        }

        cargarMemoria();
    </script>
</body>
