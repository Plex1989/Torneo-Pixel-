<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Técnica e Histórico - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #04060a; color: #f8fafc; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.06); }
        
        .sticky-nav-mobile { position: sticky; top: 0; z-index: 50; background: rgba(4, 6, 10, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* MODAL ESTILOS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; width: 100%; max-width: 520px; padding: 24px; color: white; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            body::before, body::after, .sticky-nav-mobile { display: none !important; }
            .no-print { display: none !important; }
            .glass-panel, .glass-card { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #000 !important; page-break-inside: avoid; }
            * { color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
            .badge-ascenso { background: #dcfce7 !important; color: #15803d !important; border: 1px solid #86efac !important; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        }
    </style>
</head>
<body class="pb-12">

    <!-- MODAL EXPEDIENTE COMPLETO CON RANKING -->
    <div id="modal-jugador-admin" class="modal-overlay no-print" style="display: none;">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 16px;">
                <div>
                    <h3 id="modal-jugador-nombre" style="margin: 0; color: #38bdf8; font-size: 16px; font-weight: 800; text-transform: uppercase;"></h3>
                    <span id="modal-jugador-club" style="font-size: 10px; color: #94a3b8; font-weight: 700;"></span>
                </div>
                <div style="text-align: right; padding-right: 15px;">
                    <div id="modal-jugador-ranking-header" style="font-size: 16px; font-weight: 900; color: #fbbf24;"></div>
                    <span id="modal-jugador-variacion" style="font-size: 10px; font-weight: 800; color:#94a3b8;"></span>
                </div>
                <button onclick="cerrarModalJugadorAdmin()" style="background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 800;">✕</button>
            </div>
            
            <div id="modal-jugador-partidos-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="text-center text-zinc-500 italic py-4">Cargando expediente...</div>
            </div>
            
            <button onclick="cerrarModalJugadorAdmin()" style="width: 100%; justify-content: center; margin-top: 20px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24; padding: 12px; border-radius: 9999px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;">Cerrar Detalle</button>
        </div>
    </div>

    <!-- NAVEGACIÓN STICKY MÓVIL FIJA EN LA PARTE SUPERIOR -->
    <div class="sticky-nav-mobile p-3 mb-6 no-print">
        <div class="max-w-5xl mx-auto flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest truncate"><i class="fa-solid fa-trophy mr-1"></i> MEMORIA TÉCNICA</span>
                <span id="torneo-nombre-tag" class="text-[10px] text-cyan-400 font-bold uppercase truncate max-w-[180px]">Cargando...</span>
            </div>
            
            <div class="flex gap-2">
                <button onclick="mostrarSeccion('memoria')" id="btn-tab-memoria" class="flex-1 bg-cyan-500 text-black py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                    📋 Partidos
                </button>
                <button onclick="mostrarSeccion('ranking')" id="btn-tab-ranking" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center">
                    🏆 Ranking General
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 md:px-8">
        
        <!-- HEADER PRINCIPAL -->
        <div class="text-center mb-8 pb-6 border-b border-white/10">
            <h1 class="text-2xl md:text-4xl font-black uppercase tracking-widest text-white mb-1">REPORTE OFICIAL DEL TORNEO</h1>
            <h2 id="torneo-nombre" class="text-base md:text-xl text-cyan-400 font-bold uppercase tracking-widest">Cargando Torneo...</h2>
            <p class="text-[10px] text-zinc-400 font-bold mt-2 uppercase tracking-widest no-print">Toca a cualquier jugador para ver su expediente</p>
            
            <div class="mt-4 flex justify-center gap-3 no-print">
                <button onclick="window.print()" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500 hover:text-black px-5 py-2 rounded-full text-xs font-bold uppercase tracking-widest transition-all">
                    <i class="fa-solid fa-print mr-1"></i> Imprimir / PDF
                </button>
            </div>
        </div>

        <div id="loader" class="text-center text-zinc-500 font-bold animate-pulse my-20">Procesando expediente en vivo...</div>

        <!-- SECCIÓN 1: MEMORIA DE GRUPOS -->
        <div id="seccion-memoria" class="hidden flex flex-col gap-8"></div>

        <!-- SECCIÓN 2: RANKING GENERAL Y ASCENSOS -->
        <div id="seccion-ranking-general" class="hidden flex flex-col gap-8"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        let idTorneoActivo = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

        let reglasRankingList = [];
        let categoriasList = [];
        let todosLosJugadoresBD = [];
        let bonoPaseActivo = false;
        let bonoPaseValor = 0;
        let reporteGlobal = null;

        async function cargarMemoria() {
            try {
                const [resTorneo, resPartidos, resReglas, resConfig, resCat, resJugadores] = await Promise.all([
                    clienteSupabase.from('torneos').select('nombre').eq('id', idTorneoActivo).single(),
                    clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, nombre, club, puntos_ranking), j2:jugador2_id(id, nombre, club, puntos_ranking), categorias(id, nombre)').eq('torneo_id', idTorneoActivo).eq('estado', 'finalizado'),
                    clienteSupabase.from('reglas_ranking').select('*'),
                    clienteSupabase.from('configuracion').select('*').eq('clave', 'bono_pase_grupos').single(),
                    clienteSupabase.from('categorias').select('*').order('puntos_minimos', { ascending: false }),
                    clienteSupabase.from('jugadores').select('*').order('puntos_ranking', { ascending: false })
                ]);

                if (resTorneo.data) {
                    document.getElementById('torneo-nombre').innerText = resTorneo.data.nombre;
                    document.getElementById('torneo-nombre-tag').innerText = resTorneo.data.nombre;
                }
                reglasRankingList = resReglas.data || [];
                categoriasList = resCat.data || [];
                todosLosJugadoresBD = resJugadores.data || [];
                
                if (resConfig.data) {
                    bonoPaseActivo = resConfig.data.activo;
                    bonoPaseValor = resConfig.data.valor;
                }

                procesarDatos(resPartidos.data || []);

            } catch (error) {
                console.error("Error cargando memoria:", error);
                document.getElementById('loader').innerText = "Error cargando los datos del torneo.";
            }
        }

        function calcularPuntosMatch(p1Pts, p2Pts, ganadorId, j1Id, j2Id) {
            let diff = Math.abs(p1Pts - p2Pts);
            let favoritoId = p1Pts >= p2Pts ? j1Id : j2Id;
            let esUpset = ganadorId !== favoritoId; 

            let reglaExacta = reglasRankingList.find(r => 
                diff >= r.diferencia_min && diff <= r.diferencia_max && 
                ((esUpset && r.resultado_esperado === 'gana_retador') || (!esUpset && r.resultado_esperado === 'gana_favorito'))
            );

            return { 
                ptsGanador: reglaExacta ? reglaExacta.puntos_ganador : 10, 
                ptsPerdedor: reglaExacta ? -Math.abs(reglaExacta.puntos_perdedor) : -5 
            };
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                if (Math.abs(rSetB - rSetA) > 0.0001) return rSetB - rSetA;
                return b.pg - a.pg;
            });
        }

        function obtenerCategoriaDePuntos(pts) {
            let catEncontrada = categoriasList.find(c => {
                let nom = c.nombre.toLowerCase();
                if (nom === 'libre') return false;
                if (nom.includes('primera')) return pts >= c.puntos_minimos;
                return pts >= c.puntos_minimos && pts <= c.puntos_maximos;
            });
            return catEncontrada || categoriasList.find(c => c.nombre.toLowerCase() === 'libre') || { nombre: 'General', puntos_minimos: 0 };
        }

        function procesarDatos(partidosFin) {
            let reporteData = { categorias: {}, expedientes: {} };

            partidosFin.forEach(p => {
                [p.j1, p.j2].forEach(j => {
                    if (j && !reporteData.expedientes[j.id]) {
                        reporteData.expedientes[j.id] = {
                            id: j.id, nombre: j.nombre, club: j.club, ranking_inicial: j.puntos_ranking || 0,
                            pts_ganados: 0, pts_perdidos: 0, partidos: [], ranking_final: j.puntos_ranking || 0
                        };
                    }
                });
            });

            partidosFin.forEach(p => {
                let catNombre = p.categorias?.nombre || 'General';
                if (!reporteData.categorias[catNombre]) reporteData.categorias[catNombre] = { grupos: {}, llaves: [] };
                
                let exp1 = reporteData.expedientes[p.jugador1_id];
                let exp2 = reporteData.expedientes[p.jugador2_id];

                if(exp1 && exp2) {
                    let calculo = calcularPuntosMatch(exp1.ranking_inicial, exp2.ranking_inicial, p.ganador_id, p.jugador1_id, p.jugador2_id);
                    let desc1="", desc2="";
                    let resSets = `${p.sets_j1} - ${p.sets_j2}`;

                    if(p.ganador_id === p.jugador1_id) {
                        exp1.pts_ganados += calculo.ptsGanador; exp1.ranking_final += calculo.ptsGanador;
                        exp2.pts_perdidos += calculo.ptsPerdedor; exp2.ranking_final += calculo.ptsPerdedor;
                        desc1 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador})</span> vs ${exp2.nombre}`;
                        desc2 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor})</span> vs ${exp1.nombre}`;
                    } else {
                        exp2.pts_ganados += calculo.ptsGanador; exp2.ranking_final += calculo.ptsGanador;
                        exp1.pts_perdidos += calculo.ptsPerdedor; exp1.ranking_final += calculo.ptsPerdedor;
                        desc2 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador})</span> vs ${exp1.nombre}`;
                        desc1 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor})</span> vs ${exp2.nombre}`;
                    }

                    let faseNombre = p.grupo_nombre ? `Gpo ${p.grupo_nombre}` : (p.ronda_fase || 'Llave');
                    exp1.partidos.push({ fase: faseNombre, res: resSets, desc: desc1 });
                    exp2.partidos.push({ fase: faseNombre, res: `${p.sets_j2} - ${p.sets_j1}`, desc: desc2 });
                }

                if (p.grupo_nombre) {
                    let gpoObj = reporteData.categorias[catNombre].grupos;
                    if(!gpoObj[p.grupo_nombre]) gpoObj[p.grupo_nombre] = {};
                    
                    [p.j1, p.j2].forEach(j => { 
                        if(j && !gpoObj[p.grupo_nombre][j.id]) {
                            gpoObj[p.grupo_nombre][j.id] = { id:j.id, nombre:j.nombre, club:j.club, pj:0, pg:0, pp:0, pts:0, setsG:0, setsP:0 };
                        }
                    });

                    if(p.j1 && p.j2) {
                        let obj1 = gpoObj[p.grupo_nombre][p.j1.id];
                        let obj2 = gpoObj[p.grupo_nombre][p.j2.id];
                        obj1.pj++; obj2.pj++;
                        obj1.setsG += (p.sets_j1||0); obj1.setsP += (p.sets_j2||0);
                        obj2.setsG += (p.sets_j2||0); obj2.setsP += (p.sets_j1||0);

                        if(p.ganador_id === p.jugador1_id) { obj1.pg++; obj1.pts+=2; obj2.pp++; obj2.pts+=1; }
                        else { obj2.pg++; obj2.pts+=2; obj1.pp++; obj1.pts+=1; }
                    }
                } else {
                    reporteData.categorias[catNombre].llaves.push(p);
                }
            });

            if (bonoPaseActivo && bonoPaseValor > 0) {
                let idsEnLlaves = new Set();
                partidosFin.filter(p => !p.grupo_nombre && p.ronda_fase).forEach(p => {
                    if (p.jugador1_id) idsEnLlaves.add(p.jugador1_id);
                    if (p.jugador2_id) idsEnLlaves.add(p.jugador2_id);
                });

                idsEnLlaves.forEach(id => {
                    let exp = reporteData.expedientes[id];
                    if (exp) {
                        exp.pts_ganados += bonoPaseValor;
                        exp.ranking_final += bonoPaseValor;
                        exp.partidos.unshift({
                            fase: '🏆 Fase Final',
                            res: '-',
                            desc: `<span class="text-amber-400 font-bold">Bono por Clasificar (+${bonoPaseValor} pts)</span>`
                        });
                    }
                });
            }

            reporteGlobal = reporteData;
            renderizarMemoriaUI();
            renderizarRankingGeneralUI();
            document.getElementById('loader').style.display = 'none';
            mostrarSeccion('memoria');
        }

        // ==========================================
        // CÓDIGO DEL MODAL DE EXPEDIENTE
        // ==========================================
        function abrirModalJugadorAdmin(jugadorId) {
            const exp = reporteGlobal.expedientes[jugadorId];
            if (!exp) return;

            document.getElementById('modal-jugador-nombre').innerText = exp.nombre;
            document.getElementById('modal-jugador-club').innerText = exp.club || 'Sin Club';

            let dif = exp.ranking_final - exp.ranking_inicial;
            let difStr = dif >= 0 ? `<span class="text-emerald-400">+${dif}</span>` : `<span class="text-rose-400">${dif}</span>`;
            
            document.getElementById('modal-jugador-ranking-header').innerText = `${exp.ranking_final} pts`;
            document.getElementById('modal-jugador-variacion').innerHTML = `${exp.ranking_inicial} ➔ ${exp.ranking_final} (${difStr})`;

            let trs = exp.partidos.map(p => `
                <div style="background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.08); padding:12px 16px; border-radius:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <span style="font-size:10px; color:#38bdf8; font-weight:800; text-transform:uppercase;">${p.fase}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="font-size:11px;">${p.desc}</div>
                        <span style="font-family:'Orbitron', sans-serif; font-size:14px; font-weight:800; color:#fbbf24;">${p.res}</span>
                    </div>
                </div>
            `).join('');

            if(exp.partidos.length === 0) trs = '<div class="text-center text-zinc-500 italic py-4">Sin partidos en este torneo.</div>';

            document.getElementById('modal-jugador-partidos-list').innerHTML = trs;
            document.getElementById('modal-jugador-admin').style.display = 'flex';
        }

        function cerrarModalJugadorAdmin() {
            document.getElementById('modal-jugador-admin').style.display = 'none';
        }

        function renderizarMemoriaUI() {
            const container = document.getElementById('seccion-memoria');
            let html = '';

            Object.keys(reporteGlobal.categorias).forEach(catNombre => {
                const catData = reporteGlobal.categorias[catNombre];
                
                html += `<div class="glass-panel p-4 md:p-8 rounded-3xl print-border">`;
                html += `<h2 class="text-lg md:text-2xl font-black text-cyan-400 uppercase tracking-widest mb-6 border-b border-cyan-500/30 pb-4"><i class="fa-solid fa-trophy mr-2 text-amber-400"></i> Categoría: ${catNombre}</h2>`;

                if (Object.keys(catData.grupos).length > 0) {
                    html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">`;
                    
                    Object.keys(catData.grupos).sort().forEach(gpoNombre => {
                        const jugArr = ordenarJugadoresITTF(Object.values(catData.grupos[gpoNombre]));
                        
                        html += `
                            <div class="glass-card rounded-2xl p-4 print-border">
                                <h4 class="text-amber-400 font-black uppercase mb-3 text-sm">Grupo ${gpoNombre}</h4>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs text-left">
                                        <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                            <tr>
                                                <th class="py-2">Pos</th>
                                                <th class="py-2">Jugador</th>
                                                <th class="py-2 text-center hidden sm:table-cell">PJ</th>
                                                <th class="py-2 text-center">PG</th>
                                                <th class="py-2 text-center">PP</th>
                                                <th class="py-2 text-center">Sets</th>
                                                <th class="py-2 text-center text-amber-400">Pts</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-white/5">
                                            ${jugArr.map((j, idx) => `
                                                <tr class="cursor-pointer hover:bg-cyan-500/10 transition-colors" onclick="abrirModalJugadorAdmin(${j.id})">
                                                    <td class="py-3 font-black text-zinc-500">#${idx+1}</td>
                                                    <td class="py-3">
                                                        <strong class="text-white block text-[11px]">${j.nombre}</strong>
                                                        <span class="text-[9px] text-zinc-500">${j.club || 'Sin Club'}</span>
                                                    </td>
                                                    <td class="py-3 text-center text-zinc-400 font-bold hidden sm:table-cell">${j.pj}</td>
                                                    <td class="py-3 text-center text-emerald-400 font-bold">${j.pg}</td>
                                                    <td class="py-3 text-center text-rose-400 font-bold">${j.pp}</td>
                                                    <td class="py-3 text-center">
                                                        <span class="text-emerald-400 font-bold">${j.setsG}</span><span class="text-zinc-600 mx-1">:</span><span class="text-rose-400 font-bold">${j.setsP}</span>
                                                    </td>
                                                    <td class="py-3 text-center text-amber-400 font-black text-sm">${j.pts}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function renderizarRankingGeneralUI() {
            const container = document.getElementById('seccion-ranking-general');
            let html = '';

            let jugadoresProcesadosMap = new Map();
            Object.values(reporteGlobal.expedientes).forEach(exp => {
                jugadoresProcesadosMap.set(exp.id, exp);
            });

            let listaCompletaProyectada = todosLosJugadoresBD.map(j => {
                let exp = jugadoresProcesadosMap.get(j.id);
                let rInicial = j.puntos_ranking || 0;
                let rFinal = exp ? exp.ranking_final : rInicial;
                
                let catInicial = obtenerCategoriaDePuntos(rInicial);
                let catFinal = obtenerCategoriaDePuntos(rFinal);

                let subióCat = false;
                if (catInicial.id !== catFinal.id && catFinal.puntos_minimos > catInicial.puntos_minimos) {
                    subióCat = true;
                }

                return {
                    id: j.id, nombre: j.nombre, club: j.club || 'Sin Club',
                    rInicial, rFinal, dif: rFinal - rInicial,
                    catInicial, catFinal, subióCat, jugoTorneo: !!exp
                };
            });

            const categoriasFuerza = categoriasList.filter(c => c.nombre && c.nombre.toLowerCase() !== 'libre').sort((a, b) => b.puntos_minimos - a.puntos_minimos);

            categoriasFuerza.forEach(cat => {
                const jugsEnCat = listaCompletaProyectada.filter(j => j.catFinal.id === cat.id).sort((a, b) => b.rFinal - a.rFinal);

                html += `
                    <div class="glass-panel p-4 md:p-8 rounded-3xl print-border">
                        <div class="flex justify-between items-center border-b border-purple-500/30 pb-4 mb-6 flex-wrap gap-2">
                            <h3 class="text-lg md:text-xl font-black text-purple-400 uppercase tracking-widest"><i class="fa-solid fa-layer-group mr-2"></i> ${cat.nombre}</h3>
                            <span class="text-[10px] md:text-xs text-zinc-500 font-bold uppercase tracking-wider">Rango: ${cat.puntos_minimos} a ${cat.puntos_maximos} Pts</span>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-left">
                                <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                    <tr>
                                        <th class="py-2">Pos</th>
                                        <th class="py-2">Jugador</th>
                                        <th class="py-2 hidden md:table-cell">Club</th>
                                        <th class="py-2 text-center">Variación</th>
                                        <th class="py-2 text-center text-amber-400">Pts</th>
                                        <th class="py-2 text-right">Estatus</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${jugsEnCat.length === 0 ? `<tr><td colspan="6" class="py-4 text-center text-zinc-600 italic">Sin jugadores en este rango.</td></tr>` : 
                                    jugsEnCat.map((j, idx) => {
                                        let difHtml = j.dif > 0 ? `<span class="text-emerald-400 font-bold">+${j.dif}</span>` : (j.dif < 0 ? `<span class="text-rose-400 font-bold">${j.dif}</span>` : `<span class="text-zinc-600">0</span>`);
                                        
                                        let mencionAscenso = j.subióCat ? `<span class="badge-ascenso bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-1 rounded text-[9px] font-black uppercase tracking-wider inline-block animate-pulse">🎉 ASCENSO</span>` : '';
                                        let accionClic = j.jugoTorneo ? `onclick="abrirModalJugadorAdmin(${j.id})" class="cursor-pointer hover:bg-fuchsia-500/10 transition-colors"` : `class="opacity-60"`;

                                        return `
                                            <tr ${accionClic}>
                                                <td class="py-3 font-black text-zinc-500">#${idx + 1}</td>
                                                <td class="py-3">
                                                    <strong class="text-white block text-[11px] md:text-xs">${j.nombre}</strong>
                                                    <span class="text-[9px] text-zinc-500 md:hidden">${j.club}</span>
                                                </td>
                                                <td class="py-3 text-zinc-400 font-semibold hidden md:table-cell">${j.club}</td>
                                                <td class="py-3 text-center font-bold text-[10px]">${j.rInicial} ➔${difHtml}</td>
                                                <td class="py-3 text-center text-amber-400 font-black text-sm">${j.rFinal}</td>
                                                <td class="py-3 text-right">${mencionAscenso}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        function mostrarSeccion(sec) {
            const btnMemoria = document.getElementById('btn-tab-memoria');
            const btnRanking = document.getElementById('btn-tab-ranking');
            const secMemoria = document.getElementById('seccion-memoria');
            const secRanking = document.getElementById('seccion-ranking-general');

            if (sec === 'memoria') {
                secMemoria.classList.remove('hidden');
                secRanking.classList.add('hidden');
                btnMemoria.className = "flex-1 bg-cyan-500 text-black py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(6,182,212,0.4)]";
                btnRanking.className = "flex-1 bg-white/10 hover:bg-white/20 text-white py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center";
            } else {
                secMemoria.classList.add('hidden');
                secRanking.classList.remove('hidden');
                btnRanking.className = "flex-1 bg-fuchsia-500 text-white py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(217,70,239,0.4)]";
                btnMemoria.className = "flex-1 bg-white/10 hover:bg-white/20 text-white py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center";
            }
        }

        cargarMemoria();
    </script>
</body>
</html>
