<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Técnica e Histórico - Pixel Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Sora', sans-serif; background-color: #04060a; color: #f8fafc; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: -10%; left: -10%; width: 500px; height: 500px; background: #06b6d4; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        body::after { content: ""; position: fixed; bottom: 5%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; border-radius: 50%; filter: blur(150px); opacity: 0.12; z-index: -1; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel { background: rgba(10, 15, 26, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-card { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.06); }
        
        .sticky-nav-mobile { position: sticky; top: 0; z-index: 50; background: rgba(4, 6, 10, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* MODAL ESTILOS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; width: 100%; max-width: 520px; padding: 24px; color: white; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        /* EFECTO CLIC JUGADOR */
        .jugador-clic { cursor: pointer; transition: all 0.2s ease; border-bottom: 1px dashed rgba(255,255,255,0.3); }
        .jugador-clic:hover { color: #38bdf8 !important; border-bottom-color: #38bdf8; }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            body::before, body::after, .sticky-nav-mobile { display: none !important; }
            .no-print { display: none !important; }
            .glass-panel, .glass-card { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #000 !important; page-break-inside: avoid; box-shadow: none !important; }
            * { color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
            .badge-ascenso { background: #dcfce7 !important; color: #15803d !important; border: 1px solid #86efac !important; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        }
    </style>
</head>
<body class="pb-12">

    <!-- MODAL EXPEDIENTE COMPLETO CON RANKING -->
    <div id="modal-jugador-admin" class="modal-overlay no-print" style="display: none;">
        <div class="modal-card relative">
            <div class="flex justify-between items-start border-b border-white/10 pb-4 mb-4">
                <div>
                    <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-1"><i class="fa-solid fa-id-card mr-1"></i> Expediente Oficial</div>
                    <h3 id="modal-jugador-nombre" class="m-0 text-white text-xl md:text-2xl font-black uppercase tracking-wider"></h3>
                    <span id="modal-jugador-club" class="text-xs text-zinc-400 font-bold block mt-1"></span>
                </div>
                <button onclick="cerrarModalJugador()" class="bg-white/10 hover:bg-white/20 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold transition-colors">✕</button>
            </div>
            
            <!-- TARJETA DE RESUMEN DE RANKING -->
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 border border-white/10 rounded-xl p-4 mb-5 flex justify-between items-center shadow-inner">
                <div>
                    <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest mb-1">Evolución de Ranking</div>
                    <div id="modal-jugador-variacion" class="text-xs font-bold text-zinc-300"></div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-amber-500/70 font-bold uppercase tracking-widest mb-1">Ranking Actual</div>
                    <div id="modal-jugador-ranking-header" class="text-2xl font-black text-amber-400"></div>
                </div>
            </div>

            <!-- HISTORIAL DE PARTIDOS -->
            <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mb-3"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Historial en este Torneo</div>
            <div id="modal-jugador-partidos-list" class="flex flex-col gap-3">
                <div class="mensaje-vacio">Cargando expediente...</div>
            </div>
            
            <button onclick="cerrarModalJugador()" class="w-full mt-6 bg-amber-500/20 hover:bg-amber-500 hover:text-black border border-amber-500/40 text-amber-400 py-3 rounded-full font-black text-xs uppercase tracking-widest transition-all">Cerrar Detalle</button>
        </div>
    </div>

    <!-- NAVEGACIÓN STICKY MÓVIL FIJA -->
    <div class="sticky-nav-mobile p-3 mb-6 no-print">
        <div class="max-w-5xl mx-auto flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest truncate"><i class="fa-solid fa-book-journal-whills mr-1"></i> MEMORIA TÉCNICA</span>
                <span id="torneo-nombre-tag" class="text-[10px] text-cyan-400 font-bold uppercase truncate max-w-[180px]">Cargando...</span>
            </div>
            
            <div class="flex gap-2">
                <button onclick="mostrarSeccion('memoria')" id="btn-tab-memoria" class="flex-1 bg-cyan-500 text-black py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                    📋 Reporte & Llaves
                </button>
                <button onclick="mostrarSeccion('ranking')" id="btn-tab-ranking" class="flex-1 bg-white/10 hover:bg-white/20 text-white py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center">
                    🏆 Ranking General
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 md:px-8">
        <!-- HEADER PRINCIPAL -->
        <div class="text-center mb-8 pb-6 border-b border-white/10">
            <h1 class="text-2xl md:text-4xl font-black uppercase tracking-widest text-white mb-1">REPORTE OFICIAL DEL TORNEO</h1>
            <h2 id="torneo-nombre" class="text-base md:text-xl text-cyan-400 font-bold uppercase tracking-widest">Cargando Torneo...</h2>
            <p class="text-[10px] text-amber-400 font-bold mt-3 uppercase tracking-widest no-print bg-amber-500/10 inline-block px-4 py-1.5 rounded-full border border-amber-500/30 animate-pulse">
                <i class="fa-solid fa-hand-pointer mr-1"></i> Toca el nombre de cualquier jugador para auditar su expediente
            </p>
            
            <div class="mt-5 flex justify-center gap-3 no-print">
                <button onclick="window.print()" class="bg-zinc-800 text-zinc-300 border border-zinc-700 hover:bg-zinc-700 hover:text-white px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-widest transition-all">
                    <i class="fa-solid fa-print mr-1"></i> Imprimir Memoria
                </button>
            </div>
        </div>

        <div id="loader" class="text-center text-zinc-500 font-bold animate-pulse my-20">Procesando llaves, grupos y expedientes...</div>

        <!-- SECCIÓN 1: MEMORIA DE GRUPOS Y LLAVES -->
        <div id="seccion-memoria" class="hidden flex flex-col gap-8"></div>

        <!-- SECCIÓN 2: RANKING GENERAL Y ASCENSOS -->
        <div id="seccion-ranking-general" class="hidden flex flex-col gap-8"></div>
    </div>

    <script>
        const supabaseUrl = 'https://stytjtqshyupkyihurpd.supabase.co';
        const supabaseKey = 'sb_publishable_vwjEpT0qRQv_giJV-oqLaA_dkDDCcR-';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        let idTorneoActivo = urlParams.get('torneo') || localStorage.getItem('torneo_activo_id') || 1;

        let ORG_ID = null; // EXTRAÍDO AUTOMÁTICAMENTE
        let reglasRankingList = [];
        let categoriasList = [];
        let todosLosJugadoresBD = [];
        let bonoPaseActivo = false;
        let bonoPaseValor = 0;
        let reporteGlobal = null;

        async function cargarMemoria() {
            try {
                // 1. OBTENER TORNEO Y SU DUEÑO
                const { data: torneoData } = await clienteSupabase.from('torneos').select('nombre, organizador_id').eq('id', idTorneoActivo).single();
                if (torneoData) {
                    document.getElementById('torneo-nombre').innerText = torneoData.nombre;
                    document.getElementById('torneo-nombre-tag').innerText = torneoData.nombre;
                    ORG_ID = torneoData.organizador_id;
                } else {
                    throw new Error("Torneo no encontrado");
                }

                // 2. CARGAR DATOS BLINDADOS
                const [resPartidos, resReglas, resConfig, resCat, resJugadores] = await Promise.allSettled([
                    clienteSupabase.from('partidos').select('*, j1:jugador1_id(id, nombre, club, puntos_ranking), j2:jugador2_id(id, nombre, club, puntos_ranking), categorias(id, nombre)').eq('torneo_id', idTorneoActivo).eq('organizador_id', ORG_ID).eq('estado', 'finalizado'),
                    clienteSupabase.from('reglas_ranking').select('*').eq('organizador_id', ORG_ID),
                    clienteSupabase.from('configuracion').select('*').eq('clave', 'bono_pase_grupos').eq('organizador_id', ORG_ID).single(),
                    clienteSupabase.from('categorias').select('*').eq('organizador_id', ORG_ID).order('puntos_minimos', { ascending: false }),
                    clienteSupabase.from('jugadores').select('*').eq('organizador_id', ORG_ID).order('puntos_ranking', { ascending: false })
                ]);
                
                reglasRankingList = resReglas.status === 'fulfilled' ? (resReglas.value.data || []) : [];
                categoriasList = resCat.status === 'fulfilled' ? (resCat.value.data || []) : [];
                todosLosJugadoresBD = resJugadores.status === 'fulfilled' ? (resJugadores.value.data || []) : [];
                
                if (resConfig.status === 'fulfilled' && resConfig.value.data) {
                    bonoPaseActivo = resConfig.value.data.activo;
                    bonoPaseValor = resConfig.value.data.valor;
                }

                let partidosFin = resPartidos.status === 'fulfilled' ? (resPartidos.value.data || []) : [];
                procesarDatos(partidosFin);

            } catch (error) {
                console.error("Error crítico cargando memoria:", error);
                document.getElementById('loader').innerHTML = `<span class="text-rose-500">Error cargando los datos del torneo. Verifica tu conexión.</span>`;
            }
        }

        function calcularPuntosMatch(p1Pts, p2Pts, ganadorId, j1Id, j2Id) {
            let diff = Math.abs(p1Pts - p2Pts);
            let favoritoId = p1Pts >= p2Pts ? j1Id : j2Id;
            let esUpset = ganadorId !== favoritoId; 

            let reglaExacta = reglasRankingList.find(r => 
                diff >= r.diferencia_min && diff <= r.diferencia_max && 
                ((esUpset && r.resultado_esperado === 'gana_retador') || (!esUpset && r.resultado_esperado === 'gana_favorito'))
            );

            return { 
                ptsGanador: reglaExacta ? reglaExacta.puntos_ganador : 10, 
                ptsPerdedor: reglaExacta ? -Math.abs(reglaExacta.puntos_perdedor) : -5 
            };
        }

        function ordenarJugadoresITTF(lista) {
            return [...lista].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                const rSetA = a.setsG / (a.setsP || 0.0001);
                const rSetB = b.setsG / (b.setsP || 0.0001);
                if (Math.abs(rSetB - rSetA) > 0.0001) return rSetB - rSetA;
                return b.pg - a.pg;
            });
        }

        function procesarDatos(partidosFin) {
            let reporteData = { categorias: {}, expedientes: {} };

            partidosFin.forEach(p => {
                [p.j1, p.j2].forEach(j => {
                    if (j && !reporteData.expedientes[j.id]) {
                        reporteData.expedientes[j.id] = {
                            id: j.id, nombre: j.nombre, club: j.club, ranking_inicial: j.puntos_ranking || 0,
                            pts_ganados: 0, pts_perdidos: 0, partidos: [], ranking_final: j.puntos_ranking || 0
                        };
                    }
                });
            });

            partidosFin.forEach(p => {
                let catNombre = p.categorias?.nombre || 'General';
                if (!reporteData.categorias[catNombre]) reporteData.categorias[catNombre] = { grupos: {}, llaves: [] };
                
                let exp1 = reporteData.expedientes[p.jugador1_id];
                let exp2 = reporteData.expedientes[p.jugador2_id];

                if(exp1 && exp2) {
                    let calculo = calcularPuntosMatch(exp1.ranking_inicial, exp2.ranking_inicial, p.ganador_id, p.jugador1_id, p.jugador2_id);
                    let desc1="", desc2="";
                    let resSets = `${p.sets_j1} - ${p.sets_j2}`;

                    if(p.ganador_id === p.jugador1_id) {
                        exp1.pts_ganados += calculo.ptsGanador; exp1.ranking_final += calculo.ptsGanador;
                        exp2.pts_perdidos += calculo.ptsPerdedor; exp2.ranking_final += calculo.ptsPerdedor;
                        desc1 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador} pts)</span>`;
                        desc2 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor} pts)</span>`;
                    } else {
                        exp2.pts_ganados += calculo.ptsGanador; exp2.ranking_final += calculo.ptsGanador;
                        exp1.pts_perdidos += calculo.ptsPerdedor; exp1.ranking_final += calculo.ptsPerdedor;
                        desc2 = `<span class="text-emerald-400 font-bold">Victoria (+${calculo.ptsGanador} pts)</span>`;
                        desc1 = `<span class="text-rose-400 font-bold">Derrota (${calculo.ptsPerdedor} pts)</span>`;
                    }

                    let faseNombre = p.grupo_nombre ? `Gpo ${p.grupo_nombre}` : (p.ronda_fase || 'Llave');
                    
                    let arrSets1 = p.historial_sets ? p.historial_sets.map(s => `${s.s1}-${s.s2}`).join(', ') : 'S/D';
                    let arrSets2 = p.historial_sets ? p.historial_sets.map(s => `${s.s2}-${s.s1}`).join(', ') : 'S/D';

                    exp1.partidos.push({ fase: faseNombre, mesa: p.mesa, rival: exp2.nombre, rivalClub: exp2.club, resSets: resSets, desc: desc1, parciales: arrSets1 });
                    exp2.partidos.push({ fase: faseNombre, mesa: p.mesa, rival: exp1.nombre, rivalClub: exp1.club, resSets: `${p.sets_j2} - ${p.sets_j1}`, desc: desc2, parciales: arrSets2 });
                }

                if (p.grupo_nombre) {
                    let gpoObj = reporteData.categorias[catNombre].grupos;
                    if(!gpoObj[p.grupo_nombre]) gpoObj[p.grupo_nombre] = {};
                    
                    [p.j1, p.j2].forEach(j => { 
                        if(j && !gpoObj[p.grupo_nombre][j.id]) {
                            gpoObj[p.grupo_nombre][j.id] = { id:j.id, nombre:j.nombre, club:j.club, pj:0, pg:0, pp:0, pts:0, setsG:0, setsP:0 };
                        }
                    });

                    if(p.j1 && p.j2) {
                        let obj1 = gpoObj[p.grupo_nombre][p.j1.id];
                        let obj2 = gpoObj[p.grupo_nombre][p.j2.id];
                        obj1.pj++; obj2.pj++;
                        obj1.setsG += (p.sets_j1||0); obj1.setsP += (p.sets_j2||0);
                        obj2.setsG += (p.sets_j2||0); obj2.setsP += (p.sets_j1||0);

                        if(p.ganador_id === p.jugador1_id) { obj1.pg++; obj1.pts+=2; obj2.pp++; obj2.pts+=1; }
                        else { obj2.pg++; obj2.pts+=2; obj1.pp++; obj1.pts+=1; }
                    }
                } else {
                    reporteData.categorias[catNombre].llaves.push(p);
                }
            });

            if (bonoPaseActivo && bonoPaseValor > 0) {
                let idsEnLlaves = new Set();
                partidosFin.filter(p => !p.grupo_nombre && p.ronda_fase).forEach(p => {
                    if (p.jugador1_id) idsEnLlaves.add(p.jugador1_id);
                    if (p.jugador2_id) idsEnLlaves.add(p.jugador2_id);
                });

                idsEnLlaves.forEach(id => {
                    let exp = reporteData.expedientes[id];
                    if (exp) {
                        exp.pts_ganados += bonoPaseValor;
                        exp.ranking_final += bonoPaseValor;
                        exp.partidos.unshift({
                            fase: '🏆 Clasificación',
                            mesa: '-',
                            rival: 'Sistema',
                            rivalClub: 'Bono Automático',
                            resSets: '-',
                            desc: `<span class="text-amber-400 font-bold">Bono por Pase a Fase Final (+${bonoPaseValor} pts)</span>`,
                            parciales: '-'
                        });
                    }
                });
            }

            reporteGlobal = reporteData;
            renderizarMemoriaUI();
            renderizarRankingGeneralUI();
            document.getElementById('loader').style.display = 'none';
            mostrarSeccion('memoria');
        }

        function abrirModalJugador(jugadorId) {
            const exp = reporteGlobal.expedientes[jugadorId];
            if (!exp) return;

            document.getElementById('modal-jugador-nombre').innerText = exp.nombre;
            document.getElementById('modal-jugador-club').innerText = exp.club || 'Sin Club';

            let dif = exp.ranking_final - exp.ranking_inicial;
            let difStr = dif >= 0 ? `<span class="text-emerald-400">+${dif}</span>` : `<span class="text-rose-400">${dif}</span>`;
            
            document.getElementById('modal-jugador-ranking-header').innerText = `${exp.ranking_final} pts`;
            document.getElementById('modal-jugador-variacion').innerHTML = `${exp.ranking_inicial} ➔ ${exp.ranking_final} (${difStr})`;

            let trs = exp.partidos.map(p => `
                <div class="bg-black/40 border border-white/10 p-3 md:p-4 rounded-xl shadow-inner">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] text-cyan-400 font-black uppercase tracking-widest">${p.fase} ${p.mesa !== '-' ? `• Mesa ${p.mesa}` : ''}</span>
                        <span class="text-[10px] font-bold bg-white/5 px-2 py-0.5 rounded border border-white/10">${p.desc}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div>
                            <strong class="text-white text-xs md:text-sm">vs ${p.rival}</strong>
                            <span class="block text-[9px] text-zinc-500 font-bold">${p.rivalClub}</span>
                        </div>
                        <span class="font-digital text-base md:text-lg font-black text-amber-400 tracking-widest">${p.resSets} ${p.resSets !== '-' ? 'Sets' : ''}</span>
                    </div>
                    ${p.parciales !== '-' ? `<div class="text-[10px] text-zinc-500 font-bold mt-2 pt-2 border-t border-white/5">Parciales: ${p.parciales}</div>` : ''}
                </div>
            `).join('');

            if(exp.partidos.length === 0) trs = '<div class="text-center text-zinc-500 italic py-4">Sin partidos en este torneo.</div>';

            document.getElementById('modal-jugador-partidos-list').innerHTML = trs;
            document.getElementById('modal-jugador-admin').style.display = 'flex';
        }

        function cerrarModalJugador() {
            document.getElementById('modal-jugador-admin').style.display = 'none';
        }

        function generarCuadroDeHonor(catData) {
            const partidoFinal = catData.llaves.find(p => p.ronda_fase?.toLowerCase().includes('final') && !p.ronda_fase?.toLowerCase().includes('semi'));
            const semi1 = catData.llaves.find(p => p.ronda_fase?.toLowerCase().includes('semi') && p.ronda_fase?.includes('1'));
            const semi2 = catData.llaves.find(p => p.ronda_fase?.toLowerCase().includes('semi') && p.ronda_fase?.includes('2'));

            if (!partidoFinal || !partidoFinal.ganador_id) return '';

            const campeonObj = partidoFinal.ganador_id === partidoFinal.jugador1_id ? partidoFinal.j1 : partidoFinal.j2;
            const subcampeonObj = partidoFinal.ganador_id === partidoFinal.jugador1_id ? partidoFinal.j2 : partidoFinal.j1;

            let terceros = [];
            if (semi1 && semi1.ganador_id) terceros.push(semi1.ganador_id === semi1.jugador1_id ? semi1.j2 : semi1.j1);
            if (semi2 && semi2.ganador_id) terceros.push(semi2.ganador_id === semi2.jugador1_id ? semi2.j2 : semi2.j1);

            let htmlHonor = `
                <div class="mb-8 border border-amber-500/30 rounded-2xl bg-gradient-to-br from-amber-500/10 to-amber-900/10 p-6 text-center shadow-[0_0_20px_rgba(245,158,11,0.1)]">
                    <h3 class="text-xs font-black text-amber-500 uppercase tracking-widest mb-4 border-b border-amber-500/20 pb-2 inline-block"><i class="fa-solid fa-crown mr-2"></i> Cuadro de Honor</h3>
                    
                    <div class="mb-4">
                        <div class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest mb-1">🥇 Campeón Absoluto</div>
                        <div class="text-xl md:text-3xl font-black text-amber-400 uppercase tracking-wider jugador-clic inline-block" onclick="abrirModalJugador(${campeonObj.id})">${campeonObj.nombre}</div>
                        <div class="text-xs text-amber-600/70 font-bold uppercase">${campeonObj.club || 'Sin Club'}</div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6 pt-4 border-t border-amber-500/10">
                        <div>
                            <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest mb-1">🥈 Subcampeón</div>
                            <div class="text-base font-black text-zinc-300 uppercase jugador-clic inline-block" onclick="abrirModalJugador(${subcampeonObj.id})">${subcampeonObj.nombre}</div>
                        </div>
                        ${terceros.length > 0 ? `
                        <div>
                            <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest mb-1">🥉 3ros Lugares</div>
                            <div class="flex flex-col gap-1">
                                ${terceros.map(t => `<div class="text-sm font-bold text-orange-400 uppercase jugador-clic inline-block" onclick="abrirModalJugador(${t.id})">${t.nombre}</div>`).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            return htmlHonor;
        }

        function generarLlaveVisual(llavesArray) {
            if (llavesArray.length === 0) return '';

            const pF = llavesArray.find(p => p.ronda_fase?.toLowerCase().includes('final') && !p.ronda_fase?.toLowerCase().includes('semi'));
            const s1 = llavesArray.find(p => p.ronda_fase?.toLowerCase().includes('semi') && p.ronda_fase?.includes('1'));
            const s2 = llavesArray.find(p => p.ronda_fase?.toLowerCase().includes('semi') && p.ronda_fase?.includes('2'));

            if (!pF && !s1 && !s2) return '';

            const dibujarPartidoLigero = (p, titulo) => {
                if(!p) return `<div class="glass-card p-4 rounded-xl border border-white/5 opacity-50"><div class="text-[9px] text-zinc-500 font-bold uppercase mb-2">${titulo}</div><div class="text-xs italic text-zinc-600 text-center">Por definir</div></div>`;
                
                let win1 = p.ganador_id === p.jugador1_id;
                let win2 = p.ganador_id === p.jugador2_id;
                
                return `
                    <div class="glass-card p-3 md:p-4 rounded-xl border ${p.ronda_fase.toLowerCase().includes('final') && !p.ronda_fase.toLowerCase().includes('semi') ? 'border-amber-500/30 bg-amber-500/5' : 'border-cyan-500/20'}">
                        <div class="flex justify-between items-center border-b border-white/5 pb-2 mb-3">
                            <span class="text-[9px] font-black uppercase tracking-widest ${p.ronda_fase.toLowerCase().includes('final') && !p.ronda_fase.toLowerCase().includes('semi') ? 'text-amber-400' : 'text-cyan-400'}">${titulo}</span>
                            <span class="text-[9px] text-zinc-500 font-bold">Mesa ${p.mesa}</span>
                        </div>
                        
                        <div class="flex justify-between items-center mb-2">
                            <div class="font-bold text-xs md:text-sm ${win1 ? 'text-white' : 'text-zinc-500'} cursor-pointer hover:text-cyan-300 transition-colors truncate pr-2" onclick="abrirModalJugador(${p.jugador1_id})">
                                ${win1 ? '🏆 ' : ''}${p.j1.nombre}
                            </div>
                            <div class="font-digital text-sm ${win1 ? 'text-emerald-400' : 'text-zinc-600'} font-black">${p.sets_j1}</div>
                        </div>
                        
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-xs md:text-sm ${win2 ? 'text-white' : 'text-zinc-500'} cursor-pointer hover:text-cyan-300 transition-colors truncate pr-2" onclick="abrirModalJugador(${p.jugador2_id})">
                                ${win2 ? '🏆 ' : ''}${p.j2.nombre}
                            </div>
                            <div class="font-digital text-sm ${win2 ? 'text-emerald-400' : 'text-zinc-600'} font-black">${p.sets_j2}</div>
                        </div>
                    </div>
                `;
            };

            return `
                <div class="mt-8">
                    <h3 class="text-sm font-black text-white uppercase tracking-widest mb-4 border-l-4 border-fuchsia-500 pl-3">Fase Final Eliminatoria</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-8 items-center">
                        <div class="flex flex-col gap-4">
                            ${dibujarPartidoLigero(s1, 'Semifinal 1')}
                            ${dibujarPartidoLigero(s2, 'Semifinal 2')}
                        </div>
                        <div class="flex flex-col justify-center border-l-0 md:border-l border-dashed border-white/20 pl-0 md:pl-8 mt-4 md:mt-0 relative">
                            <div class="hidden md:block absolute w-8 h-[1px] border-t border-dashed border-white/20 -left-8 top-1/4"></div>
                            <div class="hidden md:block absolute w-8 h-[1px] border-t border-dashed border-white/20 -left-8 top-3/4"></div>
                            ${dibujarPartidoLigero(pF, '🏆 Gran Final')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderizarMemoriaUI() {
            const container = document.getElementById('seccion-memoria');
            let html = '';

            Object.keys(reporteGlobal.categorias).forEach(catNombre => {
                const catData = reporteGlobal.categorias[catNombre];
                
                html += `<div class="glass-panel p-5 md:p-8 rounded-3xl mb-8 print-border">`;
                html += `<h2 class="text-xl md:text-3xl font-black text-cyan-400 uppercase tracking-widest mb-6 border-b border-cyan-500/30 pb-4"><i class="fa-solid fa-trophy mr-2 text-amber-400"></i> ${catNombre}</h2>`;

                html += generarCuadroDeHonor(catData);

                if (Object.keys(catData.grupos).length > 0) {
                    html += `<h3 class="text-sm font-black text-white uppercase tracking-widest mb-4 border-l-4 border-cyan-500 pl-3">Fase de Grupos</h3>`;
                    html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">`;
                    
                    Object.keys(catData.grupos).sort().forEach(gpoNombre => {
                        const jugArr = ordenarJugadoresITTF(Object.values(catData.grupos[gpoNombre]));
                        
                        html += `
                            <div class="glass-card rounded-2xl p-4 md:p-5 print-border">
                                <h4 class="text-cyan-400 font-black uppercase mb-4 text-xs tracking-widest"><i class="fa-solid fa-users mr-2"></i> Grupo ${gpoNombre}</h4>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs text-left whitespace-nowrap">
                                        <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                            <tr>
                                                <th class="py-2 px-1">Pos</th>
                                                <th class="py-2 px-1 w-full">Jugador</th>
                                                <th class="py-2 px-2 text-center">PJ</th>
                                                <th class="py-2 px-2 text-center">PG</th>
                                                <th class="py-2 px-2 text-center">Sets (G-P)</th>
                                                <th class="py-2 px-2 text-center text-amber-400">Pts</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-white/5">
                                            ${jugArr.map((j, idx) => `
                                                <tr class="jugador-clic" onclick="abrirModalJugador(${j.id})">
                                                    <td class="py-3 px-1 font-black text-zinc-500">#${idx+1}</td>
                                                    <td class="py-3 px-1">
                                                        <strong class="text-white block text-xs">${j.nombre}</strong>
                                                        <span class="text-[9px] text-zinc-500">${j.club || 'Sin Club'}</span>
                                                    </td>
                                                    <td class="py-3 px-2 text-center text-zinc-400 font-bold">${j.pj}</td>
                                                    <td class="py-3 px-2 text-center text-emerald-400 font-bold">${j.pg}</td>
                                                    <td class="py-3 px-2 text-center">
                                                        <span class="text-emerald-400 font-bold">${j.setsG}</span><span class="text-zinc-600 mx-1">:</span><span class="text-rose-400 font-bold">${j.setsP}</span>
                                                    </td>
                                                    <td class="py-3 px-2 text-center text-amber-400 font-black text-sm">${j.pts}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += generarLlaveVisual(catData.llaves);

                html += `</div>`; 
            });

            container.innerHTML = html;
        }

        function obtenerCategoriaDePuntos(pts) {
            let catEncontrada = categoriasList.find(c => {
                let nom = c.nombre.toLowerCase();
                if (nom === 'libre') return false;
                if (nom.includes('primera')) return pts >= c.puntos_minimos;
                return pts >= c.puntos_minimos && pts <= c.puntos_maximos;
            });
            return catEncontrada || categoriasList.find(c => c.nombre.toLowerCase() === 'libre') || { nombre: 'General', puntos_minimos: 0, puntos_maximos: 9999 };
        }

        function renderizarRankingGeneralUI() {
            const container = document.getElementById('seccion-ranking-general');
            let html = '';

            let jugadoresProcesadosMap = new Map();
            Object.values(reporteGlobal.expedientes).forEach(exp => {
                jugadoresProcesadosMap.set(exp.id, exp);
            });

            let listaCompletaProyectada = todosLosJugadoresBD.map(j => {
                let exp = jugadoresProcesadosMap.get(j.id);
                let rInicial = j.puntos_ranking || 0;
                let rFinal = exp ? exp.ranking_final : rInicial;
                
                let catInicial = obtenerCategoriaDePuntos(rInicial);
                let catFinal = obtenerCategoriaDePuntos(rFinal);

                let subióCat = false;
                if (catInicial.id !== catFinal.id && catFinal.puntos_minimos > catInicial.puntos_minimos) {
                    subióCat = true;
                }

                return {
                    id: j.id, nombre: j.nombre, club: j.club || 'Sin Club',
                    rInicial, rFinal, dif: rFinal - rInicial,
                    catInicial, catFinal, subióCat, jugoTorneo: !!exp
                };
            });

            const categoriasFuerza = categoriasList.filter(c => c.nombre && c.nombre.toLowerCase() !== 'libre').sort((a, b) => b.puntos_minimos - a.puntos_minimos);

            categoriasFuerza.forEach(cat => {
                const jugsEnCat = listaCompletaProyectada.filter(j => j.catFinal.id === cat.id).sort((a, b) => b.rFinal - a.rFinal);

                html += `
                    <div class="glass-panel p-5 md:p-8 rounded-3xl mb-8 print-border">
                        <div class="flex justify-between items-center border-b border-fuchsia-500/30 pb-4 mb-6 flex-wrap gap-2">
                            <h3 class="text-lg md:text-xl font-black text-fuchsia-400 uppercase tracking-widest"><i class="fa-solid fa-layer-group mr-2 text-purple-400"></i> ${cat.nombre}</h3>
                            <span class="text-[10px] md:text-xs text-zinc-500 font-bold uppercase tracking-wider">Rango: ${cat.puntos_minimos} a ${cat.puntos_maximos} Pts</span>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-xs text-left">
                                <thead class="text-[9px] uppercase text-zinc-500 border-b border-white/10">
                                    <tr>
                                        <th class="py-2 px-1">Pos</th>
                                        <th class="py-2 px-1">Jugador</th>
                                        <th class="py-2 text-center hidden md:table-cell">Variación</th>
                                        <th class="py-2 px-1 text-center text-amber-400">Pts Reales</th>
                                        <th class="py-2 px-1 text-right">Estatus</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${jugsEnCat.length === 0 ? `<tr><td colspan="5" class="py-4 text-center text-zinc-600 italic">Sin jugadores en este rango.</td></tr>` : 
                                    jugsEnCat.map((j, idx) => {
                                        let difHtml = j.dif > 0 ? `<span class="text-emerald-400 font-bold">+${j.dif}</span>` : (j.dif < 0 ? `<span class="text-rose-400 font-bold">${j.dif}</span>` : `<span class="text-zinc-600 font-bold">0</span>`);
                                        let mencionAscenso = j.subióCat ? `<span class="badge-ascenso bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-1 rounded text-[9px] font-black uppercase tracking-wider inline-block animate-pulse">🎉 ASCENSO</span>` : '';
                                        
                                        let accionClic = j.jugoTorneo ? `onclick="abrirModalJugador(${j.id})"` : ``;
                                        let claseClic = j.jugoTorneo ? `jugador-clic` : `opacity-60`;

                                        return `
                                            <tr class="${claseClic}" ${accionClic}>
                                                <td class="py-3 px-1 font-black text-zinc-500">#${idx + 1}</td>
                                                <td class="py-3 px-1">
                                                    <strong class="text-white block text-xs">${j.nombre}</strong>
                                                    <span class="text-[9px] text-zinc-500">${j.club}</span>
                                                </td>
                                                <td class="py-3 text-center text-[10px] hidden md:table-cell text-zinc-400 font-bold">${j.rInicial} ➔${difHtml}</td>
                                                <td class="py-3 px-1 text-center text-amber-400 font-black text-sm">${j.rFinal}</td>
                                                <td class="py-3 px-1 text-right">${mencionAscenso}${j.jugoTorneo ? '' : '<span class="text-[9px] text-zinc-600 ml-2">(No Jugó)</span>'}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function mostrarSeccion(sec) {
            const btnMemoria = document.getElementById('btn-tab-memoria');
            const btnRanking = document.getElementById('btn-tab-ranking');
            const secMemoria = document.getElementById('seccion-memoria');
            const secRanking = document.getElementById('seccion-ranking-general');

            if (sec === 'memoria') {
                secMemoria.classList.remove('hidden');
                secRanking.classList.add('hidden');
                btnMemoria.className = "flex-1 bg-cyan-500 text-black py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(6,182,212,0.4)]";
                btnRanking.className = "flex-1 bg-white/10 hover:bg-white/20 text-white py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center";
            } else {
                secMemoria.classList.add('hidden');
                secRanking.classList.remove('hidden');
                btnRanking.className = "flex-1 bg-purple-500 text-white py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all text-center shadow-[0_0_15px_rgba(168,85,247,0.4)]";
                btnMemoria.className = "flex-1 bg-white/10 hover:bg-white/20 text-white py-2.5 rounded-full text-[10px] font-black uppercase tracking-wider transition-all border border-white/10 text-center";
            }
        }

        cargarMemoria();
    </script>
</body>
</html>
